 system observation and domain experience. Testers can derive test conditions from system exploration and their own expertise rather than relying on a product owner narration.","D":"Experience with the existing system and knowledge of its production behavior serve as a valid test basis when formal documentation is absent, as per reference section 3.3.1. Using this knowledge to target likely change impact areas and historically unstable features enables effective test design without requiring complete formal documentation."}},{"q":"You are a tester on an Agile team, and at the end of a sprint a defect is found that you missed during testing. The development lead questions your accuracy in evaluating test results. Which Agile tester skill is MOST relevant to ensuring accurate evaluation and reporting of test outcomes?","o":{"A":"The ability to critically and objectively assess test results, distinguishing between expected and actual behavior with precision and reporting findings without bias.","B":"The ability to design comprehensive test automation scripts that reduce reliance on manual test evaluation.","C":"The ability to facilitate communication between developers and the product owner during sprint reviews to clarify acceptance criteria.","D":"The ability to estimate testing effort for the next sprint using velocity data and risk-based prioritization."},"a":["A"],"e":{"A":"Accuracy in evaluating and reporting test results is a core Agile tester skill requiring critical analysis, objectivity, and precise differentiation of observed versus expected behavior, as per reference section 2.3.1. This skill directly addresses the accuracy concern raised.","B":"Automation design skills address test implementation, not the accuracy of evaluating results from executed tests. Automation may reduce human error in execution but does not replace the judgment required to accurately assess and communicate test outcomes.","C":"Facilitating stakeholder communication is an interpersonal skill that supports requirements clarity, not the specific skill of accurately evaluating whether test results confirm or contradict expected behavior.","D":"Effort estimation is a planning skill distinct from the evaluation and reporting accuracy dimension questioned by the development lead."}},{"q":"Which test pyramid principle states that tests detecting defects earliest in the development lifecycle should form the largest proportion of the automated test suite?","o":{"A":"Lower-level tests such as unit tests should be the most numerous because they execute fastest and detect defects closest to the point of introduction.","B":"End-to-end tests should form the largest layer because they provide the highest confidence in full system behavior.","C":"All test levels should contain an equal number of tests to ensure balanced coverage across the system lifecycle.","D":"Integration tests should be the most numerous because they validate component interactions where most defects originate."},"a":["A"],"e":{"A":"The test pyramid establishes that unit tests form the base and largest layer because they are fast, inexpensive, and catch defects earliest in the lifecycle, as per reference section 3.1.2. This supports the quality principle of early defect detection.","B":"End-to-end tests occupy the smallest top layer of the test pyramid due to their high cost, slow execution, and late-stage defect detection. Concentrating testing at the top layer contradicts the early QA lifecycle principle.","C":"Equal distribution across levels contradicts the pyramid model, which deliberately allocates the most tests to the fastest, lowest-cost levels. Equal distribution produces an inefficient suite weighted toward slow, expensive higher-level tests.","D":"Integration tests occupy the middle layer of the pyramid with fewer tests than the unit test layer. While integration testing is valuable, the pyramid model prioritizes unit-level tests for their speed and early defect detection capability."}},{"q":"Which statement BEST describes the core principle of the Agile Manifesto regarding individuals and interactions?","o":{"A":"Working software is valued over customer collaboration.","B":"Responding to change is valued over following a plan.","C":"Individuals and interactions are valued over processes and tools.","D":"Processes and tools are valued over individuals and interactions."},"a":["C"],"e":{"A":"This option conflates two separate Agile Manifesto values. Working software over comprehensive documentation and customer collaboration over contract negotiation are distinct values, and neither pairing matches the manifesto principle about individuals and interactions.","B":"This statement represents a different Agile Manifesto value focused on adaptability. Responding to change over following a plan is the fourth manifesto value, which is unrelated to the primacy of human interaction over processes.","C":"The Agile Manifesto explicitly states that individuals and interactions are valued over processes and tools, as per reference section 1.1.1. This principle recognizes that human collaboration and communication drive project success more effectively than rigid processes.","D":"This statement directly inverts the Agile Manifesto value. The Agile Manifesto places individuals and interactions above processes and tools, not the reverse."}},{"q":"Which term describes the documented approach that defines the scope, objectives, and methods to be used for testing activities within a project?","o":{"A":"Test estimation","B":"Test plan","C":"Test strategy","D":"Performance testing"},"a":["C"],"e":{"A":"Test estimation is the process of approximating the effort and time required for testing activities within a sprint or project. It is a planning calculation activity, not a document defining the overall testing approach.","B":"While a test plan operationalizes testing for a specific scope or level, the test strategy is the higher-level document that defines the overall testing approach, objectives, and methods from which test plans are derived.","C":"A test strategy is the documented approach defining the scope, objectives, risk identification criteria, and methods to be applied to testing activities, as per reference section 3. It provides the overarching direction for how testing is planned and executed on a project.","D":"Performance testing is a specific test type that evaluates how a system behaves under load, stress, or endurance conditions. It is a testing activity type, not a planning document that defines overall testing scope and methods."}},{"q":"You are assigned to test a new feature added in the current Agile iteration that allows users to export reports in multiple file formats. Which testing approach BEST reflects the Agile practice of combining feature verification and validation within the same iteration?","o":{"A":"Assigning verification testing to the tester and validation testing to the business representative as separate, sequential activities.","B":"Executing functional tests to confirm the export feature works as specified and exploratory tests to validate that the outputs meet realistic user needs, both within the same iteration.","C":"Completing all functional verification of the export feature first and deferring user acceptance validation to a dedicated phase after the release.","D":"Limiting testing within the iteration to confirming the export feature meets the acceptance criteria defined for the story."},"a":["B"],"e":{"A":"Separating verification and validation into distinct activities performed by different roles contradicts Agile collaborative testing practices. Both activities are shared team responsibilities performed concurrently within the iteration.","B":"Agile testing integrates verification of specified behavior and validation of fitness for use within each iteration rather than separating them into sequential phases, as per reference section 2.1.1. Combining both approaches within the iteration ensures both quality dimensions are addressed before the sprint ends.","C":"Deferring validation to a post-release phase contradicts the Agile principle of completing both verification and validation within the iteration. This sequential approach increases the risk of discovering fitness-for-use issues too late to address economically.","D":"Limiting testing to acceptance criteria confirmation addresses only specification-level verification. Agile testing requires validation that features meet actual user needs, which extends beyond verifying documented criteria."}},{"q":"You are a tester on an Agile team preparing for a sprint review with business stakeholders who have limited technical knowledge. You need to communicate which tests provide business-facing quality confidence versus which support technical team decisions. Which testing quadrant concept BEST supports this communication objective?","o":{"A":"The testing quadrants model identifies which quadrant has the highest defect detection rate, enabling the team to prioritize testing investment.","B":"The testing quadrants model distinguishes tests that support the team from tests that critique the product, and separates business-facing tests from technology-facing tests, providing a framework for explaining test purpose to stakeholders.","C":"The testing quadrants model defines the sequence in which test types must be executed to ensure lower-level tests complete before higher-level tests begin.","D":"The testing quadrants model replaces the test pyramid by providing a more complete picture of coverage including non-functional testing at all levels."},"a":["B"],"e":{"A":"The testing quadrants model does not rank quadrants by defect detection rate or direct testing investment priorities. It provides a classification framework for communicating test purpose, not a risk-based prioritization model.","B":"The testing quadrants model organizes testing into quadrants based on whether tests are business-facing or technology-facing and whether they support the team or critique the product, as per reference section 3.1.3. This structure enables testers to explain the purpose of different test types to stakeholders without technical detail.","C":"The testing quadrants model organizes tests by purpose and audience, not by execution sequence. The model does not prescribe an order of test execution or define dependencies between quadrant activities.","D":"The testing quadrants model and test pyramid serve different purposes and are complementary rather than replacements. The quadrants model categorizes tests by purpose and audience, while the pyramid addresses the distribution of test volume across automation levels."}},{"q":"You are explaining to a business stakeholder how to write testable acceptance criteria for a user story about generating monthly financial summary reports. The stakeholder has written: \"The report should be accurate and available quickly.\" Which guidance BEST helps the stakeholder define testable acceptance criteria?","o":{"A":"Asking the development team to determine the acceptable report generation time based on system capacity.","B":"Splitting the story into separate accuracy and performance stories so each dimension can be tested independently.","C":"Replacing vague qualifiers with specific, measurable conditions such as the exact data fields included, acceptable calculation tolerances, and maximum report generation time.","D":"Adding a non-functional testing requirement to the acceptance criteria specifying that performance tests must be executed before the story is accepted."},"a":["C"],"e":{"A":"Delegating criteria definition to the development team removes business context and ownership from acceptance criteria. Testability guidance helps the business stakeholder express their own requirements in a verifiable form, not transfer definition responsibility.","B":"Story splitting is a backlog management decision, not guidance on how to write testable acceptance criteria. Testability is achieved through precise criteria definition, not necessarily through story decomposition.","C":"Testable acceptance criteria must be specific, measurable, and unambiguous so that tests can be designed and pass/fail decisions can be made objectively, as per reference section 3.3.2. Replacing vague terms with concrete conditions enables the team to define a clear Definition of Done for the story.","D":"Specifying a testing requirement in acceptance criteria does not make the criteria testable. Testable criteria define the observable product behavior to be verified, not the testing activities to be performed during verification."}},{"q":"You are an experienced tester embedded in an Agile team where developers encourage you to skip formal test documentation and focus only on exploratory tests based on developer guidance. Which risks to your tester mindset are MOST associated with this situation? (Select TWO)","o":{"A":"You may develop excessive automation skills by focusing entirely on manual exploratory testing rather than automation tools.","B":"You may lose independence of perspective by aligning test focus with developer assumptions rather than exercising independent critical evaluation.","C":"You may lose stakeholder communication skills by spending all time in direct developer collaboration rather than formal reporting activities.","D":"You may lose a quality-focused mindset by deprioritizing structured test design in favor of unstructured exploration directed by others."},"a":["B","D"],"e":{"A":"Gaining exploratory testing experience does not produce excessive automation skills; these are separate skill dimensions. The risk described is a skill balance concern, not a mindset loss that threatens tester independence or quality focus.","B":"Allowing developer guidance to define test focus risks replacing the tester's independent critical mindset with a developer-aligned perspective, as per reference section 2.3.2. Independent evaluation is a core tester attribute that can be eroded when the tester relies on developer direction rather than personal test judgment.","C":"Collaborating with developers is an encouraged Agile practice that does not threaten stakeholder communication skills. This option describes a workload distribution concern rather than a mindset risk arising from following developer guidance exclusively.","D":"Abandoning structured test design under developer influence risks replacing systematic quality analysis with informal exploration, weakening comprehensive coverage, as per reference section 2.3.2. The tester's quality mindset depends on maintaining disciplined test design alongside exploratory approaches."}},{"q":"You are a tester on an Agile project running for six sprints. The regression test suite has grown significantly, and manual re-execution of all regression tests each sprint is no longer feasible. Which approach MOST effectively manages regression risk in this context?","o":{"A":"Moving regression testing to the release phase to concentrate testing effort on new features during each sprint.","B":"Automating the acceptance test suite so that regression tests execute daily as part of the CI pipeline, providing rapid feedback on any regressions introduced during the sprint.","C":"Reducing the regression test scope each sprint by selecting only the tests most likely to fail based on recent defect history.","D":"Assigning additional testers to manually execute the full regression suite at the end of each sprint as a dedicated activity."},"a":["B"],"e":{"A":"Deferring regression testing to the release phase contradicts the Agile principle of integrating testing within each iteration. Late regression detection increases the cost of fixing defects and reduces the team's ability to maintain a releasable product each sprint.","B":"Automating acceptance tests for daily execution within the CI pipeline is the recommended approach to managing growing regression risk in Agile projects, as per reference section 2.2.2. Automated daily execution ensures continuous regression coverage without manual effort, enabling the team to detect regressions immediately.","C":"Selective regression testing based on defect history introduces coverage gaps and does not prevent regressions in areas with historically low defect rates. Automation addresses the feasibility problem without sacrificing regression breadth.","D":"Adding manual testers to execute a growing regression suite is not scalable and contradicts the principle of evolving test automation to manage regression risk in Agile. Manual execution remains time-consuming regardless of team size as the suite continues to grow."}},{"q":"You are helping a business stakeholder define acceptance criteria for a user story that covers multiple characteristics of the feature being delivered. Which of the following BEST represent what acceptance criteria should cover to address all relevant story characteristics? (Select TWO)","o":{"A":"Functional behavior describing how the feature must perform under specified conditions to meet the user's goal.","B":"Non-functional characteristics such as performance thresholds, security requirements, or usability expectations applicable to the story.","C":"Test case scripts documenting the exact steps and data values the tester must use to verify the acceptance criteria.","D":"Implementation details specifying which design patterns or architectural components the development team must use to build the feature."},"a":["A","B"],"e":{"A":"Acceptance criteria must cover the functional behavior of the feature, specifying observable outcomes under defined conditions to confirm the user goal is met, as per reference section 3.3.2. Functional criteria form the core of what makes a story testable and verifiable against business intent.","B":"Acceptance criteria should also address non-functional characteristics relevant to the story so that all dimensions of quality required for Done are captured, as per reference section 3.3.2. Omitting non-functional criteria leaves quality gaps that may not be detected until late in the delivery cycle.","C":"Test cases are derived from acceptance criteria; they are not themselves part of the acceptance criteria. Including test scripts in acceptance criteria conflates the requirement definition with the test execution artifact.","D":"Briefing internal code structure or design patterns in acceptance criteria conflates requirements with technical design decisions and restricts developer autonomy."}},{"q":"You are a tester joining an Agile team with no dedicated test environment management role. During the first sprint, tests fail repeatedly due to misconfigured environments not reset between test runs. Which tester role activity BEST addresses this situation?","o":{"A":"Escalating the environment instability to the scrum master as an impediment to be resolved in the next sprint retrospective.","B":"Requesting that the development team implement infrastructure-as-code automation to eliminate manual environment configuration.","C":"Documenting the environment configuration failures in the defect management system for analysis at the end of the sprint.","D":"Taking responsibility for configuring and managing the test environments to ensure they are in a known, consistent state before each test execution cycle."},"a":["D"],"e":{"A":"Treating a solvable environment configuration problem as a retrospective impediment delays resolution for the remainder of the sprint. The tester's role includes proactive environment management rather than deferring technical setup problems through escalation.","B":"Requesting infrastructure automation is a valid longer-term improvement, but it does not address the immediate role gap in the current sprint. The tester's responsibility is to manage the environment now, not to redirect the problem to the development team.","C":"Logging configuration failures as defects treats environment setup problems as product defects rather than operational tester responsibilities. The tester role includes preventing environment failures through proactive configuration management.","D":"Configuring and managing test environments is an explicit tester role activity in Agile teams, as per reference section 2.3.2. When no dedicated environment management role exists, the tester assumes this responsibility to ensure reliable test execution."}},{"q":"During Agile release planning, which tester contribution is MOST associated with communicating potential uncertainties that may affect delivery timelines?","o":{"A":"Risk identification","B":"Acceptance criteria definition","C":"Test execution reporting","D":"Defect triage"},"a":["A"],"e":{"A":"Testers contribute to release planning by identifying risks that could affect delivery scope and timelines, enabling the team to factor uncertainty into planning decisions, as per reference section 1.2.5. Risk identification is the tester activity most directly tied to communicating delivery uncertainties at the release level.","B":"Defining acceptance criteria is primarily an iteration planning activity focused on individual user stories. While testers contribute to this, it does not directly address potential uncertainties affecting release delivery timelines.","C":"Test execution reporting tracks within-sprint test progress and does not occur during release planning. It does not address forward-looking delivery uncertainties at the release level.","D":"Defect triage involves prioritizing known defects for resolution. It is an ongoing activity addressing existing issues rather than identifying future delivery risks during release planning."}},{"q":"You are part of an Agile team running a sprint retrospective. One team member raises a concern about consistently poor test coverage discovered late in sprints, but other members are reluctant to discuss it openly. Which retrospective condition MOST enables honest examination of this issue?","o":{"A":"A retrospective environment built on mutual trust and psychological safety, where team members can raise concerns without fear of blame.","B":"A detailed agenda prepared by the scrum master that includes a dedicated slot for test coverage discussion.","C":"A quantitative test coverage report shared with the team before the retrospective begins.","D":"A rule that all improvement actions identified must be assigned to specific team members."},"a":["A"],"e":{"A":"Retrospectives require a professional environment of mutual trust and psychological safety to enable candid discussion of process problems, as per reference section 1.2.3. Without this condition, team members self-censor concerns, preventing meaningful improvement.","B":"A structured agenda can facilitate retrospective flow but does not create the psychological safety needed for members to raise sensitive concerns. Members will avoid honest discussion if trust is absent, regardless of timeline layout.","C":"Presenting data before the retrospective may direct discussion but does not address the cultural barrier preventing open dialogue. Data visibility does not resolve reluctance to engage honestly with uncomfortable process topics.","D":"Assigning ownership of actions is an output-phase retrospective practice, not a condition enabling honest discussion during the retrospective itself."}},{"q":"You are a tester on an Agile team discussing how to incorporate independent testing. The team is considering assigning an external tester on a long-term basis to provide objective evaluation. Which statement BEST describes the recommended approach for independent testing in Agile projects?","o":{"A":"The independent test team should operate in a separate sprint cycle to maintain objectivity and avoid being influenced by the development team's perspective.","B":"Independent testers should rotate across multiple Agile teams every sprint to provide fresh perspective and prevent cognitive bias from familiarity.","C":"An independent test team is most effective when testers are assigned to the Agile team for an extended period rather than brought in only for specific releases.","D":"Independent testing in Agile should be limited to final acceptance testing because earlier involvement reduces the team's sense of ownership for quality."},"a":["C"],"e":{"A":"Separating independent testers into a parallel sprint cycle reduces integration with the development team, slowing feedback and reducing the relevance of independent findings to current iteration work.","B":"Rotating testers every sprint prevents the accumulation of product knowledge required for effective independent evaluation. Long-term assignment balances independence with contextual baseline knowledge.","C":"Long-term assignment of independent testers to an Agile team allows them to build sufficient product and team context to provide meaningful objective evaluation, as per reference section 2.1.3. Short-term or release-only engagement limits their ability to contribute effectively within the iterative cadence.","D":"Restricting independent testing to final acceptance contradicts the Agile principle of early and continuous quality feedback. Earlier involvement enables independent testers to identify systemic issues before they compound."}},{"q":"You are a tester conducting an exploratory testing session on a newly delivered search feature. Midway through the session, you notice unexpected behavior when combining multiple filter criteria simultaneously. You decide to adapt your test approach based on this observation. Which aspect of exploratory testing MOST enables you to make this in-session adaptation effectively?","o":{"A":"Documenting the observation in the session notes and scheduling a separate regression test to cover multiple filter combinations in a future sprint.","B":"Applying cognitive heuristics and tester judgment to recognize the significance of unexpected behavior and dynamically redirect the test session toward the newly identified risk area.","C":"Following a predefined test script that includes a section covering multiple filter combinations, which the tester can execute to investigate the observed behavior.","D":"Pausing the session and raising the unexpected behavior as a defect before continuing with the original planned session charter."},"a":["B"],"e":{"A":"Deferring investigation to a future sprint delays risk coverage and does not leverage the tester's in-session cognitive advantage. Exploratory testing enables immediate, adaptive investigation of unexpected behavior within the current session.","B":"Exploratory testing relies on the tester's cognition and heuristics to interpret observations, recognize anomalies, and adapt the session strategy in real time, as per reference section 3.3.5. This dynamic decision-making capability distinguishes exploratory testing from scripted approaches and enables the tester to pursue emergent risks immediately.","C":"Following a predefined script shifts the approach from exploratory to scripted testing. Exploratory testing intentionally operates without fixed scripts so the tester can freely redirect based on real-time observations and cognitive judgment.","D":"Logging a defect and pausing exploration before investigating the observation reduces the value of the exploratory session. Exploratory testing leverages the tester's immediate cognitive response to pursue unexpected behavior further within the session."}},{"q":"You are a tester reviewing a new user story for a healthcare data integration feature. You have identified that incorrect data mapping during integration could result in patient record mismatches. Which risk mitigation approach BEST demonstrates applying quality risk assessment in Agile testing?","o":{"A":"Documenting the data mapping risk in the product backlog as a separate story and assigning it to a future sprint when more information is available.","B":"Notifying the product owner of the risk and requesting that additional acceptance criteria be added to the story before testing begins.","C":"Performing a full regression test of all existing integration tests before testing the new data mapping feature to establish a clean baseline.","D":"Designing boundary value and equivalence partitioning tests targeting the specific data mapping logic identified as the highest risk area, and prioritizing their execution within the sprint."},"a":["D"],"e":{"A":"Deferring risk mitigation to a future sprint without current test coverage leaves the identified risk unaddressed. Quality risk assessment in Agile drives immediate test design decisions within the same iteration where the risk is identified.","B":"Requesting additional acceptance criteria is a requirements clarification step, not a risk mitigation action through testing. Risk mitigation is achieved through targeted test design and execution.","C":"Running a full regression test before addressing the specific identified risk does not mitigate the data mapping concern. Risk-based testing prioritizes effort toward assessed high-risk areas rather than broad regression coverage.","D":"Quality risk assessment in Agile drives test design and prioritization toward the highest-risk areas, using techniques that directly probe identified failure modes, as per reference section 3.2.1. Applying boundary value and equivalence partitioning to the data mapping logic directly mitigates the identified mismatch risk."}},{"q":"You are a tester on an Agile team responsible for communicating test progress to stakeholders who cannot attend daily stand-ups. The team recently implemented a continuous integration pipeline. Which tool or technique BEST supports automated and transparent communication of testing status in this context?","o":{"A":"A shared spreadsheet updated by the tester at the end of each sprint with test execution counts and open defect status.","B":"A document repository where completed test reports are uploaded after each sprint review meeting.","C":"A real-time dashboard connected to the CI pipeline that displays current test pass rates, build status, and defect trends visible to all stakeholders.","D":"A weekly email summary prepared by the tester that aggregates test results and defect counts from the previous week."},"a":["C"],"e":{"A":"Manually updated spreadsheets require tester effort for maintenance and do not provide the real-time visibility that automated reporting delivers. This approach is neither continuous nor scalable in an active CI environment.","B":"Post-sprint document uploads are a retrospective and manual reporting method that does not address the need for continuous stakeholder visibility during the sprint.","C":"Automated dashboards connected to CI pipelines provide continuous, transparent visibility into testing status without manual reporting effort, as per reference section 2.2.1. This supports stakeholder access to test progress data independent of meeting attendance.","D":"Weekly email summaries are manual, infrequent, and retrospective, providing delayed status information that does not reflect real-time testing progress."}},{"q":"You are a tester participating in a sprint retrospective following a sprint in which several high-severity defects escaped to integration testing. You want to address root causes rather than symptom-level fixes. Which retrospective approach MOST effectively supports identifying testability improvements?","o":{"A":"Proposing that all stories in the next sprint include an additional peer review step before testing begins.","B":"Asking the product owner to increase acceptance criteria detail for all upcoming stories to prevent defects.","C":"Requesting that an independent test team review the team's test cases after each sprint to identify missed conditions.","D":"Facilitating a root cause analysis of the escaped defects to identify systemic gaps in test design or coverage criteria within the team's process."},"a":["D"],"e":{"A":"Adding a review step is a corrective action applied without root cause understanding. Proposing solutions before analysis may address a symptom but misses the systemic testability issues driving recurring defect escape.","B":"Shifting acceptance criteria responsibility to the product owner does not address the team's internal testability process gaps. Root cause analysis focuses on the team's own practices.","C":"Deferring quality evaluation to an external party does not build the team's own capability to identify root causes. Retrospective-driven improvement focuses on the team's internal processes.","D":"Retrospectives focused on root cause analysis drive systemic process improvement rather than surface-level fixes, as per reference section 1.2.3. Examining underlying causes of defect escape identifies specific testability gaps in the team's practices that can be improved in future sprints."}},{"q":"You are a tester preparing a test status report for the sprint review. The product owner requests data reflecting both how much of the code has been tested and how much of the requirements have been covered. Which test metrics BEST address the product owner's request?","o":{"A":"Code coverage showing the percentage of executable code exercised by tests and requirements coverage showing the proportion of acceptance criteria addressed by test cases.","B":"Defect density per story point and test execution pass rate for the current sprint.","C":"Number of test cases executed per day and average defect resolution time during the sprint.","D":"Sprint velocity trend across three sprints and the ratio of automated to manual test cases."},"a":["A"],"e":{"A":"Code coverage and requirements coverage are complementary metrics addressing both the structural and specification dimensions of test completeness, as per reference section 2.2.1. Together they provide the product owner insight into both technical thoroughness and functional traceability.","B":"Defect density and pass rate describe quality outcomes and execution progress, not the extent to which code has been exercised or requirements have been covered.","C":"Execution rate and defect resolution time are productivity and responsiveness metrics, not coverage metrics. They do not indicate how much code or how many requirements have been addressed by the tests.","D":"Velocity is a planning and capacity metric, and the automation ratio reflects test implementation strategy. Neither metric addresses the product owner's question about code or requirements coverage."}}]},{"id":6,"title":"Practice Exam 7","questions":[{"q":"Which of the following statements about Agile retrospectives is true?","o":{"A":"Agile retrospectives should be focused mainly on obstructions and hindrances that are outside the control of the team because these issues are more challenging","B":"Traditional projects require feedback from retrospectives; however, Agile retrospectives do not require follow-up activities","C":"Agile retrospectives should be focused on the team members and business representatives, and other participants should not attend or contribute","D":"Agile retrospectives should also provide feedback to the current iteration planning regarding planning accuracy, contents, and the efficiency of the work in the team"},"a":["D"],"e":{"A":"The syllabus does not direct retrospectives to concentrate on obstacles outside the team's control. Retrospectives focus on what was successful and what could be improved within the team's own process, people, relationships and tools, so that the team can act on the results. Focusing on issues the team cannot influence would produce few actionable improvements.","B":"This statement is backwards: the syllabus stresses that retrospectives are critical to self-organization and continual improvement only when appropriate follow-up activities occur. Agile retrospectives absolutely require follow-up, and teams should implement a few improvements per iteration. Claiming they need no follow-up contradicts the purpose of the meeting.","C":"Business representatives and the team attend each retrospective, but the syllabus also states that teams may invite other participants in some cases, and a facilitator organizes and runs the meeting. Excluding all other participants is not required. The statement is therefore too restrictive to be true.","D":"Retrospectives discuss what was successful, what could be improved and how to incorporate improvements into future iterations, which naturally includes feedback on planning accuracy, content and team efficiency that feeds into the planning of the next iteration, as per reference section 1.2.3. This makes the retrospective a key input for continuous improvement of how the team plans and works. The other options misstate the focus, follow-up needs, or attendance of retrospectives."}},{"q":"Consider the following user story for an Agile project aimed at developing an application that calculates the reimbursement of medical visits: \"As an owner of the application, I want the reimbursement of medical visits to be calculated based on the following rules: There are two types of reimbursable visits: Doctor's Office Visits (DOCVs) and Hospital Visits (HVs). The reimbursement for DOCVs is 33%, while the reimbursement for HVs depends on the type of the specialist visits. Two types (A, B) of specialist visits exist and the associated reimbursements are 45% for A and 90% for B.\"\nWhich of the following would you expect to be the most suitable black-box test design technique for the user story?","o":{"A":"Decision table testing","B":"Equivalence partition testing","C":"Use case testing","D":"State transition testing"},"a":["A"],"e":{"A":"The user story describes combinations of conditions (visit type DOCV or HV, and for HV the specialist type A or B) that each lead to a different reimbursement outcome (33%, 45%, 90%), which is exactly the kind of business rule logic best captured by decision table testing, as per reference section 3.3.3. Decision tables systematically cover every combination of conditions and their resulting actions. The other techniques do not model combinations of rule conditions as directly.","B":"Equivalence partitioning could identify the visit-type classes, but it treats inputs independently and does not systematically capture how combinations of conditions (visit type plus specialist type) determine the outcome. The dependency between the conditions is the core of this story. Decision tables therefore fit better than simple partitioning.","C":"Use case testing focuses on actor-system interaction flows and scenarios, including main and alternative paths. This user story describes calculation rules rather than a sequence of interactions between a user and the system. There is no workflow here for use case testing to exercise.","D":"State transition testing is suited to systems whose behavior depends on their current state and on events that trigger transitions between states. The reimbursement rules have no states or transitions, only combinations of conditions and results. State transition testing is therefore not appropriate."}},{"q":"Why is regression of software a high risk in agile projects?","o":{"A":"Test-driven development means that existing functionality is not considered.","B":"Test automation can cause regression of software in the test environment.","C":"Regression is built into software as a safeguard against unexpected failures.","D":"There is code churn due to change in business needs over several sprints."},"a":["D"],"e":{"A":"Test-driven development does not ignore existing functionality; its accumulated unit tests actually act as a regression safety net. TDD is not the reason regression risk is high in Agile projects. This option misrepresents the practice.","B":"Test automation detects regressions; it does not cause the software to regress. Automated regression tests are the main mitigation for regression risk in Agile projects. Blaming automation for regression reverses cause and effect.","C":"Regression is not a safeguard deliberately built into software; it is the unintended breaking of previously working functionality. Regression testing is the safeguard, not regression itself. The statement confuses the problem with its mitigation.","D":"The risk of introducing regression in Agile development is high due to extensive code churn, since responding to change is a key Agile principle and previously delivered features are modified over several sprints to meet business needs, as per reference section 2.2.2. Every change to working code creates a chance of breaking it. The other options misdescribe TDD, automation, or the nature of regression."}},{"q":"Your agile team is using the Testing Quadrants to ensure that all important test levels and test types are covered in the test plan.\nIn relation to Quadrant 3 - business facing and product critique, what should be considered for the plan?","o":{"A":"Exploratory Testing","B":"Prototype Testing","C":"Performance Testing","D":"Functional Testing"},"a":["A"],"e":{"A":"Quadrant Q3 contains business-facing tests that critique the product, and the syllabus lists exploratory testing, scenarios, process flows, usability testing and user acceptance testing in this quadrant, as per reference section 3.1.3. Exploratory testing evaluates the product from a user perspective, which is exactly the purpose of Q3. The other options belong to different quadrants.","B":"Prototype testing is listed in Quadrant Q2, business-facing tests that support the team, along with functional tests, examples, story tests and simulations. These tests help guide development rather than critique the finished product. Therefore prototype testing does not belong in Q3.","C":"Performance testing is a technology-facing test that critiques the product and is placed in Quadrant Q4, together with load, stress, scalability, security and other non-functional tests. It is usually automated and tool-driven. It is not a Q3 activity.","D":"Functional testing is placed in Quadrant Q2, business-facing tests that support the team. Functional tests check that the system behaves as described in user stories and help drive development. They are not the product-critique tests of Q3."}},{"q":"Which of the following sentences about the integration of development and testing activities in Agile projects is INCORRECT?","o":{"A":"While developers develop automated unit test scripts, testers write automated system level tests.","B":"Testers replace developers in writing unit test automation scripts.","C":"Developers write acceptance criteria and test cases, together with testers.","D":"Developers and testers may work as a pair to develop and test a feature."},"a":["B"],"e":{"A":"This statement is correct and therefore not the answer: the syllabus describes developers writing automated unit tests while testers create automated tests at the system level. Both roles contribute automation at their respective levels. It accurately describes integrated development and testing.","B":"This is the INCORRECT statement: testers do not replace developers in writing unit tests; developers write unit tests, while testers focus on system-level test automation and collaborate on acceptance criteria and tests, as per reference section 2.1.1. Testers and developers work together, but unit testing remains a developer responsibility. The other options are accurate descriptions of Agile collaboration.","C":"This statement is correct and therefore not the answer: developers, testers and business stakeholders collaborate to define acceptance criteria and tests for user stories. Such collaboration is a core Agile practice. It does not describe anything incorrect.","D":"This statement is correct and therefore not the answer: the syllabus explicitly mentions that a tester may pair with a developer to develop and test a feature. Pairing is a common Agile practice. It accurately describes the integration of development and testing."}},{"q":"Which of the following statements about the benefits of the Agile processes promoting early and frequent feedback is NOT true?","o":{"A":"In Agile projects where feedback is provided early and frequently, defects and incorrect requirements are caught earlier and those problems can be fixed faster.","B":"Feedback from well-conducted Agile retrospectives can be used to positively affect the development process over the course of the next iteration.","C":"Early and frequent feedback enables the team to deliver the features that represent the highest business value to the customer first.","D":"Increasing the frequency of feedback and communication between all the stakeholders involved in Agile projects eliminates all communication problems."},"a":["D"],"e":{"A":"This is a true benefit: early and frequent feedback helps avoid requirements misunderstandings and supports discovering, isolating and resolving quality problems early. Problems caught early are cheaper and faster to fix. Because it is true, it is not the answer.","B":"This is true: retrospective feedback leads to improvement decisions that are incorporated into future iterations. Well-conducted retrospectives with follow-up actions drive continual process improvement. Because it is true, it is not the answer.","C":"This is true: the syllabus states that early and frequent feedback helps the team focus on the features with the highest business value, or associated risk, and these are delivered to the customer first. It is a stated benefit. Because it is true, it is not the answer.","D":"This statement is NOT true because early and frequent feedback reduces misunderstandings and improves communication but can never eliminate all communication problems; the syllabus lists realistic benefits such as avoiding requirements misunderstandings and clarifying customer requests, not the removal of every communication issue, as per reference section 1.1.3. The absolute claim is what makes it false. The other options describe genuine benefits of early feedback."}},{"q":"Consider the estimation of a given user story performed separately by two different teams (Team A and Team B) using the Planning Poker technique. Both teams consist of five members and use a deck of cards (0, 1, 2, 3, 5, 8, 13, 20).\nTeam A quickly decides on an estimate of 8 story points after four rounds, with no discussions between rounds.\nTeam B arrives at 3 story points after three rounds, with discussions between the lowest and highest estimators after each round.\nWhich of the following statements would you expect most likely to be true in this scenario?","o":{"A":"Team B estimates that the user story can be \"done\" with significantly less effort in absolute terms than what was estimated by Team A","B":"Team A has a better estimation process than Team B because at the end of the last round, all five team members' estimates are an exact match","C":"In the estimation process, Team B, unlike Team A, can take advantage of the discussions that represent an important benefit of using Planning Poker","D":"Both Team A and B have an ineffective estimation process because the best estimate is the average of the results of the first round of estimation"},"a":["C"],"e":{"A":"Story points are relative estimates, and each team calibrates its own scale, so an estimate of 3 from Team B cannot be compared in absolute terms with 8 from Team A. Different teams have different reference stories and velocities. No conclusion about absolute effort can be drawn.","B":"Reaching an exact match is not proof of a better process; Team A converged without any discussion, which loses the main value of Planning Poker. Agreement reached without sharing reasoning may simply reflect anchoring or pressure. The quality of the estimation process is not measured by identical cards alone.","C":"In Planning Poker, when estimates differ the estimators discuss the differences before repeating the round, and these discussions ensure a reliable estimate and improve collective knowledge of what has to be done, as per reference section 3.2.2. Team B used these discussions, especially between the lowest and highest estimators, while Team A skipped them. The other options misread story points or the technique.","D":"Planning Poker does not use the average of first-round results as the estimate. Rounds are repeated after discussion until agreement is reached by consensus or by an agreed rule such as the median or highest score. Averaging the first round would discard the value of the discussion."}},{"q":"Which of the following statements about Agile retrospectives is CORRECT?","o":{"A":"During Agile retrospectives, testers should be encouraged to provide constructive suggestions only on non-testing activities.","B":"In an Agile retrospective the moderator can encourage and make sure that good practices are kept by the team, by asking what the team is doing well.","C":"Agile retrospectives should be focused mainly on impediments that are outside the control of the team because these issues are more challenging.","D":"Unlike working sessions or meetings held in non-Agile projects, Agile retrospectives do not require follow-up activities."},"a":["B"],"e":{"A":"The syllabus states that all team members, testers and non-testers, can provide input on both testing and non-testing activities. Restricting testers to non-testing topics would waste their unique perspective on testing. The statement contradicts the syllabus.","B":"A retrospective discusses what was successful as well as what could be improved, so that successes are retained in future iterations; a facilitator asking what the team is doing well helps ensure good practices are kept, as per reference section 1.2.3. This balances improvement with preservation of effective practices. The other options misstate participation, focus, or follow-up.","C":"Retrospectives focus on process, people, organizations, relationships and tools that the team can improve, and teams implement only a few improvements per iteration. Concentrating on impediments outside the team's control yields few actionable results. The statement misrepresents the focus of retrospectives.","D":"Retrospectives are critical to continual improvement only when appropriate follow-up activities occur. Agile retrospectives therefore do require follow-up, just like other improvement meetings. The claim that they do not is false."}},{"q":"Consider an Agile project aimed at developing a test management tool. This tool allows Test Managers to generate progress reports for test analysis, test design and test execution phases in traditional projects. Consider the following user story of this Agile project:\n\"As a Test Manager who is looking at a progress report, I want to be able to print this progress report, so that I can keep a hard copy for my daily records.\"\nFor this user story the following acceptance criterion is defined:\n\"Given that I am a Test Manager looking at a progress report,\nWhen I click the 'Print' button,\nThen the progress report should be printed\"\nBased only on the given information, which of the following would you expect most likely to be true?","o":{"A":"Both the user story and the acceptance criterion are expressed in adequate form, but the user story is not testable","B":"Both the user story and the acceptance criterion are expressed in adequate form, but the user story does not describe functionality that is valuable to the user","C":"During the conversation, the acceptance criterion should not be discussed since it is described using the Given-When-Then template","D":"During the conversation, the need to update the acceptance criterion by specifying that a date stamp be visible on the printout could emerge"},"a":["D"],"e":{"A":"The user story is testable: its acceptance criterion defines a clear action (click Print) and an observable outcome (the report is printed). Testability is not the issue here. Therefore this option is not the most likely truth.","B":"Keeping a hard copy of a progress report for daily records is explicitly stated as the benefit in the so-that clause, so the story does describe value to the user. The role-feature-benefit structure is complete. The claim that it lacks user value is unfounded.","C":"Acceptance criteria, regardless of format, are exactly what the conversation part of the 3 Cs is meant to explore and refine. A Given-When-Then format does not exempt a criterion from discussion. This option contradicts collaborative user story creation.","D":"The conversation is one of the 3 Cs of a user story and explains how the software will be used; during it, stakeholders can uncover additional needs such as a date stamp on the printout, leading to refined acceptance criteria, as per reference section 1.2.2. Acceptance criteria evolve through collaboration between business, developers and testers. The other options wrongly assert untestability, lack of value, or that criteria are not discussed."}},{"q":"You are working on an Agile project and have been asked to implement exploratory testing for the current sprint. Which one of the following is a correct approach to adopt?","o":{"A":"Allocate independent testers to design exploratory tests using test charters in time boxed sessions. Plan to run all sessions in parallel with each session lasting more than 5hours.","B":"Ask experienced testers to try and find new defects by using the system without the constraint of documentation and tools.","C":"Use testers who have not been involved in the sprint to write new test cases from the user stories. These test cases are then executed in a time boxed session for the sprint.","D":"Ask experienced testers to prepare test charters for time boxed sessions lasting no more than 2hours. Tests should be designed and executed within each session using heuristics, creativity and intuition."},"a":["D"],"e":{"A":"Session-based exploratory testing uses uninterrupted sessions typically of 60 to 120 minutes, so sessions lasting more than 5 hours are not appropriate. Running all sessions in parallel is also not a requirement. The session length makes this option wrong.","B":"Exploratory testing in Agile is not unstructured use of the system; it is guided by test charters, time boxes and documented session results. Removing documentation entirely loses the structure and traceability of session-based test management. This describes ad hoc testing, not the recommended approach.","C":"Writing and then executing pre-scripted test cases is scripted testing, not exploratory testing, where design and execution happen simultaneously. Using testers who were not involved in the sprint also loses product knowledge. This does not implement exploratory testing.","D":"Session-based test management organizes exploratory testing into uninterrupted sessions of 60 to 120 minutes guided by a test charter, during which test design and execution happen at the same time, and testers use heuristics, creativity and intuition, as per reference section 3.3.4. Experienced testers are best placed to do this effectively. The other options use wrong session lengths, drop structure, or describe scripted testing."}},{"q":"Which of the following statements about Agile software development approaches is true?","o":{"A":"Communication, simplicity, feedback, courage, and respect are the five fundamental values of Kanban to guide development","B":"Scrum does not provide guidance on how development has to be done in a Scrum project but prescribes the adoption of specific testing techniques","C":"In Kanban, transparency of content and progress of tasks is usually done with the visualization of the active tasks, for example on a public whiteboard","D":"Scrum is an Agile management framework that defines three roles: the Scrum Owner, the Product Master, and the Development Team"},"a":["C"],"e":{"A":"Communication, simplicity, feedback, courage and respect are the five values of Extreme Programming (XP), not Kanban. Kanban is based on the Kanban board, work-in-progress limits and lead time. The option attributes XP values to the wrong approach.","B":"Scrum does not prescribe specific testing techniques; it deliberately leaves development and testing practices to the team. The first half of the statement is right, but the second half is false. Therefore the statement as a whole is wrong.","C":"Kanban uses a Kanban board to visualize the value chain, and transparency of content and progress of tasks is typically achieved by visualizing the active tasks, for example on a public whiteboard, as per reference section 1.2.1. This visualization is one of Kanban's core instruments along with work-in-progress limits and lead time. The other options misattribute values, roles, or practices.","D":"Scrum defines the roles Scrum Master, Product Owner and Development Team. The names Scrum Owner and Product Master do not exist in Scrum. The role names make this statement false."}},{"q":"Which of the following statements about the whole-team approach would you expect most likely to be true?","o":{"A":"The whole-team approach is a consensus-based approach for estimating, mostly used to estimate the relative size of user stories","B":"The whole-team approach helps ensure testers, developers and the business work together to ensure that the desired quality levels are achieved","C":"The whole-team approach is consistent with the \"power of three\" concept for which a user story is the conjunction of three elements (card, conversation, confirmation)","D":"The whole-team approach tends to advocate the idea of team members being \"generalists\" without having deep skills in specific disciplines"},"a":["B"],"e":{"A":"A consensus-based estimation technique for the relative size of user stories describes Planning Poker, not the whole-team approach. The whole-team approach is about shared responsibility for quality and collaboration. This option confuses two concepts.","B":"The whole-team approach involves everyone with the necessary knowledge and skills, and testers, developers and business representatives work together to achieve the desired quality levels, with quality being everyone's responsibility, as per reference section 1.1.2. It relies on co-location, collaboration and shared goals. The other options confuse it with estimation, the 3 Cs, or a lack of expertise.","C":"The power of three refers to the involvement of business, developers and testers, whereas card, conversation and confirmation are the 3 Cs of a user story. The option mixes the two concepts incorrectly. So the statement is false.","D":"The whole-team approach does not require team members to lack deep expertise; it leverages the various skill sets within the team, with testers bringing specialized testing skills. Cross-functionality comes from combining specialists, not replacing them with generalists. The statement misrepresents the approach."}},{"q":"Which of the following statements about test-driven development (TDD) and behavior-driven development (BDD) is true?","o":{"A":"Both BDD tests and TDD tests are written primarily at the acceptance level, though these tests may also be written at the integration or system levels","B":"TDD tests are focused on the implementation of the software while BDD tests on the exhibited behavior of the software C. 12 of 70","C":"TDD tests and BDD tests are written by developers, but TDD tests are generally easier for other team members and stakeholders to understand than BDD tests","D":"Specific BDD frameworks can be used to define acceptance criteria based on the role/feature/benefit template (\"As a..., I want..., so that...\")"},"a":["B"],"e":{"A":"TDD tests are written primarily at the unit (component) level, not the acceptance level; ATDD is the practice focused on acceptance tests. BDD tests describe behavior and can be used at various levels. The statement mischaracterizes TDD.","B":"TDD is used to develop code guided by automated test cases and focuses on the implementation at the unit level, while BDD focuses on the expected behavior of the software, expressed in a form stakeholders can understand, as per reference section 3.1.1. This implementation-versus-behavior distinction is the core difference. The other options misplace test levels, readability, or templates.","C":"BDD tests, written in a Given-When-Then style, are generally easier for non-technical stakeholders to understand than TDD unit tests. The option reverses this relationship. It is therefore false.","D":"BDD frameworks typically define acceptance criteria using the Given-When-Then format. The As a..., I want..., so that... template is the format for writing user stories, not BDD acceptance criteria. The option confuses the two formats."}},{"q":"Which two of the following statements are CORRECT with regards to test automation on agile projects?\n1) Every test developed for past iterations is kept and executed as part of a regression suite for each new release of code.\n2) It would be very difficult to ensure high quality in an agile project without test automation.\n3) Automated acceptance tests are run regularly as part of the continuous integration full system build.\n4) Automated regression suites are only run for the final release of code.\n5) In agile projects, the results from automated acceptance tests provide feedback on the overall product quality.","o":{"A":"3, 4","B":"2, 5","C":"1, 3","D":"2, 3"},"a":["D"],"e":{"A":"Statement 3 is true, but statement 4 is false: automated regression suites are run regularly, typically as part of the daily main build in continuous integration, not only for the final release. Running them only at the end would defeat their purpose. This combination is therefore wrong.","B":"Statement 2 is true, since high quality in an Agile project is very difficult to sustain without test automation. However, statement 5 is false: the results from automated acceptance tests provide feedback on product quality with respect to regression since the last build, but they do not provide the status of overall product quality. This combination is therefore wrong.","C":"Statement 3 is true, but statement 1 is false: because complete repetition of all tests is seldom possible, testers review and retire test cases that are no longer relevant. Not every past test is kept in the regression suite. This combination is therefore wrong.","D":"Statement 2 is true, because Agile teams depend on test automation to keep quality high with frequent change, and statement 3 is true, because automated acceptance tests are run regularly as part of the continuous integration full system build, as per reference section 2.2.2. Both statements reflect the syllabus directly. The other combinations each include a false statement about regression suites or overall product quality."}},{"q":"Which of the following is an Agile software development approach in which transparency of content and progress of tasks is usually obtained with the visualization of the active tasks and in which iterations are optional?","o":{"A":"Scrum","B":"Continuous integration","C":"Kanban","D":"Slack"},"a":["C"],"e":{"A":"Scrum divides the project into fixed-length iterations called sprints, so iterations are not optional in Scrum. Scrum uses artifacts such as the product and sprint backlogs rather than relying primarily on task visualization. It does not match the description.","B":"Continuous integration is a development practice of frequently merging and automatically building and testing code, not an Agile development approach with task visualization. It does not address iterations at all. It does not fit the description.","C":"Kanban visualizes the active tasks on a Kanban board to provide transparency of content and progress, and in Kanban iterations or sprints are optional, as per reference section 1.2.1. Items are delivered one at a time or in batches as soon as they are ready. The other options either require iterations or are not development approaches.","D":"Slack is not an Agile software development approach described in the syllabus. It is a common name for a communication tool or for spare capacity in a plan. It does not match the description."}},{"q":"Which of the following describes a direct benefit of early and frequent feedback associated with the adoption of continuous integration?","o":{"A":"Detecting and isolating code quality problems early","B":"Reducing the need of conducting retrospectives","C":"Making quality everyone's responsibility","D":"Eliminating communication problems within the team"},"a":["A"],"e":{"A":"The syllabus lists discovering via continuous integration, isolating and resolving quality problems early as a benefit of early and frequent feedback, and continuous integration makes it easier to detect integration errors and analyze root causes quickly, as per reference section 1.1.3. This is a direct benefit of automated, frequent build and test. The other options are not direct results of continuous integration.","B":"Continuous integration does not reduce the need for retrospectives, which address process, people and tools for continual improvement. The two practices serve different purposes. This is not a benefit of continuous integration.","C":"Quality being everyone's responsibility is a characteristic of the whole-team approach, not a direct benefit of continuous integration feedback. Continuous integration supports quality but does not create shared responsibility by itself. This is not the best answer.","D":"No practice eliminates communication problems entirely, and continuous integration focuses on build and test feedback rather than team communication. The absolute claim is unrealistic. This option is incorrect."}},{"q":"Which of the following statements about the testing quadrants model is true?","o":{"A":"Each of the four testing quadrants (Q1, Q2, Q3, and Q4) represents a different test level (Q1 = Unit, Q2 = Integration, Q3 = System, and Q4 = Acceptance) and describes the different test types that shall be performed by Agile teams in that test level for an Agile project","B":"Each of the four testing quadrants (Q1, Q2, Q3, and Q4) contains different test types and test levels, and these quadrants are numbered to describe the order in which the associated test types and test levels shall be performed in an Agile project (Q1 first, Q4 last)","C":"Each of the four testing quadrants (Q1, Q2, Q3, and Q4) contains different test types and test levels, and these quadrants can be used by Agile teams and other stakeholders to ensure that all important test types and test levels are included in an Agile project","D":"Each of the four testing quadrants (Q1, Q2, Q3, and Q4) contains different test types and test levels, and these quadrants are numbered to describe the risk level associated with the test types (Q1 = least risky, Q4 = most risky)"},"a":["C"],"e":{"A":"The quadrants are not mapped one-to-one to test levels; each quadrant can include tests at several levels, for example Q2 includes system-level functional tests and Q3 includes user acceptance tests. The quadrants classify tests by business versus technology facing and supporting versus critiquing. This option misrepresents the model.","B":"The syllabus states that the quadrant numbering does not dictate the order in which tests are performed. Tests from different quadrants may be executed at any time during the project. The claim that Q1 comes first and Q4 last is false.","C":"The testing quadrants align test levels with appropriate test types, and they can be used to help ensure that all important test types and test levels are included in the development lifecycle and to explain test types to stakeholders, as per reference section 3.1.3. They are a coverage and communication aid. The other options wrongly map quadrants to levels, sequence, or risk.","D":"The quadrant numbers do not represent risk levels. The model classifies tests as business or technology facing and as supporting the team or critiquing the product. Risk levels are determined separately through quality risk analysis."}},{"q":"You have been asked to explain to your client how to define acceptance criteria that are fully testable. Which of the following is the BEST EXAMPLE for testable acceptance criteria?","o":{"A":"The \"ID\" field must accept input value of a length between 2 and 10 characters.","B":"The interface to External System shall be specified.","C":"Action \"Reopen\" must be available only for a user with a specific authorization level.","D":"The program's icon should be clear and attractive."},"a":["A"],"e":{"A":"This criterion defines a precise, measurable condition (the ID field accepts input between 2 and 10 characters) from which concrete pass or fail tests, including boundary values, can be derived, and acceptance criteria must be testable in this way, as per reference section 3.3.1. It is the clearest and most objectively verifiable of the options. The other options are vague, subjective, or incomplete.","B":"Stating that an interface shall be specified describes a documentation task, not a verifiable behavior of the system. It gives no expected result against which a test can pass or fail. It is not a testable acceptance criterion.","C":"This criterion is partly testable, but a specific authorization level is not identified, so testers cannot determine exactly which users should or should not see the action. It needs further detail to be fully testable. It is less testable than option A.","D":"Clear and attractive are subjective terms with no measurable threshold. Different people would judge the icon differently, so no objective pass or fail result is possible. It is not a testable acceptance criterion."}},{"q":"You are developing the code that controls an industrial Espresso machine which will be operated by waiting staff in restaurants.\nThe machine is rather complicated and has lots of switches and buttons, so in the next iteration instructions will be provided to the operator on a small LCD screen.\nA User Story for the Operator-Instructions module is as follows:\n\"As an operator of the Espresso machine, I would like to know how to steam milk, so I can add steamed milk to the coffee.\"\nThe following is a list of risks identified for this story, with assigned probability and impact.\nWhich of these risks should be addressed when testing this user story?","o":{"A":"Operators will not read the instructions and will try various switches and buttons until something works. Probability: Low. Impact: Low","B":"The instructions may be incorrect or appear in the wrong order. Probability: Low. Impact: High","C":"An untrained customer will attempt to use the coffee machine. Probability: High. Impact: High","D":"A small child may try to steam milk. Probability: High. Impact: Low"},"a":["B"],"e":{"A":"This risk has low probability and low impact, and it concerns operator behavior rather than the content of the instructions being developed. It warrants little or no testing effort. It is therefore not the risk to focus on for this story.","B":"This risk directly concerns the product quality of the Operator-Instructions feature: incorrect or out-of-order instructions could cause misuse of the machine, so its high impact makes it the relevant quality risk to address with testing, as per reference section 3.2.1. Quality risks are identified and assessed for each backlog item, and testing effort is aimed at risks the story can actually mitigate. The other options are out of scope for this story or of low importance.","C":"The machine is operated by waiting staff, and an untrained customer using it is outside the scope of the operator instructions user story. Although rated high probability and high impact, testing the instructions module cannot mitigate this risk. It is not a quality risk of the feature being built.","D":"A small child using the machine is not a scenario addressed by the operator instructions module, which is intended for trained waiting staff. Its impact is also rated low. It is not the relevant risk for this story."}},{"q":"Which of the following statements describes Configuration Management?","o":{"A":"Configuration management is a test management task that deals with developing and applying a set of corrective actions to get a test project on track when monitoring shows a deviation from what was planned","B":"Configuration management represents a method for measuring and managing session-based testing, where a session is an uninterrupted period of testing which could last from 60 to 120 minutes","C":"Configuration management consists of all of the test design techniques in which test cases are designed to execute all possible discrete combinations of any set of a specified number of configuration elements","D":"Configuration management aims to identify and document some characteristics of a configuration item, control changes to those characteristics, and record and report change processing and implementation status"},"a":["D"],"e":{"A":"Developing and applying corrective actions to get a test project back on track describes test control, not configuration management. Test control is part of test monitoring and control activities. This definition is wrong.","B":"Measuring and managing time-boxed testing sessions describes session-based test management used for exploratory testing. It has nothing to do with controlling configuration items. This definition is wrong.","C":"Designing tests to execute all discrete combinations of a specified number of parameters describes combinatorial techniques such as pairwise testing. It is a test design technique, not configuration management. This definition is wrong.","D":"Configuration management is the discipline of identifying and documenting the characteristics of configuration items, controlling changes to them, and recording and reporting change processing and implementation status, and Agile teams rely heavily on it together with automated builds and tests, as per reference section 2.1.4. This is the standard glossary definition. The other options describe test control, session-based testing, and combinatorial test design."}},{"q":"Consider the following acceptance criterion associated to a user story: \"A maximum of 0.0002 failures per hour in the specified operational conditions over at least ten days of testing must be achieved.\" Which of the following aspects of testability is best described in this acceptance criterion?","o":{"A":"Scenarios","B":"Functional behavior","C":"External interfaces","D":"Quality characteristics"},"a":["D"],"e":{"A":"Scenarios describe sequences of actions or workflows a user performs, typically expressed in Given-When-Then form. The criterion here sets a reliability target, not a sequence of steps. It is not a scenario.","B":"Functional behavior describes the observable behavior of the system in response to inputs under certain configurations. The failure rate criterion does not specify what the system does but how reliably it does it. It is not functional behavior.","C":"External interfaces describe connections between the system and users, other systems or devices. The criterion does not mention any interface. It is not about external interfaces.","D":"A maximum failure rate under specified operational conditions over a defined test period is a measurable reliability target, and the syllabus lists quality characteristics, the system behavior relative to non-functional attributes such as performance or reliability, among the aspects of testable user stories, as per reference section 3.3.1. This criterion is a non-functional quality requirement. The other options concern workflows, functions, or interfaces."}},{"q":"Which of the following statements about the differences between testing activities in Agile projects and traditional projects is true?","o":{"A":"In traditional V-model projects there is a system test level that usually involves executing functional tests as well as non-functional tests, while in Agile projects there is never a system test level","B":"Because Agile projects tend to adopt test-first approaches, test automation in Agile projects is performed at lower test levels, while test automation in traditional projects is performed at higher test levels","C":"Risk-based testing can be adopted both in Agile projects and traditional projects. In Agile projects, the specific risks for all of the iterations are identified and assessed during release planning","D":"In traditional V-model projects the different test phases are performed sequentially, while in Agile projects these phases are performed parallel to one another within each iteration"},"a":["D"],"e":{"A":"Agile projects can include system-level testing within iterations and sometimes have a separate system test level, for example through independent test teams carrying out system integration testing. Saying there is never a system test level is false. The absolute claim makes this option wrong.","B":"Agile teams aim to automate at all test levels as early as possible, and traditional projects can also automate at any level. Test-first approaches do not restrict Agile automation to lower levels. The distinction drawn here is not supported by the syllabus.","C":"Risk-based testing applies to both, but in Agile projects quality risks are identified and assessed during both release planning, at a high level, and iteration planning, where the whole team analyzes risks for each iteration. Not all iteration risks are identified at release planning. This makes the statement false.","D":"In sequential models such as the V-model the test phases follow one another, while in Agile projects testing and development activities take place concurrently within each iteration, so test activities overlap and run in parallel, as per reference section 2.1.1. Testers work alongside developers throughout the iteration. The other options make false absolute claims or misplace risk analysis."}},{"q":"Iteration planning for Sprint 5 of your current project is complete. The plan for the sprint is to increase performance of the system, which of the following acceptance criteria would you expect for Sprint 5?\n1) User access for all roles has been validated.\n2) A static analysis tool has been executed for all code.\n3) 100% of the existing regression test suite has passed.\n4) System is responding in less than 3 seconds, 90% of the time.\n5) A new version of internet Explorer has been included.","o":{"A":"1, 3","B":"3, 4","C":"4, 5","D":"2, 5"},"a":["B"],"e":{"A":"Criterion 3 is relevant because regression tests must still pass after performance changes, but criterion 1 concerns user access validation for all roles, which is unrelated to the performance goal of the sprint. This combination is only half correct. It is not the best answer.","B":"With a sprint goal of increasing performance, a measurable response time target such as under 3 seconds 90% of the time directly verifies the goal, and passing 100% of the regression suite confirms that the changes did not break existing functionality, as per reference section 3.3.1. Acceptance criteria must be relevant and testable against the iteration objective. The other combinations include criteria unrelated to performance.","C":"Criterion 4 is appropriate, but criterion 5, adding support for a new browser version, is a compatibility change and unrelated to the performance goal. This combination is only half correct. It is not the best answer.","D":"Running a static analysis tool is a general quality practice and adding a new browser version is a compatibility change; neither verifies improved performance. Neither criterion relates directly to the sprint goal. This combination is wrong."}},{"q":"You are working in a team preparing a bank loan application. Your task is the preparation of acceptanc
