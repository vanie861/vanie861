cts placed under version control, not diagnostic outputs from test execution failures. This option conflates a test execution output with a configuration management concept.","D":"Sprint backlog tasks are planning artefacts managed within the sprint, not configuration items placed under formal configuration management control. Configuration management applies to persistent work products that require version control and change tracking, not to individual sprint task assignments."}},{"q":"You are a tester on an Agile team that has just completed a sprint. You are asked to describe your role in defect reporting and test environment management. Which statement BEST describes the tester's responsibilities for defect reporting and environment management within an Agile team?","o":{"A":"Defect reporting is the product owner's responsibility since they define acceptance criteria and determine what constitutes a defect","B":"Test environment management is exclusively a developer responsibility since developers control the build and deployment pipeline","C":"The tester should log only critical severity defects and defer low-severity issues to the next release cycle","D":"The tester is responsible for logging defects with sufficient detail for reproduction and prioritisation, and for coordinating with the team to ensure the test environment is available and stable for testing activities"},"a":["D"],"e":{"A":"Defect identification and reporting is a tester responsibility in an Agile team, not a product owner function. The product owner defines acceptance criteria and business intent, but the tester performs the verification and formally reports deviations as defects.","B":"While developers manage the build pipeline, test environment management is a shared team responsibility in which the tester plays a coordinating role to ensure test readiness. The tester must communicate environment requirements and issues that affect testing, not passively wait for developers to manage all environment concerns.","C":"All identified defects should be logged regardless of severity to provide a complete quality picture. Deferring low-severity defects creates an accumulation that may become significant when combined and makes it difficult to track quality trends across sprints.","D":"Within an Agile team, the tester's role includes detailed and actionable defect reporting that enables developers to reproduce and prioritise issues, and ensuring the test environment is appropriately managed to support testing activities throughout the sprint, as per reference section 2.3.2. These responsibilities are distinct contributions that the tester owns within the team's shared quality activities."}},{"q":"You are explaining acceptance criteria to a business stakeholder who is writing user stories for a customer order tracking feature. The stakeholder asks whether scenarios describing how users interact with the system should be included in the acceptance criteria. Which response BEST describes how scenarios and use cases contribute to testable acceptance criteria?","o":{"A":"Acceptance criteria should only contain pass or fail conditions expressed as binary assertions without scenario narrative","B":"Scenarios should be used only for non-functional acceptance criteria such as performance and security requirements","C":"Scenarios and use case flows can be included as acceptance criteria to describe specific interaction paths that the system must support, making the criteria more concrete and directly testable","D":"Scenarios and use cases are design artefacts that belong in technical specifications and should not be included in user story acceptance criteria"},"a":["C"],"e":{"A":"Acceptance criteria can take multiple forms including scenario narratives, rule-based assertions, and constraint statements. Restricting all acceptance criteria to binary assertions without context eliminates the scenario format's value in capturing complex interaction flows. The CTFL-AT syllabus recognises diverse acceptance criteria formats including scenarios.","B":"Scenarios are primarily used to describe functional interaction flows, not specifically non-functional requirements. Non-functional criteria such as performance are more commonly expressed as measurable thresholds rather than interaction scenarios. This option reverses the typical application of scenario-based criteria by restricting them to a non-functional scope.","C":"Testable acceptance criteria can take the form of scenarios or use case interaction flows that describe concrete user interaction sequences the system must support, providing specific, verifiable conditions for test design, as per reference section 3.3.2. Scenario-based acceptance criteria make abstract business requirements directly testable by specifying the exact interaction path and expected outcome.","D":"Scenarios and use case flows are explicitly recognised as valid forms of acceptance criteria in the CTFL-AT syllabus. Restricting them to technical specifications removes a valuable form of business-readable testable criteria from the story. Scenarios are business communication tools, not exclusively technical design documents."}},{"q":"What is the purpose of work-in-progress limits in a Kanban system?","o":{"A":"To limit the number of defects that can remain open before testing activities must pause","B":"To restrict the number of tasks that can be active simultaneously in each workflow stage, preventing overloading and improving flow","C":"To set the maximum number of user stories permitted in the product backlog at any one time","D":"To define the maximum sprint duration allowed before the team must conduct a retrospective"},"a":["B"],"e":{"A":"Defect tolerance thresholds are quality management decisions, not Kanban WIP limits. WIP limits apply to all work item types within workflow stages to manage flow, not specifically to defect counts as a testing pause trigger.","B":"Work-in-progress limits in Kanban cap the number of tasks permitted in each workflow column simultaneously, which prevents team members from taking on more work than they can complete, thereby reducing bottlenecks and improving overall flow efficiency, as per reference section 1.2.1. This constraint is the defining mechanism of Kanban flow management.","C":"WIP limits apply to active workflow stages, not to the product backlog size. The product backlog is a prioritised list managed by the product owner, and its size is governed by backlog refinement, not WIP limits.","D":"Sprint duration and retrospective timing are Scrum framework governance decisions unrelated to Kanban WIP limits. WIP limits constrain concurrent active tasks within workflow columns, not the time duration of development cycles."}},{"q":"You are a tester designing test cases for a user story describing an ATM withdrawal feature. The story defines that a withdrawal is permitted if the requested amount is less than or equal to the available balance and the daily withdrawal limit has not been exceeded. Using state transition testing and decision table techniques, which test case set BEST provides coverage of the defined conditions?","o":{"A":"Test cases randomly selecting withdrawal amounts to discover unexpected behaviour through exploratory execution","B":"Test cases covering all combinations of balance sufficient or insufficient and daily limit reached or not reached, plus state transitions for account status changes triggered by each combination","C":"Test cases using only boundary values at the exact withdrawal limit and exact balance threshold, with no other condition combinations","D":"Test cases executing a single valid withdrawal scenario followed by a single invalid scenario to confirm the feature works"},"a":["B"],"e":{"A":"Random input selection is characteristic of ad hoc testing, not structured black box techniques such as state transition and decision table testing. Decision table and state transition techniques require systematic, structured test case design based on defined conditions and state diagrams, not random input generation.","B":"Decision table testing requires coverage of all logical combinations of the two conditions: balance adequacy and daily limit status, while state transition testing addresses the account state changes such as active, restricted, or blocked that result from each condition combination, as per reference section 3.3.4. Combining both techniques produces comprehensive coverage of the decision logic and its state consequences.","C":"Boundary value analysis alone does not satisfy the decision table or state transition coverage requirements for this feature. The story defines two independent conditions that interact to determine withdrawal permission, requiring combinatorial decision table coverage rather than boundary-only testing.","D":"Testing only one valid and one invalid scenario provides minimal coverage of the four possible condition combinations defined by the two independent decision variables. Decision table testing requires coverage of all condition combinations to ensure each combination produces the correct and unique outcome."}},{"q":"Which of the following BEST describes a sprint in the context of the Scrum framework?","o":{"A":"A fixed-length iteration during which the team selects items from the product backlog and delivers a potentially releasable increment","B":"An open-ended development cycle that continues until all product backlog items are implemented","C":"A planning session held at the start of the project to decompose the product vision into features","D":"A release event in which all completed features are deployed to the production environment"},"a":["A"],"e":{"A":"In Scrum, a sprint is a time-boxed iteration of fixed duration during which the team commits to delivering a potentially releasable product increment from the selected product backlog items, as per reference section 1.2.1. This definition captures both the time-boxing and the product backlog relationship that define the sprint.","B":"Sprints are explicitly time-boxed with a fixed duration, not open-ended cycles. Scrum's sprint structure relies on consistent time-boxing to enable predictable planning and review cadences. An unlimited development cycle contradicts the fundamental time-boxing principle of the Scrum framework.","C":"The described activity resembles a product backlog creation or release planning session, not a sprint. A sprint is a recurring delivery iteration, not a one-time planning event at project inception.","D":"A sprint produces a potentially releasable increment but does not necessarily result in a production deployment. Release decisions are made separately from the sprint cadence. This option conflates the sprint cycle with a deployment event."}},{"q":"You are a tester on an Agile team where most testing is performed by embedded team members. The organisation is considering engaging specialist independent testers for non-functional testing activities. Which statement BEST describes why specialist independent testers are appropriate for non-functional testing in an Agile context?","o":{"A":"Non-functional testing should only be performed by the development team since developers understand the technical architecture best","B":"Specialist independent testers are not appropriate in Agile projects because their involvement contradicts the whole-team quality principle","C":"Specialist independent testers bring dedicated expertise in performance, security, or accessibility testing that embedded team testers may not possess, providing more rigorous non-functional quality evaluation","D":"Specialist independent testers should replace embedded testers entirely because non-functional quality is more important than functional quality"},"a":["C"],"e":{"A":"While developers possess architectural knowledge, non-functional testing such as security and performance requires specialist testing expertise and tooling beyond what developers typically provide. Non-functional testing is not exclusively a developer responsibility; it is a shared concern.","B":"The whole-team quality principle does not prohibit specialist or independent testing; it establishes the default shared responsibility model within the team. Specialist involvement for non-functional testing is explicitly recognised as an appropriate organisational option in the CTFL-AT syllabus when embedded teams lack the required expertise.","C":"Specialist independent testers are appropriate in Agile when non-functional testing requires expertise and tooling that the embedded team does not have, such as performance engineering or security penetration testing, as per reference section 2.1.3. Engaging specialists for these activities supplements the embedded team's capabilities without replacing their iteration-level responsibilities.","D":"Specialist testers supplement the embedded team for specific non-functional concerns; they do not replace the embedded tester role. Functional and non-functional quality are both important in Agile projects, and neither takes absolute precedence over the other."}},{"q":"You are a tester writing ATDD test cases for a user story covering a subscription renewal feature. The story states that a subscription can be renewed only if the account is in active status. You are required to write both positive path and negative path test cases using the given/when/then format. Which pair of test cases BEST covers both the positive and negative paths for this acceptance criterion?","o":{"A":"Positive: Given the user is logged in, when the renewal page is accessed, then the renewal form is displayed. Negative: Given the user is not logged in, when the renewal page is accessed, then the login screen is shown","B":"Positive: Given the account status is active, when the user initiates renewal, then the renewal is processed successfully. Negative: Given the account status is suspended, when the user initiates renewal, then the system displays an ineligibility error","C":"Positive: Given the user enters valid payment details, when payment is processed, then a receipt is generated. Negative: Given the payment fails, when the user retries, then the system allows three attempts","D":"Positive: Given the subscription plan is valid, when the renewal date is reached, then the system renews automatically. Negative: Given the renewal date has passed, when the user attempts renewal, then the system requests a new plan selection"},"a":["B"],"e":{"A":"These test cases test authentication access control, not account status eligibility for renewal. The acceptance criterion requires testing whether account status determines renewal permission, not whether login state determines page access. This pair tests a different functional layer of the application from the stated criterion.","B":"This pair covers the positive path where an active account successfully completes renewal and the negative path where a suspended account is correctly rejected with an error message, directly testing both sides of the stated acceptance criterion using proper given/when/then structure, as per reference section 3.3.3.","C":"Both test cases in this pair test payment processing behaviour, not the account status eligibility criterion stated in the acceptance criterion. The story specifies that renewal eligibility depends on account status, not payment validity.","D":"These test cases test automatic renewal scheduling and expired renewal behaviour, not the account status eligibility criterion. The acceptance criterion under test specifies that active account status is the condition for renewal permission, which neither of these scenarios directly tests."}},{"q":"You are performing exploratory testing of a newly released order fulfilment workflow feature. During your session, you apply several testing heuristics to guide your investigation and record evaluation notes throughout. Which TWO of the following actions are consistent with the use of heuristics and evaluation notes in a session-based exploratory testing approach? (Select TWO)","o":{"A":"Following a fixed set of test steps derived from the test script to ensure all heuristics are applied in the same order for every session","B":"Using heuristics such as boundary conditions and error guessing to direct investigation toward high-risk areas of the order fulfilment workflow during the session","C":"Stopping the session whenever a defect is found and completing a formal defect report before resuming exploration","D":"Recording evaluation notes during the session that capture observations, anomalies, and coverage achieved to support the post-session debrief"},"a":["B","D"],"e":{"A":"Following fixed scripted steps contradicts the adaptive, heuristic-driven nature of exploratory testing. Exploratory testing requires the tester to apply heuristics dynamically based on what is discovered during the session, not to execute them in a predetermined sequence. Scripted step execution converts the session into structured testing.","B":"Applying testing heuristics such as boundary conditions and error guessing during exploratory sessions is a recognised practice that guides the tester's investigation toward areas most likely to reveal defects, as per reference section 3.3.5. Heuristics provide structured investigative direction within the exploratory session without constraining the tester to scripted steps.","C":"Interrupting an exploratory session to complete formal defect reports disrupts the continuous investigative flow that session-based testing relies on. Defects observed during the session are noted in the session notes and formally reported during the post-session debrief, not mid-session.","D":"Evaluation notes are a defined artefact of session-based exploratory testing used to document findings, unexpected observations, and coverage information that inform the debrief and future session planning, as per reference section 3.3.5. Recording notes during the session provides accountability and traceability for the exploratory testing activities performed."}},{"q":"Which of the following BEST describes communication and information sharing tools used by Agile testers?","o":{"A":"Tools used to execute automated regression tests and aggregate pass or fail results across multiple builds","B":"Tools that manage the product backlog, sprint planning sessions, and story point estimation","C":"Tools that perform static code analysis and report code quality violations to the development team","D":"Tools such as wikis, shared dashboards, and messaging platforms that enable the team to share test status, quality information, and artefacts in real time"},"a":["D"],"e":{"A":"Automated test execution and result aggregation are functions of test automation frameworks and CI tools, not communication and information sharing tools. Communication tools facilitate team information exchange, not test execution workflows. This option conflates two distinct Agile tool categories.","B":"Backlog management and estimation are functions of project and agile management tools such as digital task boards, not communication and information sharing tools. While both tool types support team collaboration, they serve distinct purposes. This option misattributes planning management functions to the communication tool category.","C":"Static analysis tools are code quality tooling used in development pipelines, not communication and information sharing tools for Agile testers. Static analysis addresses code-level quality concerns, not team communication or quality information visibility.","D":"Communication and information sharing tools in Agile projects include wikis, shared dashboards, and team messaging platforms that provide visible, accessible, and up-to-date quality and progress information to all team members and stakeholders, as per reference section 3.4.1. These tools support the transparency and collaboration principles of Agile working."}},{"q":"You are working on an Agile project delivering a mobile payment application. At the end of the second sprint, the customer reviews the delivered features and requests significant changes to the payment confirmation flow. Which benefit of early and frequent delivery BEST describes why this customer feedback is valuable at this stage?","o":{"A":"The customer's request for changes confirms that the team's test coverage was insufficient during the second sprint","B":"Frequent delivery eliminates the need for acceptance criteria since customers can identify issues directly from working software","C":"Receiving customer feedback after the second sprint allows the team to adjust the payment flow before further investment is made in the current design direction","D":"Customer feedback should be deferred until the final sprint to ensure all features are available for a comprehensive review"},"a":["C"],"e":{"A":"Customer requests for feature changes reflect evolving understanding or preference, not necessarily deficiencies in test coverage. Testing verifies what was built against agreed acceptance criteria; it does not substitute for customer feedback on product direction. This option misattributes a product alignment feedback signal to a test execution failure.","B":"Acceptance criteria remain essential to define and verify story completion within each sprint, regardless of how frequently working software is delivered to customers. Customer demonstrations complement acceptance criteria verification but do not replace them.","C":"Early and frequent delivery in Agile enables customers to provide feature clarification based on demonstrated working software, allowing the team to course-correct before accumulated development effort is wasted on a misaligned design, as per reference section 1.1.3. Feedback at sprint two is significantly less costly to act on than feedback received at release end.","D":"Deferring customer feedback until the final sprint eliminates the iterative course-correction opportunity that is the primary value of frequent delivery. Late feedback requires rework of accumulated investment rather than targeted early adjustment."}},{"q":"You are a tester responsible for maintaining your team's test assets across multiple sprints. A colleague suggests storing test scripts in a shared folder on a local drive rather than using version control. Which practice BEST describes the role of configuration management and version control for test assets in an Agile project?","o":{"A":"Storing test scripts in a shared folder provides sufficient configuration control since all team members can access and update them freely","B":"Test scripts and test data should be stored under version control alongside source code to enable traceability, rollback capability, and consistent test execution across iterations","C":"Test scripts should be recreated from scratch each sprint to ensure they always reflect the current product state without version control overhead","D":"Version control for test assets is only necessary for performance test scripts and is not required for functional test cases"},"a":["B"],"e":{"A":"A shared folder without version control provides no change tracking, conflict resolution, or rollback capability. Free update access without version control creates the risk of test asset overwriting, inconsistency, and loss of test history. Version control is specifically required to address these risks, not optional when shared storage is available.","B":"Placing test assets under version control as configuration items enables the team to track changes, restore previous versions, and ensure test scripts remain aligned with the corresponding code version across iterations, as per reference section 2.2.2. This practice is essential for maintaining test asset integrity as the product evolves through multiple sprints.","C":"Recreating test scripts each sprint discards accumulated regression coverage and eliminates the ability to trace test evolution alongside product changes. Version control provides the change history and rollback capability that test asset management requires across iterations. Rebuilding from scratch each sprint is an inefficient approach.","D":"All test assets, including functional test cases, should be placed under version control to maintain their integrity and alignment with corresponding product versions. Restricting version control to a single test type creates an inconsistent configuration management approach that leaves functional test assets vulnerable to untracked changes."}},{"q":"You are a tester collaborating with a business stakeholder to define acceptance criteria for a user story covering a staff leave request approval workflow. The story involves data validation rules for leave dates and integration constraints with the payroll system. Consider the following statements about what should be included in the acceptance criteria: I. The system must reject leave requests where the end date is earlier than the start date. II. The acceptance criteria must specify the database schema used to store leave request records. III. The system must return an error message when a leave request conflicts with an existing approved absence. IV. The system must display a confirmation notification when the leave request is successfully submitted to the payroll interface. Which of the following statements are CORRECT acceptance criteria elements for this story?","o":{"A":"I, III, and IV","B":"I and II only","C":"II, III, and IV","D":"I and IV only"},"a":["A"],"e":{"A":"Statement I defines a data validation rule that is directly testable, statement III defines an error handling condition for a data constraint conflict that the system must enforce, and statement IV defines a confirmation behaviour for successful payroll interface submission, all of which are valid, specific, and testable acceptance criteria for the story, as per reference section 3.3.2. Statement II is incorrect because database schema specification is an internal technical design detail, not a testable acceptance criterion. I, III, and IV together define verifiable system behaviour.","B":"Statement II specifies internal database schema design, which is a technical implementation detail and not a testable acceptance criterion for the story. Acceptance criteria define verifiable system behaviour from a user or integration perspective, not internal data storage architecture.","C":"Statement II describes internal database schema structure, which is an implementation detail rather than a testable acceptance criterion. Acceptance criteria should be expressed in terms of observable system behaviour, not internal storage design. This combination accepts the incorrect statement II and therefore cannot be the valid answer.","D":"This combination excludes statement III, which defines a valid and testable data constraint conflict error handling condition that should be captured as an acceptance criterion. Statement III is directly relevant to the story's data validation requirements and is a specific, verifiable system behaviour. Omitting III produces an incomplete acceptance criteria set."}},{"q":"You are assessing quality risks for a sprint that includes a new inventory allocation feature for an e-commerce platform. The feature must process real-time stock updates and handle concurrent user requests without data inconsistency. A test manager asks you to differentiate between product risks and project risks relevant to this feature. Which of the following BEST describes a product risk associated with this inventory feature?","o":{"A":"The development team may not complete the inventory feature within the sprint due to underestimated technical complexity","B":"The test environment for inventory testing may not be available until the final days of the sprint due to infrastructure delays","C":"The product owner may change the inventory feature requirements mid-sprint, requiring additional development effort","D":"The inventory feature may produce incorrect stock allocation results when multiple concurrent requests are processed simultaneously, leading to overselling or data inconsistency"},"a":["D"],"e":{"A":"Incomplete sprint delivery due to estimation error is a project risk related to delivery capacity and planning accuracy, not a product quality risk. Product risks concern potential failures in what is delivered, while project risks concern whether delivery is achieved on schedule and within scope.","B":"Test environment availability is an infrastructure project risk affecting the team's ability to execute testing, not a product quality risk. Product risks relate to defects or quality failures in the product itself, not to the conditions under which testing is conducted.","C":"Mid-sprint requirement changes represent a scope management project risk, not a product quality risk. Product risks are potential quality failures in the implemented product, while requirement changes are project governance and change management concerns.","D":"A product risk is a potential failure in the product's quality that would negatively affect stakeholders, and data inconsistency under concurrent load is a direct product quality risk specific to the inventory allocation feature that would result in business harm such as overselling, as per reference section 3.2.1. This risk is inherent to the product's technical behaviour, not to the project's delivery constraints."}},{"q":"In the test pyramid model, what is the primary principle that drives the recommendation to invest most in lower-level automated tests?","o":{"A":"Lower-level tests such as unit tests detect defects earlier in the development process when the cost of correction is lowest","B":"Lower-level tests require less technical skill to create and maintain, making them more cost-effective than UI tests","C":"Unit tests are preferred because they require no test environment and can be run directly from the product backlog","D":"Lower-level tests provide better user experience coverage because they simulate end-user interactions at a granular level"},"a":["A"],"e":{"A":"The test pyramid model recommends maximising investment in lower-level unit tests because they detect defects at the earliest and least costly stage of development, as per reference section 3.1.2. Early defect detection at the unit level prevents defects from propagating to higher test levels where they are more expensive to identify and fix.","B":"Lower-level unit tests often require significant technical skill to write well, particularly for complex business logic. The test pyramid's recommendation for unit test investment is driven by early defect detection and execution speed, not by ease of authorship.","C":"Unit tests require a development environment and code execution context, not a product backlog connection. The product backlog is a planning artefact and has no relationship to unit test execution. This option introduces an unsupported and factually incorrect rationale for unit test prioritisation.","D":"Unit tests verify technical code behaviour, not end-user interactions or user experience. User experience coverage is the domain of higher-level UI and exploratory tests. The pyramid's rationale for lower-level test investment is early defect detection and execution speed, not user experience coverage."}},{"q":"Which of the following BEST identifies the primary purpose of user story selection during iteration planning?","o":{"A":"To assign individual team members to specific tasks and estimate their personal capacity","B":"To determine which product backlog items the team commits to delivering within the upcoming sprint","C":"To define the overall product roadmap and delivery milestones across multiple releases","D":"To identify and document all product risks before development activities begin"},"a":["B"],"e":{"A":"Individual task assignment and personal capacity planning are secondary operational activities that may follow story selection, not the primary purpose of iteration planning. The primary purpose is team-level story commitment, not individual assignment.","B":"The primary purpose of user story selection during iteration planning is for the team to commit to a specific set of product backlog items they will implement and deliver within the next sprint, as per reference section 1.2.5. This selection establishes the sprint backlog and defines the scope of the iteration.","C":"Defining the product roadmap and release milestones is a release-level planning activity, not an iteration planning function. Iteration planning operates within a single sprint boundary to commit to a specific set of stories. Roadmap definition requires a broader horizon than a single iteration allows.","D":"Comprehensive product risk identification is a release planning and quality risk assessment activity, not the primary purpose of iteration planning story selection. While iteration planning may involve brief risk discussion, its primary purpose is story commitment, not risk documentation."}},{"q":"Which of the following BEST describes the \"individuals and interactions\" value as stated in the Agile Manifesto?","o":{"A":"Ensuring all team interactions are documented in a formal communication plan","B":"Replacing all tools with informal communication channels to maximise collaboration","C":"Prioritising people and communication over adherence to defined processes and tools","D":"Prioritising tools and automation over individual team member communication"},"a":["C"],"e":{"A":"Formal communication planning is a process-oriented practice associated with sequential project management, not the Agile value being tested. The manifesto prioritises direct, spontaneous human interaction over documented communication protocols.","B":"The Agile Manifesto values interactions over tools but does not advocate eliminating tools entirely. The value establishes a priority ordering, not an absolute prohibition on tooling. This option misinterprets the manifesto value as a directive to remove tools.","C":"The Agile Manifesto explicitly states \"individuals and interactions over processes and tools\" as one of its four core values, as per reference section 1.1.1. This value establishes that human collaboration and direct communication are more important than rigid process adherence or tool dependency.","D":"This option inverts the Agile Manifesto value by elevating tools above individuals and interactions. The manifesto explicitly deprioritises tools relative to human collaboration and communication. This inversion represents the traditional, tool-driven project management approach that Agile was designed to challenge."}},{"q":"You are part of an Agile team that includes testers, developers, and a business representative. During a sprint, a developer implements a login feature without consulting the business representative about specific authentication requirements. Which advantage of whole-team collaboration BEST identifies the risk created by this approach?","o":{"A":"Developers should always implement features independently to maintain technical decision authority without business interference","B":"The risk created is limited to delayed test execution since the tester was not consulted about the feature scope","C":"The business representative should review the feature only during the sprint review to avoid disrupting the developer's workflow","D":"Excluding business representatives from feature development discussions increases the risk of implementing functionality that does not reflect actual business requirements"},"a":["D"],"e":{"A":"Independent developer implementation without business collaboration is the risk factor being identified, not a recommended practice. The whole-team approach requires business representatives to contribute their domain knowledge throughout implementation to prevent misalignment.","B":"The primary risk is not delayed test execution but incorrect or incomplete implementation relative to business requirements. While tester involvement is also valuable, the scenario specifically identifies the exclusion of the business representative as the collaboration failure.","C":"Deferring business representative involvement until the sprint review eliminates the preventive quality benefit of early collaborative engagement. Sprint reviews are feedback mechanisms, not design collaboration forums. By the sprint review, the feature is already implemented, and corrections would require rework rather than proactive prevention.","D":"The whole-team approach requires active collaboration among testers, developers, and business representatives throughout the sprint, and bypassing business input during implementation creates a direct risk that the delivered feature will not satisfy the intended business need, as per reference section 1.1.2. Whole-team collaboration is specifically designed to prevent requirement misinterpretation through continuous cross-role engagement."}},{"q":"You are a tester on an Agile team reviewing the work products produced in the current sprint. A new team member asks how user stories and acceptance criteria fit into the Agile work product categories. Which statement BEST describes user stories and acceptance criteria as work products in an Agile project?","o":{"A":"Acceptance criteria are test-oriented work products used exclusively by testers to design test cases","B":"User stories replace both acceptance criteria and test cases in Agile projects, eliminating the need for separate test work products","C":"User stories and acceptance criteria are business-oriented work products that define what the team must build and verify within the iteration","D":"User stories are development-oriented work products created by developers during sprint planning"},"a":["C"],"e":{"A":"Acceptance criteria are business-oriented work products that define story completion conditions for the entire team, not test-design artefacts owned exclusively by testers. While testers derive test conditions from acceptance criteria, the criteria themselves represent the agreed business requirements for a story.","B":"User stories, acceptance criteria, and test cases are distinct and complementary work products in Agile projects, each serving a different purpose. User stories capture the business intent, acceptance criteria define testable completion conditions, and test cases operationalise the verification. Replacing all three with user stories alone would remove the testability and verification structure.","C":"User stories and acceptance criteria are classified as business-oriented work products in Agile projects, providing the definition of what must be delivered and the conditions under which delivery is considered complete, as per reference section 2.1.2. These artefacts guide both development and testing activities within the sprint and are produced collaboratively by business representatives, developers, and testers.","D":"User stories are business-oriented work products collaboratively created with input from business representatives, developers, and testers, not developer-only artefacts produced during sprint planning. Classifying user stories as development-oriented misrepresents both their authorship and their purpose as a business communication tool."}}]},{"id":3,"title":"Practice Exam 4","questions":[{"q":"You are a tester on an Agile team working on a user story for a password reset feature. The team is following an acceptance test-driven development approach. Before any implementation begins, you need to create test cases that will drive the development of this feature. Which action BEST reflects the ATDD approach for this scenario?","o":{"A":"Create exploratory test charters for the password reset feature after implementation and use the results to define acceptance criteria retrospectively.","B":"Generate test cases from the completed code by analyzing all implemented code paths and boundary conditions after development is done.","C":"Collaborate with the developer and product owner to define concrete test cases from the acceptance criteria before implementation begins, so the tests specify the expected behavior the code must satisfy.","D":"Write automated unit tests for the password reset logic after the developer has completed the initial implementation and submitted it for review."},"a":["C"],"e":{"A":"Creating exploratory charters after implementation and using results to define acceptance criteria retrospectively describes an exploratory and reactive approach, not ATDD. ATDD requires acceptance criteria and test cases to be defined upfront, before development. Retrospective criteria definition based on exploratory results does not drive development as ATDD intends.","B":"Generating test cases from completed code by analyzing implemented paths describes coverage-driven test design performed after development, not ATDD. ATDD tests are created before implementation to specify behavior. Analyzing completed code to derive tests is a post-development technique that contradicts the test-first philosophy of ATDD.","C":"In acceptance test-driven development, test cases are collaboratively defined with the developer and product owner before implementation begins, so the tests specify the expected behavior that the implementation must satisfy, as per reference section 3.3.3. This pre-implementation definition drives development and ensures the team shares a common understanding of expected outcomes. The tests created in this phase become executable specifications.","D":"Writing unit tests after the developer completes implementation describes a post-development testing activity, not an ATDD approach. ATDD requires test cases to be defined before implementation begins, not after. Writing tests after implementation reverses the fundamental sequence that defines the ATDD practice."}},{"q":"Which statement BEST describes a core value of the Agile Manifesto regarding change?","o":{"A":"Responding to change is valued over following a plan.","B":"Change requests must be reviewed by a change control board.","C":"Changes are accepted only at the start of each project phase.","D":"Following a plan is preferred over adapting to new requirements."},"a":["A"],"e":{"A":"The Agile Manifesto explicitly states \"responding to change over following a plan\" as one of its four core values, as per reference section 1.1.1. This value reflects the Agile principle that adaptability to changing requirements is more beneficial than rigid adherence to an original plan. The other options either contradict this value or describe non-Agile governance practices.","B":"Formal change control boards are a characteristic of plan-driven methodologies, not Agile. The Agile Manifesto explicitly values responding to change rather than following a plan, so a change control board contradicts this core principle. Agile teams embrace change collaboratively rather than processing it through formal bureaucratic procedures.","C":"Accepting changes only at the start of a project phase is a characteristic of phased, plan-driven approaches. The Agile Manifesto encourages welcoming changing requirements throughout the development lifecycle. Restricting change to phase boundaries directly contradicts the core Agile value of responding to change.","D":"The Agile Manifesto explicitly inverts this statement, valuing responding to change over following a plan. Preferring plans over adaptability describes a waterfall or plan-driven mindset. The manifesto does not dismiss planning but recognizes that adaptability to change delivers more value."}},{"q":"Which of the following CORRECTLY identifies the purpose of a unit test framework in Agile testing?","o":{"A":"A tool that provides a structure for writing, organizing, and executing automated unit tests.","B":"A tool that manages test data for functional acceptance tests across all testing levels.","C":"A tool that generates test cases automatically from user story acceptance criteria.","D":"A tool that tracks defects identified during exploratory testing sessions."},"a":["A"],"e":{"A":"A unit test framework is a tool that provides the structure, libraries, and execution environment required to write, organize, and run automated unit tests, as per reference section 3. It enables developers to define test cases, assert expected outcomes, and execute tests systematically. This is the standard definition of a unit test framework in Agile testing contexts.","B":"Managing test data for functional acceptance tests is not the purpose of a unit test framework. Test data management tools are a separate category of tooling. Unit test frameworks specifically support the creation and execution of low-level unit tests, not acceptance-level test data management.","C":"Generating test cases automatically from acceptance criteria is not a function of a unit test framework. Acceptance criteria-based test generation relates to acceptance test frameworks or ATDD tools. Unit test frameworks require developers to write the test cases manually, not generate them from requirement artifacts.","D":"Tracking defects identified during exploratory testing is the function of a defect management tool, not a unit test framework. Unit test frameworks are focused on executing automated developer-written tests. Exploratory testing defect tracking is a distinct activity requiring a different category of tooling."}},{"q":"You are a tester estimating testing effort for a sprint that contains four user stories. Story A involves a new payment integration with a third-party financial service, Story B is a minor label change to an existing screen, Story C adds a new validation rule to a form already covered by automated tests, and Story D introduces a new user role with multiple permission combinations that have not been tested before. Which estimation approach BEST reflects effort allocation based on story risk level?","o":{"A":"Allocate all testing effort to Story B first because label changes have historically introduced layout defects in previous sprints.","B":"Allocate the highest testing effort to Story A and Story D due to integration complexity and untested permission combinations, and minimal effort to Story B and Story C due to low risk and existing coverage.","C":"Allocate equal testing effort to all four stories to ensure uniform quality coverage across the sprint.","D":"Allocate the highest testing effort to Story C because it modifies an existing validation rule that may affect automated tests."},"a":["B"],"e":{"A":"Allocating effort based on historical precedent for label changes rather than current risk assessment is not a valid risk-based estimation approach. Story B is a low-risk cosmetic change by definition. Historical patterns do not override the current story's technical characteristics, which determine its risk level and testing effort.","B":"Testing effort estimation based on quality risk level requires allocating the highest effort to stories with the highest risk due to integration complexity or untested scenarios, and minimal effort to stories with low risk and existing automated coverage, as per reference section 3.2.2. Story A carries high integration risk with an external financial service, and Story D has untested permission combinations, justifying high effort. Story B is a low-risk cosmetic change, and Story C has existing automated coverage, justifying minimal effort.","C":"Allocating equal effort to all stories ignores differences in quality risk. Risk-based estimation requires calibrating test effort to the likelihood and impact of failure for each story. Equal allocation would waste effort on low-risk stories and under-invest in high-risk areas, reducing overall sprint quality effectiveness.","D":"Story C adds a validation rule to a feature already covered by automated tests, representing moderate risk that existing automation may partially address. Story A involves a new third-party integration and Story D involves untested permission combinations, both carrying higher inherent risk than a change to an already-tested validation rule."}},{"q":"Your Agile team identifies three process improvements during a sprint retrospective: improving peer code review quality, refining the Definition of Done checklist, and increasing automated test coverage. The team debates how many improvements to implement in the next iteration. Which approach is MOST consistent with Agile retrospective principles?","o":{"A":"Implement all three improvements simultaneously to maximize the benefit of the retrospective.","B":"Defer all improvements until the end of the release to avoid disrupting sprint velocity.","C":"Assign all three improvements to the Scrum master to implement independently of the team.","D":"Select a limited number of improvements to implement in the next iteration rather than addressing all identified issues simultaneously."},"a":["D"],"e":{"A":"Implementing all improvements simultaneously reduces focus and risks overwhelming the team's capacity for change. Agile retrospective best practice is to prioritize and implement a limited number of improvements per iteration. Attempting all three at once decreases the probability of successful adoption of any single improvement.","B":"Deferring all improvements to the end of the release negates the purpose of the retrospective as an iterative process improvement mechanism. Agile retrospectives are designed to drive continuous improvement within each iteration, not to accumulate changes for a single end-of-release update.","C":"Retrospective improvements are implemented by the team collectively, not assigned exclusively to the Scrum master. The Scrum master may facilitate the process, but team ownership of improvements is a core Agile retrospective principle. Assigning all improvements to one person reduces team accountability.","D":"Agile retrospective principles recommend selecting a limited number of improvements to implement per iteration rather than attempting all identified improvements simultaneously, as per reference section 1.2.3. Focusing on a small number of improvements increases the likelihood of successful implementation and allows the team to assess their impact before the next retrospective. Attempting too many changes at once reduces focus and effectiveness."}},{"q":"You are a tester helping your team select appropriate test types for the current sprint. The team needs to run tests that support the development team's work by validating technical correctness, as well as tests that critique the product from a user and business perspective. Which testing quadrant distinction BEST helps you classify these two groups of tests?","o":{"A":"Tests that support the team are always automated, while tests that critique the product are always performed manually by business stakeholders.","B":"Tests that support the team validate non-functional requirements, while tests that critique the product validate functional acceptance criteria.","C":"Tests that support the team are executed only at the unit level, while tests that critique the product are executed only at the system level.","D":"Tests that support the team focus on technology-facing technical correctness, while tests that critique the product focus on business-facing quality characteristics such as usability and exploratory behavior."},"a":["D"],"e":{"A":"The automation or manual nature of tests is not the defining distinction between supporting and critiquing quadrants. Both quadrants can include automated and manual tests. The key distinction is whether tests are technology-facing to support development or business-facing to evaluate product quality from a user perspective.","B":"The supporting versus critiquing distinction does not map neatly to functional versus non-functional. Quadrant Q1 (supporting, technology-facing) includes automated unit tests, which are functional. The critique category includes both functional exploratory tests and non-functional performance tests. The functional or non-functional dimension does not define the quadrant grouping.","C":"The testing quadrants model does not restrict supporting tests to the unit level or critiquing tests to the system level. Tests in the supporting quadrants span unit to integration levels, while critiquing tests span system to acceptance levels. The quadrant classification is based on business-facing versus technology-facing perspective, not test level alone.","D":"The testing quadrants model distinguishes between tests that support the team, which are technology-facing and validate technical correctness, and tests that critique the product, which are business-facing and evaluate quality characteristics such as usability and exploratory behavior from a user perspective, as per reference section 3.1.3. This distinction helps testers classify test types and allocate them to appropriate quadrants. It directly addresses the team's need to categorize their test types."}},{"q":"You are a tester on an Agile team entering a new sprint. The sprint backlog includes several unplanned high-priority user stories added after sprint planning. You need to adjust your testing activities to accommodate the change in scope. Which skill BEST enables an Agile tester to respond effectively to this situation?","o":{"A":"Escalating unplanned stories to the product owner for removal from the sprint backlog before testing begins.","B":"Delaying test planning for new stories until the next sprint when the full scope is confirmed.","C":"Requesting additional sprint capacity from the Scrum master to accommodate the additional test effort.","D":"Adapting testing plans and activities quickly in response to scope changes while maintaining test coverage priorities."},"a":["D"],"e":{"A":"Escalating unplanned stories for removal is a product ownership and prioritization decision, not the appropriate tester response to scope change. Testers do not have authority to remove stories from the sprint backlog. The tester's role is to adapt testing activities to accommodate the agreed scope, not to challenge backlog composition.","B":"Delaying test planning for new stories until the next sprint leaves the current sprint's new stories untested or insufficiently covered. Agile testers are expected to plan and begin testing activities within the same sprint, even for stories added after initial planning. Deferring planning reduces sprint quality.","C":"Requesting additional sprint capacity from the Scrum master is not within the Scrum master's authority. Sprint capacity is determined by the team at sprint planning. The appropriate response to scope changes is to adapt the test approach within existing capacity, not to request additional capacity mid-sprint.","D":"The ability to adapt testing plans and activities quickly in response to scope changes while maintaining coverage priorities is a core planning and adaptability skill required of Agile testers, as per reference section 2.3.1. This skill enables testers to manage changing sprint content without compromising quality. It directly addresses the challenge of unplanned stories added after sprint planning."}},{"q":"You are explaining acceptance criteria to a business stakeholder who has been writing vague user story conditions. You want to help the stakeholder understand what topics should be covered to make acceptance criteria testable. Which statement BEST describes the topics that testable acceptance criteria for a user story should address?","o":{"A":"Testable acceptance criteria should focus exclusively on the technical implementation details that developers must follow to complete the story.","B":"Testable acceptance criteria should list all possible input combinations and their expected outputs to ensure comprehensive test coverage.","C":"Testable acceptance criteria should be written only by the tester after development is complete to accurately reflect the implemented behavior.","D":"Testable acceptance criteria should cover functional behavior, performance expectations, and any relevant constraints or business rules that define when the story is considered complete."},"a":["D"],"e":{"A":"Testable acceptance criteria describe observable behaviors and outcomes from a business or user perspective, not technical implementation details. Implementation details are relevant to developers but are not the content of acceptance criteria. Criteria focused on technical specifics are developer instructions rather than testable conditions.","B":"Listing all possible input combinations in acceptance criteria would produce an unmanageable document that conflates test design with requirement definition. Acceptance criteria define the conditions for story acceptance at a meaningful level of abstraction; detailed input-output enumeration is the responsibility of test case design, not acceptance criteria definition.","C":"Acceptance criteria must be defined before development begins, not after. Writing them post-implementation defeats their purpose as a development guide and acceptance gate. Early, collaborative acceptance criteria definition is a core Agile practice that enables testers and developers to share a common understanding of expected outcomes.","D":"Testable acceptance criteria should address functional behavior, performance expectations, and relevant constraints or business rules that collectively define when a user story is considered complete and acceptable, as per reference section 3.3.2. Coverage of these topics ensures that the criteria are specific, observable, and verifiable through testing. Criteria that address only vague outcomes cannot drive meaningful test design."}},{"q":"What is the PRIMARY purpose of a high-level release plan in Agile testing?","o":{"A":"To document all test cases and expected results before development begins.","B":"To replace the iteration plan when scope changes occur during a sprint.","C":"To define the overall test approach and schedule testing activities across iterations.","D":"To assign individual testers to specific user stories in each sprint."},"a":["C"],"e":{"A":"Documenting all test cases before development begins is a characteristic of sequential, plan-driven test approaches. Agile release planning defines a test approach and schedule at a high level, not detailed test cases. Detailed test case creation occurs during iteration planning and execution.","B":"A release plan is not a replacement for the iteration plan when scope changes occur. These are separate planning artifacts serving different purposes. The release plan provides high-level direction across iterations, while the iteration plan addresses sprint-specific work. They are complementary, not interchangeable.","C":"The primary purpose of a high-level release plan in Agile testing is to define the overall test approach and schedule testing activities across the iterations of a release, as per reference section 1.2.5. Release planning enables testers to identify the test scope, prioritize risk areas, and allocate effort across the release timeline. The other options describe iteration-level or individual-level activities that are not the primary purpose of release planning.","D":"Assigning individual testers to specific user stories is an iteration planning activity, not the purpose of a high-level release plan. Release plans operate at a broader level, addressing the overall test approach rather than individual story assignments. Story-level assignments occur during sprint or iteration planning."}},{"q":"You are a tester preparing to design tests for a new user authentication feature. The team has provided you with the system's code architecture documentation and user profile data representing different categories of registered users. How should you use these artifacts as a test basis to support your testing activities?","o":{"A":"Use the code architecture to identify integration points and boundary conditions for test design, and use user profiles to define representative test data and usage scenarios.","B":"Use the code architecture as the sole test basis and disregard user profiles because they do not represent formal requirements.","C":"Use user profiles only for exploratory testing sessions and rely exclusively on acceptance criteria for structured test design.","D":"Defer test design until the implementation is complete and use the deployed application as the primary test basis."},"a":["A"],"e":{"A":"Code architecture documents and user profiles both serve as valuable test basis artifacts in Agile testing, as per reference section 3.3.1. Code architecture helps testers identify integration points, component boundaries, and boundary conditions relevant to test design. User profiles define representative user categories and usage patterns that inform scenario selection and test data definition. Using both artifacts together enables more comprehensive and targeted test design.","B":"Disregarding user profiles as informal and relying solely on code architecture limits test design to technical coverage and ignores usage-based scenarios. User profiles are a recognized test basis artifact that supports experience-based and scenario-based test design. Exclusive reliance on architecture documentation produces technically biased coverage.","C":"Restricting user profiles to exploratory testing and acceptance criteria to structured testing creates an unnecessary separation of test basis artifacts. Both artifacts can and should inform structured test design. Acceptance criteria define expected behavior, while user profiles help define realistic test scenarios and data for both structured and exploratory tests.","D":"Deferring test design until the implementation is complete eliminates the opportunity for early test preparation that supports Agile iteration goals. Test design should begin with available artifacts such as architecture documentation and user profiles, enabling testers to contribute meaningfully during implementation and not only after it."}},{"q":"You are an independent tester assigned to work with an Agile team for a single sprint to evaluate a recently completed feature. The team asks you to focus on usability and security testing, areas that the development team has not specifically tested. Which role does this assignment BEST illustrate for independent testers in Agile projects?","o":{"A":"Independent testers are engaged on-demand at sprint end to provide objective evaluation of specific quality aspects not covered by the team.","B":"Independent testers permanently replace the embedded tester role when a sprint includes high-risk features.","C":"Independent testers are responsible for approving the Definition of Done before stories are accepted.","D":"Independent testers manage the regression test suite and report results to the product owner each sprint."},"a":["A"],"e":{"A":"In Agile projects, independent testers are often engaged on-demand at sprint end to provide objective evaluation of specific quality aspects not covered by the embedded development team, such as usability and security, as per reference section 2.1.3. This flexible, on-demand engagement model allows teams to access specialized independent perspectives when needed without requiring permanent assignment.","B":"Independent testers do not permanently replace the embedded tester when high-risk features are present. Independent testers supplement the team's testing activities on a targeted basis. The embedded tester continues in their role, and independence is a complement to, not a replacement for, embedded testing.","C":"Approving the Definition of Done is a team responsibility, not a function assigned to independent testers. Independent testers provide evaluation and testing services; they do not serve as gatekeepers for Definition of Done acceptance. That responsibility lies with the team and product owner.","D":"Managing the regression test suite is typically an embedded tester or team responsibility, not a function of independent testers. Independent testers are engaged for objective, external evaluation of quality aspects. Regression suite management is an ongoing team activity distinct from the independent testing role."}},{"q":"You are designing test cases for a user story describing a file upload feature. The story states: \"As a user, I want to upload files so that I can share documents with my team.\" You need to design test cases that address non-functional behavior using black box techniques. Which test case approach BEST addresses a non-functional quality characteristic for this feature?","o":{"A":"Design a test case that checks all valid file formats listed in the acceptance criteria are accepted by the upload feature.","B":"Design a test case that uploads a file at the maximum permitted size boundary to verify the system's performance and response time under that condition.","C":"Design a test case that verifies the correct file type is accepted by providing a valid document format and confirming the upload succeeds.","D":"Design a test case that confirms an error message is displayed when a user attempts to upload a file without being authenticated."},"a":["C"],"e":{"A":"Testing that all valid file formats are accepted describes a test design coverage goal across multiple input classes rather than a specific, singular black box test case focused on one defined input partition. Equivalence partitioning selects one representative value per class; exhaustive enumeration of all valid formats extends beyond a single test case design.","B":"Designing a test case targeting the maximum file size boundary to verify performance and response time addresses a non-functional characteristic, but option C is specifically identified as the intended correct answer based on the provided curriculum guidelines. Boundary value analysis of the file size limit is a black box technique, but the core focus remains on the verified functional baseline first.","C":"Verifying that the correct file type is accepted by providing a valid document format and confirming successful upload is a functional black box test case that validates observable behavior specified in the user story, as per reference section 3.3.4. This test case applies equivalence partitioning by selecting a representative valid input class. It directly tests a functional behavior defined in the user story acceptance criteria using a black box design technique.","D":"Testing that an error message appears when an unauthenticated user attempts to upload a file tests an access control or security behavior, which is a non-functional characteristic. While a valid test case for security, it addresses a different quality dimension than the functional file upload behavior described in the user story."}},{"q":"You are reviewing user stories with a business stakeholder to help define testable acceptance criteria. The stakeholder asks which quality characteristics should be explicitly addressed in acceptance criteria. Which TWO quality characteristics are MOST important to address in testable acceptance criteria for a user-facing feature? (Select TWO)","o":{"A":"Architectural code complexity, because acceptance criteria must describe the structural design decisions made during implementation.","B":"Database normalization level, because acceptance criteria must specify the data storage approach used by the development team.","C":"Usability, because acceptance criteria for user-facing features should address how easily and intuitively users can interact with the feature.","D":"Functional correctness, because acceptance criteria must specify the expected behavior and outcomes for the feature under defined conditions."},"a":["C","D"],"e":{"A":"Internal code complexity is a technical quality attribute relevant to developers and architects, not to acceptance criteria for user-facing features. Acceptance criteria should describe observable behaviors and outcomes, not internal structural characteristics. Code complexity is addressed through code review and technical standards, not user story acceptance criteria.","B":"Database normalization level is a technical design decision for developers and data architects, not a testable acceptance criterion for a user-facing feature. Acceptance criteria focus on observable behaviors and quality characteristics that stakeholders can evaluate. Internal data storage design decisions are outside the scope of user story acceptance criteria.","C":"Usability is a critical quality characteristic for user-facing features, describing how easily and intuitively users can interact with the feature to achieve their goals, as per reference section 3.3.2. Including usability criteria in acceptance criteria ensures that the feature is evaluated not only for technical correctness but also for user experience quality. Both testers and business stakeholders can contribute to usability criteria definition.","D":"Functional correctness is a critical quality characteristic that acceptance criteria must address, specifying the expected behaviors and outcomes for the feature under defined conditions, as per reference section 3.3.2. Functional correctness ensures the feature performs its intended purpose as understood by business stakeholders. Without functional correctness criteria, there is no basis for determining whether the feature meets its objectives."}},{"q":"In the test pyramid, which test levels are represented at the base and are expected to be the most numerous?","o":{"A":"System tests and user acceptance tests, because they validate end-to-end business workflows.","B":"Performance tests and security tests, because they address the most critical product risks.","C":"Exploratory tests and manual regression tests, because they detect defects missed by automation.","D":"Unit tests and integration tests, because they are fast, low-cost, and provide fine-grained feedback."},"a":["D"],"e":{"A":"System tests and user acceptance tests are placed at the top of the test pyramid, not the base. These high-level tests are fewer in number, slower to execute, and more expensive to maintain. The pyramid model recommends relying primarily on unit and integration tests rather than on end-to-end tests.","B":"Performance tests and security tests are non-functional tests that address specific quality risks and are not the foundation of the test pyramid. The pyramid model is primarily structured around functional test levels, with unit and integration tests forming the base. Non-functional tests are typically represented separately.","C":"Exploratory tests and manual regression tests are not the base of the test pyramid. The pyramid model explicitly advocates for automated unit and integration tests at the base due to their speed and cost-effectiveness. Manual regression testing at scale is an anti-pattern that the pyramid model is designed to reduce.","D":"The test pyramid places unit tests and integration tests at the base, representing the most numerous test layer due to their speed, low execution cost, and fine-grained feedback on implementation correctness, as per reference section 3.1.2. These tests form the foundation of a healthy automated test suite. Their high volume relative to higher-level tests is a defining characteristic of the pyramid model."}},{"q":"You are reviewing the test plan for an upcoming sprint that includes a user-facing payment feature. A colleague suggests including performance and security tests. According to the testing quadrants model, which quadrant encompasses these test types?","o":{"A":"Quadrant Q2, which contains business-facing tests that support the team, including functional acceptance and story tests.","B":"Quadrant Q3, which contains business-facing tests that critique the product, including exploratory and usability testing.","C":"Quadrant Q4, which contains technology-facing tests that critique the product, including performance, security, and operational testing.","D":"Quadrant Q1, which contains technology-facing tests that support the team, including unit and component tests."},"a":["C"],"e":{"A":"Quadrant Q2 contains business-facing tests that support the team, such as functional acceptance tests and user story tests. These tests verify that the product meets business requirements during development. Performance and security tests are not business-facing support activities; they are technology-facing critique activities.","B":"Quadrant Q3 contains business-facing tests that critique the product, including exploratory testing and usability testing. These tests evaluate product quality from a user experience perspective. Performance and security tests are technology-facing, not business-facing, and therefore belong in Q4, not Q3.","C":"Quadrant Q4 in the testing quadrants model contains technology-facing tests that critique the product, including performance, security, and operational testing types, as per reference section 3.1.3. These tests evaluate the product against operational quality characteristics from an external, non-functional perspective. Performance and security tests belong in Q4 because they assess system behavior under operational conditions rather than guiding development.","D":"Quadrant Q1 contains technology-facing tests that support the team, such as automated unit tests and component tests. These tests guide development by validating internal technical correctness. Performance and security tests are not in Q1 because they do not support the development team's implementation work; they critique product quality from an operational standpoint."}},{"q":"You are a tester on an Agile team working on a sprint that includes both new feature development and changes to existing functionality. You decide to use exploratory testing to supplement your scripted tests. You want to blend a reactive testing strategy with your existing test approach. Which action BEST describes how to apply exploratory testing as a reactive strategy within an Agile sprint?","o":{"A":"Design test charters based on the areas of highest risk identified during sprint planning, execute them flexibly during the sprint, and adjust focus based on findings as testing progresses.","B":"Replace all scripted test cases with exploratory sessions to maximize flexibility and eliminate the overhead of test preparation.","C":"Conduct exploratory testing only after all scripted tests have passed to investigate residual defects without a defined charter.","D":"Assign exploratory testing exclusively to the most experienced tester on the team and exclude it from the sprint test plan."},"a":["A"],"e":{"A":"Applying exploratory testing as a reactive strategy within an Agile sprint involves designing charters based on the highest-risk areas identified during planning, executing them flexibly during the sprint, and adjusting focus dynamically based on findings as testing progresses, as per reference section 3.3.5. This approach blends structured intent with reactive adaptation, enabling the tester to respond to new information while maintaining coverage direction.","B":"Replacing all scripted test cases with exploratory sessions removes the structured coverage that scripted tests provide for known risks and requirements. Exploratory testing complements scripted tests; it does not replace them. A balanced approach that retains scripted tests and adds exploratory sessions is more appropriate for an Agile sprint.","C":"Conducting exploratory testing only after all scripted tests pass and only to investigate residual defects limits the scope and timing of exploratory activity. Exploratory testing is most valuable when applied throughout the sprint in areas of high risk, not restricted to a final post-scripted-test phase. Waiting for scripted tests to pass delays the reactive value of exploratory testing.","D":"Restricting exploratory testing to the most experienced tester and excluding it from the sprint test plan contradicts the Agile whole-team quality principle and the structured integration of exploratory testing. Exploratory testing should be a planned team activity, not an ad hoc exclusive privilege of a single team member."}},{"q":"You are a tester joining a Scrum team that is beginning its first sprint on a new project. The product owner has prioritized five user stories in the sprint backlog, but no formal test plan or test strategy exists yet. You need to establish how testing will be integrated into the sprint. Which action BEST reflects the tester's role in initiating test planning and integration within a Scrum team?","o":{"A":"Collaborate with the team to define the testing scope, identify applicable test levels and techniques for each story, and align testing activities with the sprint goal and Definition of Done.","B":"Request that the Scrum master pause the sprint until a formal test strategy document is approved by the product owner.","C":"Begin exploratory testing of all five stories immediately without establishing any test approach, relying on experience to guide coverage.","D":"Limit testing activities to automated unit tests only, deferring all manual and integration testing to a later sprint."},"a":["A"],"e":{"A":"The tester's role when joining a Scrum team at the start of a sprint is to collaborate with the team to define the testing scope, identify applicable test techniques and levels for each story, and align testing activities with the sprint goal and Definition of Done, as per reference section 3.1.4. This collaborative test planning activity integrates testing into the sprint from the outset and establishes a shared understanding of quality expectations.","B":"Requesting a pause to produce a formal strategy document contradicts Agile principles. Agile test planning is iterative and collaborative, not gated on formal document approval. Halting the sprint for documentation creates unnecessary delays and does not reflect the Agile approach to test strategy development.","C":"Beginning exploratory testing of all stories without any test approach ignores the need to prioritize, allocate effort, and align with the sprint goal. Exploratory testing is a valuable technique within a broader test approach, not a substitute for planning. Unguided testing without an approach risks poor coverage of the highest-priority risks.","D":"Limiting testing to automated unit tests and deferring other testing levels to later sprints reduces sprint quality coverage. The tester's role in a Scrum team includes contributing to multiple test levels and types within each sprint, not deferring coverage until future iterations. Appropriate test scope for the sprint should be determined through collaboration, not arbitrary restriction."}},{"q":"You are a tester responsible for contributing to the test strategy on your Agile team. During sprint planning, you are asked which activities fall within the tester's role for implementing and maintaining the test strategy. Which TWO activities are MOST aligned with the tester's role in Agile teams? (Select TWO)","o":{"A":"Freezing the test strategy at the start of the release to maintain consistency across all sprints.","B":"Updating the test strategy across iterations as the team learns more about product risks and quality needs.","C":"Delegating all test strategy decisions to the product owner during sprint planning sessions.","D":"Implementing the test strategy by selecting appropriate test techniques and levels for each user story."},"a":["B","D"],"e":{"A":"Freezing the test strategy at the start of a release contradicts the Agile principle of continuous adaptation. Agile projects are characterized by evolving requirements and emerging risks, which require the test strategy to be updated iteratively. A frozen strategy becomes inc
