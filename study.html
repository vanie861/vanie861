<style>
  :root{
    color-scheme: light dark;
    --bg:#F3F4F1;
    --card:#FFFFFF;
    --ink:#171B21;
    --ink-soft:#565D66;
    --ink-faint:#8A9099;
    --line:#E4E3DB;
    --line-strong:#D0CFC5;
    --accent:#2F6BF0;
    --accent-deep:#1D4ED8;
    --accent-tint:#E9F0FE;
    --good:#1E9E54;
    --good-tint:#E7F6ED;
    --good-line:#8FD3AC;
    --amber:#B7791F;
    --amber-tint:#FBF1DC;
    --shadow:0 1px 2px rgba(18,20,15,.05), 0 14px 30px -18px rgba(18,20,15,.22);
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --radius:14px;
    --radius-sm:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1116;
      --card:#171B22;
      --ink:#ECEEF1;
      --ink-soft:#A6ADB6;
      --ink-faint:#6B727C;
      --line:#262B33;
      --line-strong:#333A44;
      --accent:#6E9BFF;
      --accent-deep:#93B4FF;
      --accent-tint:#1A2233;
      --good:#4ED084;
      --good-tint:#122A1D;
      --good-line:#2E6B45;
      --amber:#E0AE5A;
      --amber-tint:#2A2213;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -20px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1116; --card:#171B22; --ink:#ECEEF1; --ink-soft:#A6ADB6; --ink-faint:#6B727C;
    --line:#262B33; --line-strong:#333A44; --accent:#6E9BFF; --accent-deep:#93B4FF;
    --accent-tint:#1A2233; --good:#4ED084; --good-tint:#122A1D; --good-line:#2E6B45;
    --amber:#E0AE5A; --amber-tint:#2A2213;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 18px 34px -20px rgba(0,0,0,.7);
  }
  :root[data-theme="light"]{
    --bg:#F3F4F1; --card:#FFFFFF; --ink:#171B21; --ink-soft:#565D66; --ink-faint:#8A9099;
    --line:#E4E3DB; --line-strong:#D0CFC5; --accent:#2F6BF0; --accent-deep:#1D4ED8;
    --accent-tint:#E9F0FE; --good:#1E9E54; --good-tint:#E7F6ED; --good-line:#8FD3AC;
    --amber:#B7791F; --amber-tint:#FBF1DC;
    --shadow:0 1px 2px rgba(18,20,15,.05), 0 14px 30px -18px rgba(18,20,15,.22);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; line-height:1.55; }
  .page{ max-width:820px; margin:0 auto; padding:32px 20px 96px; }

  /* Header */
  .head{ margin-bottom:22px; }
  .eyebrow{ font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:0 0 6px; }
  .head h1{ font-size:clamp(24px,4.5vw,32px); font-weight:640; margin:0 0 8px; letter-spacing:-.01em;
    text-wrap:balance; }
  .head p.lede{ margin:0; color:var(--ink-soft); font-size:15px; max-width:60ch; }

  /* Toolbar */
  .toolbar{ position:sticky; top:0; z-index:20; margin:20px -20px 0; padding:12px 20px 14px;
    background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); }
  .toolrow{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .search{ flex:1; min-width:190px; position:relative; }
  .search input{ width:100%; font-family:var(--sans); font-size:14.5px; color:var(--ink);
    background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:10px 12px 10px 36px; transition:border-color .15s ease; }
  .search input:focus{ border-color:var(--accent); outline:2px solid var(--accent-tint); outline-offset:0; }
  .search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  select, .toolbtn{ font-family:var(--sans); font-size:13.5px; font-weight:500; color:var(--ink);
    background:var(--card); border:1px solid var(--line-strong); border-radius:var(--radius-sm);
    padding:10px 12px; cursor:pointer; transition:border-color .15s ease, color .15s ease; }
  select:hover, .toolbtn:hover{ border-color:var(--accent); }
  .toolbtn{ display:inline-flex; align-items:center; gap:7px; }
  .toolbtn.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .toolbtn svg{ display:block; }
  .iconbtn{ width:40px; height:40px; padding:0; justify-content:center; border-radius:50%; flex-shrink:0; }
  .meta{ margin:12px 2px 0; font-family:var(--mono); font-size:11.5px; letter-spacing:.04em;
    color:var(--ink-faint); }
  .meta b{ color:var(--ink-soft); font-weight:600; }

  /* Set section header */
  .set-head{ display:flex; align-items:baseline; gap:10px; margin:34px 2px 14px;
    padding-bottom:8px; border-bottom:1px dashed var(--line-strong); }
  .set-head h2{ font-size:16px; font-weight:640; margin:0; letter-spacing:-.01em; }
  .set-head .count{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); letter-spacing:.05em; }

  /* Card */
  .qcard{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 22px; margin-bottom:14px; box-shadow:var(--shadow); }
  .qcard-top{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .qnum{ font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.05em;
    color:var(--accent); background:var(--accent-tint); padding:3px 8px; border-radius:20px; }
  .tag{ font-family:var(--mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 8px; border-radius:20px; border:1px solid var(--line-strong); color:var(--ink-soft); }
  .tag.multi{ color:var(--amber); border-color:var(--amber); background:var(--amber-tint); }
  .qtext{ font-size:16.5px; font-weight:560; line-height:1.5; margin:0 0 16px; white-space:pre-line; }

  .opts{ display:flex; flex-direction:column; gap:8px; }
  .opt{ display:flex; align-items:flex-start; gap:11px; border:1px solid var(--line-strong);
    border-radius:var(--radius-sm); padding:11px 13px; font-size:14.5px; line-height:1.5; }
  .opt .ltr{ flex-shrink:0; width:23px; height:23px; border-radius:50%; border:1px solid var(--line-strong);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px;
    font-weight:600; color:var(--ink-soft); }
  .opt .otx{ flex:1; padding-top:1px; }
  .opt .chk{ flex-shrink:0; opacity:0; color:var(--good); }
  .reveal .opt.correct{ border-color:var(--good-line); background:var(--good-tint); }
  .reveal .opt.correct .ltr{ background:var(--good); border-color:var(--good); color:#fff; }
  .reveal .opt.correct .chk{ opacity:1; }
  .reveal .opt:not(.correct){ opacity:.72; }

  .showbtn{ margin-top:14px; font-family:var(--sans); font-size:13px; font-weight:600;
    color:var(--accent-deep); background:var(--accent-tint); border:1px solid transparent;
    border-radius:20px; padding:8px 15px; cursor:pointer; transition:filter .15s ease; }
  .showbtn:hover{ filter:brightness(.96); }
  .reveal .showbtn{ display:none; }

  .explain{ margin-top:14px; border-left:3px solid var(--accent); background:var(--accent-tint);
    border-radius:0 var(--radius-sm) var(--radius-sm) 0; padding:14px 16px; display:none; }
  .reveal .explain{ display:block; }
  .explain h4{ font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent-deep); margin:0 0 10px; }
  .exp-line{ font-size:13.5px; line-height:1.6; margin:0 0 9px; color:var(--ink-soft); }
  .exp-line:last-child{ margin-bottom:0; }
  .exp-line.corr{ color:var(--ink); }
  .exp-line .el{ font-family:var(--mono); font-weight:700; margin-right:5px; }
  .exp-line.corr .el{ color:var(--good); }
  .exp-line.wrong .el{ color:var(--ink-faint); }

  .empty{ text-align:center; padding:60px 20px; color:var(--ink-faint); font-size:15px; }
  mark{ background:var(--amber-tint); color:inherit; border-radius:3px; padding:0 2px; }

  /* ===== Annotation layer ===== */
  canvas.anno{ position:absolute; inset:0; z-index:6; pointer-events:none; border-radius:var(--radius); }
  body.annotating canvas.anno{ pointer-events:auto; touch-action:none; cursor:crosshair; }
  body.annotating .qcard{ user-select:none; -webkit-user-select:none; }
  body.annotating .showbtn{ pointer-events:none; }
  .dock{ position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:50;
    display:none; align-items:center; gap:6px; background:var(--card);
    border:1px solid var(--line-strong); border-radius:34px; padding:8px 10px; box-shadow:var(--shadow); }
  body.annotating .dock{ display:flex; }
  .dock .tool{ width:38px; height:38px; border-radius:50%; border:1px solid transparent;
    background:transparent; color:var(--ink-soft); display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:background .15s ease, color .15s ease; }
  .dock .tool:hover{ background:var(--accent-tint); color:var(--accent-deep); }
  .dock .tool.on{ background:var(--accent); color:#fff; }
  .dock .sep{ width:1px; height:24px; background:var(--line-strong); margin:0 3px; }
  .dock .swatch{ width:22px; height:22px; border-radius:50%; border:2px solid var(--line-strong);
    cursor:pointer; padding:0; }
  .dock .swatch.on{ border-color:var(--ink); box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--accent); }
  .dock .tool.danger:hover{ background:var(--good-tint); color:var(--good); }

  @media (max-width:520px){
    .page{ padding:22px 14px 80px; }
    .qcard{ padding:16px 15px; }
    .toolbar{ margin-left:-14px; margin-right:-14px; padding-left:14px; padding-right:14px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>

<div class="page">

<script>
  const DATA = {"sets":[{"id":0,"title":"Practice Exam 1","questions":[{"q":"Which of the following BEST describes the purpose of task management and tracking tools used by Agile testers?","o":{"A":"To generate test metrics reports and aggregate defect trends across multiple releases","B":"To create, assign, and monitor testing tasks and their progress throughout the sprint","C":"To execute automated regression tests and report pass or fail results to the team","D":"To version control source code and test scripts across multiple branches and iterations"},"a":["B"],"e":{"A":"Test metrics aggregation and defect trend reporting across releases are functions of test management or reporting tools, not task management tools. Task management tools track individual task status within a sprint, not cross-release quality trend analysis. This option describes a reporting tool capability, not task management.","B":"Task management and tracking tools in Agile projects enable testers to create testing tasks, assign them to team members, and monitor their completion status throughout the sprint, supporting visibility and coordination of test activities, as per reference section 3.4.1. These tools provide the operational transparency needed to track testing work alongside development tasks. The other options describe unrelated tool categories.","C":"Automated test execution and results reporting are functions of test automation frameworks and continuous integration tools, not task management tools. Task management tools track work item status and assignment, not test execution outcomes. This option conflates two distinct Agile tool categories.","D":"Version control and branch management are functions of configuration management tools, not task management tools. Task management tools focus on work item tracking and sprint coordination, not on source code or artefact versioning. This option misattributes a configuration management function to a task tracking category."}},{"q":"You are reviewing your team's test suite before the start of a new sprint. Several automated test cases cover features that were replaced or significantly modified three iterations ago. A colleague argues that all test cases should be kept permanently since they represent historical coverage. Which action BEST describes how test cases should evolve across multiple iterations in an Agile project?","o":{"A":"All existing test cases should be deleted at the start of each sprint and recreated to reflect the current sprint content exclusively","B":"Test cases should only be modified when a defect is reported that the existing suite failed to detect","C":"Test cases should be reviewed each iteration and updated or retired when the features they cover have changed or been removed","D":"All test cases must be retained permanently regardless of product changes to preserve complete historical regression coverage"},"a":["C"],"e":{"A":"Deleting all test cases each sprint destroys accumulated regression coverage for stable, previously validated features. Regression testing depends on retaining tests for unchanged or stable functionality to detect unintended changes introduced by new development. Wholesale deletion removes the regression protection that the suite provides across iterations.","B":"Reactive test case modification triggered only by defect escapes is a lagging, post-failure approach to test maintenance. Proactive review and update of test cases during iteration planning ensures the suite remains accurate and comprehensive before defects are introduced. This option defers test case maintenance until after quality has already been compromised.","C":"Evolving tests across multiple iterations requires regular review to ensure test cases remain aligned with the current product state, and cases covering removed or significantly changed features must be updated or retired to prevent misleading results and unnecessary maintenance overhead, as per reference section 2.2.2. Permanent retention of outdated tests inflates the suite and reduces its reliability as a quality indicator. The other options apply blanket retention or replacement policies inconsistent with sound test management.","D":"Retaining test cases for features that no longer exist or have been fundamentally changed produces misleading pass or fail results and increases suite maintenance burden without quality benefit. Historical coverage value must be balanced against current product accuracy. Permanent retention prioritises artefact preservation over test effectiveness."}},{"q":"You are a tester on an Agile team that is part of a larger organisation considering how to structure its testing capability. Your manager asks you to explain the organisational options for independent testing in Agile projects. Which option BEST describes a valid organisational approach for independent testing in an Agile context?","o":{"A":"Testers must be permanently assigned to independent test teams and never embedded within Agile development teams","B":"A separate independent test team can be engaged for system-level or release-level testing while the embedded tester handles iteration-level testing within the team","C":"All testing in Agile projects must be performed by developers to maximise integration and eliminate the need for separate testers","D":"Independent testing must be avoided in Agile projects because it contradicts the whole-team quality ownership principle"},"a":["B"],"e":{"A":"The CTFL-AT syllabus describes embedding testers within Agile teams as a primary organisational model for iteration-level testing. Prohibiting embedded testers removes the early, collaborative testing engagement that is fundamental to Agile quality practices. This option describes a strictly sequential test organisation incompatible with Agile integration principles.","B":"The CTFL-AT syllabus recognises that independent testing in Agile can be structured so that an external test team provides objectivity at higher test levels such as system or release testing, while the embedded tester manages iteration-level activities, as per reference section 2.1.3. This approach balances independence with Agile integration. The other options either eliminate embedded testers or prohibit independent testing without syllabus justification.","C":"The CTFL-AT syllabus defines a specific tester role within Agile teams and does not advocate developer-only testing. While developers perform unit testing, the tester role contributes distinct skills including independence, domain knowledge, and test technique application. Eliminating dedicated testers would reduce test coverage breadth and objectivity.","D":"Independent testing is a recognised and valid option in Agile, particularly for higher test levels requiring objectivity that embedded team members may not provide. The whole-team quality principle does not prohibit independent testing; it defines the default team quality responsibility. This option applies an absolute prohibition not supported by the syllabus."}},{"q":"You are a tester who has been embedded in the same Agile development team for eighteen months. Your organisation is reviewing its testing structure and identifies two risks associated with your long-term assignment to a single team. Which TWO of the following represent recognised risks for embedded testers assigned long-term to a single Agile team? (Select TWO)","o":{"A":"The tester may become too comfortable with team norms and reduce the rigour of defect reporting to maintain team relationships","B":"The tester may adopt the team's assumptions and lose the critical perspective needed to identify defects objectively","C":"The tester will accumulate too much domain knowledge and become unable to test new features introduced in the product","D":"The tester will inevitably automate all manual tests, creating a technical imbalance in the team's skill distribution"},"a":["A","B"],"e":{"A":"Prolonged team membership can create social pressure that discourages thorough defect reporting, as testers may soften assessments to preserve interpersonal relationships, as per reference section 2.1.3. This risk directly threatens the objectivity that effective testing requires. It is a recognised consequence of extended team embedding without structural independence safeguards.","B":"Long-term assignment to a single team creates alignment risk where the tester gradually adopts the team's shared assumptions and blind spots, reducing their ability to evaluate the product with impartiality, as per reference section 2.1.3. This erosion of critical perspective is a documented organisational risk associated with embedded tester independence. Mitigation strategies include periodic rotation or supplemental independent review.","C":"Domain knowledge accumulation improves testing effectiveness and is not identified as a risk in the CTFL-AT syllabus. Deep domain familiarity enables testers to design more targeted and meaningful tests. This option inverts the actual value of domain expertise by presenting it as an impediment.","D":"Progressive automation by an experienced tester is a positive contribution, not a documented independence risk associated with long-term assignment. The syllabus does not identify automation skill development as an organisational risk for embedded testers. This option describes a beneficial outcome that is mischaracterised as a structural concern."}},{"q":"You are a tester writing ATDD test cases for a user story covering a hotel room booking feature. The story states: \"As a guest, I want to reserve a room for specific dates so that I am guaranteed accommodation during my stay.\" The acceptance criteria state that a guest cannot book a room that is already reserved for the requested dates. Using the given/when/then format, which test case BEST addresses the acceptance criterion for this story?","o":{"A":"Given a room is already reserved for the requested dates, when a guest attempts to book that room for the same dates, then the system displays an availability error and prevents the booking","B":"Given a guest has valid login credentials, when the guest navigates to the booking page, then the booking form is displayed correctly","C":"Given no rooms are available in the hotel, when a guest attempts any booking, then the system displays a general unavailability message","D":"Given a guest selects a room, when the booking is confirmed, then a confirmation email is sent to the guest's registered address"},"a":["A"],"e":{"A":"This given/when/then test case directly tests the stated acceptance criterion by establishing the precondition of an existing reservation, triggering the booking attempt, and asserting the expected system response of an error message and booking prevention, as per reference section 3.3.3. The test case is specific, executable, and unambiguously derived from the acceptance criterion. The other options either test unrelated conditions or omit the critical precondition.","B":"This test case tests navigation and form display behaviour, not the acceptance criterion about preventing double bookings. The stated criterion requires testing the conflict detection logic, not the user interface presentation for authenticated users. This option tests an adjacent functional behaviour unrelated to the specific criterion being verified.","C":"The acceptance criterion specifies a condition where a particular room is reserved for the requested dates, not a scenario where all rooms are unavailable. Generalising the precondition changes the test scenario and may not exercise the targeted reservation conflict detection logic. This option tests a broader scenario that does not directly address the specific acceptance criterion.","D":"This test case tests the confirmation notification behaviour after a successful booking, not the conflict prevention acceptance criterion. The criterion under test requires validating that an already-reserved room cannot be re-booked, which this test case does not address. This option tests a post-booking workflow step unrelated to the stated acceptance condition."}},{"q":"Which of the following BEST describes the process steps followed in test-driven development?","o":{"A":"Write a failing test, implement the minimum code to pass the test, then refactor the code while keeping the test passing","B":"Implement the full feature, write tests to validate it, then review the code with the product owner before committing","C":"Define acceptance criteria, develop the feature to meet them, then conduct a manual review session before testing","D":"Create a test plan, assign test cases to developers, and execute them after each sprint review"},"a":["A"],"e":{"A":"Test-driven development follows the red-green-refactor cycle: first write a failing test that defines desired behaviour, then write the minimum production code to make the test pass, and finally refactor the code to improve quality while maintaining test passage, as per reference section 3.1.1. This sequence is the defining characteristic of TDD as a development practice. The other options either reverse steps or describe alternative practices.","B":"Implementing the feature before writing tests describes a test-last approach, not test-driven development. TDD requires the test to exist and fail before production code is written, which is the mechanism by which tests drive design. Writing tests after implementation removes the design influence that defines TDD.","C":"This sequence describes a general development workflow with acceptance criteria, not the TDD red-green-refactor cycle. TDD is a unit-level technical practice where automated tests drive code implementation, not a story-level workflow incorporating manual review sessions. This option conflates ATDD story-level thinking with TDD's technical micro-cycle.","D":"Assigning test cases to developers for post-sprint execution describes a traditional test execution workflow, not the TDD development cycle. TDD involves developers writing automated unit tests before production code as a continuous micro-cycle within development, not as a sprint-end activity. This option misrepresents TDD as a planning and execution sequence."}},{"q":"You are a tester working with a business stakeholder who is writing acceptance criteria for a user story covering an online appointment booking feature. The stakeholder has written only functional criteria and asks whether anything else should be included. Which response BEST explains how testable acceptance criteria should be defined for this story?","o":{"A":"Acceptance criteria should be written by the tester independently after development is complete to reflect actual implemented behaviour","B":"Acceptance criteria should include both functional behaviour and relevant non-functional constraints such as response time and accessibility requirements to ensure the story is fully testable","C":"Acceptance criteria should focus exclusively on functional user interactions and exclude all non-functional requirements","D":"Non-functional requirements should be deferred to the system test phase and excluded from individual story acceptance criteria"},"a":["B"],"e":{"A":"Acceptance criteria must be defined collaboratively before development begins, not written independently by the tester after implementation. Post-development tester-authored acceptance criteria describe what was built rather than what was required, eliminating the preventive quality benefit of upfront criteria definition. This option reverses the intended timing and ownership of acceptance criteria authorship.","B":"Testable acceptance criteria in Agile user stories must address not only functional behaviour but also relevant non-functional requirements such as performance, accessibility, or security constraints that define what \"done\" means for that story, as per reference section 3.3.2. Without non-functional criteria, the story may pass functional verification while failing to meet quality expectations. The other options either restrict criteria to functional aspects or defer non-functional definition inappropriately.","C":"Excluding non-functional requirements from acceptance criteria creates an incomplete definition of done that may allow the story to be accepted while failing to meet critical quality attributes. Non-functional requirements relevant to the story must be expressed as testable criteria to ensure they are verified alongside functional behaviour. This option produces a partial and insufficient acceptance basis.","D":"Deferring non-functional verification to a separate system test phase reintroduces a sequential quality gate that prevents iterative validation of non-functional attributes. Non-functional criteria relevant to individual stories should be verified within the sprint as part of the definition of done. Late-stage non-functional testing increases risk and reduces the team's ability to address quality gaps early."}},{"q":"You are preparing test activities for a sprint that includes a user story for a funds transfer feature in a banking application. The available test basis includes the user story, acceptance criteria, a data flow diagram produced during refinement, and notes from the story's three amigos session. Which action BEST reflects how you should interpret and use these test basis sources to support testing activities?","o":{"A":"Use only the user story title and defer test design until the developer provides a technical specification","B":"Limit test design to the acceptance criteria only and disregard the data flow diagram and refinement notes","C":"Request that the product owner rewrite the user story as a formal test specification before deriving any test conditions","D":"Use all available test basis sources together to derive comprehensive test conditions that cover functional behaviour, data flows, and edge cases identified during refinement"},"a":["D"],"e":{"A":"Waiting for a technical specification before designing tests is a sequential, plan-driven approach that contradicts the Agile practice of using available test basis artefacts to begin test preparation during the sprint. The user story, acceptance criteria, and refinement notes are sufficient starting points for initial test condition identification. Deferring test design reduces the time available for test execution within the sprint.","B":"Restricting the test basis to acceptance criteria alone ignores supplementary information from the data flow diagram and refinement session that may reveal additional test conditions not explicitly captured in the acceptance criteria. Comprehensive test design requires interpreting all relevant test basis sources. Limiting the basis increases the risk of missing edge cases and data flow defects.","C":"Transforming user stories into formal test specifications is not an Agile test preparation practice and would introduce unnecessary overhead and delay. User stories and their associated artefacts serve as the test basis in Agile projects, and the tester's role is to interpret these sources as they exist, not to request their transformation into traditional test documentation.","D":"The tester's responsibility when interpreting relevant information is to use all available test basis sources, including the user story, acceptance criteria, supporting technical artefacts, and refinement notes, to derive a complete set of test conditions that address functional, data, and boundary scenarios, as per reference section 3.3.1. Using multiple sources together ensures that test coverage reflects all agreed and documented expectations. The other options restrict the test basis inappropriately or defer test design."}},{"q":"You are a tester designing test cases for a user story describing a temperature alert feature. The story states that an alert is triggered when the temperature reading is below zero degrees or above fifty degrees. Readings from zero to fifty degrees inclusive generate no alert. Using equivalence partitioning and boundary value analysis, which set of test values BEST covers the defined partitions and their boundaries?","o":{"A":"Test all integer values from -5 to 55 to ensure complete coverage of all possible alert conditions","B":"Test with values -1, 0, 25, 50, and 51 to cover the below-zero boundary, the within-range partition, and the above-fifty boundary","C":"Test with values 0, 25, and 50 only to confirm the no-alert partition is handled correctly","D":"Test with values -10, 30, and 60 as representative samples from each of the three partitions"},"a":["B"],"e":{"A":"Exhaustive testing of all values in the range is unnecessary when equivalence partitioning and boundary value analysis can achieve equivalent defect detection with a significantly smaller, targeted test set. These techniques are specifically designed to reduce test volume while maintaining defect detection effectiveness. This option ignores both techniques and proposes exhaustive input enumeration.","B":"This value set applies both equivalence partitioning and boundary value analysis: -1 and 0 cover the lower boundary between the alert and no-alert partitions, 25 represents the valid no-alert partition, and 50 and 51 cover the upper boundary between the no-alert and alert partitions, as per reference section 3.3.4. This combination provides coverage of all three partitions and both critical boundaries. The other options omit boundaries or test only mid-partition values.","C":"Testing only within the valid no-alert partition misses the boundary values adjacent to the alert trigger thresholds, which are the locations most likely to reveal off-by-one defects. Boundary value analysis specifically requires testing at and adjacent to partition boundaries. This option applies equivalence partitioning without the complementary boundary coverage.","D":"Selecting mid-partition representatives without testing boundary values omits the test conditions most likely to expose defects in the boundary logic. The boundaries at zero and fifty are the critical decision points where implementation errors are most probable. This option provides partition coverage but omits boundary analysis entirely."}},{"q":"You are part of a team using two-week sprints that includes stakeholder reviews at the end of each iteration. Consider the following statements about continuous feedback in sprints: I. Continuous feedback reduces the risk of delivering features that do not meet stakeholder expectations. II. Sprint reviews should be eliminated once the team reaches a stable velocity. III. Continuous feedback allows the team to adjust priorities based on demonstrated product behaviour. IV. Feedback collected only at the end of a release is sufficient to manage product quality in Agile projects. Which of the following statements are CORRECT?","o":{"A":"III and IV","B":"I and III","C":"I and II","D":"II and IV"},"a":["B"],"e":{"A":"Statement IV is false; relying solely on release-end feedback defeats the purpose of iterative development by deferring quality validation until too late for cost-effective correction. Statement III is correct, but pairing it with the incorrect statement IV produces an invalid answer. This combination partially recognises Agile feedback value but includes a contradicting principle.","B":"Continuous feedback reduces the risk of unmet expectations by enabling early course correction, and it allows the team to adjust priorities based on observed product behaviour across sprints, as per reference section 1.1.3. Statement II is incorrect because sprint reviews are a structural Agile ceremony that should not be eliminated regardless of velocity. Statement IV is incorrect because end-of-release feedback is insufficient to support iterative quality management. Only I and III are valid.","C":"Statement II is false; sprint reviews are a required Agile ceremony and should not be removed once velocity stabilises. Eliminating sprint reviews would break the feedback loop that is fundamental to Agile delivery. This combination accepts an incorrect statement and produces an invalid pair.","D":"Both statement II and statement IV are false. Sprint reviews must be retained throughout the project, and end-of-release feedback alone is insufficient for managing quality in an iterative development model. This combination selects two incorrect statements and represents a fundamental misunderstanding of Agile feedback principles."}},{"q":"You are a tester classifying a set of testing activities for your sprint. The activities include usability testing sessions with end users and performance testing under load. Your test lead asks you to identify which testing quadrants these activities belong to. Which statement BEST describes the relationship between testing quadrants Q3 and Q4 and their associated testing types?","o":{"A":"Q3 contains automated performance tests while Q4 contains manual exploratory testing sessions","B":"Q3 and Q4 both contain development-support tests used by developers to verify technical code quality","C":"Q4 contains business-facing user acceptance tests while Q3 contains technology-facing load and stress tests","D":"Q3 contains business-facing tests that critique the product, such as usability and exploratory testing, while Q4 contains technology-facing tests that critique the product, such as performance and security testing"},"a":["D"],"e":{"A":"Performance tests are technology-facing and belong to Quadrant 4, not Q3. Manual exploratory testing is business-facing and belongs to Quadrant 3, not Q4. This option reverses the assignments of both quadrants, producing an entirely incorrect classification of the critique-oriented test types.","B":"Development-support tests are the function of Quadrants 1 and 2, not Q3 and Q4. Quadrants 3 and 4 are critique-oriented, assessing the product's suitability from business and technical perspectives rather than supporting its internal construction. This option misidentifies the orientation of the upper two quadrants.","C":"User acceptance tests are business-facing and belong to Quadrant 3, not Q4. Load and stress tests are technology-facing and belong to Quadrant 4, not Q3. This option reverses the business and technology dimension assignments across Q3 and Q4.","D":"Quadrant 3 comprises business-facing critique tests such as usability testing, exploratory testing, and user acceptance testing that evaluate the product from a stakeholder or end-user perspective, while Quadrant 4 contains technology-facing critique tests such as performance, load, and security testing that evaluate non-functional product characteristics, as per reference section 3.1.3. Both quadrants assess product quality rather than supporting its construction. The other options misassign test types or reverse the business versus technology dimension."}},{"q":"You are working on an Agile project where development and testing activities run in parallel throughout each sprint. A new team member asks how this integrated approach differs from what they experienced in a traditional project. Which statement BEST describes how development and testing activities are integrated in Agile projects?","o":{"A":"Development is completed in the first half of the sprint and testing is performed exclusively in the second half to maintain a clean separation of activities","B":"Testers receive fully developed user stories from developers and perform independent testing without collaboration to preserve objectivity","C":"Development and testing activities are integrated only during the final sprint of a release to ensure all features are tested simultaneously","D":"Testing activities begin as soon as stories enter development within the iteration, with testers and developers collaborating on acceptance criteria and defect resolution throughout the sprint"},"a":["D"],"e":{"A":"Splitting a sprint into discrete development and testing halves reintroduces a sequential, phase-gated structure within the iteration, which contradicts the integrated Agile model. Agile integration requires development and testing to overlap and inform each other throughout the sprint. This option describes a mini-waterfall approach that defeats the continuous collaboration benefit of Agile.","B":"Performing testing in isolation from developers contradicts the whole-team collaboration model central to Agile integration. While objectivity is a valid testing concern, Agile projects balance independence with collaboration, particularly for unit and integration-level verification within the team. Fully independent testing without collaboration removes the early defect prevention benefit of integrated working.","C":"Integration of development and testing is a continuous practice throughout every sprint in an Agile project, not a release-end activity. Restricting integration to the final sprint is a sequential release approach that eliminates the iterative quality benefits of Agile development. This option describes a batch integration model incompatible with Agile principles.","D":"In Agile projects, testing is integrated with development from the start of each sprint, with testers actively collaborating on acceptance criteria clarification and participating in defect resolution as development progresses, as per reference section 2.1.2. This concurrent model produces shared work products across business, development, and test categories within the same iteration. The other options describe sequential or role-separated approaches inconsistent with Agile integration."}},{"q":"You are a tester preparing for iteration planning on a sprint that includes a new patient data management feature for a healthcare application. The feature involves storing sensitive medical records, integrating with an existing patient lookup service, and meeting regulatory data retention requirements. Which approach BEST reflects how quality risks should be identified and assessed for this feature during iteration planning?","o":{"A":"Assess only the technical complexity of each risk area and disregard the potential consequences for patients","B":"Assign equal testing effort to all three risk areas to avoid introducing bias into the assessment","C":"Evaluate both the likelihood of failure and the business impact for each risk area, then prioritise testing effort toward the highest combined risk","D":"Focus testing effort exclusively on the integration point with the patient lookup service and defer all other risk areas"},"a":["C"],"e":{"A":"Quality risk assessment requires both dimensions: technical likelihood and business or patient impact. Disregarding patient consequences for a healthcare feature with sensitive data and regulatory obligations produces an incomplete risk picture that may critically underprioritise high-impact failure scenarios. One-dimensional technical assessment is insufficient for effective risk-based testing.","B":"Equal effort allocation ignores the differential risk profiles of the three areas and misuses testing capacity by applying the same effort to high-risk and low-risk areas alike. Risk-based testing requires effort to be proportional to the assessed combination of likelihood and impact. Uniform effort allocation is a risk-neutral approach that contradicts quality risk assessment principles.","C":"Quality risk assessment in Agile requires evaluating each identified risk on two dimensions: the probability of failure occurrence and the severity of the business impact if failure occurs, as per reference section 3.2.1. Applying both dimensions to the sensitive data storage, service integration, and regulatory compliance risks enables the tester to allocate testing effort proportionally to the most critical areas. The other options apply partial or incorrect risk assessment approaches.","D":"Focusing exclusively on the integration risk ignores the regulatory compliance and sensitive data storage risks, which may carry higher business impact. Quality risk assessment requires all identified risk areas to be evaluated before effort is prioritised. Selective focus without a full risk assessment may leave high-impact risks undertested."}},{"q":"You are a tester on an Agile team that releases working software at the end of every two-week sprint. A senior developer argues that stakeholder feedback sessions are consuming too much time and suggests reducing them to once per quarter. Which benefit of early feedback BEST supports maintaining the current sprint-level feedback cadence?","o":{"A":"Frequent stakeholder feedback enables the team to detect product misalignments early and incorporate corrections before significant effort is misdirected","B":"Frequent feedback sessions allow the team to skip regression testing since defects are caught by stakeholders directly","C":"Reducing feedback frequency improves team velocity by eliminating non-development activities from the sprint","D":"Early feedback ensures the product owner can approve all test cases before sprint execution begins"},"a":["A"],"e":{"A":"Early and frequent feedback in Agile allows misalignments between stakeholder expectations and product behaviour to be identified and corrected within short cycles, significantly reducing the cost and effort of rework, as per reference section 1.1.3. Reducing feedback to quarterly cycles would allow misalignments to accumulate over multiple sprints before discovery. The other options mischaracterise the purpose or benefit of the feedback mechanism.","B":"Stakeholder feedback sessions focus on product alignment and feature acceptance, not on defect discovery through formal test execution. Regression testing addresses internal code stability concerns that stakeholder reviews cannot substitute for. This option incorrectly equates two distinct quality activities.","C":"Stakeholder feedback sessions are a defined part of the Agile delivery cycle and contribute directly to quality outcomes by validating product direction. Removing feedback to increase velocity would optimise for output quantity while sacrificing product quality and stakeholder alignment. This option prioritises short-term throughput over sustainable value delivery.","D":"Stakeholder feedback collected at sprint reviews informs future sprint content, not test case approval for the current sprint. Test case design and approval are internal team activities that occur independently of stakeholder feedback sessions. This option confuses two unrelated Agile activities."}},{"q":"Which of the following BEST identifies a role defined within the Scrum framework?","o":{"A":"Release Manager","B":"Test Lead","C":"Business Analyst","D":"Product Owner"},"a":["D"],"e":{"A":"Release Manager is not a defined Scrum role; it is a role associated with traditional project or operations management. Scrum defines three specific roles: Product Owner, Scrum Master, and development team member. Introducing a Release Manager as a Scrum role reflects a misunderstanding of the framework's role structure.","B":"Test Lead is not a defined role within the Scrum framework. Scrum does not prescribe specialised functional roles such as test lead or development lead within the team. Team members in Scrum are cross-functional contributors without formal specialisation titles defined by the framework.","C":"Business Analyst is not a role defined within the Scrum framework. While individuals with analytical skills may participate in Scrum teams, Scrum itself does not recognise or define a Business Analyst role. This option reflects a traditional project management role structure not applicable to Scrum.","D":"The Product Owner is one of the three defined roles in the Scrum framework, responsible for managing the product backlog and representing stakeholder interests, as per reference section 1.2.1. This role is explicitly named in the Scrum framework alongside the Scrum Master and the development team. The other options describe roles from different frameworks or organisational structures not defined within Scrum."}},{"q":"You are a tester on a team that recently implemented a continuous integration pipeline. After several weeks, the team notices that developers are committing code less frequently because they fear triggering a failed build. A test manager asks you to identify the risk this behaviour represents for continuous integration. Which response BEST describes a recognised risk or challenge associated with continuous integration?","o":{"A":"Infrequent commits improve continuous integration quality by reducing the number of build triggers and minimising pipeline congestion","B":"The risk of continuous integration is limited to test execution time, which can be resolved by running tests less frequently","C":"Infrequent code commits undermine continuous integration by reducing feedback frequency and allowing integration problems to accumulate before discovery","D":"The primary risk of continuous integration is that automated tests replace the need for manual exploratory testing"},"a":["C"],"e":{"A":"Infrequent commits do not improve CI quality; they reduce the feedback granularity that CI is designed to provide. Each commit that is deferred represents an integration verification opportunity lost, increasing the batch size of unverified changes. Pipeline congestion from frequent commits is manageable, while accumulated unverified changes represent a significant integration risk.","B":"Running tests less frequently in a CI pipeline directly undermines its purpose of providing rapid quality feedback on each commit. Reducing test frequency to address execution time sacrifices the core CI benefit in exchange for speed, which is the inverse of the correct approach. The scenario's risk is behavioural, not related to test execution duration.","C":"The value of continuous integration depends on frequent code commits that trigger automated builds and tests, providing rapid feedback on integration quality, as per reference section 1.2.4. When developers reduce commit frequency out of fear of build failures, integration defects accumulate undetected, defeating the early detection purpose of CI. The other options either describe unrelated CI challenges or misidentify the impact of reduced commit frequency.","D":"Continuous integration pipelines execute automated checks but do not eliminate the need for manual exploratory testing, which serves a distinct quality purpose. The identified risk in the scenario is reduced commit frequency causing integration defect accumulation, not the scope of automated test coverage. This option misidentifies both the risk and the relationship between CI and exploratory testing."}},{"q":"You are a tester on an Agile team where quality ownership is distributed across team members. Your test lead explains that testers in Agile teams take on coaching and quality ownership responsibilities beyond traditional test execution. Which TWO of the following activities BEST reflect the coaching and quality ownership responsibilities of a tester in an Agile team? (Select TWO)","o":{"A":"Guiding developers on how to write effective unit tests to improve the team's overall test coverage","B":"Executing all performance and security testing independently without involving the development team to preserve test objectivity","C":"Documenting all test results in a formal test report and submitting it to the project manager after each sprint","D":"Facilitating a discussion with the team on improving the definition of done to include additional quality criteria"},"a":["A","D"],"e":{"A":"Agile testers are expected to coach team members on test techniques and quality practices, including unit test design, as per reference section 2.3.2. This coaching activity directly reflects the quality ownership dimension of the Agile tester role.","B":"Performing all non-functional testing in isolation from the development team contradicts the whole-team quality ownership model. Agile quality responsibilities are shared, and non-functional testing is most effective when developers contribute their technical understanding alongside the tester's test design skills. This option misrepresents objectivity as a justification for role isolation.","C":"Submitting formal test reports to a project manager is a traditional reporting activity not characteristic of the Agile tester's coaching and quality ownership role. Agile testers communicate quality status through team-facing mechanisms such as task boards and standups, not through formal upward reporting.","D":"Facilitating improvements to the definition of done is a quality ownership activity that enables the tester to embed higher quality standards into the team's shared acceptance of story completion, as per reference section 2.3.2. This responsibility reflects the collaborative, team-wide quality ownership model in Agile."}},{"q":"You are a tester joining an Agile team at the start of a new project. The team is about to begin its first sprint, which the team refers to as sprint zero. The Scrum Master asks you to describe what testing-related activities you should perform during this initial sprint. Which action BEST reflects the tester's role during sprint zero in a Scrum team?","o":{"A":"Wait for the development team to complete all sprint zero tasks before contributing any testing activities","B":"Document the complete test plan for all planned sprints and obtain product owner approval before sprint one begins","C":"Establish the initial test environment, define the test approach, and identify potential quality risks for the product backlog","D":"Begin executing test cases for the highest-priority user stories in the product backlog immediately"},"a":["C"],"e":{"A":"Passively waiting for development team completion contradicts the whole-team approach and the tester's specific sprint zero responsibilities. The tester has defined preparatory activities including environment setup and risk identification that run in parallel with development preparation tasks. Waiting removes the tester's proactive contribution during the critical project setup phase.","B":"Producing a complete multi-sprint test plan before the first delivery sprint contradicts the iterative, just-in-time planning approach of Agile. Agile testers establish a high-level test approach during sprint zero but refine planning iteratively as sprint content becomes known. Comprehensive upfront planning followed by formal approval is a sequential lifecycle practice.","C":"During sprint zero, the tester's role in a Scrum team includes setting up the test environment, defining the test strategy and approach, and conducting an initial quality risk assessment against the product backlog, as per reference section 3.1.4. These preparatory activities enable the team to execute testing effectively from the first delivery sprint. The other options either defer essential setup activities or assign sprint zero responsibilities inappropriately.","D":"Sprint zero is a preparation phase for establishing infrastructure, tooling, and approach, not a delivery sprint where test execution against user stories begins. User stories are not typically implemented in sprint zero; test execution against backlog stories commences from the first delivery sprint. This option misapplies execution-phase activities to the preparatory sprint."}},{"q":"You are collaborating with a business stakeholder to define acceptance criteria for a user story covering a patient medication scheduling feature. The story involves validating prescription business rules, displaying scheduled medication timings, and integrating with a pharmacy dispensing interface. Which TWO of the following should be included as acceptance criteria for this story? (Select TWO)","o":{"A":"The development team must complete the medication scheduling feature within the current sprint to avoid regulatory penalties","B":"The system must reject a medication schedule where the prescribed dosage interval violates the minimum safe frequency defined by the clinical business rules","C":"The product owner must personally validate all scheduled medication timings against the original prescription before sprint sign-off","D":"The system must display a timeout error and allow the user to retry when the pharmacy dispensing interface does not respond within an acceptable period"},"a":["B","D"],"e":{"A":"Sprint delivery timelines and regulatory penalty avoidance are project management concerns, not testable acceptance criteria for the story. Acceptance criteria define verifiable system behaviour, not delivery schedule commitments.","B":"Business rule validation governing safety-critical constraints must be expressed as explicit, testable acceptance criteria to ensure the system enforces correct clinical logic. This criterion is specific, verifiable, and directly tied to a defined business rule applicable to the story scope.","C":"Product owner review activities are a governance practice, not an acceptance criterion for system behaviour. Acceptance criteria describe what the system must do, not the approval workflow.","D":"Acceptance criteria for stories involving external system interfaces must address failure scenarios and non-functional behaviour such as error handling. This criterion covers both interface integration behaviour and a measurable non-functional expectation, making it specific and testable within the story's scope."}},{"q":"Which of the following combinations contains only principles from the Agile Manifesto? I. Deliver working software frequently, with a preference for shorter timescales. II. Build projects around motivated individuals and give them the support they need. III. Maximise the work done by ensuring every requirement is fully specified before development. IV. Welcome changing requirements, even late in development.","o":{"A":"I and III only","B":"I, II, and IV","C":"I, III, and IV","D":"II, III, and IV"},"a":["B"],"e":{"A":"Statement III is not an Agile Manifesto principle and is incompatible with Agile values. This combination excludes statement II, which is a valid principle about motivated individuals, and includes a non-manifesto statement. Accepting this combination requires rejecting two correctly identified Agile principles.","B":"Delivering working software frequently, building projects around motivated individuals, and welcoming changing requirements are all established Agile Manifesto principles, as per reference section 1.1.1. Statement III contradicts the manifesto by advocating for exhaustive upfront specification, which conflicts with the Agile principle of adaptive planning. Only I, II, and IV accurately reflect manifesto principles.","C":"Statement III describes maximising work done through full upfront specification, which directly contradicts the Agile principle that values simplicity and the art of maximising work not done. Selecting this combination requires accepting a principle that opposes Agile values. Statement III is characteristic of a plan-driven, sequential approach.","D":"Statement III is not an Agile Manifesto principle and contradicts the manifesto's emphasis on simplicity and iterative delivery over exhaustive upfront specification. Including statement III alongside valid Agile principles produces an incorrect and internally inconsistent combination. This option conflates a sequential lifecycle rule with Agile principles."}},{"q":"You are a tester reviewing the testing strategy for an upcoming sprint. Your test lead explains that the team's unit tests and component integration tests belong to the lower quadrants of the testing quadrant model. Which statement BEST describes the relationship between testing quadrants Q1 and Q2 and their associated testing types?","o":{"A":"Q1 contains technology-facing tests that support the team, such as unit and component tests, while Q2 contains business-facing tests that support the team, such as functional and story tests","B":"Q1 contains business-facing acceptance tests while Q2 contains technology-facing performance and security tests","C":"Q1 and Q2 both contain critique-oriented tests designed to evaluate product quality from a user perspective","D":"Q2 contains automated unit tests while Q1 contains manual exploratory testing sessions"},"a":["A"],"e":{"A":"Quadrant 1 comprises technology-facing tests that support the development team by validating technical correctness at the code level, and Quadrant 2 comprises business-facing tests that support the team by verifying functional behaviour against user stories and acceptance criteria, as per reference section 3.1.3. Both quadrants are support-oriented and drive development, distinguishing them from the critique-oriented quadrants. The other options misassign test types or invert the business versus technology dimension.","B":"Acceptance tests are business-facing and belong to Quadrant 2, not Q1. Performance and security tests are technology-facing critique tests that belong to Quadrant 4, not Q2. This option reverses the business and technology dimensions across both quadrants, producing an entirely incorrect classification.","C":"Q1 and Q2 are both support-oriented quadrants that help the team build the product correctly, not critique it. Critique-oriented testing that evaluates the product from an external or user perspective is the function of Quadrants 3 and 4. This option misidentifies the orientation of the lower two quadrants.","D":"Unit tests belong to Q1 as technology-facing development support tests, not Q2. Exploratory testing is a business-facing, manual critique activity associated with Quadrant 3, not Q1. This option reverses the test type assignments within Q1 and Q2 and misattributes exploratory testing to the wrong quadrant."}},{"q":"You are participating in a sprint retrospective after a sprint in which several high-priority defects were found during the last two days of testing. The team is discussing what process changes should result from this retrospective. Which action BEST reflects a valid retrospective outcome and appropriate follow-up in an Agile project?","o":{"A":"The team documents the defects in a shared log and presents the log to management at the next programme review","B":"The team agrees to increase the sprint length by one week to provide more time for testing in future sprints","C":"The tester is assigned responsibility for preventing late defect discovery by reviewing all code changes before commit","D":"The team commits to shifting test activities earlier in the sprint and assigns a team member to track progress in the next iteration"},"a":["D"],"e":{"A":"Documenting defects for management review is a reporting activity, not a retrospective improvement action. Retrospective outcomes must be team-owned process changes implemented within the next iteration, not escalation artefacts for external audiences. This option treats the retrospective as a reporting ceremony rather than an improvement mechanism.","B":"Sprint length is a structural decision that requires broader agreement and is not a typical retrospective output. Retrospective improvements focus on changing how the team works within the existing sprint structure, not on altering the structure itself. This option substitutes a structural change for the process improvement that the retrospective is designed to produce.","C":"Assigning sole responsibility to the tester for code review before commit misrepresents both the tester role and the shared quality responsibility model in Agile. Retrospective improvements should enhance team-wide processes, not concentrate responsibility in a single role. This option contradicts the whole-team quality ownership principle.","D":"A retrospective outcome must be a specific, actionable improvement commitment with an assigned owner and a follow-up mechanism, which is exactly what shifting testing earlier and assigning tracking responsibility provides, as per reference section 1.2.3. This outcome addresses the root cause identified and establishes accountability for implementation. The other options either produce non-actionable outputs or bypass the team-owned improvement model."}},{"q":"You are a tester who has recently moved from a sequential development lifecycle to an Agile project. Your manager asks you to explain a key difference between testing activities in the two environments. Which statement BEST describes a difference between testing in Agile projects and testing in non-Agile projects?","o":{"A":"In Agile projects, testers collaborate with developers throughout each iteration rather than receiving completed software at a defined test phase","B":"In Agile projects, all testing is deferred until the final sprint to ensure the product is feature-complete before verification begins","C":"In non-Agile projects, testers are embedded within the development team and contribute to story refinement alongside developers","D":"Agile projects eliminate the need for structured test levels by replacing them with exploratory testing sessions in each sprint"},"a":["A"],"e":{"A":"A defining difference between Agile and sequential testing is that Agile integrates testers into the development process throughout each iteration, enabling continuous collaboration, rather than receiving completed builds at a separate, phase-gated test stage, as per reference section 2.1.1. This integration supports earlier defect detection and shared quality ownership. The other options either describe sequential lifecycle characteristics or misattribute Agile testing behaviours.","B":"Deferring all testing to the final sprint is a characteristic of sequential, phase-gated lifecycles, not Agile projects. Agile testing occurs continuously throughout each iteration alongside development. Late-stage testing in Agile would negate the early feedback benefits that iterative delivery provides.","C":"Embedding testers within the development team and involving them in story refinement is an Agile practice, not a characteristic of non-Agile sequential lifecycles. In sequential projects, testers typically operate in a separate, phase-sequential test team that receives work after development phases complete. This option reverses the defining characteristics of the two lifecycle types.","D":"Agile projects retain structured test levels, including unit, integration, and system testing, which are executed concurrently within iterations rather than in sequential phases. Exploratory testing complements but does not replace structured test levels. This option incorrectly attributes a test level elimination to Agile development."}},{"q":"Which of the following BEST describes a value stated in the Agile Manifesto?","o":{"A":"Working software over comprehensive documentation","B":"Comprehensive documentation over working software","C":"Following a plan over responding to change","D":"Contract negotiation over customer collaboration"},"a":["A"],"e":{"A":"\"Working software over comprehensive documentation\" is one of the four core values explicitly stated in the Agile Manifesto, as per reference section 1.1.1. This value prioritizes delivering functional software above producing extensive written artefacts, reflecting the Agile preference for tangible outcomes over process overhead. The remaining options either invert manifesto values or introduce statements not present in the manifesto.","B":"This statement directly inverts the Agile Manifesto value, which places working software above documentation. The manifesto acknowledges documentation has value but explicitly deprioritizes it relative to functional software delivery. This option represents the traditional, plan-driven approach that Agile was designed to challenge.","C":"The Agile Manifesto values responding to change over following a plan, not the reverse. This option inverts the stated manifesto value by elevating plan adherence above adaptability. The manifesto explicitly recognises that change is beneficial and must be accommodated throughout delivery.","D":"The Agile Manifesto values customer collaboration over contract negotiation, not the reverse. This option misrepresents the manifesto by prioritising formal contractual arrangements above ongoing stakeholder engagement. The correct value emphasises continuous collaboration with customers as superior to contractual obligations."}},{"q":"You are a tester joining a new Agile team. During your first sprint, you notice that developers, the product owner, and the tester all attend backlog refinement and contribute to defining acceptance criteria. A colleague from a previous organisation questions why testing is involved so early. Which benefit of the whole-team approach BEST justifies this practice?","o":{"A":"Tester involvement in refinement is only necessary when the product owner is unavailable to review stories","B":"Developers benefit from tester involvement in refinement by receiving completed test cases before coding begins","C":"The whole-team approach requires testers to approve user stories before they are added to the backlog","D":"Involving the tester during refinement improves story quality by identifying testability issues before development begins"},"a":["D"],"e":{"A":"Tester involvement during refinement is a standard whole-team practice, not a contingency measure for product owner absence. The whole-team model requires continuous tester participation in collaborative story preparation, not conditional involvement. This option undermines the preventive quality benefit that early tester engagement provides.","B":"Testers participating in refinement focus on identifying testability concerns and clarifying acceptance criteria, not on delivering completed test cases at that stage. Test case creation is an iteration activity that follows refinement. This option misrepresents the type of contribution testers make during the refinement ceremony.","C":"Story approval is a product owner responsibility, not a tester gatekeeping function. The whole-team approach enables testers to contribute quality insights during collaborative review, not to exercise approval authority over backlog entries. This option misattributes a governance function to the tester role.","D":"The whole-team approach ensures that testers contribute their quality perspective during early story refinement, enabling testability issues to be resolved before development investment occurs, as per reference section 1.1.2. Early tester involvement prevents defects arising from unclear or untestable acceptance criteria. The other options either assign testing to a later phase or misrepresent the benefit of the whole-team model."}},{"q":"You are a tester on an Agile team that has just completed a sprint delivering a new search feature. During the retrospective, the team identifies that defects in the search function were detected too late in the sprint. Which retrospective outcome BEST represents using this ceremony as a mechanism for process improvement?","o":{"A":"The team agrees to introduce earlier testing activities for search-related stories in the next sprint to reduce late defect discovery","B":"The team records the defect count in the sprint report and forwards it to the project manager for review","C":"The team decides to remove the search feature from the next sprint backlog until defect trends improve","D":"The product owner is asked to rewrite the acceptance criteria for the search feature before the next sprint"},"a":["A"],"e":{"A":"Retrospectives are used to identify process improvement actions that the team commits to implementing in the next iteration, and introducing earlier testing is a direct, actionable response to the identified late defect detection problem, as per reference section 1.2.3. This outcome reflects the retrospective's purpose as a continuous improvement mechanism. The other options either defer action or address symptoms rather than root causes.","B":"Forwarding defect counts to a project manager for review is a reporting activity, not a process improvement action arising from a retrospective. Retrospectives produce team-owned improvement commitments, not escalation artefacts for external review. This option confuses defect reporting with the improvement-focused intent of the ceremony.","C":"Removing a feature from the backlog does not address the process failure that caused late defect detection. A retrospective improvement action must target the team's working practices, not the product scope. This option avoids the process problem rather than resolving it through actionable change.","D":"Asking the product owner to revise acceptance criteria is a backlog refinement action, not a retrospective process improvement. While acceptance criteria quality may have contributed to the defect pattern, a retrospective improvement must change how the team works, not what the product owner writes. This option misidentifies the source of the process failure."}},{"q":"Match each Kanban concept in Column 1 with its correct description in Column 2. Column 1: 1. Kanban board. 2. Work-in-progress limit. 3. Workflow column. 4. Pull system. Column 2:","o":{"A":"1D, 2B, 3A, 4C","B":"1A, 2C, 3B, 4D","C":"1B, 2D, 3C, 4A","D":"1C, 2A, 3D, 4B"},"a":["D"],"e":{"A":"This mapping assigns the workflow column description (D) to the Kanban board (1) and misplaces the WIP limit. The Kanban board is the overarching visual tool, not a process stage representation, which is the role of the workflow column. This combination confuses two structurally distinct Kanban elements.","B":"This mapping assigns the WIP limit definition (A) to the Kanban board (1) and misplaces the pull system description. Each Kanban concept has a distinct and non-interchangeable definition; swapping descriptions produces factually incorrect pairings. This combination reflects a misunderstanding of the functional differences between Kanban instruments.","C":"This mapping assigns the pull system description (B) to the Kanban board (1) and incorrectly pairs the WIP limit with an unrelated concept. The pull system is specifically defined by demand-driven work intake, not by visual display. This combination produces at least three incorrect concept-to-description pairings.","D":"A Kanban board (1) is a visual tool displaying the state of work items (C), a work-in-progress limit (2) caps concurrent tasks per stage (A), a workflow column (3) represents a defined process stage (D), and a pull system (4) allows team members to take work only when capacity is available (B), as per reference section 1.2.1. This mapping correctly aligns each concept with its unique defining characteristic. The other combinations misassign at least one concept to an incorrect description."}},{"q":"You are performing session-based exploratory testing on a newly released inventory management feature. Your test session is scheduled for ninety minutes. Which TWO of the following actions are consistent with a session-based test management approach for this session? (Select TWO)","o":{"A":"Pause the session every fifteen minutes to write a formal defect report for each observation before continuing","B":"Define a test charter before starting the session that specifies the mission, feature scope, and types of risks to investigate","C":"Document session findings, coverage achieved, and time spent in a session note to enable a structured debrief after the session","D":"Extend the session duration beyond the scheduled time whenever the tester identifies an interesting area to investigate further"},"a":["B","C"],"e":{"A":"Interrupting the session every fifteen minutes to write formal defect reports would fragment the exploratory investigation and undermine the time-boxed, continuous nature of session-based test management. Defects observed during the session are recorded in the session note and reported formally after the session concludes during the debrief. This option disrupts the exploratory flow that the approach is designed to preserve.","B":"Session-based test management requires each exploratory testing session to be initiated with a test charter that defines the mission, scope, and focus areas for the session, as per reference section 3.3.5. The charter provides investigative direction without constraining the tester's adaptive exploration within those boundaries. This is a foundational practice that distinguishes structured exploratory testing from unguided ad hoc testing.","C":"Session-based test management requires testers to record findings, coverage observations, and session duration in a session sheet or note, which is used during a post-session debrief to communicate results, identify follow-up charters, and support quality reporting, as per reference section 3.3.5. This documentation provides accountability and traceability for exploratory activities and is the primary output mechanism of the approach.","D":"Session-based test management relies on time-boxing as a core structural element that enables session planning, comparison, and debrief scheduling. Extending sessions indefinitely when interesting areas are found contradicts the bounded, accountable nature of the approach. Additional investigation areas should be captured as charter candidates for subsequent sessions rather than used to justify session extension."}},{"q":"Which of the following BEST defines configuration management in the context of Agile testing?","o":{"A":"The process of assigning testers to specific user stories during sprint planning to ensure coverage","B":"A reporting mechanism used to communicate test status and defect trends to stakeholders","C":"The practice of identifying, controlling, and tracking changes to software work products across the project lifecycle","D":"A technique for estimating the effort required to test a set of user stories based on story point values"},"a":["C"],"e":{"A":"Tester assignment during sprint planning is a resource allocation activity, not configuration management. Configuration management manages the integrity and versioning of work products, not the assignment of team members to tasks. This option misidentifies a planning activity as a configuration management function.","B":"Test status reporting and defect trend communication are test progress reporting activities, distinct from configuration management. Configuration management focuses on artefact control and versioning, not on status communication. This option describes a reporting function unrelated to the definition being tested.","C":"Configuration management is defined as the practice of identifying, controlling, and tracking changes to software work products to maintain integrity and traceability throughout the project, as per reference section 2. This definition encompasses version control, change tracking, and artefact integrity management. The other options describe unrelated practices or misattribute the purpose of configuration management.","D":"Effort estimation using story points is a planning and estimation technique, not configuration management. Configuration management concerns artefact version control and change tracking, not test effort quantification. This option conflates two entirely distinct Agile testing concepts."}},{"q":"Which of the following BEST describes the primary difference between release planning and iteration planning in an Agile project?","o":{"A":"Release planning and iteration planning are interchangeable terms that describe the same event in Agile projects","B":"Iteration planning replaces the need for release planning once the product backlog is established","C":"Release planning defines the overall product scope and timeline, while iteration planning determines which stories will be implemented in the next sprint","D":"Iteration planning sets the product roadmap, while release planning selects individual test cases for the sprint"},"a":["C"],"e":{"A":"Release planning and iteration planning are distinct events operating at different scales and frequencies. Release planning is a higher-level activity addressing product scope across multiple iterations, while iteration planning addresses a single sprint cycle. Treating them as interchangeable removes a fundamental structural distinction in Agile planning.","B":"Both planning levels remain relevant and complementary throughout an Agile project, regardless of backlog establishment. Release planning provides the strategic frame within which individual iterations are planned. Removing release planning would eliminate the mechanism for aligning delivery milestones with stakeholder and business expectations.","C":"Release planning operates at the product level, establishing scope, milestones, and delivery timelines across multiple iterations, while iteration planning focuses on selecting and committing to specific user stories for a single sprint, as per reference section 1.2.5. These two planning horizons serve distinct purposes and occur at different cadences. The other options either conflate the two planning levels or reverse their distinguishing characteristics.","D":"This option reverses the planning horizons by attributing roadmap definition to iteration planning and test case selection to release planning. Roadmap and scope decisions are release-level concerns, while test case selection and story commitment occur at the iteration level. This option conflates the scope and granularity of both planning events."}},{"q":"You are a tester who has recently joined an Agile team. During a sprint planning session, a misunderstanding arises between you and a developer about the scope of a user story. The team lead suggests your interpersonal skills need development to improve collaboration. Which interpersonal skill BEST describes the skill required to resolve this type of collaborative conflict?","o":{"A":"Proficiency in writing
