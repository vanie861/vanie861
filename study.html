e tests for the following user story:\n\"IF a customer needs a loan for less than 50,000 Euros and they have made repayments regularly (without any delay) and the customer's monthly income is more than 3000 Euros for the last year, THEN the bank will accept the loan request; in other cases, the bank will not accept the request. A customer assistant is responsible for preparing data for approval but the approval is done by the bank manager.\"\nWhich of the following test cases can be treated as acceptance test criteria for the above user story?\n1) As a customer assistant I can log in to the system and check the history of the customer account for the last year.\n2) As a customer assistant I can log in to the system and check the history of the customer debts and repayments.\n3) As a customer assistant I can log in to the system and change my password.\n4) As a bank manager I can log in to the system and receive the information of all requests waiting for approval.\n5) As a bank manager I can log in to the system and decide whether to approve a loan for a customer.\n6) As a bank manager I can log in to the system within 10 seconds.\nA.                                                                                              22 of 70","o":{"A":"Acceptance test criteria are 1, 2, 3 and 6","B":"Acceptance test criteria are 1, 3, 4 and 5","C":"Acceptance test criteria are 2, 4, 5 and 6","D":"Acceptance test criteria are 1, 2, 4 and 5"},"a":["D"],"e":{"A":"Items 1 and 2 support the customer assistant's data preparation, but item 3 (changing a password) is unrelated to the loan approval story, and item 6 (login time) is a non-functional requirement not stated in the story. This combination includes irrelevant items. It is wrong.","B":"Items 1, 4 and 5 are relevant, but item 3, changing a password, has nothing to do with preparing or approving a loan request. It also omits item 2, checking repayment history, which is a key condition in the story. This combination is wrong.","C":"Items 2, 4 and 5 are relevant, but item 6, logging in within 10 seconds, is a performance condition not mentioned in the story. It also omits item 1, checking the last year of account history needed for the income condition. This combination is wrong.","D":"Items 1 and 2 let the customer assistant check income history for the last year and debt and repayment history, which are the conditions in the story, while items 4 and 5 let the bank manager see pending requests and decide on approval, matching the defined roles; acceptance criteria must relate to the story's functional behavior and roles, as per reference section 3.3.1. Items 3 and 6 are not part of this story. The other combinations include unrelated items or omit essential ones."}},{"q":"Which of the following would provide the MOST independence for testers working with agile teams?","o":{"A":"Testers are fully embedded in each Agile team to perform many of the testing tasks.","B":"Testers from an independent test team who do not get involved with the Agile team, but are assigned to do System Testing once all sprints are completed.","C":"Testers from an independent test team are assigned on-demand for the final days of each sprint.","D":"Testers from an independent test team are assigned to the Agile team at the beginning of the project, returning for re-assignment to a new agile team."},"a":["B"],"e":{"A":"Testers fully embedded in the Agile team perform many testing tasks, but the syllabus notes that this position carries a risk of loss of independence and objective evaluation. It offers the least independence of the options. It is therefore wrong.","B":"A test team that never becomes involved with the Agile team and tests the system only after all sprints are complete has the greatest organizational separation from the developers, which gives the most independence, as per reference section 2.1.5. This comes at the cost of late feedback and weak product understanding, which is why it is rarely advisable in Agile, but the question asks only about independence. The other options involve progressively closer engagement with the team.","C":"Assigning independent testers on demand during the final days of each sprint preserves a good degree of independence, but these testers still work within each sprint alongside the team. They are less separated than testers who stay entirely outside the Agile team. This is not the most independent option.","D":"Independent testers assigned long term from the beginning of the project maintain some independence while building strong relationships with the team. Their daily involvement reduces separation compared with a fully uninvolved team. This is not the most independent option."}},{"q":"Which of the following statements is FALSE regarding early and frequent feedback?","o":{"A":"Early feedback decreases the amount of time needed for system testing.","B":"Early feedback promotes early discovery and resolution of quality problems.","C":"Early feedback provides the Agile team with information on its productivity.","D":"Early feedback helps to deliver a product that better reflects what the customer wants."},"a":["A"],"e":{"A":"This statement is FALSE because reduced system testing time is not a benefit of early and frequent feedback listed in the syllabus; the listed benefits are avoiding requirements misunderstandings, clarifying customer requests, discovering and resolving quality problems early, providing productivity information and promoting consistent momentum, as per reference section 1.1.3. Early feedback does not in itself shorten system testing. The other options are genuine benefits.","B":"This is true: discovering, isolating and resolving quality problems early is an explicit benefit of early and frequent feedback. It is therefore not the false statement. It is not the answer.","C":"This is true: early feedback provides information to the Agile team regarding its productivity and ability to deliver. It is listed in the syllabus. It is not the answer.","D":"This is true: clarifying customer feature requests early means the product better reflects what the customer wants. It is a listed benefit. It is not the answer."}},{"q":"Which of the following statements best describes test execution automation?","o":{"A":"The use of software to control the execution of tests and the comparison of actual results to expected results","B":"An approach to testing in which test activities are planned as uninterrupted sessions of test design and execution","C":"A way of developing software where automated test cases are developed before the software is developed to run those test cases","D":"The execution of the test process against a single and identifiable release of the test object"},"a":["A"],"e":{"A":"Test execution automation is the use of software to control the execution of tests, compare actual results to expected results, set up preconditions and report results, and Agile teams rely on it heavily to manage regression risk, as per reference section 2.2.2. This is the standard definition. The other options describe exploratory testing, TDD, and a test run.","B":"Planning test activities as uninterrupted sessions of simultaneous test design and execution describes session-based exploratory testing. It is a manual, experience-based approach. It is not test execution automation.","C":"Writing automated tests before the code that makes them pass describes test-driven development, a development practice. Although it uses automated tests, it is not the definition of test execution automation. This option is wrong.","D":"Executing the test process against a single identifiable release of the test object describes a test run or test cycle. It does not involve software controlling test execution. This option is wrong."}},{"q":"Which of the following is a benefit of a whole-team approach?","o":{"A":"Enables reduction in test duplication as the testers and test engineers function as a single team.","B":"Enables testers to execute their responsibility for quality for the combined team.","C":"Enables the team to focus on solely their separate areas of expertise and responsibility.","D":"Enables the various skill sets within the team to be leveraged to the benefit of the project."},"a":["D"],"e":{"A":"The whole-team approach does not specifically aim to reduce test duplication by merging testers and test engineers. Its focus is involving business, developers and testers in shared responsibility for quality. This is not a stated benefit.","B":"In the whole-team approach quality is everyone's responsibility, not just the testers'. Framing it as testers executing responsibility for quality on behalf of the team contradicts the concept. This option is wrong.","C":"The whole-team approach encourages collaboration across disciplines rather than having members focus solely on their separate areas. Working in silos is what the approach is designed to avoid. This option is wrong.","D":"The whole-team approach involves everyone with the necessary knowledge and skills, and the syllabus lists benefits such as enhanced communication and collaboration and enabling the various skill sets within the team to be leveraged to the benefit of the project, as per reference section 1.1.2. Combining skills strengthens the whole team. The other options misrepresent responsibility or promote silos."}},{"q":"Which of the following statements best describes Agile software development?","o":{"A":"Agile software development is a software development approach whereby lines of code (production and /or test) of a component are written by two programmers sitting at a single computer","B":"Agile software development tends to break a project into a number of iterations, where each iteration represents a separate phase of sequential development and thus in which testing is performed during the last iteration","C":"Agile software development tends to adopt an iterative incremental lifecycle, where requirements and solutions evolve through collaboration between self-organizing and cross-functional teams","D":"Agile software development tends to break a project into a series of increments, each of which delivers a portion of functionality through a series of mini-Waterfalls where all phases of the Waterfall are completed before proceeding to the next increment"},"a":["C"],"e":{"A":"Two programmers writing code together at a single computer describes pair programming, an Extreme Programming practice. It is one practice used in some Agile teams, not a description of Agile software development as a whole. This option is too narrow.","B":"Agile iterations are not separate sequential phases, and testing is not performed only in the last iteration. Testing happens continuously in every iteration alongside development. This describes a sequential model.","C":"Agile software development is based on an iterative and incremental lifecycle in which requirements and solutions evolve through collaboration between self-organizing, cross-functional teams, consistent with the Agile Manifesto values and principles, as per reference section 1.1.1. Working software is delivered frequently and change is welcomed. The other options describe pair programming or sequential development.","D":"Delivering increments through a series of mini-Waterfalls, completing all phases before moving on, describes a sequential incremental model. Agile development performs activities concurrently within each iteration. This option is wrong."}},{"q":"Which of the following statements is true in Agile projects?","o":{"A":"Test automation is important to manage regression risk because it enables version control and ensures ease of access to the tests by all team members","B":"Shorter timeframes and frequent changes require the adoption of good practices for test design and implementation, which should be defined during release planning","C":"The risk of regression tends to decrease when code that worked in previous iterations gets modified due to new features in subsequent iterations","D":"The tests written for the features developed in earlier iterations are the most important and they should never be retired from the regression test suite"},"a":["B"],"e":{"A":"Version control and ease of access for all team members are benefits of storing test assets in a configuration management tool, not of test automation. Automation manages regression risk by reducing the effort of regression testing. The option attributes the wrong benefits.","B":"The shorter timeframes for testing and constant change in each iteration increase the impact of poor test design and implementation practices, so defining how the team designs, writes and stores test cases should occur during release planning, as per reference section 2.2.2. Good practices must be adopted early and applied consistently. The other options misattribute benefits or misstate regression risk.","C":"Modifying code that worked in previous iterations increases the risk of regression, not decreases it. Code churn is precisely why regression risk is high in Agile projects. This statement is false.","D":"Tests written in earlier iterations may have little value later due to feature changes, and testers should retire test cases that are no longer relevant. Earlier tests are not automatically the most important. This statement contradicts the syllabus."}},{"q":"Which of the following statements about the Planning poker test estimate technique are CORRECT?\n1) Planning poker is a consensus based technique using a deck of cards.\n2) A low test estimate usually means the story should be broken down into multiple smaller stories.\n3) A high test estimate usually means the story should be broken down into multiple smaller stories.\n4) One poker round is played and then consensus has to be reached.\n5) The risk level of each backlog item should be decided before the poker session.","o":{"A":"1, 3, 5","B":"1, 2, 3","C":"2, 3, 4","D":"1, 2, 4"},"a":["A"],"e":{"A":"Planning poker is a consensus-based technique using a deck of cards (statement 1), a high estimate usually means the story is not well understood or should be broken down into multiple smaller stories (statement 3), and the risk level of a backlog item should be included before the planning poker session begins (statement 5), as per reference section 3.2.2. Statements 2 and 4 contradict the syllabus. The other combinations include one or both of those false statements.","B":"Statements 1 and 3 are true, but statement 2 is false: it is a high estimate, not a low one, that suggests a story should be split. Statements 2 and 3 cannot both be correct. This combination is wrong.","C":"Statement 3 is true, but statement 2 is false and statement 4 is false because poker rounds are repeated after discussion until agreement is reached. Consensus is not required after a single round. This combination is wrong.","D":"Statement 1 is true, but statement 2 wrongly links low estimates to splitting stories, and statement 4 wrongly limits the technique to a single round. Both errors contradict the syllabus. This combination is wrong."}},{"q":"A Scrum team is performing quality risk analysis during planning for the first iteration. User stories have associated risk items with levels determined by impact and likelihood. For multiple risk items, the user story's risk is the average of individual risk levels.\nWhich of the following statements would you expect most likely to be true?","o":{"A":"While the identification of the risk items should be performed by the Product Owner, the assessment of the risk levels should be performed by the whole team","B":"Potential issues with poorly written user stories should not be raised during risk analysis because they could influence how the risk level is determined","C":"Regardless of the risk level, more thorough test techniques should be selected for US-004 since it is the user story with most associated risk items","D":"An estimation session after the risk analysis should consider only the risk level for effort estimation"},"a":["A"],"e":{"A":"Of the given options this is the only one not clearly false, since the whole team, including testers, contributes to assessing risk levels based on impact and likelihood, as per reference section 3.2.1. Note, however, that the syllabus says the whole team both identifies and assesses quality risks during iteration planning, so restricting identification to the Product Owner is not fully accurate. The other options directly contradict the syllabus.","B":"The syllabus states that if problems with user stories are found during risk identification, the team can thoroughly review the stories as a mitigating strategy. Poorly written user stories should therefore be raised, not suppressed. This statement is false.","C":"The extent of testing and the choice of test techniques should be proportional to the level of risk, not to the number of risk items associated with a story. Ignoring the risk level contradicts risk-based testing. This statement is false.","D":"Effort estimation considers development and testing effort, complexity of the story and scope of testing, with risk level as one input alongside the product owner's priority. Considering only the risk level would ignore the content of the story. This statement is false."}},{"q":"Which of the following is the BEST way for a test team to keep its independence when working in an Agile development environment?","o":{"A":"Share the Test Strategy with the Agile development team, but not the details of the Test Cases.","B":"Locate the team that develops the test automation framework in a different location to the Agile development team.","C":"Assign testers to be members of the Agile team, but ensure the testers report to a different manager than the developers.","D":"Co-locate only some of the testers with the Agile development team, while the rest of the testers are in a different location."},"a":["C"],"e":{"A":"Withholding test case details from the Agile team undermines transparency and collaboration without providing real independence. Independence comes from organizational reporting lines, not from hiding information. This option is wrong.","B":"Placing only the automation framework team in a different location does not make the testers on the Agile team independent. Physical distance mainly harms communication. This is not the best way to maintain independence.","C":"The syllabus describes an independent, separate test team whose testers are assigned to Agile teams, allowing them to maintain independence while gaining product understanding and strong relationships; reporting to a different manager than the developers preserves that organizational independence, as per reference section 2.1.5. Testers still collaborate daily as team members. The other options rely on information hiding or physical separation.","D":"Splitting testers between locations creates communication problems and inconsistent involvement rather than true independence. Co-location supports the whole-team approach, while independence depends on reporting structure. This option is wrong."}},{"q":"Which of the following statements is true?","o":{"A":"Early and frequent feedback in Agile projects helps maintain a uniform distribution of defects through the code and thus avoid defect clustering","B":"Early and frequent feedback in Agile projects allows the team to find a greater number of defects at the unit test level than in non-Agile projects","C":"Early and frequent feedback in Agile projects provides earlier information about the stability of the software product but not about its quality","D":"Early and frequent feedback in Agile projects allows the team to provide customers with products that better meet their requirements sooner"},"a":["D"],"e":{"A":"Early feedback does not change how defects are distributed in the code; defect clustering is a general testing principle that holds regardless of feedback frequency. The claim has no basis in the syllabus. This option is wrong.","B":"The syllabus makes no claim that Agile projects find more defects at the unit level than non-Agile projects because of early feedback. The benefit is earlier detection and resolution, not a higher defect count at a specific level. This option is wrong.","C":"Early and frequent feedback provides information on product quality throughout the lifecycle, not just on stability. The syllabus explicitly states that short iterations give early and continuous feedback on product quality. This option is wrong.","D":"By getting frequent customer feedback, Agile teams clarify feature requests and make them available early, so the product better reflects what the customer wants, and the highest business value features are delivered first, as per reference section 1.1.3. This is a core benefit of early and frequent feedback. The other options make unsupported claims about defects or quality."}},{"q":"Consider an Agile team using a development practice with these steps:\nWrite a failing test for a small piece of code Make the test pass by implementing minimal code Refactor the code Repeat the process with additional small functionality Which one of the following testing quadrants would the tests produced with this practice be part of?","o":{"A":"Q4 - Technology-facing tests that critique the product","B":"Q2 - Business-facing tests that support the team","C":"Q3 - Business-facing tests that critique the product","D":"Q1 - Technology-facing tests that support the team"},"a":["D"],"e":{"A":"Q4 contains technology-facing tests that critique the product, such as performance, load, stress and security tests. The described cycle produces unit tests that guide coding, not non-functional product critique. This quadrant is wrong.","B":"Q2 contains business-facing tests that support the team, such as functional tests, examples and story tests. The tests produced here are low-level unit tests written from a technical perspective. This quadrant is wrong.","C":"Q3 contains business-facing tests that critique the product, such as exploratory and usability testing. The practice described is developer-driven unit testing. This quadrant is wrong.","D":"The steps describe test-driven development, which produces automated unit (component) tests, and Q1 is the unit level, technology-facing quadrant containing unit and component tests that support the developers, as per reference section 3.1.3. These tests are typically automated and part of continuous integration. The other quadrants contain business-facing or non-functional tests."}},{"q":"Which of the following allows a developer to define accurate unit tests focused on business needs?","o":{"A":"Design-Driven Development","B":"Behavior-Driven Development","C":"Test-Driven Development","D":"Acceptance Test-Driven Development"},"a":["B"],"e":{"A":"Design-Driven Development is not one of the test-first practices described in the syllabus. It has no defined link to writing unit tests focused on business needs. This option is wrong.","B":"Behavior-driven development allows a developer to focus on testing the code based on the expected behavior of the software, and the syllabus states that it helps the developer collaborate with other stakeholders to define accurate unit tests focused on business needs, as per reference section 3.1.1. BDD tests are easier for stakeholders to understand. The other options focus on implementation or the acceptance level.","C":"Test-driven development focuses on the code and its implementation, with tests driven by the developer's design rather than business behavior. It does not specifically align unit tests with business needs. This option is wrong.","D":"Acceptance test-driven development defines acceptance tests with business stakeholders before implementation, focusing on the acceptance level rather than unit tests. It is used by the whole team, not primarily for developers' unit tests. This option is wrong."}},{"q":"Which of the following is NOT a statement of value from the Agile Manifesto?","o":{"A":"Working software over comprehensive documentation","B":"Processes and tools over individuals and interactions.","C":"Responding to change over following a plan.","D":"Customer collaboration over contract negotiation."},"a":["B"],"e":{"A":"Working software over comprehensive documentation is one of the four value statements of the Agile Manifesto. It is therefore a genuine value statement. It is not the answer.","B":"The Agile Manifesto values individuals and interactions over processes and tools; this option reverses the order, so it is NOT a statement from the Manifesto, as per reference section 1.1.1. The other three options are accurate value statements. This inversion is what makes it the answer.","C":"Responding to change over following a plan is one of the four value statements of the Agile Manifesto. It is a genuine value statement. It is not the answer.","D":"Customer collaboration over contract negotiation is one of the four value statements of the Agile Manifesto. It is a genuine value statement. It is not the answer."}},{"q":"An Agile team is developing a Pay-TV web portal. In Iteration 3, only PayPal and credit card payments are supported. A new user story in Iteration 4 adds payment using credit from a smartcard.\nWhich of the following would you expect to describe valid and relevant acceptance tests for this user story?","o":{"A":"Tests to check that payments with insufficient credit charged on the smartcard are successful","B":"Tests to check that payments with sufficient credit charged on the smartcard are given five percent discount are successful","C":"Tests to check that payments with expired credit cards of supported credit card types are unsuccessful","D":"Tests to check that payments with no credit charged on the smartcard will be unsuccessful"},"a":["D"],"e":{"A":"A payment with insufficient smartcard credit should be rejected, so a test expecting it to succeed would verify incorrect behavior. Acceptance tests must reflect the expected, valid behavior. This option is wrong.","B":"A five percent discount for smartcard payments is not part of the user story. Acceptance tests must be derived from the story and its acceptance criteria, not invent new requirements. This option is not relevant.","C":"Expired credit card handling concerns the existing credit card payment method from earlier iterations, which is a regression concern. It is not an acceptance test for the new smartcard payment story. This option is not relevant.","D":"The new user story adds payment using smartcard credit, so verifying that payment fails when there is no credit on the smartcard is a valid negative acceptance test directly tied to the new functionality, and acceptance tests must be derived from the story's behavior, as per reference section 3.3.1. It checks expected behavior of the new feature. The other options test wrong behavior, invented requirements, or existing features."}},{"q":"Which ONE of the following is an example of a typical \"Business-oriented work product\"?","o":{"A":"The released product.","B":"Acceptance testing entry criteria.","C":"A user manual.","D":"Usability testing test results."},"a":["C"],"e":{"A":"The released product is the actual system built by the team, which falls under development work products that implement the system, such as code. It does not describe what is needed or how to use it. This option is wrong.","B":"Acceptance testing entry criteria describe how the system is tested and belong to test work products such as test strategies and plans. They are not business-oriented. This option is wrong.","C":"Business-oriented work products describe what is needed, such as requirements specifications, and how to use it, such as user documentation, and a user manual is user documentation, as per reference section 2.1.2. It helps users understand and operate the product. The other options are development or test work products.","D":"Usability test results present test results, which places them among test work products such as test dashboards. They are not business-oriented work products. This option is wrong."}},{"q":"You have been asked to execute an exploratory testing session on Park & Ride system. The test charter has been titled as \"Buy a bus ticket\". As a result, a number of defects were reported, the titles of which are listed below. Which defect is out of scope for the given test charter?","o":{"A":"Price for a bus ticket was calculated incorrectly.","B":"Failed to buy a bus ticket after 18:00.","C":"Failed to buy a bus ticket when the network connection to the Central System is down.","D":"Payment for parking ticket is restricted to cash only (no credit card supported)."},"a":["D"],"e":{"A":"An incorrectly calculated bus ticket price is a defect in buying a bus ticket and therefore within the charter. Price calculation is part of the purchase flow. This defect is in scope.","B":"Failing to buy a bus ticket after 18:00 is a failure of the bus ticket purchase function under a particular time condition. It falls squarely within the charter. This defect is in scope.","C":"Failing to buy a bus ticket when the connection to the Central System is down is a bus ticket purchase failure under an error condition. Exploring such conditions is typical within a charter. This defect is in scope.","D":"A test charter defines the scope and objectives of an exploratory session, and a restriction on paying for a parking ticket concerns the parking function, not buying a bus ticket, so it falls outside this charter, as per reference section 3.3.4. It may be a valid defect but belongs to a different charter. The other options all relate to buying a bus ticket."}}]},{"id":7,"title":"Practice Exam 8","questions":[{"q":"A Scrum project is aimed at developing an online travel website based on an IBE (Internet Booking Engine), to provide booking of flights. The website will allow customers to specify their travel requirements, and once these requirements are received, the website will offer a list of available flights which customers can book. A single Scrum team will work on this project and the project will start with a Sprint Zero.\nWhich of the following statements best describes how a tester on the Scrum team should contribute during the Sprint Zero?","o":{"A":"The tester should work together with the rest of the team to identify the product backlog and create an initial system architecture and high-level prototypes","B":"The tester should individually produce the list of the product backlog items that the team will commit to deliver at the end of the first regular sprint","C":"The tester should work together with the rest of the team to produce the list of the product backlog items that the team will commit to deliver at the end of the first regular sprint","D":"While the other team members are working on the project plan, the tester should individually create an initial test strategy for all test levels"},"a":["A"],"e":{"A":"During Sprint Zero the tester collaborates with the rest of the team on preparation activities such as identifying the scope of the project (the product backlog) and creating an initial system architecture and high-level prototypes, as per reference section 2.3.2. Sprint Zero sets the direction for the project, and the tester works jointly with the team rather than in isolation. The other options either describe solo work or confuse Sprint Zero with planning the commitment for the first regular sprint.","B":"Selecting the backlog items to commit to for a sprint is a whole-team decision made during iteration planning, not something a tester produces alone. It is also not a Sprint Zero activity, which focuses on preparation such as scope, architecture, tools and test strategy. This option is wrong on both the individual nature and the timing of the work.","C":"Although it correctly describes collaboration, committing to the backlog items for the first regular sprint happens in that sprint's iteration planning, not in Sprint Zero. Sprint Zero covers preparation activities such as identifying the product backlog, initial architecture, tooling and an initial test strategy. The activity described is therefore placed in the wrong iteration.","D":"Creating an initial test strategy for all test levels is indeed a Sprint Zero activity, but the syllabus states that the tester collaborates with the team on it rather than working individually while others plan. Agile emphasizes the whole-team approach, so isolating the tester contradicts how Sprint Zero is intended to work. The individual nature of the work makes this option incorrect."}},{"q":"Which of the following is NOT a typical task performed by the tester within an Agile team?","o":{"A":"Ensuring all project status meetings are held according to the plan.","B":"Ensuring the appropriate testing tasks are scheduled during iteration planning.","C":"Suggesting improvements in team retrospectives.","D":"Working with business stakeholders to clarify requirements."},"a":["A"],"e":{"A":"Ensuring that project status meetings are held according to plan is a facilitation or management responsibility, typically of the Scrum Master or project manager, and is not listed among the tester's tasks in an Agile team, as per reference section 2.3.2. The tester's typical tasks include scheduling testing tasks during planning, suggesting improvements in retrospectives and clarifying requirements with stakeholders. The other options are all explicitly listed tester activities, so they do not answer this NOT question.","B":"Ensuring that the appropriate testing tasks are scheduled during release and iteration planning is explicitly listed as a typical tester task in an Agile team. It helps make testing work visible and planned alongside development work. Because it is a typical task, it is not the correct answer to this NOT question.","C":"Participating proactively in team retrospectives, suggesting and implementing improvements, is explicitly listed as a typical tester task. Testers bring a unique perspective on quality and process to retrospectives. Because it is a typical task, it does not answer this NOT question.","D":"Actively collaborating with developers and business stakeholders to clarify requirements, especially regarding testability, consistency and completeness, is a typical tester task. This collaboration helps create testable user stories and acceptance criteria. Because it is a typical task, it is not the correct answer."}},{"q":"Which of the following statements best describes how development and testing activities are integrated in Agile projects?","o":{"A":"Testers can start testing a user story only when it is \"done\", meaning when the coding of that user story is finished","B":"The performances of developers are measured on implemented story points while the performances of testers on executed test cases and defect counts","C":"Agile teams often adopt exploratory testing, where test design and test execution occur at the same time, usually guided by a test charter","D":"Both business stakeholders and testers can test user stories during their development within an iteration to provide fast feedback to the developers"},"a":["D"],"e":{"A":"In Agile projects testing activities occur throughout the iteration, not as a final activity after coding is finished. A story is considered done only after it has been integrated and tested, so testing cannot wait for done. This option describes a sequential mindset rather than integrated development and testing.","B":"Measuring developers on story points and testers on executed test cases and defect counts separates the roles and conflicts with the whole-team approach, where everyone is responsible for quality. The syllabus does not describe such role-specific performance measures as a way of integrating development and testing. This statement describes a divisive practice, not integration.","C":"Exploratory testing, where test design and execution occur simultaneously guided by a charter, is indeed common in Agile teams. However, it describes a test technique, not how development and testing activities are integrated within the iteration. It is a true statement that does not answer the question asked.","D":"In Agile iterations, developers, testers and business stakeholders all have a role in testing, and business stakeholders also test the stories during implementation to provide fast feedback to the development team, as per reference section 2.1.1. Testing takes place throughout the iteration in parallel and overlapping with development, which is the essence of integrated activities. The other options describe either sequential testing, role-based measurement or a technique unrelated to integration."}},{"q":"Which of the following is the best example of a testable acceptance criterion for test-related activities?","o":{"A":"The web application shall provide a response time lower than one second for 95% of the webpages when 100 concurrent users are working on it","B":"100% of the source code must be statically analyzed against some of the known major security vulnerabilities and no errors/warnings must be reported","C":"The application's user interface for the checkout process shall be clear and intuitive to the users","D":"The application shall calculate the volume of the solid shapes (cones, pyramids) with reasonable accuracy"},"a":["A"],"e":{"A":"This criterion defines a measurable response time threshold, a percentage of pages and a specific load of concurrent users, so a test can objectively determine pass or fail, as per reference section 3.3.1. Testable acceptance criteria must be specific and measurable, including for non-functional characteristics such as performance. The other options contain vague or incomplete terms that prevent objective verification.","B":"The phrase \"some of the known major security vulnerabilities\" is vague, since it does not specify which vulnerabilities are to be checked. Without a defined set, testers cannot determine objectively whether the criterion has been met. The ambiguity makes this criterion not properly testable.","C":"Terms such as \"clear and intuitive\" are subjective and are interpreted differently by different users. No objective measure or threshold is given to decide pass or fail. This is a classic example of an untestable acceptance criterion.","D":"\"Reasonable accuracy\" is undefined and gives no tolerance or precision value against which results can be compared. Testers cannot objectively decide whether a calculated volume passes. The criterion is therefore not testable as written."}},{"q":"Based on the skills required for testers in Agile teams, which of the following activities would you expect least likely to be performed by testers in Agile projects?","o":{"A":"Tracking the failures of the unit tests that are written when using the Test-Driven Development practice","B":"Identifying and updating test cases from previous iterations that are affected by the changes made in the current iteration","C":"Working collaboratively with a developer to develop and test a feature","D":"Actively participating in specification workshops aimed at clarifying user stories through examples that will be transformed into tests"},"a":["A"],"e":{"A":"Unit tests written as part of test-driven development are created and run by developers as part of their coding cycle, so tracking their failures is a developer activity and least likely to be performed by testers, as per reference section 2.3.2. Testers in Agile teams focus on activities such as maintaining regression tests, pairing with developers and participating in specification workshops. The other options are all activities the syllabus expects of Agile testers.","B":"Testers must be able to quickly identify and update test cases from previous iterations that are affected by changes made in the current iteration. This is a key part of managing regression risk in Agile projects. It is therefore a very likely tester activity, not the least likely.","C":"Pairing, including a tester working collaboratively with a developer to develop and test a feature, is an Agile practice described in the syllabus. It fits the collaborative skills expected of Agile testers. It is a likely activity, so it is not the answer.","D":"Participating in specification workshops that clarify user stories through examples, which later become tests, is typical of acceptance test-driven development. Testers bring their testing perspective to these collaborative sessions. This is a likely tester activity, not the least likely."}},{"q":"Which of the following describes the main purpose of a task management tool in agile projects?","o":{"A":"A task management tool is used by team members to share ideas and collaborate on assigned tasks.","B":"A task management tool is used to manage and track user stories, tests and other tasks.","C":"A task management tool is used to store source code and automated tests.","D":"A task management tool allows developers to continuously integrate their code."},"a":["B"],"e":{"A":"Sharing ideas and collaborating is the purpose of communication and information sharing tools such as wikis, instant messaging and desktop sharing. Task management tools may support collaboration indirectly, but their main purpose is tracking work items. This option describes a different tool category.","B":"Task management and tracking tools are used to record and track user stories, tests and other tasks, their estimates and status, often as an electronic task board, as per reference section 3.4.1. They give the whole team visibility of all work in the iteration and release. The other options describe communication, configuration management and build tools.","C":"Storing source code and automated tests is the role of configuration management and version control tools. Task management tools track the work to be done, not the artifacts themselves. This option confuses task management with configuration management.","D":"Allowing developers to continuously integrate their code is the purpose of continuous integration and build tools. Task management tools track tasks and their status rather than automating builds. This option describes a build tool, not a task management tool."}},{"q":"Which of the following is a risk that continuous integration introduces?","o":{"A":"Teams sometimes over-rely on unit tests and exclude some important system and acceptance tests.","B":"Testers sometimes have too many builds to test, which reduces the quality of testing.","C":"Teams no longer have the ability to run manual tests, as all tests must be automated.","D":"Developer's workload is increased, which can result in a reduction of output."},"a":["A"],"e":{"A":"The syllabus lists among the risks and challenges of continuous integration that teams sometimes over-rely on unit tests and perform too little system and acceptance testing, as per reference section 1.2.4. Because automated unit tests run with every build, teams can wrongly assume they are sufficient. The other options are not risks named for continuous integration.","B":"Frequent builds are a feature of continuous integration, and automated tests run on each build, so testers are not expected to test every build manually. Too many builds reducing testing quality is not a risk named in the syllabus. This option is not the listed risk.","C":"Continuous integration does not eliminate manual testing; it automates build and regression checks while manual and exploratory testing continue alongside it. The syllabus notes that continuous integration reduces repetitive manual testing, not that all manual testing becomes impossible. This statement is false.","D":"Continuous integration is intended to give developers faster feedback and reduce integration effort, not to increase their workload and reduce output. The effort of introducing tools and automation is a challenge, but reduced developer output is not a stated risk. This option misrepresents the effect of continuous integration."}},{"q":"You are a tester in an agile team. The user story you are due to test is still under development so your tests are blocked. The main issue holding progress on this user story is that the developer's unit tests are constantly failing.\nAs an agile tester, which of the following actions should you take?","o":{"A":"Review the design of the problematic user story and improve it where possible.","B":"Create a bug report for each of your blocked tests.","C":"Work together with the developer, suggesting reasons why the tests are failing.","D":"Use the time to improve and automate existing test cases of other user stories."},"a":["C"],"e":{"A":"Redesigning the user story on your own bypasses the product owner and the team, who jointly own story content and design decisions. It also does not address the immediate problem of failing unit tests. This is not the collaborative action expected of an Agile tester.","B":"Raising bug reports for blocked tests adds overhead without solving anything, since the code is still under development and the failures are already known to the developer. Agile favors direct communication over formal reporting in such situations. This action does not help move the story forward.","C":"Agile testers collaborate closely with developers and help resolve problems, for example by pairing and sharing their testing perspective on why tests fail, as per reference section 2.3.2. Working with the developer addresses the actual blocker and supports the whole-team responsibility for quality. The other options are either unilateral, bureaucratic or ignore the blocking issue.","D":"Improving and automating other tests is useful work, but it ignores the story that is blocking progress. In Agile, team members help each other remove impediments to complete the committed stories. Choosing unrelated work is less effective than helping resolve the blocker."}},{"q":"Which of the following describes the frequency with which usually all changes made to the software are merged and all changed components are integrated regularly in a continuous integration process?","o":{"A":"At least once per iteration","B":"At least once a week","C":"At least once a month","D":"At least once a day"},"a":["D"],"e":{"A":"Integrating only once per iteration would delay detection of integration problems for weeks, which is the opposite of continuous integration. The practice relies on merging and integrating much more frequently. This frequency is far too low.","B":"Weekly integration still allows integration problems to accumulate for several days. Continuous integration requires changes to be merged and integrated at least daily. This option does not match the defined frequency.","C":"Monthly integration is close to a big-bang approach that continuous integration is designed to avoid. It would remove the benefit of early detection of integration problems. This option is incorrect.","D":"In continuous integration, all changes are merged and all changed components are integrated regularly, at least once a day, keeping the tested software within a day of the version being developed, as per reference section 1.2.4. This daily or more frequent integration enables early detection of integration problems. The other options describe frequencies that are too infrequent for continuous integration."}},{"q":"Which of the following sentences related to Risk-based testing is CORRECT?","o":{"A":"Risk-based testing fits well in Agile development processes, as risks are analyzed twice - during release and iteration planning.","B":"Risk-based testing does not fit well in Agile development processes, as short iterations mandate short test times.","C":"Risk-based testing does not fit in Agile development processes, as each iteration focuses on limited parts of the product.","D":"Risk-based testing fits well in Agile development processes, as risks are easy to identify when the work is divided into user stories."},"a":["A"],"e":{"A":"In Agile projects quality risk analysis takes place at two places, release planning and iteration planning, so risk-based testing fits naturally into the Agile process, as per reference section 3.2.1. The risk analysis then guides the priority and depth of testing in each iteration. The other options either reject risk-based testing or give a reason not supported by the syllabus.","B":"Short iterations do not make risk-based testing unsuitable; on the contrary, limited time makes prioritizing testing by risk even more valuable. Risk analysis helps decide the priority and depth of testing within each iteration. This statement is false.","C":"Focusing each iteration on a limited part of the product does not prevent risk-based testing; risks are simply assessed for the stories in scope. The syllabus explicitly describes quality risk analysis as part of Agile planning. This statement is false.","D":"The syllabus does not claim that risks become easy to identify because work is divided into user stories. Risk identification still requires the whole team's analysis during release and iteration planning. The reason given is not the one the syllabus provides."}},{"q":"During a retrospective, which of the following items would be the LEAST effective to generate discussions on process improvement?","o":{"A":"The build process was slow and this often caused delays waiting for the build to complete.","B":"For the last sprint the estimated and actual effort were much higher than the team capacity.","C":"The automation tests failed frequently without any logs to help in debugging the failure reason.","D":"One of the testers was regarded as being both disruptive and lazy and did not contribute to team success."},"a":["D"],"e":{"A":"A slow build process causing delays is a concrete process issue that the team can analyze and improve, for example through better tooling or build optimization. Such topics are exactly what retrospectives are meant to address. It would generate useful discussion.","B":"A large gap between estimated effort and team capacity points to planning and estimation problems. Discussing it can improve estimation practices and sprint commitment. This is an effective retrospective topic.","C":"Automated tests failing without logs is a tooling and testability problem that directly affects productivity. Retrospectives commonly address test effectiveness and tooling improvements. This item would generate a productive improvement discussion.","D":"Labelling an individual as disruptive and lazy is a personal attack rather than a process observation, and retrospectives must take place in a professional environment characterized by mutual trust, as per reference section 1.2.3. Such blaming undermines trust and is unlikely to produce constructive process improvements. The other options describe process and tooling issues that are effective discussion topics."}},{"q":"Which of the following statements would you expect least likely to be true?","o":{"A":"In Agile projects, where an independent test team works in parallel with Agile teams, the independent test team is usually expected to work on functional testing while Agile teams on non-functional testing","B":"In Agile projects where an independent test team works in parallel with Agile teams, the independent test team can work on long-term and/or non-sprint activities such as developing automated test tools","C":"Having independent test teams working in parallel with Agile teams can be required for Agile projects that have to deal with regulatory compliance requirements and complex domains","D":"Having independent test teams working in parallel with Agile teams can be an option when scaling Agile software development, for example when an independent test team supports multiple Agile teams"},"a":["A"],"e":{"A":"The syllabus describes an independent test team as able to support activities such as developing automated test tools, non-functional testing, test environments and test levels that do not fit in a sprint, and does not state that independent teams do functional testing while Agile teams do non-functional testing, as per reference section 2.1.5. If anything, specialized non-functional testing is an example of work an independent team may take on. The other statements are consistent with the syllabus, making this the least likely to be true.","B":"The syllabus states that an independent test team can have specialized testers working on long-term and iteration-independent activities such as developing automated test tools. This statement is therefore likely to be true. It is not the answer to this least likely question.","C":"Projects with regulatory compliance requirements or complex domains may need additional independent testing to meet formal verification needs. Using independent test teams alongside Agile teams is a reasonable option in such contexts. This statement is plausibly true.","D":"When scaling Agile, an independent test team can support several Agile teams, for example with system integration testing that spans teams. This is consistent with the organizational options described in the syllabus. The statement is likely true."}},{"q":"An Agile project is aimed at developing an e-commerce website that will allow registered users to purchase digital books. During the checkout process, only credit card payments, with supported credit card types, will be accepted.\nConsider the following acceptance criterion for a given user story of this Agile project:\n\"Check that the number of steps required to complete a purchase order during the checkout process is minimized, in order to reduce the risk that the customers will leave the website without completing their orders.\"\nWhich of the following information would you expect to be the most relevant to create a test aimed at covering this acceptance criterion?","o":{"A":"The maximum number of digital books that can be purchased in a single order","B":"The supported credit card types","C":"The maximum number of steps to complete the registration process","D":"The maximum number of steps to complete the checkout process"},"a":["D"],"e":{"A":"The maximum number of books per order has no bearing on how many steps the checkout process takes. The acceptance criterion concerns minimizing checkout steps, not order size. This information is irrelevant to the test.","B":"Supported credit card types are relevant to payment validation tests, not to the number of steps in checkout. Changing card types does not measure whether the process is minimized. This information does not support the stated criterion.","C":"The registration process is separate from the checkout process described in the criterion. Knowing the steps for registration does not help verify the length of checkout. This option targets the wrong process.","D":"To test that the checkout steps are minimized, the tester needs a defined target, namely the maximum number of steps allowed to complete checkout, so that the criterion becomes measurable, as per reference section 3.3.1. Testers work with stakeholders to obtain such concrete information that turns a vague criterion into a testable one. The other options concern order size, payment types or registration, which do not relate to this criterion."}},{"q":"What is the definition of agile software development?","o":{"A":"Testing carried out informally where no formal test preparation or execution takes place, no recognized test design technique is used and there are no expectations for results.","B":"A group of software development methodologies based on iterative incremental development with self- organizing cross-functional teams who cooperate to define requirements and to implement the solution.","C":"A framework to describe the software development lifecycle activities from requirements specification to maintenance where test planning of the various test levels is done as soon as the test basis is ready","D":"A way of developing software where the test cases are developed, and often automated, before the software under test is developed."},"a":["B"],"e":{"A":"This is essentially the definition of ad hoc testing, informal testing with no preparation or expected results. It describes a testing style, not a software development approach. It is unrelated to Agile software development.","B":"Agile software development is a group of methodologies based on iterative incremental development, where requirements and solutions evolve through collaboration between self-organizing cross-functional teams, as per reference section 1.1.1. This reflects the values of the Agile Manifesto and the whole-team approach. The other options describe ad hoc testing, a sequential lifecycle model and test-driven development.","C":"This describes a sequential lifecycle framework such as the V-model, where test planning for each level starts when its test basis is ready. Agile development is iterative and incremental rather than phase-based. This option describes a traditional model.","D":"This is the definition of test-driven development, a specific practice where tests are written before the code. TDD is used in some Agile teams but is not a definition of Agile software development itself. This option confuses a practice with the overall approach."}},{"q":"Which of the following statements best describes test-driven development?","o":{"A":"A way of developing software where the test cases are developed, and often automated, before the software to run those test cases has been written","B":"A high-level description of the test levels to be performed and the testing within those levels for an organization or programme (one or more projects)","C":"An approach to software development based on iterative incremental development, where requirements and solutions evolve through collaboration between self-organizing cross-functional teams","D":"A way of testing software where test design and test execution occur at the same time, guided by a test charter during time-boxed testing sessions"},"a":["A"],"e":{"A":"Test-driven development is a way of developing software in which test cases are developed, and often automated, before the code that satisfies them is written, as per reference section 3.1.1. Developers add a failing test, write just enough code to pass it, and then refactor in short cycles. The other options define a test strategy, Agile development and exploratory testing.","B":"A high-level description of the test levels for an organization or programme is the definition of a test strategy. It is a planning document, not a development practice. This option does not describe test-driven development.","C":"Iterative incremental development with collaboration between self-organizing cross-functional teams defines Agile software development. TDD is one practice that may be used within Agile, but it is not the same thing. This option describes the wider approach.","D":"Simultaneous test design and execution guided by a charter in time-boxed sessions defines exploratory testing. TDD instead writes tests first to drive code design. This option describes a different technique."}},{"q":"A calculator application is being developed. The third sprint has been planned to add functionality to the calculator to allow scientific calculations.\nWhich TWO examples below represent activities that would likely be managed on an agile task board for the third sprint?\n1) A task to design the features planned for the next sprint.\n2) A task to run an acceptance test for a user story.\n3) A task to automate regression tests.\n4) A task to participate in training in preparation for the fourth sprint.\n5) A task to produce a daily progress report for the agile team members.","o":{"A":"2, 3","B":"1, 4","C":"4, 5","D":"1, 5"},"a":["A"],"e":{"A":"An Agile task board shows the tasks of the current iteration, including testing tasks such as running acceptance tests for a user story and automating regression tests, as per reference section 2.2.1. Both items 2 and 3 are concrete work within sprint three that the team tracks to completion. The other combinations include next-sprint work, training or status reports that are not iteration tasks.","B":"Designing features for the next sprint and training for the fourth sprint belong to future iterations or are not work on the current sprint's user stories. The task board for sprint three tracks work for the stories committed in that sprint. Neither item fits.","C":"Training for the fourth sprint is not a task for the current sprint's stories, and producing a daily progress report is unnecessary because the task board and burndown chart themselves provide progress visibility. Neither item would typically appear as a task on the board. This combination is incorrect.","D":"Designing features for the next sprint belongs to future planning, and a daily progress report is replaced by the daily stand-up and the task board itself. Neither item represents work on the current sprint's user stories. This combination is incorrect."}},{"q":"Which of the following statements would you expect to be the MOST direct advantage of the whole-team approach?","o":{"A":"Having at least once a day an automated build and test process that detects integration errors early and quickly.","B":"Avoiding requirements misunderstandings which may not have been detected until later in the development cycle when they are more expensive to fix.","C":"Capitalizing on the combined skills of business representatives, testers and developers working together to contribute to project success.","D":"Reducing the involvement of business representatives because of the increased communication and collaboration between testers and developers."},"a":["C"],"e":{"A":"A daily automated build and test process that detects integration errors early is a benefit of continuous integration. It is not a direct consequence of the whole-team approach. This option describes a different practice.","B":"Avoiding requirements misunderstandings early is a benefit associated with early and frequent feedback and collaborative user story creation. It may be an indirect result of teamwork, but it is not the most direct advantage of the whole-team approach. This option is less precise than the correct one.","C":"The whole-team approach brings together business representatives, testers and developers so that the combined skills of the team are leveraged for project success, as per reference section 1.1.2. The syllabus lists enabling various skill sets to be leveraged as a direct benefit, alongside improved communication and shared responsibility for quality. The other options describe benefits of other practices or contradict the approach.","D":"The whole-team approach increases, not reduces, the involvement of business representatives, who are part of the team. Reducing business involvement contradicts the approach and the Agile value of customer collaboration. This option is incorrect."}},{"q":"Which of the following statements about Agile retrospectives is true?","o":{"A":"Agile retrospectives should focus exclusively on improving negative aspects, without wasting time in discussions on what worked well during the iteration","B":"All of the improvements identified in an Agile retrospective must be implemented as soon as possible during the next iteration","C":"Metrics such as burndown charts, velocity, and number of stories completed could be effectively used during Agile retrospectives for process improvement","D":"An Agile retrospective should be held at the end of an iteration only when the number of story points completed by the team in that iteration is lower than the team velocity"},"a":["C"],"e":{"A":"Retrospectives discuss both what was successful and what could be improved, so that successes can be retained in future iterations. Ignoring what worked well would lose valuable information. This statement is false.","B":"Teams should implement only a few improvements per iteration to allow continuous improvement at a sustainable pace. Forcing all improvements into the next iteration would be unrealistic. This statement is false.","C":"Retrospectives can result in improvement decisions on test effectiveness, productivity and team performance, and metrics such as burndown charts, velocity and stories completed provide objective input for these discussions, as per reference section 1.2.3. Using data helps the team identify trends and root causes. The other options misrepresent the scope, pace or timing of retrospectives.","D":"A retrospective is held at the end of each iteration regardless of performance. Holding it only when velocity drops would miss opportunities to retain successes and improve continuously. This statement is false."}},{"q":"Which of the following statements about test automation and regression risk in Agile projects is true?","o":{"A":"Automated unit tests are generally not run with each code check-in as they take longer to run than automated acceptance tests and could slow down the code check-in process","B":"Regression risk is reduced when there is a high degree of code changes being applied from one iteration to the next","C":"Technical debt is due to manual testing and it cannot be present when the team implements test automation","D":"Test automation can help to manage regression risk since it allows the running of regression test suites within each iteration"},"a":["D"],"e":{"A":"Automated unit tests are run before code is checked into the mainline to ensure changes do not break the build, and they are typically the fastest tests to run. The claim that they are slower than acceptance tests and skipped for that reason is false. This option misrepresents unit testing practice.","B":"Extensive code churn increases regression risk, not reduces it. The more code is changed between iterations, the more likely existing functionality is broken. This statement is the opposite of the truth.","C":"Technical debt comes from many sources such as poor design, missing tests and deferred defects, and it can exist regardless of test automation. Automation helps control it but does not eliminate it. This statement is false.","D":"Test automation helps manage regression risk because automated regression suites can be run in every iteration with less effort than manual regression testing, as per reference section 2.2.2. This frees testers to test new features more thoroughly while protecting existing functionality. The other options contain false claims about unit tests, code churn and technical debt."}},{"q":"Which of the following statements about a test charter are CORRECT?\n1) It is used mainly in exploratory tests.\n2) It is used to monitor a test process.\n3) It may make reference to user stories.\n4) It contains notes taken during a test session.\n5) It is used to outline the company test policy.","o":{"A":"1, 2, 5","B":"2, 3, 4","C":"2, 4, 5","D":"1, 3, 4"},"a":["D"],"e":{"A":"Statement 5 is wrong because a company test policy is an organizational document, not something outlined in a test charter. Statement 2 is also not the main purpose of a charter. This combination includes incorrect statements.","B":"Statement 1 is missing even though charters are used mainly in exploratory testing, and statement 2 describes test monitoring rather than a charter's purpose. This combination omits a key correct statement. It is therefore incorrect.","C":"This combination includes statement 5, which is wrong because test policy is defined at organizational level, and statement 2, which is not a charter's purpose. It also omits statement 1. This combination is incorrect.","D":"A test charter is used mainly to guide exploratory testing sessions, may reference user stories, risks or specifications, and is associated with notes recorded during the session, as per reference section 3.3.4. Statements 1, 3 and 4 therefore describe the charter correctly. The other combinations include monitoring the test process or outlining company test policy, which are not charter purposes."}},{"q":"In Agile projects, which of the following approaches would result in the best compromise for preserving independence of testers and for allowing testers to have a good understanding of the product as well as good relationships with other team members?","o":{"A":"Having independent separate test teams where testers are assigned to Agile teams on-demand during the final days of each iteration","B":"Having independent separate test teams where testers are assigned to Agile teams on a long-term basis, at the beginning of an Agile project","C":"Having only Agile teams where testers are integral parts and where they perform many of the testing tasks, without having an independent test team","D":"Having independent separate test teams where all of the testers work separately from developers without being assigned to Agile teams"},"a":["B"],"e":{"A":"Assigning testers on demand only in the final days of each iteration preserves independence but causes time pressure, lack of understanding of new features and poor relationships with stakeholders and developers. The syllabus notes that this approach often leads to problems. It does not achieve the required balance.","B":"Having an independent test team whose testers are assigned to Agile teams on a long-term basis from the beginning of the project lets testers maintain independence while gaining a good understanding of the product and strong relationships with team members, as per reference section 2.1.5. This is the compromise the syllabus describes. The other options sacrifice either independence or understanding and relationships.","C":"Fully embedding testers without any independent team gives good product understanding but risks loss of independence and objective evaluation. It does not preserve independence. This option does not offer the best compromise.","D":"Keeping all testers separate from developers without assignment to Agile teams maximizes independence but prevents good product understanding and relationships. It also conflicts with the collaborative nature of Agile. This option is not a good compromise."}},{"q":"You are working in a software development company which, for many years, used a sequential development model and was organized into separate departments for each functional group (e.g. business analysts, developers, testers) located within their own office space. Your organization has recently changed to a SCRUM agile framework. Which of the following is an important organizational and behavioral best practice for a tester in the SCRUM team that should have also been practiced when using the sequential model?","o":{"A":"Resilient testing means that the testing process is capable of dealing with rapid changes throughout the development process with test plans being updated during each iteration.","B":"Credibility means that the tester must share information with the stakeholders about the test process so that they find the selected test strategy and testing activities trustworthy.","C":"Cross-functional teamwork means that all team members contribute to testing in various ways. For example, involving people with the test strategy, test planning and execution as well as test reporting.","D":"Co-located teamwork means that all team members, including developers and testers, must sit together in the same office, so they can quickly communicate face-to-face."},"a":["B"],"e":{"A":"Resilient testing, responding to change with plans updated each iteration, is described as an Agile Scrum best practice tied to iterative development. In a sequential model with separate departments, plans were not revised per iteration. This practice is specific to the Agile context rather than something shared with the sequential model.","B":"Credibility means the tester ensures the test strategy, its implementation and execution are credible, often by providing information about the testing process to stakeholders, otherwise they will not trust the results, as per reference section 2.3.2. This applies equally in sequential and Agile lifecycles. The other options describe practices tied to Agile iterations, whole-team working or co-location.","C":"Cross-functional teamwork, where the whole team works together on testing activities, is a Scrum team practice that did not exist in an organization split into separate functional departments. It is specific to the Agile team structure. This option does not fit a practice that should also have existed in the sequential model.","D":"Co-location, with testers sitting together with developers and the product owner, is a Scrum best practice, but the organization previously had separate office spaces for each department. It is an organizational arrangement rather than a behavioral practice expected under the sequential model. This option does not fit the question."}},{"q":"In a sprint planning, the product owner presents a user story written on a card. The team starts having a discussion with the product owner to get an understanding on how the software should work.\nThe user story written on the card is:\n\"As a customer, I want to subscribe to the mailing list so that I can receive the latest deal in an email.\"\nBy applying the 3C concept, which ONE of the following statements is CORRECT?","o":{"A":"Conversation should include the acceptance criteria discussion.","B":"The card should contain requirements not the user story.","C":"Product owner has written a user story and confirmation is not needed.","D":"The conversation is not required and the team should start developing."},"a":["A"],"e":{"A":"In the 3C concept, the Conversation explains how the software will be used and is where the team and product owner discuss the story, including the acceptance criteria that form the Confirmation, as per reference section 1.2.2. Discussing acceptance criteria during the conversation ensures a shared understanding of when the story is done. The other options misrepresent the Card, Confirmation or Conversation.","B":"The Card is the physical medium that holds the user story itself, typically in the As a, I want, so that format. It is not meant to hold detailed requirements. This statement contradicts the 3C concept.","C":"Confirmation, in the form of acceptance criteria, is always needed to determine whether the story is complete. Writing a story does not remove the need for confirmation. This statement is false.","D":"The Conversation is an essential element of the 3C concept and is how the team gains understanding of the story. Skipping it and starting development risks misunderstanding the requirement. This statement is false."}},{"q":"Which agile development approach incorporates the following practices:\n* a project is divided into iterations called sprints\n* each sprint results in a potentially releasable/shippable product?","o":{"A":"Kanban","B":"Extreme Programming","C":"Continuous Integration","D":"Scrum"},"a":["D"],"e":{"A":"Kanban does not use fixed iterations; it manages a continuous flow of work with work-in-progress limits. Iterations called sprints are not part of Kanban. This option is incorrect.","B":"Extreme Programming uses iterations and engineering practices such as pairing and TDD, but the term sprint and the concept of a potentially shippable increment per sprint are specific to Scrum. This option does not match both practices described.","C":"Continuous integration is an engineering practice for merging and building code frequently, not a development approach with sprints. It can be used within Scrum but does not define sprints. This option is incorrect.","D":"Scrum divides a project into iterations called sprints, and each sprint results in a potentially releasable or shippable product increment, as per reference section 1.2.1. These are defining characteristics of the Scrum framework. The other options describe approaches or practices that do not use sprints."}},{"q":"Which of the following statements about iteration and release planning is true?","o":{"A":"Release planning defines and re-defines the product backlog and provides the basis for a test approach and test plan spanning all iterations","B":"During release planning, testers add value by breaking down user stories into tasks (particularly testing tasks)","C":"During release planning, testers establish and prioritize the user stories for the release and then participate in the quality risk analysis for these stories","D":"Release plans cannot change as an Agile project proceeds, but iteration plans may change to accommodate new needs"},"a":["A"],"e":{"A":"Release planning defines and re-defines the product backlog and provides the basis for a test approach and test plan spanning all iterations, as per reference section 1.2.5. Release plans are high level and look ahead to the release as a whole. The other options misplace task breakdown, assign prioritization to testers or claim release plans cannot change.","B":"Breaking user stories down into tasks, including testing tasks, happens during iteration planning, not release planning. Release plans are high level and work at the level of user stories. This option places the activity in the wrong planning level.","C":"In release planning it is the business representatives who establish and prioritize the user stories, in collaboration with the team, not the testers. Testers do participate in the quality risk analysis, but the first part of the statement is wrong. This option misassigns responsibility.","D":"Release plans are not fixed; they are revisited and can change as the project proceeds and new needs emerge. Both release and iteration plans evolve in Agile. This statement is false."}},{"q":"Which of the following statements about the test pyramid is true?","o":{"A":"The test pyramid concept is based on the principle of eliminating defects as early as possible in the software lifecycle","B":"The test pyramid emphasizes having more automated tests at the higher test levels and a decreasing number of them at the lower test levels","C":"The test pyramid concept states that every software system consists always of four different test levels (unit, integration, system, acceptance)","D":"The test pyramid consists of four test levels with business-facing tests at the bottom of the pyramid and technology-facing tests at the top"},"a":["A"],"e":{"A":"The test pyramid concept is based on the testing principle of early QA and testing, that is, eliminating defects as early as possible in the lifecycle, as per reference section 3.1.2. This is why it emphasizes many fast tests at the lower levels. The other options invert the pyramid, impose fixed levels or confuse it with the testing quadrants.","B":"The pyramid emphasizes a large number of tests at the lower levels and fewer tests at the higher levels. This option states the reverse. It is incorrect.","C":"The syllabus uses unit, integration, system and acceptance as the typical example of pyramid layers, but it does not state that every system always has exactly these four levels. This statement is overly absolute and incorrect.","D":"Business-facing versus technology-facing is a distinction from the testing quadrants, not the test pyramid. Moreover, the pyramid places lower-level technical tests such as unit tests at the bottom. This option confuses two different models."}},{"q":"Which of the following tools would you expect to be the most useful to report defects found during exploratory testing sessions in Agile projects?","o":{"A":"Tools that generate data to populate an application's database","B":"Continuous integration and build distribution tools","C":"Application lifecycle management (ALM) and task management tools","D":"Tools that capture a
