nd log activities performed on an application during its use"},"a":["D"],"e":{"A":"Data generation tools populate databases with test data, which supports test preparation but does not record what happened during an exploratory session. They do not help reproduce and report defects found. This option is not the most useful for reporting.","B":"Continuous integration and build distribution tools automate building and deploying software. They do not capture the steps a tester performed in an exploratory session. This option is not suited to reporting exploratory defects.","C":"ALM and task management tools can store defect reports, but they do not capture the actions leading to a failure during exploration. The tester would still need to reconstruct the steps manually. This option is less useful than capture tools.","D":"Exploratory test tools that capture and log activities performed on an application during a session record the exact steps that led to a failure, which can then be used to report the defect to developers, as per reference section 3.4.5. This makes defects found in unscripted testing easy to reproduce. The other options describe tools that do not record session activity."}},{"q":"Which tasks are typically performed by a tester on an Agile project?\n1) Implementing test strategy.\n2) Documenting business requirements.\n3) Measuring and reporting test coverage.\n4) Coaching development team in relevant aspects of testing.\n5) Executing test-driven development tests.","o":{"A":"2, 5","B":"2, 4, 5","C":"1, 3, 4","D":"1, 3"},"a":["C"],"e":{"A":"Documenting business requirements is primarily the product owner's or business representative's responsibility, and executing TDD tests is a developer activity. Neither is a typical tester task. This combination is incorrect.","B":"Coaching the team is a tester task, but documenting business requirements and executing TDD tests are not. Including them makes the combination wrong. This option is incorrect.","C":"The syllabus lists implementing the test strategy, measuring and reporting test coverage, and coaching other team members in relevant aspects of testing among the typical tasks of an Agile tester, as per reference section 2.3.2. Statements 1, 3 and 4 are therefore all tester tasks. The other combinations include requirements documentation or TDD test execution, which belong to other roles, or are incomplete.","D":"Implementing the test strategy and measuring coverage are correct tester tasks, but this combination omits coaching the team, which is also a listed tester task. It is incomplete. Option C is the more complete and correct answer."}},{"q":"An Agile team uses a burndown chart and a task board to track progress within each iteration. In the burndown chart, the x-axis represents the days of iteration, while the y-axis represents the story points. The task board uses columns: \"To Do\", \"Ongoing\", \"Done\".\nA user story for the current iteration has 20 story points and 4 tasks (T1, T2, T3, T4). At the end of Day 5, all are in \"Ongoing\". At the end of Day 6, T1 and T2 move to \"Done\", while T3 and T4 remain \"Ongoing\". Which of the following statements would you expect most likely to be true at the end of Day 6?","o":{"A":"The burndown chart should be updated with a number of 10 burned story points","B":"The burndown chart must be changed to represent the unit of work in hours because story points cannot be used","C":"The burndown chart should not be updated because T3 and T4 are not \"Done\" yet"},"a":["C"],"e":{"A":"Story points are burned only when the whole user story is done; they are not split proportionally across tasks. Burning 10 points for two of four tasks would overstate progress. This option is incorrect.","B":"Story points are a valid unit for a burndown chart, and many Agile teams burn down story points rather than hours. There is no rule forcing a change to hours in this situation. This option is incorrect.","C":"A burndown chart based on story points reflects only completed user stories, and since T3 and T4 are still ongoing the story is not done and none of its points can be burned, as per reference section 2.2.1. Partially completed stories deliver no value under the definition of done. The other options either burn partial points or wrongly claim story points cannot be used."}},{"q":"Which of the following is a typical task performed by a tester within a Scrum team?","o":{"A":"Suggesting improvements in sprint retrospectives","B":"Coaching other team members in self-organization and cross-functionality","C":"Removing impediments to the Scrum team's progress","D":"Prioritizing the items in the product backlog"},"a":["A"],"e":{"A":"Participating proactively in retrospectives, suggesting and implementing improvements, is explicitly listed as a typical tester task, as per reference section 2.3.2. Testers bring their testing perspective to process improvement. The other options describe Scrum Master or product owner responsibilities.","B":"Coaching the team in self-organization and cross-functionality is a Scrum Master responsibility. The tester coaches in relevant aspects of testing, not in the Scrum framework itself. This option describes a different role.","C":"Removing impediments to the team's progress is a core Scrum Master responsibility. Testers raise impediments but are not responsible for removing them. This option describes a different role.","D":"Prioritizing the product backlog is the product owner's responsibility. Testers may advise on risks, but they do not own backlog priority. This option describes a different role."}},{"q":"Which of the following would you expect most likely to be an advantage of the whole-team approach?","o":{"A":"Providing constant availability of executable software throughout the iteration for testing, demonstration, or education purposes","B":"Improved quality of the requirements specification (through examples and automatable tests) when adopting the Acceptance Test-Driven Development practice","C":"Improved code quality produced as the result of the refactoring step performed as part of the test-driven- development technique","D":"Eliminating the schedule risks associated with big-bang integration"},"a":["A"],"e":{"A":"Constant availability of executable software throughout the iteration for testing, demonstration or education purposes is listed among the benefits of continuous integration, which lets the whole team work together on the same working product, as per reference section 1.2.4. With everyone contributing to and testing the same integrated software every day, the team can collaborate continuously. The other options describe benefits specific to ATDD, TDD or the removal of big-bang integration.","B":"Improved requirements quality through examples and automatable tests is a benefit of acceptance test-driven development. It is attributed to that specific practice rather than to the whole-team approach. This option is not the intended answer.","C":"Improved code quality through refactoring is a benefit of test-driven development. It is a developer-level practice, not an advantage of the whole-team approach. This option is incorrect.","D":"Eliminating the schedule risks of big-bang integration is a benefit of continuous integration's frequent merging. It is not related to how the whole team is organized. This option is not the intended answer."}},{"q":"Which of the following statements is true within an Agile team?","o":{"A":"Unlike traditional projects, testers are not asked to measure and report test coverage, and to report defects","B":"When adopting test-driven development, testers write all the tests while developers write all the code to make these tests pass","C":"Each team member plays a role in performing test-related tasks but only testers are responsible for product quality","D":"Testers may have difficulty keeping pace with the incoming changes in time-boxed iterations"},"a":["D"],"e":{"A":"Testers in Agile teams still measure and report test coverage and report defects, as these are listed tester tasks. Agile does not remove these responsibilities. This statement is false.","B":"In test-driven development, developers write the tests and the code in short cycles. Testers do not write all the tests for developers to pass. This statement is false.","C":"Within an Agile team each team member is responsible for product quality, not only the testers. This statement contradicts the whole-team approach. It is false.","D":"The syllabus lists as an organizational risk that testers cannot keep pace with the incoming changes in time-constrained iterations, as per reference section 2.3.2. Short time-boxes and frequent change put pressure on testing. The other options misstate tester responsibilities, TDD roles or ownership of quality."}},{"q":"User Story: As a user I want to be able to calculate tax percentage based on amount of income.\nWhat is the best black box test design technique for verifying the accuracy of this user story?","o":{"A":"Statement testing - test all statements in income calculation.","B":"User story testing - test that the user can enter an income amount and get a result.","C":"State transition testing - test all states of income entry.","D":"Equivalence partitioning - test with low, medium and high income."},"a":["D"],"e":{"A":"Statement testing is a white-box technique that requires knowledge of the code, not a black-box technique. It measures code coverage rather than verifying behavior against the specification. This option does not answer the question.","B":"Checking that a user can enter an amount and get a result verifies basic functionality, not the accuracy of the calculation. It is not a recognized systematic black-box technique. This option is too shallow.","C":"State transition testing suits systems whose behavior depends on states and events, which is not the main concern of a tax percentage calculation. Testing states of income entry would not verify calculation accuracy. This option is not the best fit.","D":"Equivalence partitioning divides income into ranges that are expected to be treated the same, such as low, medium and high income, and tests representative values to verify the calculated tax, as per reference section 3.3.3. Black-box techniques such as equivalence partitioning apply to user stories in Agile projects. The other options are white-box, too shallow or suited to different behavior."}},{"q":"An Agile team is working on a project to develop an image editing tool. In the current version, the `Settings' GUI allows users to adjust exposure, contrast, and saturation. A session-based exploratory testing session is planned to find issues with parameter combinations that cause undesired image effects.\nWhich of the following would you expect to be the best charter to support this exploratory testing session?","o":{"A":"Explore 'Settings' with many values of exposure, applied on different images, to discover unexpected effects on those images","B":"Explore 'Settings' with many combinations of the values of exposure, contrast, and saturation, applied on different images, to discover unexpected effects on those images","C":"Explore 'Settings' to discover unexpected effects on those images","D":"Explore 'Settings' working on different images by setting exposure, contrast, and saturation at their minimum, then setting exposure and contrast at maximum while keeping saturation at minimum, to discover unexpected effects"},"a":["B"],"e":{"A":"This charter covers only exposure values, so it would not reveal issues caused by combinations of exposure, contrast and saturation. It misses the stated purpose of the session. This option is too narrow.","B":"A good charter states the area, the test conditions and the purpose, and this one targets combinations of exposure, contrast and saturation on different images to discover unexpected effects, matching the session's objective, as per reference section 3.3.4. It gives enough focus while leaving freedom to explore. The other options are too narrow, too vague or overly scripted.","C":"This charter gives no guidance on which parameters or combinations to explore. It is too vague to focus a time-boxed session on parameter combinations. This option is incorrect.","D":"This charter prescribes specific steps and values, which turns it into a scripted test rather than an exploratory charter. It also covers only a few combinations. This option removes the freedom that exploratory testing requires."}},{"q":"Which statement about an Agile task board is CORRECT?","o":{"A":"It provides detailed visual representation of the whole team's status.","B":"It is updated once at the end of each iteration.","C":"Only \"in progress\" tasks are shown on the task board.","D":"It is a detailed visual representation of the status of testing."},"a":["A"],"e":{"A":"The Agile task board provides a detailed visual representation of the whole team's current status, including development and testing tasks, as per reference section 2.2.1. Tasks move across columns such as to do, in progress and done, and the board is updated continuously. The other options limit its update frequency or content incorrectly.","B":"The task board is updated continuously and discussed in daily stand-ups, not only once at the end of each iteration. Updating it only at the end would remove its value for tracking progress. This statement is false.","C":"The task board shows all tasks, including those still to do and those done, not only in-progress tasks. Showing all columns is what gives the team the full picture. This statement is false.","D":"The task board covers all team tasks, including development, testing and other work, not only testing. It represents the whole team's status. This statement is too narrow."}},{"q":"What is the main benefit of the Test Pyramid?","o":{"A":"It means testing is involved early in the development cycle.","B":"It helps in evaluating the amount of test cases needed.","C":"It shows complexity of testing activities.","D":"It acts as a metric for testing progress."},"a":["B"],"e":{"A":"The test pyramid is based on the principle of early testing, but its purpose is not to indicate when testing is involved in the development cycle. It describes the distribution of tests across levels. This option is not its main benefit.","B":"The test pyramid shows that many tests are needed at the lower levels and fewer at the upper levels, which helps the team evaluate how many test cases, especially automated ones, to target at each level, as per reference section 3.1.2. It guides the quantity and distribution of tests. The other options describe timing, complexity or progress metrics, which the pyramid does not provide.","C":"The pyramid does not express the complexity of testing activities. It concerns the number of tests at each level. This option is incorrect.","D":"Progress of testing is measured using tools such as burndown charts, task boards and test metrics. The test pyramid is not a metric. This option is incorrect."}},{"q":"Which one of the following is a testable acceptance criterion?","o":{"A":"The solution shall support business processes.","B":"The system shall be easy to use.","C":"The response time to confirm a customer submission must not exceed 5 seconds.","D":"The tools for testing are tested before use and are meeting the requirements."},"a":["C"],"e":{"A":"\"Support business processes\" is vague and gives no measurable condition. Testers cannot determine objectively whether it has been met. This criterion is not testable.","B":"\"Easy to use\" is subjective and has no measurable threshold. Different users would judge it differently. This criterion is not testable.","C":"This criterion specifies a measurable threshold, a response time not exceeding five seconds for confirming a submission, so the result can be objectively verified, as per reference section 3.3.1. Testable acceptance criteria must be specific and measurable. The other options are vague or refer to the test tools rather than the product.","D":"This statement concerns validating test tools, not the behavior of the product being built. It is also vague about which requirements the tools must meet. It is not a testable acceptance criterion for a user story."}},{"q":"Which of the following activities are done in release planning?\n1) Identifying testable user stories with acceptance criteria.\n2) Elaborating the user stories into tasks.\n3) Prioritizing the user stories.\n4) Creating acceptance tests for the user stories.\n5) Analyzing risks for each of the user stories.\n6) Performing high level estimation for the release.","o":{"A":"Activities 1, 4 and 6","B":"Activities 2 and 4","C":"Activities 2, 3 and 5","D":"Activities 1, 3 and 6"},"a":["D"],"e":{"A":"Identifying testable stories and high-level estimation belong to release planning, but creating acceptance tests is done during the iteration when stories are implemented. Including activity 4 makes this combination wrong. It also omits prioritization.","B":"Elaborating stories into tasks happens in iteration planning, and creating acceptance tests happens during the iteration. Neither is a release planning activity. This combination is incorrect.","C":"Prioritizing stories is a release planning activity, but elaborating stories into tasks and detailed risk analysis for each story are done in iteration planning. This combination mixes planning levels. It is incorrect.","D":"In release planning, business representatives establish and prioritize the user stories with the team, testers help define testable user stories with acceptance criteria, and a high-level effort estimation is performed, as per reference section 1.2.5. Activities 1, 3 and 6 are therefore release planning activities. The other combinations include task breakdown, per-story risk analysis or acceptance test creation, which belong to iteration planning or the iteration itself."}},{"q":"Consider an online application that allows registered users to pay the annual car tax based on the vehicle's engine power in kW. Given the following user story:\n\"As a customer I need the online application to calculate the annual car tax amount that I need to pay for my car:\n* If the power of the vehicle is less than 20 kW, then the annual car tax is free\n* If the power of the vehicle is more or equal than 20 kW but less or equal than 150 kW, then the annual car tax is 250 Euros\n* If the power of the vehicle is more than 150 kW, then the annual car tax is 750 Euros\"\nWhat is the MOST suitable use of a black-box test design technique for this user story?","o":{"A":"Decision table testing. Test the following conditions: Conditions=registered user logged in; inserted power of the vehicle=20kW; Action=Car tax paid","B":"State transition testing. Test the transitions between the following states: logging in, inserting the power of the vehicle, making payment, logging out.","C":"Equivalence partitioning. Test the annual car tax value for the following partitions: [power of the vehicle < 20 kW ; 20 kW ≤ power of the vehicle ≤ 150 kW; power of the vehicle > 150 kW]","D":"Use case testing Test the following use case (Actor=registered user): Pre-condition=registered user logged in Scenario=registered user inserts the power of the vehicle, making payment and logs out Post-condition=car tax paid and registered user logged out"},"a":["C"],"e":{"A":"This decision table tests a single power value and ignores the three tax ranges that drive the calculation. It does not systematically cover the business rules. This option is not the most suitable use of a technique.","B":"State transition testing here covers the navigation flow of logging in, entering data and paying, not the tax calculation rules. It would not verify that the correct amount is calculated for each power range. This option is not suitable.","C":"The user story defines three ranges of engine power, below 20 kW, from 20 to 150 kW inclusive, and above 150 kW, each producing a different tax, so equivalence partitioning with one test per partition directly covers the rules, as per reference section 3.3.3. Black-box techniques such as equivalence partitioning are applied to user stories in Agile projects. The other options test flows or single values rather than the calculation rules.","D":"This use case tests the end-to-end payment scenario but does not systematically verify the tax amount for each power range. It focuses on the flow, not on the calculation rules. This option is not the most suitable."}},{"q":"Which of the following activities would you expect most likely to be performed during daily stand-up meetings?","o":{"A":"Discussing what did not work well during the previous iteration","B":"Highlighting blocking issues that are impeding the test progress","C":"Identifying specific quality risks associated with the next iteration","D":"Creating acceptance tests for the user stories selected for the current iteration"},"a":["B"],"e":{"A":"Discussing what did not work well in the previous iteration is the purpose of the retrospective, not the daily stand-up. The stand-up focuses on the current iteration. This option is incorrect.","B":"In daily stand-up meetings each team member reports progress and highlights any impediments or blocking issues, including those impeding test progress, as per reference section 2.2.1. This lets the team address obstacles quickly. The other options belong to retrospectives, iteration planning or ongoing iteration work.","C":"Identifying quality risks for the next iteration happens during iteration planning, not the daily stand-up. The stand-up is a short status meeting. This option is incorrect.","D":"Creating acceptance tests is work carried out during the iteration, not in the brief stand-up meeting. The stand-up is for synchronization and impediments. This option is incorrect."}}]}],"total":320};
  const list = document.getElementById('list');
  const meta = document.getElementById('meta');
  const qInput = document.getElementById('q');
  const setSel = document.getElementById('setSel');
  const ansBtn = document.getElementById('ansBtn');
  const ansLbl = document.getElementById('ansLbl');

  let filterSet = 'all';
  let answersShown = true;

  // ===== Annotation state =====
  const ANNO_KEY = 'ctflStudyAnnotations_v1';
  let annotate = false, tool = 'hi', color = '#F6C445';
  let strokes = {};                       // { questionNumber: [ {tool,color,size,pts:[{x,y}]} ] }
  try{ strokes = JSON.parse(localStorage.getItem(ANNO_KEY) || '{}') || {}; }catch(e){ strokes = {}; }
  function saveAnno(){ try{ localStorage.setItem(ANNO_KEY, JSON.stringify(strokes)); }catch(e){} }

  // Set dropdown
  const optAll = document.createElement('option'); optAll.value='all'; optAll.textContent='All sets'; setSel.appendChild(optAll);
  DATA.sets.forEach(s=>{ const o=document.createElement('option'); o.value=s.id; o.textContent=s.title; setSel.appendChild(o); });

  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(t){ return esc(t).replace(/"([^"]+)"/g,'&ldquo;$1&rdquo;'); }
  function highlight(t, term){
    if(!term) return esc(t);
    const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
    return esc(t).replace(re,'<mark>$1</mark>');
  }

  function matches(q, term){
    if(!term) return true;
    const hay = (q.q + ' ' + Object.values(q.o).join(' ')).toLowerCase();
    return hay.includes(term);
  }

  function render(){
    const term = qInput.value.trim().toLowerCase();
    list.innerHTML = '';
    let shown = 0, gnum = 0;

    DATA.sets.forEach(s=>{
      if(filterSet!=='all' && String(s.id)!==String(filterSet)){ gnum += s.questions.length; return; }
      const hits = [];
      s.questions.forEach((q,i)=>{ gnum++; if(matches(q,term)) hits.push({q, n:gnum}); });
      if(!hits.length) return;

      const sh = document.createElement('div'); sh.className='set-head';
      sh.innerHTML = '<h2>'+esc(s.title)+'</h2><span class="count">'+hits.length+' shown</span>';
      list.appendChild(sh);

      hits.forEach(({q,n})=>{
        shown++;
        const multi = q.a.length>1;
        const card = document.createElement('div');
        card.className = 'qcard' + (answersShown?' reveal':'');
        let opts = '';
        Object.keys(q.o).forEach(k=>{
          const corr = q.a.includes(k);
          opts += '<div class="opt'+(corr?' correct':'')+'">'+
            '<span class="ltr">'+k+'</span>'+
            '<span class="otx">'+highlight(q.o[k], term)+'</span>'+
            '<span class="chk"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>'+
          '</div>';
        });
        let exp = '<div class="explain"><h4>Explanation</h4>';
        q.a.forEach(k=>{ if(!q.e[k]) return;
          exp += '<p class="exp-line corr"><span class="el">'+k+'.</span>'+fmt(q.e[k])+'</p>';
        });
        exp += '</div>';
        card.innerHTML =
          '<div class="qcard-top"><span class="qnum">Q'+n+'</span>'+
          (multi?'<span class="tag multi">Select '+q.a.length+'</span>':'')+'</div>'+
          '<p class="qtext">'+highlight(q.q, term)+'</p>'+
          '<div class="opts">'+opts+'</div>'+
          '<button class="showbtn">Show answer</button>'+ exp;
        card.querySelector('.showbtn').onclick = ()=> card.classList.add('reveal');
        list.appendChild(card);
        setupCanvas(card, n);
      });
    });

    if(!shown){ list.innerHTML = '<div class="empty">No questions match “'+esc(term)+'”.</div>'; }
    meta.innerHTML = '<b>'+shown+'</b> question'+(shown===1?'':'s')+' shown'+(term?' · matching “'+esc(term)+'”':'')+' · <b>'+DATA.total+'</b> total';
  }

  qInput.oninput = render;
  setSel.onchange = ()=>{ filterSet = setSel.value; render(); };
  ansBtn.onclick = ()=>{
    answersShown = !answersShown;
    ansBtn.classList.toggle('on', answersShown);
    ansBtn.setAttribute('aria-pressed', String(answersShown));
    ansLbl.textContent = answersShown ? 'Answers shown' : 'Answers hidden';
    render();
  };

  // Theme (half-moon icon, matching the drill app)
  const root = document.documentElement;
  const themeIcon = document.getElementById('themeIcon');
  function isDark(){ const t=root.getAttribute('data-theme');
    return t ? t==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
  function paintIcon(){
    themeIcon.innerHTML = isDark()
      ? '<path d="M12 3a9 9 0 1 0 9 9 6 6 0 0 1-9-9Z" fill="currentColor"/>'
      : '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>';
  }
  document.getElementById('theme').onclick = ()=>{
    root.setAttribute('data-theme', isDark()?'light':'dark'); paintIcon();
  };
  paintIcon();

  // ===== Drawing engine =====
  // Each visible card owns a canvas sized to its box. Strokes are stored in
  // card-relative pixels keyed by the question's global number, so annotations
  // stay pinned to their question through search / filter / theme changes.
  function setupCanvas(card, n){
    const cv = document.createElement('canvas');
    cv.className = 'anno';
    card.appendChild(cv);
    const ctx = cv.getContext('2d');

    function sizeTo(){
      const w = card.clientWidth, h = card.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      redraw();
    }
    function drawStroke(s){
      if(!s.pts.length) return;
      ctx.globalAlpha = s.tool === 'hi' ? 0.34 : 1;
      ctx.lineWidth = s.size;
      ctx.strokeStyle = s.color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(s.pts[0].x, s.pts[0].y);
      if(s.pts.length === 1){ ctx.lineTo(s.pts[0].x + 0.1, s.pts[0].y); }
      else s.pts.forEach(p => ctx.lineTo(p.x, p.y));
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    function redraw(){
      ctx.clearRect(0, 0, cv.width, cv.height);
      (strokes[n] || []).forEach(drawStroke);
    }

    let cur = null, drawing = false;
    function pt(e){ const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    function eraseAt(p){
      const before = (strokes[n] || []).length;
      strokes[n] = (strokes[n] || []).filter(s => !s.pts.some(q => Math.hypot(q.x - p.x, q.y - p.y) < 14));
      if((strokes[n] || []).length !== before){ redraw(); saveAnno(); }
    }

    cv.addEventListener('pointerdown', e => {
      if(!annotate) return;
      e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing = true;
      const p = pt(e);
      if(tool === 'eraser'){ eraseAt(p); return; }
      cur = { tool, color, size: tool === 'hi' ? 15 : 2.6, pts: [p] };
      redraw(); drawStroke(cur);
    });
    cv.addEventListener('pointermove', e => {
      if(!drawing || !annotate) return;
      const p = pt(e);
      if(tool === 'eraser'){ eraseAt(p); return; }
      cur.pts.push(p); redraw(); drawStroke(cur);
    });
    function finish(){
      if(cur && cur.pts.length){ (strokes[n] = strokes[n] || []).push(cur); saveAnno(); }
      cur = null; drawing = false;
    }
    cv.addEventListener('pointerup', finish);
    cv.addEventListener('pointercancel', finish);

    if('ResizeObserver' in window){ new ResizeObserver(sizeTo).observe(card); }
    requestAnimationFrame(sizeTo);
  }

  // ===== Dock wiring =====
  const dock = document.getElementById('dock');
  const annoBtn = document.getElementById('annoBtn');
  function setTool(t){
    tool = t;
    dock.querySelectorAll('.tool[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  }
  function setColor(c){
    color = c;
    dock.querySelectorAll('.swatch').forEach(b => b.classList.toggle('on', b.dataset.color === c));
  }
  annoBtn.onclick = () => {
    annotate = !annotate;
    document.body.classList.toggle('annotating', annotate);
    annoBtn.classList.toggle('on', annotate);
    annoBtn.setAttribute('aria-pressed', String(annotate));
  };
  dock.querySelectorAll('.tool[data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
  dock.querySelectorAll('.swatch').forEach(b => b.onclick = () => setColor(b.dataset.color));
  document.getElementById('clearAll').onclick = () => {
    if(!Object.keys(strokes).length) return;
    if(confirm('Erase all annotations on every question?')){ strokes = {}; saveAnno(); render(); }
  };
  setTool('hi'); setColor('#F6C445');

  render();
</script>
