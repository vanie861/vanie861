automated test scripts and configuring continuous integration pipelines","B":"Expertise in formal test estimation techniques such as planning poker and function point analysis","C":"Ability to design comprehensive test plans that document all testing activities for the sprint","D":"Active listening and the ability to articulate testing concerns clearly to developers and the product owner during story discussions"},"a":["D"],"e":{"A":"Automated scripting and CI configuration are technical skills, not interpersonal competencies. The scenario describes a communication breakdown requiring collaborative conflict resolution, not a technical tooling deficiency. This option addresses a different dimension of the Agile tester skill profile than the one identified in the scenario.","B":"Estimation techniques are analytical skills applied during planning activities, not interpersonal skills used to resolve collaborative misunderstandings. The scenario requires communication and listening capability, not estimation proficiency. This option misidentifies the skill category needed to address the described situation.","C":"Test planning documentation is an analytical and organisational activity, not an interpersonal skill. Resolving a collaborative misunderstanding between a tester and developer requires communication-oriented people skills, not written planning artefacts. This option addresses a different aspect of the tester role than the interpersonal competency being assessed.","D":"Agile testers must possess strong interpersonal skills including active listening and clear communication to resolve scope ambiguities collaboratively with developers and product owners during story refinement and planning, as per reference section 2.3.1. These skills enable the tester to raise concerns constructively and align understanding without creating team friction. The other options either describe technical skills or misidentify the required interpersonal competency."}},{"q":"Match each tester activity in Column 1 with the Agile team role responsibility it supports in Column 2. Column 1: 1. Reviewing acceptance criteria during story refinement 2. Reporting defect trends from the current sprint 3. Contributing to the definition of done for user stories 4. Coaching team members on test techniques Column 2:","o":{"A":"1A, 2D, 3B, 4C","B":"1B, 2C, 3A, 4D","C":"1D, 2B, 3C, 4A","D":"1C, 2A, 3D, 4B"},"a":["D"],"e":{"A":"This mapping assigns defect trend reporting (2) to a role support function (D) inconsistent with its quality communication purpose and misplaces coaching (4) to an incorrect role dimension (C). Each tester activity maps to a specific team responsibility that this combination fails to reflect accurately. At least two assignments in this option produce incorrect pairings.","B":"This mapping assigns acceptance criteria review (1) to a role support function (B) that does not correspond to product quality clarity and misplaces the definition of done contribution (3) to an incorrect dimension (A). The correct mapping requires precise alignment between each activity and the team responsibility it serves. This combination introduces multiple misattributions.","C":"This mapping assigns acceptance criteria review (1) to an unrelated responsibility (D) and misplaces defect trend reporting (2) to a support function (B) inconsistent with its quality communication purpose. All four pairings in this option are incorrect relative to the responsibilities defined for Agile tester activities. This combination represents a systematic misalignment across all four items.","D":"Reviewing acceptance criteria (1) supports the product owner's clarity and story quality goals (C), reporting defect trends (2) informs the team's quality status visibility (A), contributing to the definition of done (3) establishes shared completion standards (D), and coaching team members on test techniques (4) builds collective testing capability within the team (B), as per reference section 2.3.2. Each activity maps uniquely to a distinct team responsibility dimension. The other combinations misassign at least one activity."}},{"q":"You are a tester on an Agile team that uses a task board to track sprint progress. The product owner asks how the task board helps communicate test progress during the sprint. Which statement BEST describes how a task board supports test progress tracking in an Agile project?","o":{"A":"Testing tasks appear on the task board only after development tasks are marked complete to preserve the sequential flow of work","B":"The task board provides a shared, visible representation of testing tasks in progress, completed, and blocked, enabling the team to identify testing bottlenecks in real time","C":"The task board replaces all written test status reports by providing sufficient visual information for formal stakeholder reporting","D":"The task board is used exclusively by the product owner to monitor whether acceptance criteria have been met for each story"},"a":["B"],"e":{"A":"Agile task boards are designed to reflect concurrent work across development and testing, not sequential phase completion. Restricting testing task visibility to post-development completion would reintroduce a sequential structure that contradicts the integrated Agile working model. This option misrepresents the task board as a phase-gated tracking tool.","B":"The task board is a key Agile communication tool that makes the state of all work items, including testing tasks, visible to the entire team, enabling immediate identification of blockages and progress gaps, as per reference section 2.2.1. This real-time visibility supports proactive team response to testing delays. The other options either limit the task board's function or misrepresent its role in test communication.","C":"While task boards provide team-level progress visibility, they do not replace formal stakeholder reporting mechanisms such as burndown charts, test summary reports, or sprint review presentations. Task boards are team coordination tools, not formal reporting artefacts. This option overstates the scope of the task board as a communication tool.","D":"The task board is a team-wide transparency tool accessible and relevant to all team members, not a product owner-exclusive monitoring instrument. Acceptance criteria verification is tracked through test results and definition of done completion, not solely through the task board. This option incorrectly restricts both the audience and purpose of the task board."}},{"q":"You are a tester on an Agile team using planning poker to estimate the testing effort for stories in the upcoming sprint. The sprint backlog includes a user authentication story, a data export feature, and a notification service. During the planning session, your initial estimate for the authentication story is significantly higher than the developer's estimate. Which action BEST reflects the correct application of planning poker for testing effort estimation in this situation?","o":{"A":"Explain the testing concerns that drove the higher estimate and re-estimate after the team discusses and aligns on the story's scope and risk","B":"Accept the developer's lower estimate immediately to avoid slowing down the planning session","C":"Escalate the estimation disagreement to the Scrum Master for a final decision on the correct estimate","D":"Average the developer's estimate and the tester's estimate mathematically and use the result as the final story point value"},"a":["A"],"e":{"A":"Planning poker requires team members who submit divergent estimates to explain their reasoning before a re-estimate is conducted, enabling the team to identify scope or risk misunderstandings and reach a shared, informed estimate, as per reference section 3.2.2. The tester's higher estimate may reflect testing complexity, acceptance criteria gaps, or integration risks not visible to the developer. Re-estimation after discussion produces a more accurate, risk-adjusted commitment.","B":"Accepting a divergent estimate without discussion bypasses the core value of planning poker, which is to surface and resolve differing assumptions about scope and complexity. Silent acceptance of a lower estimate may lead to under-allocation of testing effort and sprint commitment failure. Planning poker specifically requires discussion when estimates diverge significantly.","C":"Planning poker is a team-owned consensus technique; the Scrum Master's role is to facilitate process, not to arbitrate estimation disagreements. Estimation authority rests with the team members who will perform the work, and disagreements are resolved through discussion, not escalation. This option misassigns decision authority in the planning process.","D":"Mathematical averaging of divergent estimates does not resolve the underlying scope or risk misunderstanding that caused the divergence. Planning poker uses discussion-driven consensus to produce a shared understanding, not arithmetic compromise. Using an average would mask unresolved assumptions that could affect sprint delivery accuracy."}},{"q":"In the test pyramid model, which statement BEST describes the relationship between the levels of automated testing?","o":{"A":"Service and API tests form the largest base layer because they provide faster feedback than unit tests","B":"Unit tests form the largest base of the pyramid, service or API tests form the middle layer, and UI tests form the smallest apex","C":"UI tests form the largest base because they provide the most comprehensive coverage of user behaviour","D":"All three levels of the pyramid should contain equal numbers of automated tests to ensure balanced coverage"},"a":["B"],"e":{"A":"Unit tests form the base of the test pyramid and execute faster than API-level tests, making them the most suitable candidates for the largest layer. API tests occupy the middle position precisely because they are slower than unit tests but faster than UI tests. This option reverses the speed and volume relationship between the base and middle layers.","B":"The test pyramid model structures automated testing into three levels: a broad base of fast, stable unit tests; a middle layer of service or API tests; and a small apex of slower, more fragile UI tests, as per reference section 3.1.2. This structure recommends maximising automation at the lower levels and minimising GUI-level tests to optimise execution speed and stability. The other options either invert the pyramid or misrepresent its layer composition.","C":"The test pyramid model explicitly places UI tests at the apex, representing the smallest proportion of automated tests due to their higher maintenance cost and slower execution. Maximising UI tests contradicts the pyramid's efficiency rationale. This option inverts the pyramid structure.","D":"The test pyramid model prescribes an unequal, tapered distribution with far more unit tests than UI tests. Equal distribution across levels would defeat the pyramid's purpose of optimising feedback speed and test stability. This option misrepresent the pyramid as a symmetric model."}},{"q":"You are refining a user story with your team. The proposed story reads: \"As an administrator, I want to generate usage reports so that I can monitor system activity.\" During refinement, the team realises they cannot estimate the story because the reporting scope is entirely undefined. Which INVEST criterion is MOST at risk in this story due to the undefined scope preventing estimation?","o":{"A":"Small, because the story is too large to complete within a single sprint","B":"Estimable, because the team cannot size the story for sprint commitment without a defined reporting scope","C":"Valuable, because the story does not specify which stakeholders benefit from the reports","D":"Independent, because the story depends on other reporting features not yet defined"},"a":["B"],"e":{"A":"The stem does not indicate that the story is too large; it identifies undefined scope as the cause of estimation failure. The Small criterion addresses story size relative to sprint capacity, not the presence or absence of scope definition. This option conflates scope ambiguity with story size, which are distinct INVEST concerns.","B":"The Estimable criterion of INVEST requires that a story be understood well enough for the team to assign a relative size estimate for planning purposes, as per reference section 1.2.2. When reporting scope is entirely undefined, the team lacks the information needed to estimate effort, making sprint commitment impossible. The clarifying qualifier in the stem ensures Estimable is the unambiguous primary risk, distinguishing it from Testable.","C":"The story does include a stated value proposition: enabling the administrator to monitor system activity. While the value could be articulated more precisely, the stem identifies estimation incapacity as the primary failure symptom, not stakeholder benefit ambiguity. This option targets a different INVEST criterion than the one explicitly at risk.","D":"The stem does not indicate dependencies on other stories or features; the risk identified is the team's inability to estimate due to undefined scope. Independence concerns arise when a story cannot be developed without completion of another story, which is not the issue described. This option misattributes the failure symptom to a different INVEST dimension."}},{"q":"You are a tester on an Agile team that has completed five sprints. The regression test suite has grown significantly and now takes several hours to execute. A developer suggests disabling some regression tests to speed up the pipeline. Which response BEST explains why test automation is important for managing regression risk in this situation?","o":{"A":"Automated regression tests should be replaced with manual exploratory sessions each sprint to maintain testing freshness and avoid stale coverage","B":"Regression risk in Agile projects is managed by requiring developers to re-test all previously implemented stories manually before each sprint review","C":"The regression test suite should be archived at the end of each sprint and rebuilt from scratch to ensure tests remain aligned with the latest product state","D":"Automated regression tests enable the team to continuously verify existing functionality without increasing manual testing effort as the product grows across iterations"},"a":["D"],"e":{"A":"Replacing automated regression tests with manual exploratory sessions would fail to provide the repeatable, systematic coverage required to protect against regressions as the product grows. Exploratory testing complements automation by targeting new and uncertain areas, not by replacing repeatable regression verification. This option removes the efficiency benefit that automation provides for regression risk management.","B":"Requiring full manual re-testing of all implemented stories before each sprint review is impractical as the product grows and contradicts the purpose of automated regression suites. Manual regression testing cannot scale at the same rate as automated testing across multiple iterations. This option proposes a labour-intensive approach that automation is specifically designed to replace.","C":"Rebuilding the regression suite from scratch each sprint discards validated test coverage and defeats the cumulative quality protection that regression testing provides across iterations. The regression suite should evolve incrementally, with tests added for new features and retiring only those no longer relevant. This option misrepresents regression suite management as a periodic rebuild activity.","D":"The core value of automated regression testing in Agile is its ability to provide continuous verification of previously implemented features without proportionally increasing manual testing effort, which is essential as the codebase grows across multiple iterations, as per reference section 2.2.2. Disabling regression tests to improve speed removes the safety net protecting against undetected regressions. The other options either misstate the value of automation or propose approaches that increase quality risk."}},{"q":"You are working on an Agile team where all members, including testers and developers, share a common workspace. A manager proposes splitting the team across two office floors to accommodate growth. Which benefit of co-location and collaboration BEST supports keeping the team in a shared workspace?","o":{"A":"Shared workspace guarantees equal contribution from all team members regardless of role boundaries","B":"Co-location allows the team to bypass the product owner during sprint planning by self-organising story selection","C":"Co-location enables informal, real-time communication that reduces misunderstandings and accelerates defect resolution","D":"Co-located teams eliminate the need for sprint ceremonies since all coordination happens informally"},"a":["C"],"e":{"A":"Physical proximity does not automatically ensure equal contribution; team norms, facilitation, and role clarity are additional factors that influence collaborative balance. Co-location facilitates communication but does not govern contribution levels across roles. This option incorrectly attributes a behavioural guarantee to a physical arrangement.","B":"The product owner's participation in sprint planning is a Scrum requirement that co-location does not override. The product owner is responsible for backlog prioritisation and story selection input regardless of team proximity. This option misrepresents the product owner's role in the planning ceremony.","C":"Co-location supports the whole-team approach by enabling spontaneous, synchronous communication among all team members, which reduces the latency and misinterpretation risk associated with distributed working, as per reference section 1.1.2. Proximity allows testers and developers to resolve ambiguities and defects without scheduling delays. The other options either overstate co-location benefits or misattribute outcomes unrelated to the collaboration model.","D":"Sprint ceremonies serve structured purposes, including planning, review, and retrospective, that informal co-located communication cannot replace. Co-location enhances the effectiveness of these events but does not substitute for them. Eliminating ceremonies would remove the structured cadence that Agile frameworks require for team alignment."}},{"q":"You are a tester on an Agile team that uses a burndown chart to track sprint progress. At the midpoint of the sprint, the burndown chart shows that the remaining work is significantly above the ideal trend line. Which action BEST represents using the burndown chart as a test status communication tool in this situation?","o":{"A":"Raise the deviation as a testing impediment during the daily standup and propose adjusting scope or effort to align with the sprint goal","B":"Wait until the end of the sprint to review the burndown chart before deciding whether to report the deviation","C":"Update the burndown chart to reflect the ideal trend line by adjusting the baseline so the deviation is no longer visible","D":"Escalate the burndown deviation directly to the product owner and request that additional team members be added to the sprint"},"a":["A"],"e":{"A":"Burndown charts are used to communicate testing progress and product quality status, and a significant deviation from the ideal trend line at sprint midpoint should be raised as an impediment in the daily standup to enable team-level response, as per reference section 2.2.1. This action uses the chart as an active communication tool rather than a passive observation. The other options either defer action or misuse the burndown data.","B":"Waiting until sprint end to act on a midpoint deviation removes the opportunity for the team to adjust effort or scope in time to meet the sprint goal. Burndown charts are designed to provide real-time visibility that enables proactive response, not retrospective reporting. Deferring action on a visible negative trend undermines the communication purpose of the tool.","C":"Manipulating the baseline to eliminate visible deviation falsifies the team's progress status and removes the transparency that burndown charts are designed to provide. Accurate burndown data enables honest stakeholder communication and informed team decision-making. Altering the baseline to hide deviation is a quality reporting integrity failure.","D":"Escalating directly to the product owner and requesting resource additions bypasses the team's own problem-solving responsibility and daily standup communication mechanism. The first response to a burndown deviation is a team-level discussion to assess root cause and identify corrective options before escalation. Resource additions are a structural decision that requires broader consensus, not an immediate response to a midpoint trend deviation."}},{"q":"Which of the following BEST defines a test charter in the context of Agile exploratory testing?","o":{"A":"A comprehensive list of step-by-step test procedures to be followed during a scripted test session","B":"A report summarising the defects found and coverage achieved during a completed testing session","C":"A documented statement of the scope and mission that guides an exploratory testing session","D":"A formal test plan approved by the project manager before exploratory testing can begin"},"a":["C"],"e":{"A":"A test charter is specifically designed for exploratory testing, where tester judgement and adaptive investigation replace scripted step-by-step procedures. Detailed procedural scripts define scripted testing, not exploratory sessions. This option misidentifies the charter as a scripted test procedure, which contradicts its purpose.","B":"A test charter is a pre-session planning artefact that guides exploration, not a post-session reporting document. The session sheet or debrief note captures findings and coverage after the session completes. This option confuses a planning input with a reporting output.","C":"A test charter is defined as a statement of the scope, objectives, and mission that provides direction for an exploratory testing session without over-constraining the tester's investigation, as per reference section 3. This definition distinguishes the charter as a guiding artefact rather than a scripted test procedure. The other options describe unrelated test artefacts or misattribute the purpose of the charter.","D":"A test charter is a lightweight, tester-defined guiding statement, not a formally approved management document. Exploratory testing charters are created to direct individual sessions, not to satisfy project governance approval requirements. This option conflates a test charter with a formal test plan artefact."}}]},{"id":1,"title":"Practice Exam 2","questions":[{"q":"You are assessing quality risks for an upcoming sprint that includes a payment processing feature. The feature involves high transaction volume, integration with an external payment gateway, and a regulatory compliance requirement. How should you assess the quality risk for this feature?","o":{"A":"Delegate risk assessment to the product owner and focus testing effort only on areas they specify","B":"Evaluate both the likelihood of failure and the potential business impact to prioritize the most critical test areas for the sprint","C":"Assign equal testing effort to all features in the sprint without differentiating by risk level","D":"Assess only the technical complexity of the feature and ignore potential business consequences"},"a":["B"],"e":{"A":"Quality risk assessment is a collaborative activity involving the tester's professional judgement, not a product owner directive. Delegating risk identification entirely to the product owner removes the tester's technical risk perspective from the assessment. The tester must independently assess and communicate risks, not merely respond to owner-specified areas.","B":"Quality risk assessment in Agile requires evaluating both the likelihood of a defect occurring and the severity of its business impact, as per reference section 3.2.1. Applying both dimensions to the payment processing feature, which carries high transaction volume, integration complexity, and regulatory exposure, enables prioritized and risk-proportionate testing. The other options apply only one dimension or mischaracterize the assessment approach.","C":"Equal effort allocation ignores the differential risk profiles of features and misuses available testing capacity. Risk-based testing explicitly requires effort to be proportional to assessed risk level. Applying uniform effort to all features is a risk-neutral approach inconsistent with quality risk assessment principles.","D":"Quality risk assessment requires evaluation of both technical failure likelihood and business impact. Considering only technical complexity without assessing business consequences produces an incomplete risk picture that may underprioritize high-impact failure scenarios. This option applies a one-dimensional assessment method."}},{"q":"You are a tester facilitating an ATDD specification workshop for a user story covering an online booking cancellation feature. The product owner, a developer, and you are participating. During the workshop, the team is working through the specification process. Which action BEST reflects the correct ATDD specification workshop process for this story?","o":{"A":"Ask the product owner to write all acceptance tests independently and share them with the team after the workshop","B":"Defer the definition of acceptance examples until the first iteration review to ensure they reflect the actual implemented behaviour","C":"Collaboratively define concrete examples of expected system behaviour that will serve as the basis for executable acceptance tests before development begins","D":"Allow the developer to implement the feature first and then ask the product owner to review the output against their expectations"},"a":["C"],"e":{"A":"ATDD requires collaborative example creation involving all three roles simultaneously; independent authorship by the product owner bypasses the shared understanding that the workshop is designed to produce. Independently written tests may not reflect the technical constraints identified by the developer or the testing perspective contributed by the tester.","B":"Acceptance examples in ATDD must be defined before development begins, not after implementation. Deferring example definition until the iteration review converts ATDD into a post-development validation activity, eliminating its primary benefit of aligning expectations upfront. This option fundamentally inverts the ATDD process sequence.","C":"The ATDD specification workshop process requires the team to collaboratively produce concrete examples of expected behaviour that are transformed into executable acceptance tests prior to feature development, as per reference section 3.3.3. This shared example creation aligns the understanding of all three roles before coding starts. The other options either defer collaboration or reassign the example creation responsibility incorrectly.","D":"Developing the feature before defining executable acceptance tests contradicts the test-first principle of ATDD. The specification workshop must produce agreed acceptance examples before development begins, not after. This option describes a post-development review, not an ATDD workshop process."}},{"q":"Which of the following BEST describes the purpose of configuration management tools used by Agile teams?","o":{"A":"To visualise team workflow and manage work-in-progress limits across active sprint tasks","B":"To generate and maintain automated test reports summarising pass and fail outcomes across sprints","C":"To track and control changes to source code, test scripts, and other project artefacts across iterations","D":"To automate the scheduling and execution of test cases within the continuous integration pipeline"},"a":["C"],"e":{"A":"Visualizing workflow and managing WIP limits are functions of task management or Kanban tools, not configuration management tools. Configuration management is concerned with artefact versioning and change control, not workflow visibility. This option describes a project tracking tool, not a configuration management tool.","B":"Test reporting and results aggregation are functions of test management or reporting tools, not configuration management tools. Configuration management tools are designed for artefact version control and change tracking. This option misidentifies the purpose and capability of configuration management tooling.","C":"Configuration management tools in Agile projects are used to track and control changes to source code, test scripts, and related project artefacts, enabling teams to manage versions and maintain artefact integrity across iterations, as per reference section 3.4.1. These tools support traceability and collaboration across the team. The other options describe unrelated tool categories or misattribute the purpose of configuration management.","D":"Test execution scheduling and automation within CI pipelines is the responsibility of build automation and test runner tools, not configuration management tools. Configuration management tools focus on version control and change tracking, not test orchestration. This option conflates two distinct tool categories."}},{"q":"Match each tester activity in Column 1 with the planning event it belongs to in Column 2. Column 1: 1. Estimating testing effort for stories selected for the iteration 2. Defining the overall test approach for the upcoming release 3. Clarifying acceptance criteria for stories scheduled in the sprint 4. Identifying product risks that affect release scope Column 2:","o":{"A":"1A, 2B, 3C, 4D","B":"1B, 2D, 3A, 4C","C":"1C, 2A, 3B, 4D","D":"1D, 2C, 3B, 4A"},"a":["C"],"e":{"A":"This mapping assigns effort estimation (1) to release planning strategy (A), which is incorrect since effort estimation for individual stories occurs during iteration planning. Defining the test approach (2) is incorrectly mapped to iteration planning story review (B). The remaining assignments are also misaligned with the appropriate planning events. This combination reflects a misunderstanding of tester responsibilities at each planning level.","B":"This mapping incorrectly associates defining the test approach (2) with iteration planning story review (D) rather than release planning, and misplaces risk identification (4) to iteration planning effort allocation (C) rather than release planning. Tester activities must be matched to the planning horizon where they deliver value. This combination reverses several key mappings.","C":"Estimating testing effort for iteration stories (1) maps to iteration planning effort allocation (C), defining the overall test approach (2) maps to release planning strategy (A), clarifying acceptance criteria for sprint stories (3) maps to iteration planning story review (B), and identifying product risks (4) maps to release planning risk identification (D), as per reference section 1.2.5. Each activity aligns precisely with the planning horizon at which testers contribute. The other combinations misassign activities to the wrong planning events.","D":"This mapping assigns effort estimation (1) to release-level risk identification (D) and misaligns the test approach definition (2) with iteration planning effort allocation (C). The correct mapping requires matching each tester activity to its appropriate planning scope, which this option fails to achieve. Each assignment in this option is factually incorrect."}},{"q":"Which of the following activities BEST represents the value a tester adds during release planning?","o":{"A":"Executing regression tests to confirm previously working features remain stable","B":"Updating the test automation suite to reflect newly implemented features","C":"Identifying testable product risks and defining the overall test approach for the release","D":"Writing detailed test cases for each user story selected in the iteration"},"a":["C"],"e":{"A":"Regression test execution is a test execution activity that occurs during or after an iteration, not during release planning. Release planning is a forward-looking activity concerned with scope, risk, and strategy. Execution activities are outside the scope of planning events.","B":"Updating automation artefacts is a within-iteration technical task, not a release planning contribution. Release planning addresses strategic test concerns rather than tactical test maintenance activities. This option describes an operational task unrelated to the planning horizon.","C":"During release planning, testers contribute by identifying product risks and establishing the overall test approach, as per reference section 1.2.5. This activity directly influences scope and risk management decisions at the release level. The other options either describe iteration-level activities or responsibilities outside the tester role.","D":"Writing detailed test cases for individual user stories is an iteration-level activity, not a release planning contribution. Release planning operates at a higher scope and focuses on risk, strategy, and overall test approach rather than story-level test design. This option conflates release and iteration planning responsibilities."}},{"q":"You are a tester embedded in a Scrum team that is midway through a sprint. The development team has completed the first user story and is ready to hand it over. You notice that no acceptance criteria were reviewed with the product owner before development began. Which action BEST reflects Scrum tester teamwork best practices in this situation?","o":{"A":"Proceed with testing the story using your own judgement to infer the intended acceptance conditions","B":"Notify the product owner by email and wait for written acceptance criteria before performing any testing activity","C":"Ask the development team to write the acceptance criteria independently and review them after the next standup","D":"Raise the missing acceptance criteria review as an impediment and collaborate with the product owner and developer to define and agree on acceptance conditions before testing begins"},"a":["D"],"e":{"A":"Inferring acceptance conditions without product owner alignment introduces significant risk of testing against incorrect assumptions. Tester-defined acceptance conditions without business validation do not satisfy the collaborative test confirmation required in Agile. This approach may produce passing tests for a story that does not meet the actual business need.","B":"Waiting passively for written criteria without engaging collaboratively contradicts the whole-team interaction model. Agile teamwork requires active, in-person or synchronous collaboration on acceptance conditions, not sequential handoffs. This option introduces unnecessary delay and bypasses the face-to-face collaboration that Scrum promotes.","C":"Acceptance criteria definition is a shared responsibility requiring product owner input, not a developer-only task. Developer-authored acceptance criteria without product owner validation may not reflect the intended business value. This option removes the business perspective from the acceptance criteria discussion.","D":"The Scrum tester best practice requires collaborative acceptance criteria definition before testing and development proceed, as per reference section 3.1.4. Raising the gap as an impediment and involving both the product owner and developer follows the whole-team responsibility model and prevents testing against undefined or incorrect expectations. The other options either bypass the collaboration requirement or defer the problem."}},{"q":"You are a tester participating in a sprint retrospective. The team is identifying test-related process improvements from the last iteration. Which TWO of the following actions are appropriate test-related retrospective improvement decisions? (Select TWO)","o":{"A":"Requesting that the product owner write all test cases for the next sprint to reduce tester workload","B":"Proposing that the team skip the daily standup to allocate more time for test execution","C":"Deciding to automate a set of frequently failing manual regression tests to reduce execution time","D":"Adding a peer review step for test cases before they are executed in the next sprint"},"a":["C","D"],"e":{"A":"Assigning test case authorship to the product owner misrepresents both their role and the tester's responsibility within an Agile team. Retrospective improvements should enhance team collaboration and process quality, not redistribute core testing responsibilities inappropriately. This option reflects a misunderstanding of role boundaries in Agile.","B":"The daily standup is a core Agile ceremony supporting team synchronization and impediment identification, and removing it to gain execution time would harm team coordination. Retrospective improvements should optimize process without eliminating essential collaboration events. This option trades long-term team health for a short-term time gain.","C":"Automating frequently failing regression tests is a measurable process improvement targeting test efficiency and regression risk, as per reference section 1.2.3. This decision addresses a recurring pain point identified in the retrospective and improves the team's ability to maintain quality across iterations. It is a valid test-related improvement action.","D":"Introducing a peer review step for test cases is a concrete, actionable process improvement that directly addresses test quality within the team's control, as per reference section 1.2.3. This improvement reduces defects in test design and increases the reliability of test execution. It is a specific, implementable change arising from retrospective reflection."}},{"q":"You are a tester on a team that has recently adopted the power of three collaboration model. During backlog refinement, the product owner, developer, and tester review a new user story together. Which outcome BEST demonstrates the advantage of this whole-team approach?","o":{"A":"Acceptance criteria are collaboratively defined, reducing misunderstandings before development begins","B":"The tester assumes sole responsibility for defining the acceptance criteria independently","C":"The developer writes all test cases prior to the product owner reviewing requirements","D":"The product owner finalizes requirements independently before the tester joins the discussion"},"a":["A"],"e":{"A":"The power of three brings together the product owner, developer, and tester to collaboratively define acceptance criteria, as per reference section 1.1.2. This collaboration reduces ambiguity and prevents defects from entering development by aligning understanding before work starts. The other options describe outcomes that are either unrelated to this model or misattribute its benefit.","B":"The power of three model specifically requires collaborative input from all three roles, not independent work by the tester alone. Sole tester ownership of acceptance criteria would undermine the shared quality responsibility that the whole-team approach promotes. This option contradicts the fundamental intent of the collaboration model.","C":"This describes a sequential, role-isolated approach inconsistent with the whole-team quality responsibility model. The power of three requires simultaneous input from all three roles during the same session. Pre-writing test cases before collaborative review bypasses the shared understanding the model is designed to achieve.","D":"Excluding the tester from early requirements discussion negates the collaborative advantage of the whole-team approach. The power of three model requires all three roles to participate simultaneously during story review. Delayed tester involvement leads to the same ambiguity and defect injection risks that the model is designed to prevent."}},{"q":"You are a tester on an Agile team that wants to improve product quality using test metrics. Your team currently tracks only defect counts per sprint. A test lead suggests adding metrics that better reflect product quality trends. Which metric BEST supports product quality improvement decisions in an Agile project?","o":{"A":"Average sprint velocity across the last three iterations","B":"Number of user stories completed per tester per iteration","C":"Defect detection percentage across test levels, showing the proportion of defects found before release","D":"Total number of test cases executed per sprint, regardless of pass or fail outcome"},"a":["C"],"e":{"A":"Sprint velocity measures team delivery throughput, not product quality. While velocity is useful for planning purposes, it does not reflect defect trends, test effectiveness, or quality status. Using velocity as a quality improvement metric conflates delivery speed with quality outcomes.","B":"Stories completed per tester measures individual productivity rather than product quality. Quality improvement decisions require metrics that reveal defect patterns, test coverage gaps, or risk reduction trends. Productivity metrics do not provide the diagnostic information needed to guide quality improvements.","C":"Defect detection percentage across test levels reveals how effectively the team is identifying defects early in the process, which directly supports quality improvement decisions, as per reference section 2.2.1. This metric highlights whether defects are escaping to later stages and informs targeted process improvements. The other options either measure activity volume without quality insight or track metrics unrelated to product quality trends.","D":"Execution count without pass or fail outcome data provides no meaningful insight into product quality or defect trends. A high test execution count with unknown outcomes does not indicate whether quality is improving or declining. This metric measures testing activity volume, not quality effectiveness."}},{"q":"Your Scrum team is planning the next sprint. The product owner, developers, and tester are reviewing user stories together. A developer suggests that quality should be verified only after coding is complete. Which response BEST reflects the whole-team quality responsibility principle?","o":{"A":"Developers are responsible for unit testing while testers are responsible for all other quality checks","B":"Quality is a shared responsibility, and testing activities should begin as soon as stories are ready for refinement","C":"The tester should wait until the development team marks stories as complete before beginning any testing","D":"Quality assurance is the exclusive responsibility of the tester assigned to the sprint"},"a":["B"],"e":{"A":"This option divides quality into siloed role-based responsibilities, which contradicts the whole-team approach. While developers do write unit tests, quality responsibility in the whole-team model is not partitioned by role but shared collectively. This role-based division replicates a sequential mindset inconsistent with Agile principles.","B":"The whole-team approach establishes that quality is the collective responsibility of every team member, not a phase-gated activity owned by developers alone, as per reference section 1.1.2. Testing activities such as reviewing acceptance criteria and clarifying ambiguities begin during refinement, before development starts. The other options restrict quality responsibility to specific roles or phases, contradicting this principle.","C":"Waiting until development completion before testing begins is a sequential, phase-gated approach that contradicts the whole-team quality model. The whole-team approach requires testers to engage early, including during story refinement and sprint planning. Late-stage testing increases the cost and complexity of defect resolution.","D":"Assigning quality responsibility to a single tester contradicts the whole-team quality principle, which distributes ownership across all team members. In Agile projects, every team member, including developers and the product owner, contributes to quality outcomes. Isolating quality ownership increases risk and reduces collaboration."}},{"q":"You are a tester designing test cases for a user story that describes a discount calculation feature. The story states that customers who spend between fifty and one hundred units receive a ten percent discount, while customers who spend above one hundred units receive a twenty percent discount. Customers spending below fifty units receive no discount. Using equivalence partitioning and boundary value analysis, which test case set BEST covers both the partition boundaries and representative values for this feature?","o":{"A":"Test only with values exactly at the mid-point of each discount tier to confirm the correct percentage is applied","B":"Test with a single value from each discount tier and skip values at or near the partition boundaries","C":"Test all integer values between zero and one hundred and fifty to ensure complete functional coverage","D":"Test with values 49, 50, 100, 101 and a representative mid-partition value such as 75 to cover boundaries and partition representatives"},"a":["D"],"e":{"A":"Testing only mid-partition values applies equivalence partitioning without boundary value analysis. Boundaries between partitions are the locations where defects are most frequently introduced, and omitting boundary values produces an incomplete test set. This option addresses partition coverage but neglects the boundary testing requirement.","B":"Skipping boundary values omits the test conditions most likely to reveal defects in the boundary logic. Boundary value analysis specifically targets the edges between partitions, where off-by-one errors and range definition defects are most common. This option applies equivalence partitioning alone without the complementary boundary coverage.","C":"Exhaustive testing of all input values is impractical and unnecessary when equivalence partitioning and boundary value analysis can provide equivalent defect detection coverage with a substantially smaller, targeted test set. This option ignores both techniques and proposes exhaustive input testing, which contradicts the purpose of partition-based and boundary-based test design.","D":"Boundary value analysis requires testing at and around the boundaries between partitions, and equivalence partitioning requires at least one representative value per identified partition, as per reference section 3.3.4. Values 49 and 50 cover the lower boundary, 100 and 101 cover the upper boundary, and 75 represents the middle partition. This combination satisfies both techniques for the described discount structure."}},{"q":"Which of the following lists contains practices associated with Extreme Programming?","o":{"A":"Sprint planning, daily standup, sprint review, sprint retrospective","B":"Kanban boards, work-in-progress limits, flow metrics, cumulative flow diagrams","C":"Release planning, product backlog, user story mapping, velocity tracking","D":"Test-driven development, pair programming, continuous integration, refactoring"},"a":["D"],"e":{"A":"These four activities are Scrum ceremonies, not Extreme Programming practices. XP focuses on engineering practices rather than on iterative planning events. Attributing Scrum ceremonies to XP represents a common framework misconception.","B":"These are Kanban practices associated with visualizing workflow and managing flow, not Extreme Programming. XP is defined by technical engineering disciplines, not flow-based visualisation tools. These practices belong to a different Agile approach entirely.","C":"Release planning, product backlog management, and velocity tracking are primarily associated with Scrum and general Agile planning, not specifically with Extreme Programming. XP emphasizes coding and testing disciplines rather than planning artefacts.","D":"Test-driven development, pair programming, continuous integration, and refactoring are all established Extreme Programming practices, as per reference section 1.2.1. These practices collectively support frequent delivery, code quality, and collaborative development. The other options include practices from unrelated or misattributed frameworks."}},{"q":"Which of the following BEST defines regression testing in the context of Agile testing?","o":{"A":"Analysing test results to identify the root cause of a defect introduced in the most recent build","B":"Re-running tests on previously validated functionality to confirm that new changes have not introduced unintended defects","C":"Testing newly added features in the current sprint to confirm they meet acceptance criteria","D":"Measuring the performance characteristics of the system under simulated production load conditions"},"a":["B"],"e":{"A":"Root cause analysis of defects is a defect investigation activity, not regression testing. Regression testing is a proactive re-execution activity designed to detect unintended changes, not a diagnostic activity following defect identification. This option describes a different quality assurance activity.","B":"Regression testing involves re-executing tests on stable, previously tested features to verify that recent changes have not broken existing functionality, as per reference section 3. This definition aligns with the CTFL-AT keyword definition and supports the continuous quality assurance practice in Agile iterations. The other options describe unrelated test types or misstate the regression testing purpose.","C":"Testing new features against acceptance criteria describes confirmation testing or acceptance testing, not regression testing. Regression testing focuses specifically on existing, previously validated functionality rather than new feature verification. This option conflates two distinct test purposes.","D":"Performance testing under load is a non-functional test type, not regression testing. Regression testing targets functional correctness of existing behaviour after changes. This option describes an entirely different test objective and technique."}},{"q":"Which of the following BEST describes the collaborative approach used in acceptance test-driven development?","o":{"A":"Business representatives, developers, and testers collaboratively define acceptance tests before development of the corresponding feature begins","B":"Developers write unit tests after completing the implementation to confirm the code meets technical specifications","C":"The tester independently creates acceptance tests at the end of the sprint without developer or business input","D":"Business representatives approve completed test results after each sprint to confirm acceptance criteria are met"},"a":["A"],"e":{"A":"Acceptance test-driven development is defined by the collaborative creation of acceptance tests by business representatives, developers, and testers prior to feature implementation, as per reference section 3.1.1. This shared upfront agreement on testable acceptance conditions drives both development and verification. The other options either restrict collaboration to fewer roles or misorder the development and test activities.","B":"Writing tests after implementation describes a post-development verification approach, not acceptance test-driven development. ATDD specifically requires tests to be defined before development begins. This option describes a reactive test approach, not the proactive collaborative model that ATDD mandates.","C":"Independent test creation without collaboration contradicts the defining characteristic of ATDD, which requires joint participation from business representatives, developers, and testers. ATDD is explicitly a collaborative practice, and excluding any of the three roles undermines its purpose. This option describes isolated test design, not ATDD.","D":"Business approval of test results after development is a review activity, not ATDD. ATDD requires collaborative definition of acceptance tests before implementation, not post-development review of results. This option describes a sign-off practice rather than a collaborative test-first approach."}},{"q":"You are a tester assigned to a scaled Agile program where your organization is considering forming a separate independent test team to review sprint outputs. A senior tester asks you to describe the role of independent testing in this context. Which statement BEST explains when a separate independent test team is appropriate in an Agile project?","o":{"A":"A separate independent test team is most appropriate for evaluating product quality at the system level, particularly when objectivity cannot be ensured within the development team","B":"A separate independent test team should replace the embedded tester role in every Agile team to ensure impartiality","C":"An independent test team is required for every sprint to ensure that the definition of done is met","D":"Independent testing should be avoided in Agile projects as it contradicts the whole-team quality principle"},"a":["A"],"e":{"A":"Independent testing in Agile is best suited to system-level evaluation where objectivity and impartiality are required and cannot be sufficiently achieved by the embedded team, as per reference section 2.1.3. Independent testers provide an external perspective that reduces confirmation bias in high-stakes quality assessments. The other options either misapply the independent testing role or contradict its purpose.","B":"Independent testing is intended to complement, not replace, the tester role within the Agile team. Removing embedded testers in favour of an entirely independent team would reduce the early and continuous testing involvement that Agile requires. Independent testing is an additional quality layer, not a substitution for the embedded role.","C":"The definition of done is a shared team responsibility verified by the embedded team, not a mandatory function of a separate independent test team. Requiring independent review for every sprint would introduce overhead inconsistent with Agile cadence and whole-team quality ownership. This option misattributes the DoD verification responsibility.","D":"Independent testing is a recognized and appropriate practice in Agile contexts, particularly for system-level evaluation where objectivity is required. Its use does not contradict the whole-team quality principle when applied at the correct scope. This option presents an absolute prohibition not supported by the CTFL-AT syllabus."}},{"q":"Which of the following BEST describes a core value stated in the Agile Manifesto?","o":{"A":"Processes and tools over individuals and interactions","B":"Comprehensive documentation over working software","C":"Contract negotiation over customer collaboration","D":"Individuals and interactions over processes and tools"},"a":["D"],"e":{"A":"This statement directly inverts the Agile Manifesto value, which prioritizes individuals and interactions instead. The manifesto explicitly deprioritizes processes and tools relative to human collaboration. The correct value places people and communication first, not procedural or tooling constraints.","B":"The Agile Manifesto values working software over comprehensive documentation, not the reverse. This option represents the traditional, sequential approach that Agile was designed to challenge. The manifesto acknowledges documentation has value but treats working software as the higher priority.","C":"The Agile Manifesto values customer collaboration over contract negotiation, not the reverse. This option inverts the stated manifesto value by elevating contractual formality above ongoing stakeholder engagement. The correct value emphasizes continuous collaboration with customers throughout development.","D":"The Agile Manifesto explicitly states \"Individuals and interactions over processes and tools\" as one of its four core value statements, as per reference section 1.1.1. This value prioritizes human collaboration and communication above rigid adherence to defined processes or tooling. The remaining options either misquote or invert the manifesto values, making them factually incorrect."}},{"q":"You are a tester on an Agile team that has just completed a four-week sprint. The team is preparing to hold a retrospective. A new team member asks when the retrospective should occur and who should attend. Which response BEST describes retrospective timing and participation in an Agile project?","o":{"A":"The retrospective is conducted before sprint planning to prepare the team for the next iteration","B":"Only testers and developers attend the retrospective since quality and code are the primary discussion topics","C":"The retrospective is held at the end of each iteration and includes all team members to review process and identify improvements","D":"The retrospective is held only at the end of the final release and is attended exclusively by the project manager"},"a":["C"],"e":{"A":"Retrospectives occur after sprint completion and before or alongside the next sprint planning event, not as a preparatory activity before planning. Positioning the retrospective before planning misrepresents the intended ceremony sequence in Agile. The retrospective reflects on the completed iteration, not the upcoming one.","B":"Retrospectives are whole-team events covering all aspects of the team's process, not solely quality and code. Excluding the product owner and other team members reduces the perspective available for process improvement. The retrospective is a collective improvement ceremony, not a technical role-specific debrief.","C":"Retrospectives are conducted at the end of each iteration with full team participation, enabling collective process review and continuous improvement, as per reference section 1.2.3. All team members, including testers, developers, and the product owner, contribute to identifying what worked well and what should change. The other options either restrict participation or misplace the timing of the retrospective.","D":"Limiting retrospectives to release end eliminates the iterative improvement benefit that makes retrospectives valuable in Agile. Restricting attendance to the project manager excludes the team members whose practices and collaboration are the subject of the review. This option describes a waterfall-style post-project review, not an Agile retrospective."}},{"q":"You are a tester joining a team that previously worked in a sequential lifecycle. Your new team uses Agile iterations. A colleague notes that test levels seem to overlap on the Agile project. Which statement BEST explains why test levels overlap in Agile projects compared to a sequential lifecycle?","o":{"A":"Agile projects eliminate integration testing entirely by relying on continuous deployment pipelines","B":"Sequential lifecycles allow test levels to overlap because all testing is performed in a single phase","C":"Agile projects require testers to complete all test levels before development begins in each iteration","D":"In Agile projects, unit, integration, and system testing activities occur concurrently within the same iteration rather than in defined sequential phases"},"a":["D"],"e":{"A":"Integration testing remains a relevant and actively performed test level in Agile projects; it is not eliminated by continuous delivery practices. Continuous integration pipelines may automate some integration checks, but they do not replace the integration testing level. This option incorrectly equates pipeline automation with the removal of a test level.","B":"Sequential lifecycles are specifically characterized by separate, non-overlapping test phases with defined entry and exit criteria. Overlapping test levels is a characteristic of Agile, not sequential development. This option reverses the defining characteristic of each lifecycle type.","C":"Testing in Agile projects runs concurrently with development within each iteration rather than preceding it. Requiring all test levels to be completed before development contradicts the parallel, collaborative nature of Agile development and testing. This option misrepresents the integration of development and testing activities in Agile.","D":"Agile development integrates testing across levels within each iteration, allowing unit, integration, and system testing to overlap rather than following a strict sequential order, as per reference section 2.1.1. This overlap supports faster feedback and continuous quality validation. In sequential lifecycles, each test level is a distinct phase with defined entry and exit criteria."}},{"q":"You are a tester applying session-based test management to support exploratory testing of a newly released payment workflow feature. Which TWO of the following actions are consistent with the session-based test management approach? (Select TWO)","o":{"A":"Record findings, coverage, and session duration in a session sheet to support debrief and reporting after the session completes","B":"Define a test charter before the session that specifies the scope, mission, and areas to investigate during the exploratory testing session","C":"Extend the session indefinitely until all possible test scenarios for the feature have been exhausted","D":"Follow a pre-written, step-by-step scripted test procedure for every action taken during the session to ensure repeatability"},"a":["A","B"],"e":{"A":"Session-based test management requires testers to document their findings, coverage achieved, and time spent in a session sheet, which is used during a structured debrief to communicate results and inform subsequent sessions, as per reference section 3.3.5. This documentation practice provides accountability and traceability for exploratory testing activities. It is the primary reporting mechanism of the approach.","B":"Session-based test management requires each exploratory testing session to be guided by a predefined charter that establishes the mission, scope, and investigation focus, as per reference section 3.3.5. The charter provides structure without over-constraining the tester's exploration, enabling both freedom and accountability. This action is a foundational practice of the session-based approach.","C":"Session-based test management defines time-boxed sessions with a clear start and end, preventing indefinite exploration. Time-boxing is a core structural element of the approach that enables planning, comparison across sessions, and structured debriefs. Open-ended sessions without time boundaries contradict the session-based management structure.","D":"Following fully scripted procedures transforms an exploratory session into scripted testing, eliminating the adaptive and investigative nature that defines exploratory testing. Session-based test management provides a charter for guidance but relies on the tester's judgement and creative exploration within that scope. Scripted step-by-step procedures are incompatible with the exploratory testing approach."}},{"q":"You are a tester who has recently joined an Agile team from a traditional testing background. Your manager identifies that testers transitioning to Agile environments face specific organizational risks. Which TWO of the following represent recognized organizational risks for testers working in Agile teams? (Select TWO)","o":{"A":"Testers may face pressure to reduce testing effort to meet sprint velocity targets, compromising quality","B":"Testers assigned long-term to a single Agile team may gradually lose the independence needed for objective defect detection","C":"Testers who write automated tests will always introduce more defects than they detect","D":"Testers in Agile teams are at risk of acquiring too many technical skills, reducing their focus on business testing"},"a":["A","B"],"e":{"A":"Velocity pressure is a recognized organizational risk in Agile teams where testers may be expected to sacrifice thoroughness to keep pace with development speed, as per reference section 2.3.2. This risk directly threatens the independence and rigour that effective testing requires. Acknowledging this risk enables teams to establish protective norms around testing time allocation.","B":"Long-term assignment to one team creates alignment risk where testers adopt the team's perspective and reduce their critical objectivity, as per reference section 2.3.2. This is a specific organizational risk that can reduce the effectiveness of defect identification over time. Rotation or independent review mechanisms are recommended to mitigate this risk.","C":"This statement is factually unsupported and does not represent a recognized organizational risk in the CTFL-AT syllabus. Automated test authorship by testers is encouraged in Agile contexts and does not inherently introduce defects. This option presents a misleading and unsubstantiated claim.","D":"Technical skill development for Agile testers is explicitly encouraged in the syllabus, and there is no documented risk of testers becoming over-skilled in technical areas at the expense of business testing. This option inverts the actual skill development guidance and presents a non-existent risk."}},{"q":"Your Agile team uses a wiki dashboard and daily standups to communicate test status. Consider the following statements about these communication tools: I. Wiki dashboards provide a persistent, shared view of test progress accessible to all stakeholders. II. Daily standups replace the need for any written test status reporting in Agile projects. III. Wiki dashboards can display automated test results, defect counts, and coverage metrics. IV. Daily standups are used to raise test impediments and synchronize the team on testing progress. Which of the following statements are CORRECT?","o":{"A":"I and II only","B":"II and IV only","C":"I and IV only","D":"I, III, and IV"},"a":["D"],"e":{"A":"Statement II is false; daily standups do not eliminate the need for written test status reporting in Agile projects. Wiki dashboards and other written communication artefacts remain valuable for asynchronous stakeholder visibility. Selecting this combination accepts an incorrect statement and omits the valid statement IV.","B":"Statement II incorrectly claims that daily standups replace written reporting, which contradicts the CTFL-AT guidance on using multiple communication tools in combination. Statement IV is correct, but pairing it with the incorrect statement II produces an invalid combination. This option requires accepting a false premise to justify the selection.","C":"This combination excludes statement III, which is a valid description of wiki dashboard capabilities including display of automated test results, defect counts, and coverage metrics. All three statements I, III, and IV are correct, and omitting statement III produces an incomplete and therefore incorrect answer.","D":"Wiki dashboards provide persistent, visible test progress data accessible to all stakeholders, can display automated metrics including test results and coverage, and daily standups enable impediment escalation and team synchronization on testing progress, as per reference section 2.2.1. Statement II is incorrect because standups complement written communication rather than replacing it. These three statements accurately reflect how Agile teams use dashboards and standups together."}},{"q":"You are reviewing your Agile team's regression test suite before the start of a new sprint. Several test cases were written for user stories implemented two iterations ago. A colleague suggests all tests should be retained permanently. Which action BEST reflects sound test case retirement and relevance review practice in Agile projects?","o":{"A":"Replace all existing test cases at the start of each sprint to ensure tests reflect the latest sprint content","B":"Archive all test cases from previous iterations without review and reactivate them only when defects are reported","C":"Periodically assess each test case for continued relevance and retire those that no longer reflect current product behaviour","D":"Retain all test cases permanently to ensure maximum historical coverage across all iterations"},"a":["C"],"e":{"A":"Replacing all test cases each sprint discards valid regression coverage for previously implemented functionality. Regression testing depends on retaining tests for stable features to detect unintended changes. Wholesale replacement each sprint eliminates the regression protection that the suite provides.","B":"Archiving without review defers the relevance assessment that is necessary for effective suite management. Reactivating tests only after defect reports is a reactive approach that misses the proactive regression risk management that periodic review provides. This option does not satisfy the standard for ongoing test case maintenance in Agile projects.","C":"Test cases in Agile projects must be reviewed regularly to confirm they still reflect the current product state, and those that no longer apply should be retired to prevent suite bloat and misleading results, as per reference section 2.2.2. Retaining all tests permanently introduces maintenance overhead and execution noise without quality benefit. The other options either delay review or apply blanket retention policies that conflict with sound test management.","D":"Retaining all tests regardless of current relevance leads to suite bloat, increased execution time, and misleading quality signals from tests that no longer reflect the product. Test suite management requires ongoing relevance review, not permanent retention. This option prioritizes historical coverage over current test accuracy and efficiency."}},{"q":"You are a tester joining an Agile team. The team lead explains that testers in Agile require a combination of skills beyond traditional test execution. Which combination of skills BEST reflects the technical and automation capabilities expected of a tester in an Agile team?","o":{"A":"Ability to write and maintain automated tests, understanding of build and integration tools, and basic coding proficiency","B":"Expertise in project budget management, resource allocation, and release scheduling","C":"Proficiency in writing business requirements, managing the product backlog, and facilitating sprint planning","D":"Skills in stakeholder relationship management, contract negotiation, and service-level agreement review"},"a":["A"],"e":{"A":"Agile testers are expected to possess technical skills including automated test authorship and maintenance, familiarity with build and integration tooling, and sufficient coding ability to collaborate effectively with developers, as per reference section 2.3.1. These skills enable testers to contribute across the iteration without creating bottlenecks. The other options either describe non-technical skills or misattribute responsibilities to the tester role.","B":"Budget management, resource allocation, and release scheduling are project management responsibilities, not tester competencies in an Agile team. Technical and automation skills are the relevant capability dimension for Agile testers described in section 2.3.1. This option misidentifies the skill category being assessed.","C":"Backlog management and sprint planning facilitation are product owner and Scrum Master responsibilities, not core tester technical skills. While testers contribute to planning activities, they do not own these facilitation functions. This option conflates planning role responsibilities with tester technical competencies.","D":"These are commercial and governance skills unrelated to the technical and automation capabilities described for Agile testers. The technical skill profile for Agile testers focuses on test automation, tooling integration, and coding proficiency. This option describes a project or commercial management role, not a tester role."}},{"q":"Which of the following is one of the twelve principles behind the Agile Manifesto?","o":{"A":"Assign testing responsibilities exclusively to a dedicated quality assurance team","B":"Maximize the amount of work done to ensure complete product coverage","C":"Deliver working software frequently, with a preference for a shorter timescale","D":"Freeze requirements at the start of each iteration to ensure delivery stability"},"a":["C"],"e":{"A":"Agile principles promote whole-team responsibility for quality, not isolated test team ownership. The manifesto emphasizes self-organizing teams where everyone contributes to quality. Exclusive assignment of testing to a separate group contradicts the collaborative intent of Agile principles.","B":"The Agile Manifesto principle states that simplicity and maximizing the amount of work not done is essential. This option contradicts the manifesto by advocating for exhaustive effort rather than lean, value-focused delivery. The correct principle prioritizes doing less but delivering more value.","C":"Delivering working software frequently, preferring shorter timescales, is one of the twelve principles of the Agile Manifesto, as per reference section 1.1.1. This principle directly supports iterative delivery and continuous feedback. The other options either misstate or contradict established Agile principles.","D":"The Agile Manifesto explicitly welcomes changing requirements, even late in development. Freezing requirements contradicts the Agile principle of harnessing change for the customer's competitive advantage. This approach is characteristic of sequential, plan-driven lifecycles rather than Agile."}},{"q":"You are a tester on an Agile team preparing for sprint planning. The team uses story points to estimate user stories. The sprint backlog contains three stories: a login feature estimated at five points, a reporting dashboard at eight points, and a notification service at three points. Your test lead asks you to estimate the testing effort required for the sprint considering these story point values and the associated quality risks. Which approach BEST represents sound Agile testing effort estimation for this sprint?","o":{"A":"Allocate testing effort proportionally based on story point size and adjust for the quality risk profile of each story","B":"Assign equal testing effort to all three stories regardless of story point value or associated risk","C":"Allocate all testing effort to the highest story point item and defer testing of lower-point stories","D":"Estimate testing effort by counting the number of test cases planned without considering story points or risk"},"a":["A"],"e":{"A":"Agile testing effort estimation combines story point size with quality risk assessment to produce a proportional, risk-adjusted allocation of testing capacity, as per reference section 3.2.2. Higher-point stories with elevated risk profiles require greater testing effort, while lower-risk stories may require less even if their point value is similar. The other options apply single-dimension estimation approaches that ignore risk or complexity.","B":"Equal effort allocation ignores both the relative complexity indicated by story points and the risk-adjusted effort that quality risk differences demand. Uniform testing effort produces over-testing of low-risk, low-complexity stories and under-testing of high-risk, high-complexity ones. This approach contradicts the risk-proportionate estimation principle.","C":"Effort allocation must reflect both story size and risk level; concentrating all effort on the largest story point item ignores quality risks associated with smaller but potentially higher-risk stories. The notification service or login feature may carry greater regulatory or integration risk than their point values suggest. This option misapply story points as the sole estimation criterion.","D":"Test case count is a lagging indicator of testing activity volume, not a forward-looking estimation approach aligned with Agile. Risk-adjusted, story-point-anchored estimation provides a more predictive and value-proportionate basis for testing effort planning. This option measures output quantity rather than effort risk alignment."}},{"q":"You are part of a development team using short two-week iterations. Your manager proposes switching to quarterly release cycles to reduce planning overhead. Which benefit of short iteration cycles BEST supports retaining the two-week cadence?","o":{"A":"Short iterations enable continuous stakeholder validation, allowing the team to detect misaligned features before significant effort is invested","B":"Shorter iterations reduce the number of user stories the team must deliver per release","C":"Two-week iterations eliminate the need for sprint retrospectives since less rework accumulates","D":"Short iterations allow developers to skip code reviews since feedback is gathered from stakeholders directly"},"a":["A"],"e":{"A":"Short iteration cycles provide frequent opportunities for stakeholder validation, enabling early detection of misaligned features before substantial development investment occurs, as per reference section 1.1.3. This reduces both rework cost and the risk of delivering a product that does not meet business needs. The other options either describe unrelated benefits or mischaracterize the purpose of iteration length.","B":"Iteration length does not inherently reduce story count per release; it changes the frequency of delivery and feedback. Reducing story volume is a scope decision, not a consequence of iteration cadence. This option conflates iteration duration with delivery throughput.","C":"Retrospectives are a mandatory Agile ceremony regardless of iteration length, and short iterations do not eliminate process improvement needs. In fact, frequent retrospectives are considered beneficial precisely because teams can identify and act on improvements more rapidly. This option incorrectly treats iteration length as a replacement for retrospective practice.","D":"Stakeholder feedback during sprint reviews does not replace technical code review practices. Code reviews address internal code quality concerns that stakeholder demonstrations are not designed to evaluate. This option incorrectly conflates two distinct quality activities."}},{"q":"Which of the following BEST defines a build verification test in the context of Agile testing?","o":{"A":"A set of automated tests that confirm the build is stable enough to proceed to further testing","B":"A manual test session conducted by the tester to verify the completeness of the product backlog","C":"A configuration item that records all changes made to source code during a sprint","D":"A performance test suite used to measure system throughput after each deployment"},"a":["A"],"e":{"A":"A build verification test is a defined set of automated checks confirming that a software build is sufficiently stable to advance to subsequent testing activities, as per reference section 2. This test type provides a rapid quality gate at the build level before more extensive testing begins. The other options describe either unrelated test types or misattribute the purpose of build verification.","B":"Build verification tests are automated checks targeting build stability, not manual sessions reviewing backlog completeness. Backlog review is a planning activity unrelated to build verification. This option confuses a technical automated test type with a planning artefact review activity.","C":"A configuration item is an artefact managed under configuration management to track change history, not a type of automated test. Build verification tests are executable test sets, not configuration
