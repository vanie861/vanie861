records. This option conflates two distinct concepts from the Agile testing vocabulary.","D":"Performance testing measures non-functional system characteristics such as throughput and response time, whereas build verification tests confirm basic build stability. These are distinct test types with different purposes and execution triggers. Performance suites are not typically run as build verification gates."}},{"q":"In the test pyramid model, which statement BEST describes the recommended relationship between API-level and GUI-level automated test tools?","o":{"A":"GUI-level tests should form the largest proportion of the automated suite because they most closely simulate user behaviour","B":"API-level and GUI-level tests should be maintained in equal proportions to balance coverage across the system","C":"GUI-level tests replace API-level tests in Agile projects because they are easier to write and maintain","D":"API-level tests should form a larger proportion of the automated suite than GUI-level tests because they execute faster and provide more stable feedback"},"a":["D"],"e":{"A":"The test pyramid model explicitly places GUI tests at the apex, representing the smallest proportion of automated tests. While GUI tests simulate user interactions, their fragility and execution speed make them unsuitable as the primary automation layer. Prioritizing GUI tests inverts the pyramid model.","B":"The test pyramid model prescribes an unequal distribution, with fewer GUI tests and more unit and API-level tests. Equal proportions would undermine the efficiency and feedback stability benefits that the pyramid structure is designed to provide. This option misrepresents the pyramid as a flat or symmetric model.","C":"GUI tests are generally more difficult to maintain and more prone to instability than API-level tests, which is precisely why the pyramid model recommends fewer of them. The pyramid model does not suggest replacing API-level automation with GUI tests. This option contradicts the maintenance and stability rationale that underpins the pyramid hierarchy.","D":"The test pyramid model recommends a higher proportion of API-level automated tests compared to GUI-level tests, as API tests execute more quickly and produce more stable, reliable feedback with lower maintenance overhead, as per reference section 3.1.2. GUI tests are placed at the top of the pyramid in smaller numbers due to their slower execution and fragility. The other options either invert the pyramid model or misstate the rationale for test level distribution."}},{"q":"You are a tester who has been assigned long-term to a single Agile development team. After several months, a manager raises concerns about the risks this arrangement may create. Which outcome BEST represents an organizational risk associated with long-term tester assignment to a single Agile team?","o":{"A":"The tester accumulates too many test automation skills, creating a technical bottleneck in the team","B":"The tester may adopt the team's perspective and lose the independence needed to identify defects objectively","C":"The tester gains excessive domain knowledge, which makes them more effective at finding complex defects","D":"The tester becomes too productive and reduces the need for other team members to contribute to quality"},"a":["B"],"e":{"A":"Skill accumulation is not an organizational risk associated with long-term tester assignment in the CTFL-AT syllabus. The primary documented risk is the erosion of tester independence due to prolonged team alignment. This option describes an operationally implausible scenario unrelated to the independence concern.","B":"Long-term assignment to a single Agile team creates the risk that the tester becomes too aligned with the team's viewpoint, compromising the objectivity that effective defect detection requires, as per reference section 2.1.3. This loss of independence is a known organizational risk that reduces the tester's ability to challenge assumptions impartially. The other options describe either benefits or unrelated concerns.","C":"Deep domain knowledge is generally an advantage for testing effectiveness, not a recognized organizational risk. The risk associated with long-term assignment is loss of independence due to team alignment, not over-familiarity with the domain. This option misidentifies a benefit as a risk.","D":"Tester productivity does not create organizational risk in the context described by the CTFL-AT syllabus. The documented risk of long-term assignment relates to independence and objectivity, not to skill development or productivity gains. This option introduces an implausible and unsupported risk scenario."}},{"q":"You are reviewing your team's test approach for the current sprint. The test lead asks you to classify a set of tests as either automated or manual based on the testing quadrant model. The tests under review include user story acceptance tests and exploratory testing sessions. Which classification BEST reflects how these test types align with the automated versus manual dimension in the testing quadrants?","o":{"A":"User story acceptance tests are typically automated, while exploratory testing sessions are conducted manually","B":"Both user story acceptance tests and exploratory testing sessions should be fully automated to support continuous integration","C":"Exploratory testing sessions are automated using scripted test tools, while acceptance tests are executed manually each sprint","D":"Both test types should remain manual because automation conflicts with the Agile principle of customer collaboration"},"a":["A"],"e":{"A":"In the testing quadrant model, acceptance tests derived from user stories are typically automated to support continuous regression validation, while exploratory testing sessions require human judgement and creative investigation that cannot be automated, as per reference section 3.1.3. This classification reflects the practical application of the quadrant model to automation decisions. The other options either incorrectly classify both types or reverse the expected automation approach.","B":"Exploratory testing relies on human creativity, intuition, and adaptive investigation, making it unsuitable for full automation. Automating exploratory sessions would eliminate the dynamic, charter-driven investigation that defines this technique. Only structured, repeatable tests such as acceptance tests are candidates for automation.","C":"This option reverses the correct automation classification. Exploratory testing is characteristically manual and human-driven, while acceptance tests are systematically automated to provide repeatable regression coverage. Scripting exploratory tests transforms them into structured tests, eliminating their exploratory value.","D":"Agile projects actively encourage test automation, particularly for regression and acceptance tests, to manage growing test suites across iterations. Automation does not conflict with customer collaboration; it complements it by freeing the team to focus human effort on exploratory and higher-value testing activities."}},{"q":"You are a tester on an Agile team that has just completed a sprint. Your test lead asks you to measure and report test coverage for the stories delivered in the sprint. Which activity BEST represents the tester's responsibility for measuring and reporting test coverage in an Agile team?","o":{"A":"Waiting until the end of the release to aggregate coverage data across all completed sprints","B":"Tracking and communicating the proportion of user stories and acceptance criteria covered by tests during and after the sprint","C":"Delegating coverage reporting to the development team and reviewing their report at the sprint review","D":"Calculating code branch coverage using static analysis tools operated by the development team"},"a":["B"],"e":{"A":"Test coverage must be measured and reported within each sprint to inform timely team decisions, not deferred until release end. Delayed coverage reporting reduces the team's ability to identify and address coverage gaps while there is still opportunity to act. This option contradicts the iterative reporting cadence expected in Agile.","B":"Measuring and reporting test coverage in an Agile team involves tracking the proportion of user stories and their acceptance criteria that are exercised by tests, and communicating this status to the team, as per reference section 2.3.2. This activity provides transparent coverage visibility that supports team decision-making. The other options either assign the activity to other roles or describe unrelated measurement approaches.","C":"Coverage measurement and reporting is a defined tester responsibility in an Agile team; it cannot be delegated to the development team as a default practice. The tester owns this reporting function and communicates findings directly to the team. Delegation without tester involvement removes an essential quality communication activity.","D":"Code branch coverage via static analysis is a developer-operated technical metric, not the primary coverage reporting responsibility of the Agile tester. Tester-reported coverage in Agile focuses on story and acceptance criteria coverage, not source code structural metrics. This option misidentifies both the metric type and the responsible party."}},{"q":"You are explaining acceptance criteria to a business stakeholder who is unfamiliar with user stories. The stakeholder asks whether non-functional requirements such as performance and security need to be included in the acceptance criteria for a story. Which response BEST describes how non-functional requirements should be addressed in user story acceptance criteria?","o":{"A":"Non-functional requirements are always captured in a separate technical specification and should not appear in user story acceptance criteria","B":"Non-functional requirements are the responsibility of the architect and do not need to be included in acceptance criteria","C":"Non-functional requirements should only be defined at the end of the release once all functional stories are complete","D":"Non-functional requirements such as performance and security should be included as explicit acceptance criteria in the user story when they are relevant to the story's context"},"a":["D"],"e":{"A":"While non-functional requirements may be documented in supplementary artefacts, they should also be reflected in acceptance criteria when they are directly relevant to the story being tested. Excluding them from acceptance criteria creates a gap in the testable conditions for that story. This option creates an unverifiable split between story acceptance and non-functional expectations.","B":"Non-functional requirements that affect story behaviour must be testable and verifiable, which requires them to be expressed as acceptance criteria. Assigning non-functional ownership exclusively to the architect and excluding them from acceptance criteria removes them from the team's Definition of Done scope. This option incorrectly separates non-functional concerns from story-level verification.","C":"Deferring non-functional requirement definition to release end prevents iterative verification and creates a high-risk backlog of unvalidated quality attributes. Non-functional criteria relevant to individual stories should be defined alongside functional criteria during story refinement. Late definition of non-functional requirements is a risk factor, not a sound acceptance criteria practice.","D":"Testable acceptance criteria in Agile user stories can and should include non-functional requirements when they are relevant to the story, as per reference section 3.3.2. Explicitly stating non-functional expectations such as response time or access control requirements makes them verifiable and prevents them from being overlooked during testing. The other options either exclude non-functional criteria or defer their definition inappropriately."}},{"q":"You are refining a user story with your team. The product owner has written: \"As a customer, I want to reset my password so that I can regain access to my account.\" The story has been discussed verbally, but no acceptance criteria have been documented. Which aspect of the 3C concept is MOST at risk of being incomplete?","o":{"A":"Card, because the story has not been written on a physical index card","B":"Conversation, because the team has not yet discussed the story with stakeholders","C":"Card, because the user story does not include a technical implementation description","D":"Confirmation, because testable acceptance criteria have not been established for the story"},"a":["D"],"e":{"A":"The card component of the 3C concept refers to the written representation of the story, not specifically to a physical card format. The story text exists and has been articulated, so the card component is present regardless of medium. This option misinterprets card as a physical artefact requirement.","B":"The scenario explicitly states the story has been discussed verbally with the team, satisfying the conversation component of the 3C concept. The gap is not in discussion but in documented confirmation. This option incorrectly identifies conversation as the missing element.","C":"User story cards are intentionally kept brief and non-prescriptive; they do not require technical implementation details. The card captures the user need, role, and goal, all of which are present in the described story. This option applies a misaligned expectation to the card component.","D":"In the 3C model, confirmation refers to the acceptance criteria that confirm when a story is complete and testable, as per reference section 1.2.2. Without documented acceptance criteria, there is no basis for the team to verify that the story has been correctly implemented. The other options describe 3C components that are either present or unresolved to the described gap."}},{"q":"You are a tester collaborating with business stakeholders to define acceptance criteria for a user story covering a loan application submission feature. The story involves business rules for eligibility validation and integration with an external credit scoring service. Which TWO of the following should be included as acceptance criteria for this story? (Select TWO)","o":{"A":"The product owner must review and approve all test cases before testing begins for this story","B":"The development team must complete the implementation of the loan submission feature within the current sprint","C":"The system must reject loan applications where the applicant's income is below the minimum eligibility threshold defined by the business rules","D":"The system must return an error response within an acceptable timeframe when the external credit scoring service is unavailable"},"a":["C","D"],"e":{"A":"Product owner approval of test cases is a governance preference, not an acceptance criterion for the story's behaviour. Acceptance criteria describe what the system must do, not the process by which testing is approved. This option misrepresents an administrative step as a testable system condition.","B":"Sprint delivery timelines are planning commitments, not testable acceptance criteria. Acceptance criteria define verifiable system behaviour, not delivery schedules. Including delivery timing in acceptance criteria conflates project management constraints with functional verification conditions.","C":"Business rule validation, such as income eligibility thresholds, is a directly testable condition that must be expressed as an explicit acceptance criterion to ensure the system enforces the correct eligibility logic, as per reference section 3.3.2. This criterion is specific, verifiable, and tied to a known business rule. Including it enables the tester to design a targeted test case confirming correct rule enforcement.","D":"Acceptance criteria for stories involving external system interfaces must address integration failure scenarios and non-functional behaviour such as response time and error handling, as per reference section 3.3.2. This criterion is testable, relevant to the story scope, and ensures the system behaves predictably during external service disruption. It covers both the interface and a measurable non-functional expectation."}},{"q":"You are a tester preparing test activities for a sprint. The primary test basis available is a user story describing a customer account registration feature. The story includes a brief description, a list of acceptance criteria, and notes from the story refinement session. Which of the following BEST describes how you should use this user story as the primary test basis?","o":{"A":"Request that the product owner write formal test cases before development begins to ensure test coverage","B":"Derive test conditions and test cases directly from the acceptance criteria and story description, using refinement notes to clarify ambiguities","C":"Wait for a formal test specification document to be produced before identifying any test conditions","D":"Use only the story title and ignore acceptance criteria since they may change during development"},"a":["B"],"e":{"A":"Writing test cases is a tester responsibility, not a product owner function. The product owner defines acceptance criteria and business intent, while the tester derives test conditions and cases from those criteria. Assigning test case authorship to the product owner misrepresents both roles and bypasses the tester's analytical contribution.","B":"The user story, together with its acceptance criteria and refinement session notes, forms the primary test basis in Agile projects, as per reference section 3.3.1. Deriving test conditions from acceptance criteria ensures alignment between what was agreed and what is tested. Refinement notes clarify intent where the story or criteria are ambiguous, supporting complete and accurate test design.","C":"Agile projects do not produce formal test specification documents in the traditional sense; the user story and its acceptance criteria serve as the primary test basis. Waiting for formal specifications would delay testing and contradict the iterative, just-in-time documentation approach of Agile development. This option applies a sequential lifecycle expectation to an Agile context.","D":"Acceptance criteria are the primary source of testable conditions and must be used as the central basis for test design. Ignoring acceptance criteria because they may evolve undermines the confirmation component of the 3C model and produces tests that are disconnected from agreed story outcomes. Changes to criteria should trigger test case updates, not avoidance."}},{"q":"You are working on an Agile project and your team lead asks you to explain the categories of work products produced during an iteration. Which of the following BEST describes the categories of work products created as development and testing activities are integrated in Agile projects?","o":{"A":"Work products are limited to user stories and test reports, as other artefacts are not required in Agile","B":"Business-oriented, development-oriented, and test-oriented work products are produced collaboratively within each iteration","C":"Work products in Agile are produced sequentially: requirements first, then code, then test reports","D":"Agile projects produce only test-oriented work products, as development artefacts are considered documentation waste"},"a":["B"],"e":{"A":"Agile projects produce a broader range of work products across business, development, and test categories, not only user stories and test reports. Limiting artefacts to two types oversimplifies the work product landscape defined in the CTFL-AT syllabus. This option reflects an incomplete understanding of integrated Agile work product categories.","B":"In Agile projects, work products are categorized as business-oriented, development-oriented, and test-oriented, all produced through integrated team collaboration within iterations, as per reference section 2.1.2. This categorization reflects the blended nature of Agile delivery where all three types emerge concurrently. The other options either apply sequential categories or misrepresent Agile work product structure.","C":"Sequential work product production is characteristic of plan-driven lifecycles, not Agile projects. In Agile, business, development, and test work products are produced concurrently and iteratively within the same sprint. This option incorrectly applies a waterfall production model to an Agile context.","D":"Agile projects produce all three categories of work products: business-oriented, development-oriented, and test-oriented. The Agile principle of valuing working software over comprehensive documentation does not eliminate development artefacts; it reduces unnecessary documentation. This option misinterprets the lean documentation principle as a prohibition on development work products."}},{"q":"You are a tester on an Agile team completing its fourth sprint. Your team has built an automated regression test suite that has grown significantly across iterations. During the sprint review, the test lead notes that the suite is taking longer to execute and some tests are producing intermittent failures. Which action BEST addresses the management of the automated regression test suite in this situation?","o":{"A":"Disable the entire regression suite temporarily and rely on manual testing until the suite is rebuilt","B":"Add more test cases to the suite to increase coverage and offset the intermittent failure rate","C":"Transfer responsibility for the regression suite to the development team to reduce tester workload","D":"Review the suite to identify and remove obsolete tests, stabilize flaky tests, and optimize execution time"},"a":["D"],"e":{"A":"Disabling the regression suite removes the primary safeguard against undetected regressions during active development. Manual testing alone cannot provide the coverage frequency required to manage regression risk across multiple iterations. This option trades a manageable suite maintenance problem for a significant quality risk.","B":"Adding tests to a suite already experiencing intermittent failures and execution time issues would worsen both problems. Expanding an unstable suite increases maintenance overhead and prolongs execution without resolving the root causes. The correct action is to review and stabilize, not expand.","C":"Regression test suite management is a shared team responsibility, but transferring full ownership to developers does not address the identified problems of instability and excessive execution time. The issue requires technical review and optimization, not a change in ownership. This option avoids the maintenance problem rather than resolving it.","D":"Managing an evolving automated regression test suite requires regular review to retire obsolete tests, address intermittent failures, and optimize execution duration, as per reference section 2.2.2. This action directly resolves both the execution time and stability concerns raised in the scenario. The other options either defer the problem or apply inappropriate solutions."}},{"q":"You are a tester assigned to an Agile team. Your test lead asks you to determine which testing quadrant applies to a set of tests that support the development team by evaluating the technical quality of the code rather than business-facing behaviour. Which testing quadrant BEST describes technology-facing tests that support the development team?","o":{"A":"Quadrant 4, which includes non-functional performance and security tests that critique the product","B":"Quadrant 2, which includes business-facing functional tests derived from user stories and acceptance criteria","C":"Quadrant 1, which includes technology-facing tests such as unit tests and component tests that support the development team","D":"Quadrant 3, which includes business-facing exploratory testing that evaluates product usability and user experience"},"a":["C"],"e":{"A":"Quadrant 4 contains technology-facing tests that critique the product, such as performance, security, and reliability testing. These tests evaluate product quality from a non-functional perspective rather than supporting development through technical code validation. This option selects the wrong technology-facing quadrant.","B":"Quadrant 2 contains business-facing tests that support the development team, including functional tests based on user stories. While Quadrant 2 supports development, it does so through business-facing rather than technology-facing test types. This option selects the wrong dimension of the quadrant model.","C":"Quadrant 1 of the testing quadrants model contains technology-facing tests, including unit and component tests, that support the development team by validating technical code quality rather than business behaviour, as per reference section 3.1.3. These tests are typically automated and run continuously. The other quadrants address business-facing or critique-oriented testing objectives.","D":"Quadrant 3 contains business-facing tests such as exploratory testing and usability testing that critique the product from a user perspective. These tests support the business, not the development team's technical quality objectives. This option describes the wrong quadrant for the technology-facing, development-support test category."}},{"q":"You are working on an Agile project with two-week iterations. After each sprint, the team demonstrates working software to stakeholders and incorporates their feedback into the next iteration. A colleague questions whether this cycle is necessary. Which benefit of frequent feedback BEST justifies maintaining this practice?","o":{"A":"It replaces the need for retrospectives by allowing teams to adjust direction during demos","B":"Defects and misalignments with stakeholder expectations are detected and corrected earlier, reducing the cost of changes","C":"It allows the team to avoid writing test cases by relying on stakeholder verbal confirmation","D":"Frequent feedback ensures developers can delay integration until the end of the release"},"a":["B"],"e":{"A":"Stakeholder feedback sessions and retrospectives serve distinct purposes in Agile. Retrospectives focus on team process improvement, while sprint reviews gather product feedback from stakeholders. One ceremony cannot substitute for the other without losing a critical improvement mechanism.","B":"Frequent feedback enables early detection of defects and product misalignments, which significantly reduces the cost and effort of corrections compared to late-stage discovery, as per reference section 1.1.3. Shorter feedback cycles allow the team to course-correct before investment in the wrong direction accumulates. The other options either misstate the benefit or describe outcomes unrelated to feedback frequency.","C":"Frequent feedback does not eliminate the need for formal test design or documentation. Stakeholder demonstrations complement structured testing rather than replacing it. Relying solely on verbal stakeholder confirmation leaves significant quality risks unaddressed.","D":"Frequent feedback in Agile is specifically intended to support continuous integration and early validation, not to justify deferred integration. Delaying integration until release end contradicts both the feedback principle and continuous integration practices. This option misrepresents the purpose of iterative feedback cycles."}},{"q":"You are a tester on a team that has recently implemented a continuous integration pipeline. After each code commit, the pipeline executes a sequence of automated activities. A new developer asks which activities are automatically triggered within the continuous integration process. Which option BEST describes the automated activities performed as part of continuous integration?","o":{"A":"User acceptance testing and performance benchmarking are run automatically at each code commit","B":"Deployment to the production environment is triggered automatically on every successful build","C":"Static code analysis, automated unit tests, and build verification tests are executed automatically on each code commit","D":"Manual exploratory testing and peer code review are initiated automatically after each commit"},"a":["C"],"e":{"A":"User acceptance testing typically requires human stakeholder involvement and is not suitable for automated execution on every commit. Performance benchmarking may be automated but is generally scheduled at specific intervals rather than triggered on every commit. Continuous integration pipelines focus on fast, lightweight automated checks, not comprehensive test suite execution.","B":"Automatic deployment to production on every build describes continuous deployment, not continuous integration. Continuous integration focuses on automated build and test verification, while deployment decisions, particularly to production, typically involve additional gates. This option conflates two distinct continuous delivery practices.","C":"Continuous integration pipelines automatically trigger static code analysis, unit test execution, and build verification tests upon each code commit, as per reference section 1.2.4. These activities provide rapid feedback on code quality and integration stability without manual intervention. The other options either include manual activities or mischaracterize the scope of continuous integration automation.","D":"Exploratory testing and peer code review are human-driven activities that cannot be automatically triggered by a code commit. Continuous integration pipelines execute automated checks only; manual activities require deliberate scheduling and human initiation. Including these in automated CI activities reflects a fundamental misunderstanding of pipeline capabilities."}}]},{"id":2,"title":"Practice Exam 3","questions":[{"q":"You are a tester embedded within an Agile development team. A test manager asks you to evaluate the trade-off between your independence and your integration within the team. Which statement BEST describes the trade-off between embedded tester independence and objectivity in an Agile team?","o":{"A":"Embedded testers maintain full independence because they are formally separated from the development team during testing activities","B":"Embedded testers have more independence than external independent testers because they understand the product better","C":"The trade-off between independence and integration does not apply to testers who have strong interpersonal boundaries","D":"Embedded testers gain deep product knowledge and team integration but may reduce their objectivity over time due to alignment with the team's shared assumptions"},"a":["D"],"e":{"A":"Embedded testers are integrated into the development team and do not maintain formal separation during testing. Their integration is the source of both the collaboration benefit and the independence trade-off. Formal separation contradicts the embedded model and misrepresents how the independence risk arises.","B":"Product familiarity does not equate to testing independence. External independent testers have greater objectivity precisely because they are not subject to the team alignment that embedded testers experience. Greater product knowledge improves test targeting but does not increase independence from the team's shared assumptions.","C":"Independence risk in Agile testing is a structural organisational concern arising from team membership, not a personal characteristic that individuals can counteract through interpersonal boundaries alone. The CTFL-AT syllabus treats independence trade-off as an organisational risk requiring structural mitigation, not an individual behavioural factor.","D":"Embedding a tester within an Agile team improves collaboration and product familiarity but creates a recognised trade-off where prolonged alignment with the team's perspective can reduce the critical objectivity needed for effective defect detection, as per reference section 2.1.3. This trade-off is a recognised independence risk in the CTFL-AT syllabus."}},{"q":"You are a tester joining an Agile team that uses hardening iterations. A colleague explains that the team occasionally dedicates a sprint entirely to fixing accumulated defects before a release. Which statement BEST explains how the hardening iteration practice differs from the Agile principle of fixing bugs first?","o":{"A":"Hardening iterations are the preferred Agile approach because they consolidate all defect resolution into a single efficient sprint","B":"The Agile principle of fixing bugs first applies only to critical severity defects and does not conflict with deferring low-priority defects to a hardening sprint","C":"Hardening iterations and fixing bugs first are interchangeable practices that produce identical quality outcomes","D":"The hardening iteration defers defect resolution to a dedicated sprint, whereas the Agile principle favours fixing defects as they are discovered within each iteration to prevent accumulation"},"a":["D"],"e":{"A":"Hardening iterations are considered a departure from ideal Agile practice, not a preferred approach. Concentrating defect resolution in a single sprint reintroduces a sequential, batch-fix model that delays quality feedback. The Agile principle of fixing bugs first requires defects to be addressed within the iteration where they are discovered.","B":"The Agile principle does not distinguish between defect severities when advocating for immediate resolution. Deferring any defects to a hardening sprint creates an accumulation that undermines iterative quality management, regardless of severity. This option introduces an unsupported severity-based exception to the principle.","C":"The two practices produce different quality outcomes. Fixing bugs first within each iteration prevents accumulation and maintains continuous quality, while hardening iterations batch defect resolution and create a delayed quality gate. These approaches are not interchangeable; one supports continuous quality and the other reintroduces sequential defect management.","D":"The Agile practice of fixing bugs first requires defects to be resolved immediately when found within the iteration, while a hardening iteration is a separate, defect-clearance sprint that represents a departure from this principle, as per reference section 2.1.1. Accumulating defects for a dedicated fix sprint introduces the same late-stage quality risk that Agile iterative testing is designed to avoid."}},{"q":"You are a tester on an Agile team. Your test lead explains that testers have specific responsibilities in contributing to sprint retrospectives and supporting continuous improvement. Which TWO of the following activities BEST reflect the tester's participation in retrospectives and continual improvement in an Agile team? (Select TWO)","o":{"A":"Taking sole responsibility for all process improvements identified in the retrospective to demonstrate quality ownership","B":"Identifying testing-related impediments from the completed sprint and proposing concrete process changes to address them in the next iteration","C":"Sharing observations about test effectiveness and coverage gaps to inform the team's understanding of quality risks going forward","D":"Documenting all retrospective outcomes in a formal improvement register and submitting it to senior management after each sprint"},"a":["B","C"],"e":{"A":"Retrospective improvements are team-owned commitments, not individual tester responsibilities. Assigning all improvement actions to the tester creates an imbalanced workload and contradicts the whole-team quality ownership model. Process improvements should be distributed across team members based on relevance and capacity.","B":"The tester's contribution to retrospectives includes raising testing-specific impediments observed during the sprint and proposing actionable improvements that the team can implement, as per reference section 2.3.2. This active participation ensures that testing process concerns are addressed through the team's improvement mechanism.","C":"Agile testers contribute to retrospectives and continual improvement by communicating insights about test coverage adequacy, testing efficiency, and emerging quality risks that the team should address in subsequent sprints, as per reference section 2.3.2. This knowledge sharing builds the team's collective quality awareness and informs planning decisions for future iterations.","D":"Formal improvement registers submitted to management are not a standard Agile retrospective output. Retrospective improvements are captured as team commitments implemented within the next iteration, not escalated to senior management through formal documentation. This option introduces a bureaucratic reporting overhead inconsistent with Agile self-organisation principles."}},{"q":"You are a tester collaborating with a developer and a business representative to write a user story for a product search feature. The team uses brainstorming and mind mapping to explore possible user needs. Which outcome BEST reflects how these techniques support writing testable user stories in collaboration?","o":{"A":"Brainstorming and mind mapping help the team surface diverse test conditions and edge cases that improve the completeness and testability of acceptance criteria","B":"Brainstorming sessions are used exclusively by the product owner to generate user stories without developer or tester input","C":"Mind mapping replaces the need for acceptance criteria by providing a visual representation of all story requirements","D":"Brainstorming and mind mapping are post-development review techniques used to identify defects in completed features"},"a":["A"],"e":{"A":"Brainstorming and mind mapping are collaborative techniques that enable the team to explore the full range of user needs, scenarios, and edge cases that inform testable acceptance criteria for user stories, as per reference section 1.2.2. These techniques generate a broader set of conditions than any single role could identify independently, directly improving story testability.","B":"Brainstorming for user story creation is a whole-team collaborative activity that requires input from developers, testers, and business representatives to capture diverse perspectives. Restricting brainstorming to the product owner eliminates the technical and quality perspectives that improve story completeness. This option contradicts the collaborative authorship model described in the CTFL-AT syllabus.","C":"Mind maps are a facilitation and exploration tool that supports the discovery of story content, not a substitute for testable acceptance criteria. Acceptance criteria provide the specific, verifiable conditions required to confirm story completion, which a mind map's visual structure cannot replace. This option conflates an ideation technique with a story verification mechanism.","D":"Brainstorming and mind mapping are collaborative story preparation techniques used before development begins, not post-development review activities. Applying these techniques after development misses their primary value in preventing incomplete or non-testable stories from entering the sprint."}},{"q":"You are a tester on an Agile team that has just completed a challenging sprint. During the retrospective, the team identifies that testers frequently had to wait for developer environments to be configured before testing could begin. A team member suggests improving self-organisation to resolve this. Which action BEST reflects using the retrospective as a mechanism for self-organisation and continual improvement?","o":{"A":"The tester documents the environment issue in a formal incident report and submits it to the configuration management team","B":"The team agrees to create a shared environment setup checklist and assigns a rotating team member to prepare the test environment at sprint start","C":"The team escalates the environment configuration problem to the project manager for resolution in the next quarter","D":"The team decides to add more testers to the sprint to compensate for the environment configuration delays"},"a":["B"],"e":{"A":"Submitting a formal incident report to an external team is a bureaucratic response inconsistent with the self-organising, iterative improvement intent of the retrospective. The team should own and implement the improvement internally. This option introduces an external escalation path that delays resolution and removes team ownership of the improvement.","B":"Creating a practical, team-owned improvement action such as a shared environment checklist with rotating ownership is a direct application of self-organisation and continual improvement through the retrospective mechanism, as per reference section 1.2.3. This action addresses the identified impediment with a specific, implementable process change the team owns and controls.","C":"Escalating a solvable team-level impediment to management contradicts the self-organisation principle of Agile teams. Retrospective improvements should be team-owned and implemented within the next iteration, not deferred to external resolution. This option bypasses the team's self-management responsibility for process improvement.","D":"Adding more testers addresses a symptom rather than the root cause of the identified problem. The impediment was environment configuration delay, not insufficient testing capacity. Retrospective improvements should resolve root causes through process changes, not by adding resources to work around an unresolved constraint."}},{"q":"You are a tester on an Agile team beginning a new sprint. During sprint planning, the team selects five user stories for the sprint backlog. The test lead asks you to update the task board with testing tasks for each story. Which action BEST reflects the tester's role in sprint planning and task board management within a Scrum team?","o":{"A":"Limit testing tasks on the task board to defect re-verification activities, since new feature testing is performed informally","B":"Create testing tasks for each selected story, estimate their effort, and add them to the sprint backlog on the task board alongside development tasks","C":"Wait until development tasks are completed before adding testing tasks to the task board to reflect the actual sequence of work","D":"Ask the product owner to create all testing tasks based on the acceptance criteria they have written for each story"},"a":["B"],"e":{"A":"All testing activities, including new feature testing, regression testing, and exploratory sessions, should be represented as explicit tasks on the sprint task board. Restricting visible testing tasks to re-verification activities and treating feature testing as informal work reduces sprint planning accuracy and testing transparency.","B":"The tester's role during Scrum sprint planning includes identifying and estimating the testing tasks required for each committed user story and populating the task board with those testing activities in parallel with development tasks, as per reference section 3.1.4. This ensures testing effort is visible, planned, and tracked alongside development throughout the sprint.","C":"Testing tasks should be planned and visible from the start of the sprint, not added after development is complete. Adding testing tasks only after development creates a hidden testing backlog that distorts sprint planning transparency and reintroduces a sequential handoff model. Early visibility of testing tasks is essential for sprint capacity management.","D":"Testing task identification and creation is a tester responsibility, not a product owner function. The product owner defines acceptance criteria and business intent; the tester translates these into testable tasks and estimates. Assigning task creation to the product owner removes the tester's planning contribution and misrepresents both roles."}},{"q":"You are a tester participating in a planning poker session for a sprint that includes a new data migration feature. The team is using the Fibonacci sequence to assign story point estimates. You estimate the migration feature at thirteen points while the developer estimates it at five points. The Scrum Master asks the team to discuss the divergence before re-estimating. Which response BEST explains why using the Fibonacci sequence in planning poker supports more accurate testing effort estimation?","o":{"A":"The Fibonacci sequence eliminates estimation bias by preventing team members from selecting round numbers","B":"Planning poker using the Fibonacci sequence requires the tester to match the developer's estimate to avoid delaying sprint planning","C":"The Fibonacci sequence reflects increasing uncertainty at higher complexity levels, prompting discussion of risk and scope differences when estimates diverge significantly","D":"The Fibonacci sequence ensures all team members assign the same estimate, preventing divergence and speeding up planning sessions"},"a":["C"],"e":{"A":"While the Fibonacci sequence does reduce clustering around round numbers, the primary reason for its use in planning poker is to reflect increasing complexity uncertainty, not to eliminate rounding bias. The estimation benefit comes from the discussion triggered by divergent estimates, not from the avoidance of specific numerical values.","B":"Planning poker specifically values and investigates divergent estimates rather than requiring convergence to the developer's view. The tester's higher estimate of thirteen points may reflect testing complexity or risk not visible to the developer, and discussing this divergence is the technique's primary value. Requiring the tester to concede would eliminate the quality risk perspective from the estimation process.","C":"The Fibonacci sequence is used in planning poker because the increasing gaps between values at higher numbers reflect the growing uncertainty and complexity associated with larger work items, as per reference section 3.2.2. When a tester and developer submit significantly different estimates such as thirteen and five, the Fibonacci structure makes the divergence visible and prompts the team to discuss the underlying scope or risk assumptions causing the gap. This discussion produces a more accurate shared estimate.","D":"The Fibonacci sequence does not guarantee identical estimates; it provides a shared scale that makes divergence visible and prompts productive discussion. Divergent estimates are expected and valuable in planning poker because they surface differing assumptions about scope, risk, or complexity. Forcing agreement without discussion would defeat the purpose of the estimation technique."}},{"q":"You are reviewing the testing strategy for a sprint that includes user acceptance testing sessions and accessibility evaluation activities. Your test lead asks which testing quadrant these activities belong to. Which testing quadrant BEST represents business-facing tests that critique the product, including exploratory and usability testing?","o":{"A":"Quadrant 3, which contains business-facing tests that critique the product and includes exploratory testing, usability testing, and user acceptance testing","B":"Quadrant 1, which contains business-facing tests that support the team, including user acceptance testing and exploratory sessions","C":"Quadrant 4, which contains business-facing critique tests, including usability and accessibility evaluation","D":"Quadrant 2, which contains business-facing tests that critique the product through scenario-based acceptance testing"},"a":["A"],"e":{"A":"Quadrant 3 of the testing quadrants model contains business-facing tests that critique the product from a user and stakeholder perspective, including exploratory testing, usability evaluation, and user acceptance testing, as per reference section 3.1.3. These activities evaluate whether the product meets stakeholder needs and expectations rather than supporting its internal construction.","B":"Quadrant 1 contains technology-facing tests that support the development team, such as unit and component tests, not business-facing critique activities. User acceptance testing and exploratory testing are business-facing critique tests belonging to Quadrant 3, not Q1. This option assigns the wrong content to Q1 and misidentifies the quadrant for the described activities.","C":"Quadrant 4 contains technology-facing critique tests such as performance, load, and security testing. Usability and accessibility evaluation are business-facing activities belonging to Quadrant 3, not Q4. This option misassigns business-facing critique activities to the technology-facing critique quadrant.","D":"Quadrant 2 contains business-facing tests that support the team, such as story-based functional tests, not critique-oriented activities. Critique-oriented business-facing tests belong to Quadrant 3. This option confuses the support and critique orientations within the business-facing dimension of the quadrant model."}},{"q":"You are a tester on a team that uses a continuous integration pipeline. After a series of failed builds, the development team asks you to explain how continuous integration supports software quality. A new developer asks specifically what purpose the continuous integration process serves in your Agile project. Which response BEST describes the purpose of continuous integration?","o":{"A":"Continuous integration automatically builds and tests the software on each code commit to provide rapid quality feedback and detect integration defects early","B":"Continuous integration manages the deployment of tested builds to the production environment after each sprint review","C":"Continuous integration replaces the need for a dedicated test environment by running all tests locally on developer machines","D":"Continuous integration ensures that all user stories in the sprint are reviewed and approved by the product owner before merging"},"a":["A"],"e":{"A":"The primary purpose of continuous integration is to automatically build and execute tests upon each code commit, enabling early detection of integration defects and providing rapid feedback to the development team, as per reference section 1.2.4. This purpose directly supports quality by reducing the window in which integration issues remain undetected.","B":"Deployment to production is the concern of continuous delivery or continuous deployment practices, not continuous integration. Continuous integration focuses on automated building and testing triggered by code commits, not on production release management. This option conflates CI with CD, which are related but distinct practices.","C":"Continuous integration pipelines execute automated tests in a shared, controlled build environment, not solely on individual developer machines. Running tests only locally would eliminate the shared feedback and integration verification that CI pipelines are designed to provide. This option describes a practice that contradicts the central purpose of CI.","D":"Product owner story approval is a sprint review and acceptance activity, not a continuous integration function. CI pipelines are automated technical quality gates triggered by code commits, not product acceptance workflows. This option confuses a business approval process with an automated technical integration practice."}},{"q":"You are a tester on an Agile team that holds a daily standup each morning. A new team member suggests replacing the daily standup with a weekly status email to save time. Which advantage of the whole-team approach BEST supports retaining the daily standup?","o":{"A":"The daily standup enables the whole team to synchronise progress, raise impediments, and maintain shared visibility of testing and development status in real time","B":"Daily standups allow the product owner to assign tasks to individual team members each morning","C":"Daily standups replace sprint retrospectives by providing daily opportunities for process improvement discussion","D":"Daily standups ensure developers complete their coding tasks before testers begin testing each morning"},"a":["A"],"e":{"A":"The whole-team approach relies on frequent, transparent communication mechanisms such as the daily standup to maintain team alignment, surface impediments early, and support shared responsibility for quality and progress, as per reference section 1.1.2. Replacing the standup with a weekly email would remove the real-time impediment identification and team synchronisation that supports iterative quality management.","B":"The daily standup is a team synchronisation ceremony, not a task assignment forum for the product owner. Task assignments are self-organised by the team, not directed by the product owner during the standup. This option misrepresents both the standup's purpose and the product owner's role within it.","C":"Daily standups and retrospectives serve distinct purposes: standups synchronise daily progress while retrospectives enable structured process improvement at sprint end. One ceremony cannot substitute for the other without losing a critical team function. This option incorrectly equates the operational coordination of the standup with the reflective improvement purpose of the retrospective.","D":"The daily standup does not enforce a sequential handoff from development to testing. Agile development and testing activities run concurrently within the sprint, and the standup is not a phase transition gate. This option reintroduces a sequential, phase-gated working model that contradicts the integrated Agile approach."}},{"q":"You are a tester on an Agile team working on a complex financial trading platform. A new story requires testing a multi-currency calculation feature that the team has not previously worked on. Your test lead emphasises that domain knowledge is critical for effective testing of this feature. Which combination of skills BEST describes how domain knowledge and critical thinking contribute to an Agile tester's effectiveness?","o":{"A":"Domain knowledge enables the tester to identify meaningful test conditions and boundary cases relevant to financial rules, while critical thinking enables evaluation of whether tested behaviour meets business intent","B":"Domain knowledge allows the tester to write production code when developers are unavailable, while critical thinking supports code review activities","C":"Critical thinking is only relevant for testers performing exploratory testing and is not required for structured acceptance test execution","D":"Domain knowledge is the sole skill required for Agile testers since technical and testing knowledge can be acquired from developers"},"a":["A"],"e":{"A":"Agile testers require domain knowledge to understand the business context and rules that determine what constitutes correct and incorrect behaviour, and critical thinking to evaluate whether the observed system behaviour satisfies the business intent behind the acceptance criteria, as per reference section 2.3.1. Together, these skills enable test design that goes beyond mechanical acceptance criteria execution to targeted, meaningful verification.","B":"Domain knowledge and critical thinking are testing competencies, not development or code review skills. Agile testers are not expected to substitute for developers in writing production code. This option misattributes testing skills to development role responsibilities.","C":"Critical thinking is a core Agile tester skill applicable across all testing activities, including structured acceptance test execution. Even when following defined acceptance criteria, the tester must critically evaluate whether the tested behaviour genuinely satisfies the business intent. Restricting critical thinking to exploratory testing misrepresents its universal applicability in Agile testing.","D":"Agile testers require a combination of domain, testing, and technical skills, not domain knowledge alone. Acquiring testing knowledge from developers is not a substitute for the tester's own professional testing competency, which includes test design, risk identification, and quality evaluation skills. This option oversimplifies the Agile tester skill profile."}},{"q":"You are a tester reviewing your team's test automation dashboard at the start of a sprint. The dashboard displays automated test results from the previous sprint's CI pipeline runs. A developer asks how this information should be used to communicate test progress and product quality. Which response BEST describes how automated test results and dashboard reporting support quality communication in an Agile project?","o":{"A":"Automated test results are only meaningful when all test cases pass and should not be reviewed when failures are present","B":"Automated test results on the dashboard provide real-time, transparent visibility of build stability and test pass or fail trends that enable informed team quality decisions throughout the sprint","C":"Automated test result dashboards are used only by the test manager to produce formal quality reports at sprint end","D":"Dashboard reporting replaces the need for daily standups since all quality information is available in the automated results"},"a":["B"],"e":{"A":"Reviewing automated test results is most valuable precisely when failures are present, as failures signal quality risks requiring team attention. Monitoring only passing results would eliminate the defect detection value of automated testing. Dashboard visibility of failures is an essential quality communication function, not a condition to be avoided.","B":"Test automation results displayed on a dashboard provide continuous, accessible quality indicators that allow the whole team to monitor product stability and identify quality trends without waiting for manual status updates, as per reference section 2.2.1. This transparency supports proactive team decision-making on quality issues during the sprint.","C":"Test automation dashboards are team-wide communication tools designed to provide continuous visibility to all team members, not exclusive management reporting artefacts. Restricting dashboard access to the test manager and limiting its use to sprint-end reporting removes the real-time quality transparency that the tool is designed to provide.","D":"Automated dashboards provide test execution status data, while daily standups address team coordination, impediment identification, and shared context that metrics cannot replace. Dashboards and standups serve complementary communication purposes; neither can substitute for the other. This option conflates quantitative quality data with the qualitative team communication that standups enable."}},{"q":"You are a tester classifying test activities for a sprint. Your team performs component tests that verify the internal structure and integration of code modules without any business-facing scenario context. Which testing quadrant BEST represents these technology-facing tests that support the development team?","o":{"A":"Quadrant 4, which contains technology-facing tests that critique the product, including load and stress tests","B":"Quadrant 1, which contains technology-facing tests that support the team, including unit tests and component integration tests","C":"Quadrant 2, which contains technology-facing tests that critique the product, including performance and security tests","D":"Quadrant 3, which contains business-facing tests that critique the product, including usability and exploratory testing"},"a":["B"],"e":{"A":"Quadrant 4 contains technology-facing critique tests such as performance and reliability tests that evaluate the product's non-functional characteristics. The described component tests support development and verify technical correctness, not critique the product's non-functional quality. This option selects the critique-oriented technology quadrant rather than the support-oriented one.","B":"Quadrant 1 of the testing quadrants model contains technology-facing tests such as unit tests and component tests that are automated and support the development team by verifying internal technical correctness rather than business-facing behaviour, as per reference section 3.1.3. These tests drive development quality from a technical perspective.","C":"Quadrant 2 contains business-facing tests that support the team, such as functional tests based on user stories, not technology-facing critique tests. Performance and security tests belong to Quadrant 4, not Quadrant 2. This option misassigns both the orientation and the content of Quadrant 2.","D":"Quadrant 3 contains business-facing critique tests such as usability and exploratory testing that evaluate the product from a stakeholder perspective, not technology-facing development support tests. The described component tests are technical, not business-facing, and support rather than critique the product. This option selects the wrong quadrant on both dimensions."}},{"q":"Which of the following BEST describes the given/when/then format used in behavior-driven development?","o":{"A":"Given describes the user role, when describes the system under test, and then describes the testing tool to be used","B":"Given and when together describe the full requirement, while then describes the acceptance criteria for the story","C":"Given describes the precondition, when describes the action or event, and then describes the expected outcome of the scenario","D":"Given describes the expected outcome, when describes the precondition, and then describes the action to be performed"},"a":["C"],"e":{"A":"The given/when/then format describes scenario behaviour, not user roles, system identification, or tooling. This option misattributes each clause to a non-scenario element, fundamentally misrepresenting the purpose of the BDD specification format. No clause in the format describes a testing tool.","B":"The given/when/then format does not partition scenario content between a two-clause requirement description and a single-clause acceptance criterion. All three clauses together form one atomic scenario, with given providing context, when providing the trigger, and then providing the expected outcome. This option misrepresents the structure as a two-part requirement plus a separate acceptance statement.","C":"The given/when/then format in behavior-driven development structures executable specifications by defining the precondition state in the given clause, the triggering action or event in the when clause, and the expected system response in the then clause, as per reference section 3.1.1. This structure makes scenarios directly translatable into executable acceptance tests.","D":"This option incorrectly reorders all three clauses of the given/when/then format. The given clause establishes the initial state, the when clause introduces the action, and the then clause states the expected outcome. Reversing these positions would produce logically incoherent scenario specifications."}},{"q":"You are a tester on an Agile team that periodically collects customer satisfaction data to evaluate product quality. A product owner asks how customer satisfaction survey results should be used in the context of test progress communication. Which response BEST describes how customer satisfaction surveys contribute to product quality communication in an Agile project?","o":{"A":"Customer satisfaction survey results provide a stakeholder-perspective quality metric that complements technical test results and defect data to give a more complete picture of product quality","B":"Customer satisfaction surveys replace test execution reports since they directly measure whether the product meets user expectations","C":"Customer satisfaction data should only be collected at product release and is not relevant to iteration-level quality communication","D":"Customer satisfaction surveys measure team velocity and are used to adjust sprint capacity planning"},"a":["A"],"e":{"A":"In Agile projects, product quality communication uses multiple tools and metrics, including customer satisfaction data, to provide a stakeholder-level view of quality that technical test results alone cannot capture, as per reference section 2.2.1. Customer satisfaction surveys offer a business outcome perspective that complements quantitative test metrics.","B":"Customer satisfaction surveys measure perceived stakeholder experience, not technical quality or functional correctness, and cannot replace formal test execution reports. Test reports provide evidence-based quality data while surveys provide perception-based quality signals. Both are complementary inputs, neither substituting for the other.","C":"Agile quality communication uses iterative feedback mechanisms, and customer satisfaction data is relevant throughout the delivery lifecycle, not only at release. Waiting until release end to collect satisfaction data contradicts the 'continuous stakeholder feedback' value. Iteration-level satisfaction inputs inform ongoing quality decisions.","D":"Customer satisfaction surveys measure stakeholder perception of product quality, not team delivery speed or capacity. Velocity is a planning metric derived from story point completion, entirely distinct from satisfaction survey data. This option conflates two unrelated measurement categories."}},{"q":"You are a tester on an Agile team that delivers working software at the end of each sprint. During a sprint review, a stakeholder identifies that a recently delivered reporting feature does not match their expectations because a key filter requirement was misunderstood during story writing. Which benefit of early and frequent feedback BEST explains how this misunderstanding could have been prevented?","o":{"A":"The misunderstanding would have been prevented by requiring the product owner to document all requirements in a formal specification before development","B":"Frequent feedback reduces the need for acceptance criteria by ensuring stakeholders verify features informally during each standup","C":"Early and frequent feedback during story refinement enables the team to clarify requirements and validate understanding before significant development effort is invested","D":"Frequent sprint reviews ensure that all misunderstandings are identified and corrected without any impact on development effort"},"a":["C"],"e":{"A":"Producing comprehensive formal specifications before development contradicts the Agile principle of using lightweight, just-in-time documentation supplemented by continuous collaborative feedback. Formal upfront specifications are a sequential lifecycle practice that reduces the adaptability that Agile feedback mechanisms provide.","B":"Daily standups are team synchronisation ceremonies, not stakeholder feature verification forums. Acceptance criteria remain essential testable conditions regardless of feedback frequency. This option incorrectly substitutes an operational coordination ceremony for the defined purpose of acceptance criteria in Agile story verification.","C":"Early and frequent feedback in Agile specifically aims to surface requirement misunderstandings before development begins, reducing the cost and rework associated with late discovery of misaligned features, as per reference section 1.1.3. Conducting structured feedback during story refinement would have exposed the filter requirement misunderstanding before the sprint commenced.","D":"Sprint reviews occur after development is complete, which means misunderstandings discovered at that stage still require rework. Early feedback during refinement is specifically valuable because it prevents development effort from being misdirected. Sprint reviews provide feedback on completed work, not prevention of implementation errors."}},{"q":"Match each planning activity in Column 1 with the planning level it belongs to in Column 2. Column 1: 1. Prioritising the product backlog for the upcoming release 2. Selecting user stories to implement in the next iteration 3. Identifying product risks that affect the release scope 4. Estimating testing effort for stories committed in the sprint Column 2:","o":{"A":"1C, 2A, 3B, 4D","B":"1D, 2B, 3C, 4A","C":"1B, 2D, 3A, 4C","D":"1A, 2C, 3D, 4B"},"a":["C"],"e":{"A":"This mapping assigns story selection (2) to release planning risk activities (A) and product risk identification (3) to iteration planning effort allocation (B), which reverses the correct scope for both activities. Story selection for implementation is an iteration-level activity, and product risk identification that affects release scope belongs at the release level.","B":"All four mappings in this combination are incorrect relative to the planning horizons defined in the CTFL-AT syllabus. Backlog prioritisation (1) is incorrectly mapped to iteration planning commitment (D), story selection (2) to release planning scoping (B), risk identification (3) to iteration planning effort allocation (C), and effort estimation (4) to release planning risk activities (A).","C":"Prioritising the product backlog (1) maps to release planning scoping (B), selecting user stories (2) maps to iteration planning commitment (D), identifying product risks that affect release scope (3) maps to release planning risk activities (A), and estimating testing effort for sprint stories (4) maps to iteration planning effort allocation (C), as per reference section 1.2.5. Each activity is correctly matched to the planning horizon at which it provides the most value.","D":"This mapping assigns backlog prioritisation (1) to release-level risk identification (A) and misplaces product risk identification (3) to iteration planning commitment (D). Backlog prioritisation is a release-level scoping concern, not a risk identification task."}},{"q":"Which of the following BEST defines a quality risk in the context of Agile testing?","o":{"A":"A project constraint such as insufficient budget or inadequate testing resources that limits the scope of testing","B":"A requirement that has not been formally reviewed and approved before the start of development","C":"A potential problem with the quality of a product that, if it occurs, would have a negative impact on stakeholders or the business","D":"A deviation between the actual test execution results and the expected test outcomes defined in the test case"},"a":["C"],"e":{"A":"Budget limitations and resource constraints are project risks, not product quality risks. Quality risks relate to potential product quality failures that would affect stakeholders, while project risks relate to constraints affecting the project's ability to deliver. The CTFL-AT syllabus distinguishes between product and project risk types.","B":"An unapproved requirement is a requirements management gap, not a quality risk as defined in the CTFL-AT syllabus. Quality risks are potential product quality failures with stakeholder impact, not process compliance issues in the requirements workflow.","C":"A quality risk is defined as a potential product quality problem whose occurrence would negatively affect stakeholders or the business, and which therefore drives risk-based testing prioritisation, as per reference section 3. This definition captures both the probabilistic nature of the risk and its consequence dimension.","D":"A deviation between actual and expected results is a defect, not a quality risk. Quality risks are forward-looking potential problems identified before testing, while defects are identified findings during or after test execution. This option conflates a risk with a test result observation."}},{"q":"You are a tester managing your team's automated test suite across multiple sprints. Your team needs to decide how frequently automated unit tests and acceptance tests should be executed to manage regression risk effectively. Which TWO of the following execution frequency practices BEST support regression risk management in Agile projects? (Select TWO)","o":{"A":"Automated unit tests should be executed on every code commit to provide immediate feedback on code-level regression introduced by the change","B":"Automated unit tests should be executed manually by the tester before each sprint review to ensure results are current","C":"Automated tests should be executed only at the end of the release to avoid slowing down the development team's commit velocity","D":"Automated acceptance tests should be executed at least once per sprint to confirm that previously validated story acceptance criteria remain satisfied across iterations"},"a":["A","D"],"e":{"A":"Executing unit tests on every commit is a fundamental continuous integration practice that provides the fastest possible feedback on regression risk at the code level, as per reference section 2.2.2. This frequency ensures that regressions are detected at the smallest possible change granularity, reducing the effort required to identify and fix the root cause.","B":"Manual initiation of automated tests is an inefficient practice that defeats the automation benefit of continuous, trigger-based execution. Automated tests derive their regression management value from being triggered automatically by code changes, not from manual scheduling before ceremonies.","C":"Executing automated tests only at release end eliminates the continuous feedback benefit that automation provides for regression risk management. Late-stage batch execution means regressions accumulate undetected across all sprints and are discovered too late for cost-effective correction.","D":"Running automated acceptance tests at minimum once per sprint ensures that previously validated functionality is re-verified after new development, directly managing the risk of acceptance-level regressions across iterations, as per reference section 2.2.2. This practice protects the cumulative delivery value of previous sprints against unintended changes."}},{"q":"You are a tester preparing test activities for a sprint that includes a new insurance claims processing feature. The available information includes the user story, acceptance criteria, a quality risk assessment from the previous sprint review, and notes from the team's risk identification workshop. Which action BEST describes how quality risks should be used as a test basis in this Agile sprint?","o":{"A":"Use only the acceptance criteria as the test basis and discard quality risk information since risks are managed by the product owner","B":"Wait for the quality risk assessment to be formally reviewed and approved by the test manager before designing any test cases","C":"Treat quality risks as project documentation only and do not use them to derive test conditions or influence test prioritisation","D":"Derive additional test conditions from the quality risk assessment to supplement acceptance criteria coverage and prioritise testing effort toward the highest-risk areas"},"a":["D"],"e":{"A":"Quality risks are a recognised Agile test basis that testers must actively use to design targeted tests beyond what acceptance criteria alone specify. Discarding risk information reduces test coverage of high-impact failure scenarios. Quality risk management is a shared responsibility, not exclusively a product owner function, and the tester must derive test conditions from identified risks.","B":"Requiring formal approval of risk assessments before test design begins introduces unnecessary bureaucratic delay that contradicts the iterative, just-in-time test preparation approach of Agile. Quality risk information should be used immediately as a test basis as soon as it is identified, not held pending management approval.","C":"Using quality risks as a test basis to derive test conditions and prioritise testing effort is an explicit Agile testing practice described in the CTFL-AT syllabus. Treating risk assessments as documentation-only artefacts removes their primary value as inputs to test design and effort prioritisation.","D":"Quality risks identified through risk assessment constitute a valid and important test basis in Agile projects, enabling testers to supplement acceptance criteria with risk-derived test conditions and allocate testing effort proportionally to risk exposure, as per reference section 3.3.1. Using quality risks as a test basis ensures that testing addresses the most consequential failure scenarios, not only the formally documented acceptance criteria."}},{"q":"You are a tester facilitating a sprint retrospective. The team is reviewing the previous sprint and discussing what to improve. The Scrum Master asks the team to address topics across three areas. Which combination of retrospective topics BEST reflects the structured areas that an Agile retrospective should cover?","o":{"A":"Defect counts, test coverage percentages, and velocity measurements from the completed sprint","B":"Product backlog refinement, sprint planning quality, and release milestone achievement","C":"Individual performance reviews, salary discussions, and career development planning","D":"People and interactions, processes and practices, and tools and technology used by the team"},"a":["D"],"e":{"A":"While metrics such as defect counts and velocity may inform the retrospective discussion, they are not the defined topic categories that structure a retrospective. Retrospective topics address people, process, and tools dimensions rather than individual sprint metrics.","B":"These topics describe planning process quality assessments rather than the three defined retrospective topic areas of people, processes, and tools. Retrospectives are team working practice improvement mechanisms, not planning effectiveness reviews.","C":"Retrospectives are team-level process improvement ceremonies, not individual performance management or HR review sessions. Conducting individual performance reviews within a retrospective would undermine the psychological safety required for honest, team-focused improvement discussion.","D":"Agile retrospectives are structured to address improvements across three primary topic areas: people and their interactions, the team's processes and practices, and the tools and technology they use, as per reference section 1.2.3. This structure ensures the retrospective captures improvement opportunities across all dimensions of the team's working approach."}},{"q":"Which of the following BEST defines a configuration item in the context of Agile testing?","o":{"A":"A risk identified during quality risk assessment that affects the scope of testing for a sprint","B":"Any work product that is placed under configuration management to track and control changes throughout the project","C":"A defect report created when a build verification test fails during a continuous integration run","D":"A sprint backlog task assigned to a specific team member during iteration planning"},"a":["B"],"e":{"A":"A quality risk is a testing planning input, not a configuration item. Configuration items are work products tracked through version control and change management, not risk register entries. This option conflates risk management vocabulary with configuration management terminology.","B":"A configuration item is defined as any work product, including source code, test scripts, or documentation, that is subject to configuration management controls to maintain traceability and integrity across project iterations, as per reference section 2. This definition captures the key characteristic of a configuration item as a managed artefact.","C":"A defect report is a quality reporting artefact, not a configuration item. Configuration items are managed work produ
