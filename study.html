ope is captured in a rigid master document upfront.","D":"Creating a comprehensive master test plan covering all release activities upfront is a classic sequential testing practice. Agile release planning establishes only a high-level test approach, leaving technical details to be determined just-in-time within sprints."}},{"q":"Your Agile team has delivered five consecutive sprints without any significant defects escaping to production. However, during sprint six, three defects are found in production within two days of release. Your team needs to understand why quality suddenly degraded. Which benefit of early and frequent feedback BEST supports your investigation?","o":{"A":"Frequent test feedback from prior sprints provides a quality baseline that helps isolate where the degradation began.","B":"Frequent feedback eliminates all quality risks, so the sprint six defects must have been introduced after release.","C":"The five previous defect-free sprints confirm that the team's process is sound and no investigation is needed.","D":"Frequent stakeholder reviews during sprints six prevented testers from completing their testing activities."},"a":["A"],"e":{"A":"Early and frequent feedback from each sprint's testing activities establishes a consistent quality baseline that the team can use to identify when and where a change in product quality occurred, as per reference section 1.1.3. Comparing sprint six test execution, coverage, and churn data against the baseline isolates variables to locate the process breakdown.","B":"Frequent feedback reduces the risk of defects escaping but cannot eliminate quality risks entirely. Attributing defects strictly to post-release factors without internal process review assumes testing is infallible.","C":"A record of past success does not exempt the team from investigating sudden failures. Quality degradation in sprint six requires immediate diagnostic review to identify why safety nets that previously worked failed to catch the issues.","D":"Stakeholder reviews are standard Agile ceremonies and are not mutually exclusive with testing execution. Blaming ceremony overhead for missed defects ignores the need to analyze test design completeness and risk coverage within the iteration."}},{"q":"Which of the following CORRECTLY identifies tools used for test design, test implementation, and test execution in Agile projects?","o":{"A":"Test design tools replace manual testing entirely, implementation tools produce the Definition of Done, and execution tools approve user stories.","B":"Test design tools support the creation of test cases and test data, implementation tools manage test scripts and automation code, and execution tools run tests and capture results.","C":"Test design tools execute automated regression tests, implementation tools manage defects, and execution tools define acceptance criteria.","D":"Test design tools generate code coverage reports, implementation tools schedule sprint ceremonies, and execution tools manage the product backlog."},"a":["B"],"e":{"A":"Tools do not replace human testing capabilities, establish team agreements like the Definition of Done, or replace the product owner's authority to accept or reject user stories.","B":"In Agile testing, tools are categorized by their specific function across the lifecycle, as per reference section 3.4.1. Test design tools assist in identifying test conditions and data inputs; implementation tools manage automated scripts, framework structures, and versioning; execution tools run the suites and output test logs.","C":"This option misassigns tool capabilities across categories. Test execution tools run regression sets, while design tools focus on upfront test synthesis, and acceptance criteria are defined by human collaboration, not automated execution tooling.","D":"Code coverage analysis is an execution-phase metric, while scheduling ceremonies and backlog tracking are product management capabilities outside the functional boundary of test tool suites."}},{"q":"You are a tester on an Agile team that releases a new feature after each two-week sprint. Business stakeholders review the working software at each sprint review and provide feedback before the next sprint begins. How does this practice BEST support project momentum through early and frequent feedback?","o":{"A":"Stakeholder feedback at sprint reviews is used to extend the sprint duration when rework is required.","B":"Frequent reviews reduce the need for automated testing because stakeholders confirm quality manually.","C":"Regular stakeholder feedback enables the team to adjust direction continuously, preventing large rework cycles.","D":"Sprint reviews replace the need for acceptance testing because stakeholders validate all functionality directly."},"a":["C"],"e":{"A":"Sprint timeboxes are strictly fixed and never extended. If feedback necessitates revisions or rework, those items are formatted as new user stories, prioritized in the product backlog, and planned for a future sprint.","B":"Stakeholder reviews provide high-level validation of business value and feature alignment, not deep verification of functional correctness. They do not substitute for the systematic, granular validation that automated regression testing provides.","C":"Early and frequent feedback on working software allows the team to detect misalignments with user expectations immediately, facilitating minor course corrections within subsequent short cycles, as per reference section 1.1.3. This iterative alignment prevents the compounding of errors that results in massive rework at the end of traditional lifecycles.","D":"Sprint reviews are demonstrations, not validation checkpoints that replace structured test execution. Acceptance testing verifies alignment against clear, functional metrics and criteria, which informal stakeholder review feedback cannot replicate."}},{"q":"You are a tester joining a Scrum team in the second sprint of a new financial compliance system. The first sprint delivered a basic user authentication module. You are now responsible for designing tests incrementally as new features are added each sprint. Which approach BEST describes how to apply incremental test design and developer pairing to support the sprint goals?","o":{"A":"Design tests independently of the development team to maintain tester objectivity throughout the sprint.","B":"Limit test design to unit tests written by developers, deferring all other test types to the dedicated test phase after the release.","C":"Design acceptance tests for sprint two stories collaboratively with developers at the start of the sprint, reusing and extending first-sprint tests as a regression baseline for subsequent iterations.","D":"Complete all acceptance testing for the entire release at the end of the final sprint to ensure full system integration is verified before delivery."},"a":["C"],"e":{"A":"Designing tests in complete isolation from developers undermines the whole-team collaboration model. Objective evaluation is maintained through critical thinking during testing execution, not by refusing to coordinate on upfront test criteria alignment.","B":"Restricting internal testing solely to unit tests and delaying higher-level verification to a separate, late-stage phase reintroduces a phase-gated pipeline that breaks continuous verification.","C":"Incremental test design requires building on previous assets, designing tests for new iteration capabilities collaboratively with developers, and maintaining an evolving regression suite to protect existing functionality, as per reference section 3.1.4. Pairing on test criteria ensures developers build code to satisfy explicitly defined test parameters from the start.","D":"Batching all acceptance testing into a final phase is a traditional sequential practice. Deferring verification creates an accumulation of risk and bugs, making issues exponentially more expensive to locate and resolve at the end of the release."}},{"q":"You are a tester on an Agile team. The product owner has identified a complex new feature requiring input from developers, testers, and a business subject-matter expert to define the acceptance criteria. Which advantage of the whole-team approach does this collaborative activity BEST illustrate?","o":{"A":"The product owner delegates all quality decisions to the development team to reduce planning overhead.","B":"Developers become responsible for acceptance testing when a subject-matter expert is available.","C":"Diverse team skills and perspectives are combined to improve acceptance test quality and completeness.","D":"The tester assumes sole responsibility for writing acceptance criteria on behalf of the business representative."},"a":["C"],"e":{"A":"The whole-team approach centers on distributed quality collaboration, not the complete abandonment of the product owner's decision-making accountability regarding product backlog content or acceptance conditions.","B":"The involvement of a domain expert enhances the team's shared context, but it does not remove the dedicated testing perspective required to plan and execute system validation or displace the tester's specialized skill set.","C":"The whole-team approach optimizes value by combining cross-functional viewpoints--the business value perspective of the stakeholder, the technical feasibility of the developer, and the analytical risk focus of the tester--to produce rigorous, clear, and comprehensive criteria, as per reference section 1.1.2.","D":"Assigning exclusive authorship of acceptance criteria to the tester removes the collaborative interaction required across disciplines, transforming requirements definition back into an isolated, role-siloed activity."}},{"q":"You are a tester helping your team apply the testing quadrants model to plan test activities for the current sprint. The sprint includes a new customer-facing feature as well as underlying service components. Your team asks how the testing quadrants model guides the selection of dynamic testing techniques. Which explanation BEST describes how the testing quadrants model guides dynamic testing in Agile projects?","o":{"A":"The testing quadrants model categorizes dynamic tests by whether they are technology-facing or business-facing, helping teams select test types that address both technical and business quality dimensions within each iteration.","B":"The testing quadrants model applies only to static testing techniques such as reviews and inspections, not to dynamic test execution.","C":"The testing quadrants model requires all tests within a sprint to be automated before they can be assigned to any quadrant.","D":"The testing quadrants model restricts testing activities in each sprint to one quadrant to prevent overlap between test types."},"a":["A"],"e":{"A":"The testing quadrants model serves as a planning taxonomy that categorizes dynamic tests across two axis lines: business-facing versus technology-facing, and supporting the team versus critiquing the product, as per reference section 3.1.3. This map ensures that teams consciously plan code-level technical validations (Q1), functional story tests (Q2), user experience sessions (Q3), and non-functional performance/security gates (Q4) within iterations.","B":"The model is explicitly designed to categorize and balance dynamic testing levels and types across the architecture, ranging from unit testing to specialized non-functional performance benchmarks.","C":"Automation is an implementation choice, not a category requirement. While Q1 is heavily automated, other quadrants like Q3 (exploratory and usability testing) rely inherently on manual human design and execution.","D":"Restricting a sprint to a single quadrant would leave critical layers of the application unverified. Agile delivery requires a balanced distribution of testing across quadrants concurrently based on story needs."}},{"q":"You are a tester reviewing your team's definition of tester work products in an Agile project. A new team member asks which artifacts a tester is responsible for producing compared to a traditional testing project. Which statement BEST describes how tester work products are integrated in Agile compared to non-Agile projects?","o":{"A":"In Agile, defect reports are not required because all defects are resolved within the sprint in which they are discovered.","B":"In Agile, the product owner is responsible for producing test plans because testers focus exclusively on test execution.","C":"In Agile, tester work products such as test plans and defect reports are often lightweight, embedded in shared team tools, and updated iteratively rather than produced as standalone formal documents.","D":"In Agile, testers produce the same formal test documentation as in non-Agile projects, but deliver it at the end of each sprint instead of at the end of the project."},"a":["C"],"e":{"A":"While resolving defects within the sprint is ideal, tracking and logging remain necessary for unresolved issues or release notes. Defects that cannot be resolved immediately are placed back onto the product backlog.","B":"Developing the testing approach remains a core function of the tester. The product owner manages business priorities and acceptance criteria but does not write or own test plans.","C":"Agile documentation is lean and dynamic, replacing massive standalone specification binders with living records, task boards, and automated pipeline outputs integrated directly into the team's project tracking tooling, as per reference section 2.1.2.","D":"Simply executing traditional, heavyweight documentation overhead on a faster, two-week schedule defeats the core Agile principle of minimizing waste and documentation bloat in favor of delivery velocity and working software."}},{"q":"Match each Agile planning activity to the tester contribution that BEST describes the tester's role in that activity. 1. Release planning 2. Iteration planning 3. Daily standup 4. Sprint retrospective Options:","o":{"A":"1-Assigning story points to user stories; 2-Approving the Definition of Done; 3-Demonstrating completed features to stakeholders; 4-Writing detailed test cases for the next sprint","B":"1-Creating acceptance tests from user stories; 2-Defining test approach and identifying high-level risks; 3-Identifying testing process improvements; 4-Reporting test progress and raising impediments","C":"1-Approving the Definition of Done; 2-Assigning story points to user stories; 3-Writing detailed test cases for the next sprint; 4-Demonstrating completed features to stakeholders","D":"1-Defining test approach and identifying high-level risks; 2-Creating acceptance tests from user stories; 3-Reporting test progress and raising impediments; 4-Identifying testing process improvements."},"a":["D"],"e":{"A":"Testers do not assign story points unilaterally, and demonstrating completed features to stakeholders is a sprint review activity, not a standup contribution.","B":"This option reverses the correct allocations for release planning and iteration planning. Defining high-level risk frameworks belongs at the release planning horizon, while creating story acceptance tests happens during iteration planning.","C":"Approving the Definition of Done is a collective, whole-team activity, and writing test cases does not occur during retrospective ceremonies.","D":"This sequence accurately aligns the tester's contributions across planning horizons as defined in the syllabus: outlining strategy and product-level risks at release planning (1), generating story acceptance tests at iteration planning (2), surfacing blocker indicators at the daily standup (3), and refining testing efficiency at retrospectives (4), as per reference section 1.2.5."}},{"q":"You are a tester on an Agile team where a new feature involves integrating with an external payment provider. You proactively schedule a meeting with the developer and a business stakeholder to clarify the integration requirements and acceptance criteria before the sprint begins. Which aspect of the tester's role within an Agile team does this BEST reflect?","o":{"A":"Taking ownership of the business stakeholder's role by defining the acceptance criteria without their input.","B":"Replacing the sprint planning ceremony with individual pre-sprint meetings to avoid group discussion.","C":"Ensuring that testing activities begin only after all integration requirements have been formally approved by the project manager.","D":"Collaborating with developers and stakeholders to resolve ambiguities and ensure testing requirements are understood before implementation."},"a":["D"],"e":{"A":"Testers work collaboratively to refine and test acceptance criteria; they do not dictate requirements independently or displace the business stakeholder's decision-making authority.","B":"Proactive alignment sessions are a valuable supplement to clarify technical ambiguities, but they do not replace the mandatory teamwide commitments made during formal sprint planning.","C":"Agile testing avoids sequential sign-off gates controlled by project managers. Testing activities proceed iteratively as part of the cross-functional team's self-organizing model.","D":"A primary responsibility of the Agile tester is to engage across disciplines early, facilitating communication between technical and business roles to expose requirement gaps and establish testability parameters before development begins, as per reference section 2.3.2."}},{"q":"You are a tester on an Agile team that currently relies on manual regression testing between sprints. The team is experiencing increasing regression failures as the codebase grows with each iteration. You are asked to recommend how continuous integration could reduce this regression risk. Which approach BEST leverages continuous integration to manage regression risk in this context?","o":{"A":"Automate regression tests and execute them as part of the continuous integration pipeline after each code commit so failures are detected immediately.","B":"Schedule manual regression testing sessions at the end of each sprint to review all changes made during the iteration.","C":"Assign a dedicated tester to review each developer's commit manually before it is merged into the main branch.","D":"Reduce the frequency of code commits so that regression testing can be completed fully before the next commit is accepted."},"a":["A"],"e":{"A":"Continuous integration structures regression management by coupling automated test execution directly to code check-ins, providing immediate, rapid feedback on build stability and catching defects at the point of introduction, as per reference section 1.2.4. This automation scales effectively as the codebase expands.","B":"Relying strictly on manual testing at the end of a sprint permits defects to compound undetected for weeks, inflating the cost and complexity of triage and debugging at the tail-end of the iteration.","C":"Inserting a mandatory manual test inspection gate into every individual commit creates a severe process bottleneck that completely halts delivery velocity and violates the core intent of continuous integration automation.","D":"Restricting code commit frequency decreases integration granularity, resulting in massive, high-risk merges where isolation of the root cause of failures becomes increasingly difficult."}},{"q":"You are a tester designing test cases for a user story that specifies a maximum file upload size of 10 MB for a document management system. You need to design test cases using boundary value analysis to address both functional and non-functional behavior. Which test case BEST applies boundary value analysis to a non-functional characteristic derived from this requirement?","o":{"A":"Upload a file of 10.1 MB and verify that the system displays an appropriate rejection error message.","B":"Upload a file of exactly 10 MB and measure the system's response time to verify that it meets the performance threshold defined for maximum-size uploads.","C":"Upload a file of exactly 10 MB and confirm that the system accepts the upload without displaying an error message.","D":"Upload a file of 9.9 MB and verify that it is accepted, confirming behavior just below the boundary limit."},"a":["B"],"e":{"A":"Verifying the rejection of a 10.1 MB file tests functional error enforcement at the limit boundary, validating functional correctness rather than assessing a non-functional attribute.","B":"Constructing a test at the exact capacity threshold (10 MB) to evaluate the system's execution latency or throughput targets a non-functional characteristic (performance) using a structured black box boundary technique, as per reference section 3.3.4.","C":"Checking that a 10 MB file is successfully processed validates standard functional correctness at the boundary edge, not non-functional performance or load resilience parameters.","D":"Testing a 9.9 MB file evaluates standard positive functional behavior just below the structural boundary limit, confirming standard logic compliance."}},{"q":"Which of the following CORRECTLY identifies a value stated in the Agile Manifesto regarding collaboration?","o":{"A":"Contract negotiation over customer collaboration.","B":"Comprehensive documentation over customer interaction.","C":"Process and tools over individuals and interactions.","D":"Customer collaboration over contract negotiation."},"a":["D"],"e":{"A":"This statement completely inverts the manifesto value, which explicitly deprioritizes rigid contract structures relative to building proactive client engagement loops.","B":"The manifesto acknowledges the utility of documentation but subordinates it directly to delivering functional software and maintaining close customer collaboration.","C":"This is an inversion of the core manifesto tenet, which prioritizes human communication and direct collaboration over compliance with rigid processes or tools.","D":"\"Customer collaboration over contract negotiation\" is one of the four foundational value pairings explicitly stated in the Agile Manifesto, prioritizing flexible, ongoing partnership over adversarial or strictly legalistic plan adherence, as per reference section 1.1.1."}},{"q":"You are an embedded tester who has been working closely with the same development team for several consecutive sprints. Your manager raises a concern that your close working relationship with the developers may be reducing your ability to evaluate the software objectively. Which risk to independent testing does this scenario BEST illustrate?","o":{"A":"An embedded tester may lose objectivity over time due to close collaboration with developers, reducing their ability to critically evaluate the software.","B":"An embedded tester becomes more effective as the sprint duration increases because they gain deeper product knowledge.","C":"Embedded testers should be replaced by independent testers after two sprints to maintain objectivity across the release.","D":"The risk of independence loss is eliminated when the tester participates in sprint retrospectives with the full team."},"a":["A"],"e":{"A":"A significant risk of the embedded model is cognitive alignment or confirmation bias, where the tester, through prolonged proximity, adopts the development team's assumptions, blind spots, and social norms, gradually eroding critical distance, as per reference section 2.1.3.","B":"While product familiarity scales with time, deep technical alignment does not automatically protect against the loss of detached, objective critical evaluation highlighted by the risk scenario.","C":"Forcing complete tester replacement every two sprints would destroy domain knowledge accumulation and break team cohesion. The standard mitigation is targeted independent review or rotation over much longer horizons.","D":"Retrospectives are excellent for identifying process changes, but they cannot structurally restore a tester's detached objectivity or counteract the day-to-day cognitive convergence that occurs during close execution pairing."}},{"q":"Which of the following CORRECTLY identifies three recognized Agile software development approaches?","o":{"A":"Kanban, RUP, and Extreme Programming.","B":"Scrum, Kanban, and Extreme Programming.","C":"Scrum, Waterfall, and Kanban.","D":"Extreme Programming, PRINCE2, and Scrum."},"a":["B"],"e":{"A":"The Rational Unified Process (RUP) is a heavyweight, architecture-centric iterative framework that is distinct from the lean, lightweight approaches that characterize Agile development.","B":"Scrum (focused on timeboxed framework management), Kanban (focused on continuous workflow visualization), and Extreme Programming (focused on rigorous engineering practices like TDD) are all explicitly recognized Agile delivery models, as per reference section 1.2.1.","C":"Waterfall is a strictly sequential, phase-gated framework that is the conceptual opposite of the adaptive, change-welcoming principles of Agile testing.","D":"PRINCE2 is a structured project management and governance methodology, not an iterative engineering or software development framework."}},{"q":"In the test pyramid, which test level is represented at the top and is characterized by the fewest tests and highest execution cost?","o":{"A":"Performance tests, because they have the longest execution time of any test level.","B":"System and acceptance-level tests, including GUI-based automated tests.","C":"Unit tests, because they are the most comprehensive tests and cover the widest range of scenarios.","D":"Integration tests, because they require the most complex test environment setup across all levels."},"a":["B"],"e":{"A":"Performance testing is a non-functional verification category that evaluates operational capability, rather than a discrete functional architectural layer of the standard test pyramid.","B":"The apex of the test pyramid comprises system and end-to-end user acceptance tests (often driven via the GUI), which are kept intentionally sparse due to their high execution latency, vulnerability to UI change breakage, and high maintenance costs, as per reference section 3.1.2.","C":"Unit testing forms the wide, expansive base of the pyramid, representing the layer with the highest volume of lightweight, highly stable automated checks.","D":"Integration testing occupies the intermediate middle tier of the model, bridging the granular code-level checks at the base with the sparse end-to-end flows at the apex."}},{"q":"You are a tester on an Agile team. The product owner asks for a summary of the current test quality status to share with external stakeholders. Which combination of metrics BEST communicates both test progress and product quality in an Agile project?","o":{"A":"The total number of test cases written and the percentage of requirements documented indicate test coverage and quality.","B":"Test pass and fail rates alongside defect density per user story provide both progress and quality visibility.","C":"Sprint velocity and team capacity utilization provide the most reliable indicators of test progress and product quality.","D":"The number of user stories completed and the number of developers on the team indicate the current quality level."},"a":["B"],"e":{"A":"Test case construction volume and documentation percentages are leading indicators of preparation effort; they provide no information regarding actual execution trends or underlying system stability.","B":"Combining execution pass/fail metrics (which tracks validation execution progress) with defect density calculations (which normalizes the volume of uncovered bugs against delivery scope) provides an objective quality status indicator, as per reference section 2.2.1.","C":"Velocity and resource capacity tracking are standard project delivery throughput indicators that provide zero diagnostic insight into defect patterns, script trends, or code stability.","D":"Completed story volume tracks delivery speed, and team size represents headcount; neither serves as an indicator of code health, coverage gaps, or residual regression risks."}},{"q":"In Scrum, which term describes the maximum fixed-length period within which the development team must deliver a potentially shippable product increment?","o":{"A":"Sprint.","B":"Iteration backlog.","C":"Definition of Done.","D":"Release cycle."},"a":["A"],"e":{"A":"A Sprint is a strictly bounded, timeboxed iteration of fixed length (typically one to four weeks) that serves as the core cadence vehicle for Scrum delivery, producing a potentially releasable product increment at its conclusion, as per reference section 1.2.1.","B":"The sprint or iteration backlog is the prioritized subset of user stories and associated functional tasks committed for execution within the timebox, not the time period itself.","C":"The Definition of Done represents the shared checklist of quality and compliance exit parameters that an increment must satisfy to be considered complete; it is not a temporal boundary.","D":"A release cycle describes the overarching operational cadence through which accumulated increments are pushed out to users, often encompassing multiple sprints."}},{"q":"You are part of an Agile team holding a feature discussion for a new reporting module. The product owner, a developer, and you, the tester, each contribute questions and concerns about the feature before implementation begins. Which benefit of the whole-team approach does this BEST demonstrate?","o":{"A":"The tester is responsible for facilitating all feature discussions to ensure quality is represented.","B":"Developers must not participate in feature discussions to avoid influencing acceptance criteria prematurely.","C":"Feature discussions are conducted exclusively in sprint review meetings to maintain sprint focus.","D":"Cross-role involvement in feature discussions reduces ambiguity and surfaces quality risks early."},"a":["D"],"e":{"A":"Facilitation is a shared capability often driven by the Scrum master or self-organized by the team; it is not an exclusive mandate forced upon the tester role.","B":"Excluding developers strips the discussion of essential technical feasibility and architectural constraint context, increasing the likelihood of unachievable criteria design.","C":"Restricting requirements clarification solely to end-of-sprint review sessions is a trailing, post-development mechanism that guarantees high rework costs for misalignments.","D":"Synchronous, multi-perspective alignment sessions bring business, development, and testing perspectives together simultaneously, allowing ambiguities to be resolved and bugs in requirements to be caught before code is ever written, as per reference section 1.1.2."}},{"q":"You are working with a developer and a product owner to refine a user story for a new file export feature. The current story describes only functional behavior. You identify that the story should also address non-functional characteristics before it can be considered testable. Which non-functional characteristic is MOST appropriate to include in the acceptance criteria for this story?","o":{"A":"A list of all third-party libraries that must be used in the export implementation.","B":"The maximum time permitted for the export operation to complete under a specified file size.","C":"A description of the database schema used to store the exported file records.","D":"The name of the developer responsible for implementing the export functionality."},"a":["B"],"e":{"A":"Mandating specific code library assets is a low-level technical implementation constraint for developers, rather than an observable user-facing operational requirement.","B":"Establishing a measurable execution time constraint under defined input capacity transforms an abstract performance expectation into a verifiable, testable non-functional acceptance criterion, as per reference section 1.2.2.","C":"Specifying internal database schema structural configurations focuses on design specifics that constrain implementation mechanics rather than describing verifiable, user-observable outcomes.","D":"Resource assignment tracking is a basic team task coordination detail that has no functional relationship to system quality parameters or feature verification criteria."}},{"q":"During release planning, which activity BEST describes how a tester adds value by improving story quality?","o":{"A":"Approving the release plan by confirming all stories have been technically implemented.","B":"Identifying stories that lack clear and testable acceptance criteria and raising them for clarification.","C":"Writing all acceptance tests for stories scheduled in the first iteration of the release.","D":"Assigning story points to user stories on behalf of the development team."},"a":["B"],"e":{"A":"Release planning is a forward-looking scheduling exercise; stories are not yet implemented at this point. Plan approval is a product owner and stakeholder capability.","B":"Testers add early preventative value during high-level release planning by acting as a testability filter, identifying poorly defined or ambiguous criteria before they are finalized into the release timeline, as per reference section 1.2.5.","C":"Generating detailed, granular acceptance test cases is a tactical activity performed during iteration planning or within the sprint itself, not during high-level release scoping.","D":"Story point allocation requires technical estimation consensus from the individuals who will execute the implementation; testers do not allocate sizing values on behalf of developers."}},{"q":"You are a tester preparing to design tests for a new transaction processing feature. The team has provided you with a defect taxonomy from previous releases and a set of applicable regulatory standards for financial data handling. How should you use these artifacts as a test basis to support your testing activities for this feature?","o":{"A":"Use the defect taxonomy as the sole test basis and disregard the regulatory standards because compliance testing is the responsibility of the legal team.","B":"Use the regulatory standards to write the product's legal disclaimers and use the defect taxonomy to assign defect severity levels to discovered issues.","C":"Defer the use of both artifacts until after initial exploratory testing is complete to avoid introducing bias into the test design process.","D":"Use the defect taxonomy to identify categories of defects historically likely in similar features and design tests targeting those risk areas; use the regulatory standards to derive test conditions that verify compliance with required data handling rules."},"a":["D"],"e":{"A":"Ignoring industry regulatory standards strips the test basis of mandatory compliance parameters, exposing the application to significant data handling risk. Compliance verification is a core testing capability.","B":"Drafting legal content is outside the functional scope of the testing team, and taxonomies are used to guide test design exploration, not to arbitrate severity impact classifications.","C":"Deferring foundational reference documentation to the post-exploration phase wastes validation time by forcing the tester to work without known risk or compliance direction.","D":"Utilizing a defect taxonomy allows the tester to apply historical failure patterns to current test design, while regulatory standards provide clear boundaries for compliance conditions, creating a comprehensive test basis, as per reference section 3.3.1."}},{"q":"Which of the following CORRECTLY describes the relationship between configuration management and build verification testing in Agile projects?","o":{"A":"Build verification testing replaces configuration management by validating all component versions through test execution.","B":"Configuration management is performed only after build verification tests pass to avoid modifying a failing build.","C":"Build verification tests are triggered manually by the configuration manager after each release to production.","D":"Configuration management ensures consistent environments so that build verification tests produce reliable and repeatable results."},"a":["D"],"e":{"A":"Build verification testing evaluates basic functional stability; it lacks the capability to act as a version control or tracking system for software repository assets.","B":"Configuration management is a continuous pipeline practice that controls source code check-ins from the start of development, rather than a reactive process step gated by test completion.","C":"Build verification testing is automated and embedded within the continuous integration pipeline, triggering immediately upon build assembly rather than via manual human coordination at release points.","D":"Configuration management provides environment baseline integrity, ensuring dependencies, configurations, and repository versions are stable so that build verification scripts run reliably without environment-induced false positives, as per reference section 2."}},{"q":"You are a tester attending a sprint planning meeting with the product owner to discuss testing effort estimates for the upcoming iteration. The sprint backlog includes four user stories of varying complexity and risk. The product owner asks you to explain how you will estimate testing effort for each story. Which explanation BEST describes the approach to estimating testing effort in a discussion with the product owner?","o":{"A":"Testing effort will be estimated based on the complexity of each story's acceptance criteria, the associated quality risks identified during planning, and the test types required to achieve adequate coverage.","B":"Testing effort will be equal for all stories to ensure that the sprint workload is distributed fairly across the team.","C":"Testing effort will be determined solely by the number of test cases written in the previous sprint for stories of similar scope.","D":"Testing effort will be allocated based on the product owner's priority ranking of stories, with the highest-priority story receiving the most testing time."},"a":["A"],"e":{"A":"Calibrating testing effort in Agile requires analyzing the unique risk profile of the feature, the direct complexity of its criteria, and the specific validation types (such as functional, security, or load) needed to achieve definition of done parameters, as per reference section 3.2.2.","B":"Distributing effort uniformly across all items treats low-risk cosmetic updates and high-risk database migrations identically, misallocating validation capacity.","C":"Relying strictly on raw test case counts from prior cycles creates a lagging, arbitrary projection metric that ignores the specific operational requirements or risks of new stories.","D":"Business priority ranking focuses on commercial value, not technical risk. A minor feature down the backlog might require extensive integration testing effort due to structural legacy complexity."}},{"q":"Which of the following CORRECTLY defines exploratory testing in the context of Agile projects?","o":{"A":"A type of regression testing used to re-execute previously passing tests after a new build is deployed.","B":"A method of testing that requires the tester to follow a strict sequence of predefined steps without deviation.","C":"A simultaneous learning, test design, and test execution activity guided by the tester's knowledge and judgment.","D":"A testing approach in which all test cases are defined upfront in a test plan before any test execution begins."},"a":["C"],"e":{"A":"Regression testing focuses on automated, repeatable confirmation of existing code pathways, which is distinct from the unscripted, investigative nature of exploratory testing.","B":"Predefined step compliance characterizes scripted testing, a technique that restricts the tester's ability to react to system anomalies or pursue unmapped defects.","C":"Exploratory testing is an unscripted technique where the tester integrates system exploration, test synthesis, and immediate execution concurrently, adapting their approach dynamically based on real-time observations, as per reference section 3.","D":"Synthesizing all test cases upfront within a fixed plan represents specification-based testing, which is distinct from the fluid, learning-driven cycle of exploratory testing."}},{"q":"You are reviewing the sprint test plan for a feature that enables business users to generate custom financial reports. Your team is discussing which test quadrant best characterizes the functional story tests planned for this feature. Which description BEST explains why functional story tests for this feature belong in Quadrant Q2?","o":{"A":"Quadrant Q2 contains technology-facing tests that support the team by validating internal component interfaces and API contracts.","B":"Quadrant Q2 contains business-facing tests that critique the product by identifying usability defects through user-centered evaluation.","C":"Quadrant Q2 contains technology-facing tests that critique the product by measuring system performance under business transaction volumes.","D":"Quadrant Q2 contains business-facing tests that support the team by verifying that the delivered functionality meets the business requirements defined in user stories."},"a":["D"],"e":{"A":"Validating internal component interfaces and structural code contracts is a technology-facing, development-support function belonging to Quadrant Q1.","B":"Evaluating user experience quality and exposing usability issues through user-centered evaluation corresponds to Quadrant Q3 (business-facing, product critique).","C":"Measuring non-functional transaction execution speed, capacity, or security constraints fits within Quadrant Q4 (technology-facing, product critique).","D":"Quadrant Q2 focuses on business-facing tests that support the development team by demonstrating that features satisfy defined functional behaviors and user story expectations, as per reference section 3.1.3."}},{"q":"You are a tester on an Agile team where a developer has just raised a concern that several test cases you wrote are slowing down the sprint. Rather than defending the tests, you acknowledge the concern and propose a collaborative discussion to identify which tests can be optimized. Which Agile tester skill does your response BEST demonstrate?","o":{"A":"Strong technical skills in test automation that allow the tester to immediately resolve performance issues.","B":"Formal escalation of the developer's concern to the Scrum master to ensure it is addressed in the retrospective.","C":"A positive, solution-oriented mindset that prioritizes collaboration and team progress over personal defensiveness.","D":"The ability to independently rewrite all test cases without input from the developer to demonstrate responsiveness."},"a":["C"],"e":{"A":"Unilateral technical remediation attempts ignore the interpersonal team alignment context necessary to address the developer's broader feedback root cause.","B":"Jumping immediately to formal management escalation avenues introduces unnecessary friction and bypasses direct, collaborative peer coordination.","C":"Agile testers must possess a constructive, solution-oriented interpersonal approach that embraces feedback from peers, values whole-team progress, and resolves efficiency concerns through cross-functional dialogue rather than defensive resistance, as per reference section 2.3.1.","D":"Redesigning the assets in complete isolation removes the developer's perspective from the solution, risking a rewrite that fails to resolve the pipeline constraint."}}]},{"id":5,"title":"Practice Exam 6","questions":[{"q":"Which Kanban concept measures the total elapsed time from when a work item enters the workflow until it is delivered to the customer?","o":{"A":"Throughput","B":"Work in progress","C":"Lead time","D":"Cycle time"},"a":["C"],"e":{"A":"Throughput measures the number of work items completed within a given time period. It is a rate-based capacity metric, not a measure of the time taken to deliver a single work item.","B":"Work in progress refers to the count of items actively being worked on within the system at any given moment. Limiting work in progress is a core Kanban practice, but it does not measure the delivery duration of individual items.","C":"Lead time in Kanban measures the total duration from when a work item is requested or enters the system to when it is completed and delivered, as per reference section 1.2.1. It is a key flow metric used to optimize delivery predictability.","D":"Cycle time measures only the active working period from when work begins on an item to when it is finished, excluding any upstream waiting time. Cycle time is a subset of lead time and does not capture the full duration from request entry to delivery."}},{"q":"Which category of tools available to Agile testers includes cloud computing platforms and virtualization technologies used to provision and manage test environments on demand?","o":{"A":"Test data management tools","B":"Defect management tools","C":"Static analysis tools","D":"Infrastructure and environment management tools"},"a":["D"],"e":{"A":"Test data management tools support the creation, storage, masking, and provisioning of test data, not the provisioning of computing infrastructure or virtual environments. These tools address data availability, not environment availability.","B":"Defect management tools support the logging, tracking, prioritization, and resolution workflow for defects. They do not provide infrastructure provisioning or virtualization capabilities for test environments.","C":"Static analysis tools examine source code or other artifacts without executing them to identify potential defects or coding standard violations. They operate on code artifacts, not on computing infrastructure.","D":"Cloud computing and virtualization technologies are categorized as infrastructure and environment management tools in Agile testing, enabling on-demand environment provisioning and configuration, as per reference section 3.4.1. These tools support the Agile need for rapid, repeatable environment setup."}},{"q":"You are a tester on an Agile team deciding whether to adopt a new test automation framework. The development team lacks automation experience, and the product owner is concerned about delivery speed. Which whole-team approach BEST supports this situation?","o":{"A":"The team defers automation decisions to the next sprint retrospective to avoid disrupting current sprint velocity.","B":"The tester shares automation knowledge with developers so the whole team can contribute to building and maintaining automated tests.","C":"The tester takes sole ownership of automation to protect quality and shields the team from technical complexity.","D":"The product owner decides which tests to automate to ensure business priorities drive automation investment."},"a":["B"],"e":{"A":"Deferring capability-building decisions without addressing the current knowledge gap does not leverage the whole-team approach. Retrospectives address process improvement retrospectively, not real-time skill-sharing decisions needed during sprint execution.","B":"The whole-team approach encourages testers to transfer skills and share quality responsibilities across all team members, as per reference section 1.1.2. Enabling developers to contribute to automation addresses both the knowledge gap and the delivery speed concern by broadening the team's capacity.","C":"Assigning automation ownership exclusively to the tester contradicts the whole-team approach. This creates a bottleneck, limits team resilience, and prevents the shared quality ownership that is a core advantage of cross-functional Agile teams.","D":"Automation decisions require technical judgment about testability and risk, not solely business priority input. Assigning these decisions to the product owner bypasses the collaborative technical expertise of the whole team."}},{"q":"You are an experienced tester working on an Agile project where junior developers have limited understanding of testability principles when writing code. Which whole-team approach activity BEST addresses this gap?","o":{"A":"Conducting informal knowledge-sharing sessions where the tester explains testability practices to developers during sprint activities.","B":"Writing a testability guidelines document and placing it in the team's shared repository for developers to consult independently.","C":"Raising the concern with the scrum master to address it through a formal training program outside the sprint.","D":"Requesting that the product owner add testability stories to the product backlog to make the gap formally visible."},"a":["A"],"e":{"A":"The whole-team approach promotes tester knowledge transfer to help team members develop shared quality awareness, as per reference section 1.1.2. Informal coaching during sprint activities builds lasting testability understanding without disrupting delivery flow.","B":"Passive documentation is less effective than active knowledge sharing for building practical testability understanding. The whole-team approach emphasizes collaborative learning and direct interaction over self-directed reference materials.","C":"Routing a capability gap through formal external training delays improvement and separates learning from practical application. The whole-team approach favors in-sprint collaboration and direct peer learning over formal programs.","D":"Testability practices are a technical quality concern addressed through team collaboration, not a backlog item representing business value. Adding testability improvement as a formal story misrepresents the nature of whole-team quality responsibility."}},{"q":"Your Agile team has started a new project where the business representative provides requirements through informal verbal conversations only. After two sprints, the team delivers features that do not match business expectations. Which benefit of early feedback MOST directly explains how this problem could have been prevented?","o":{"A":"Early feedback allows the team to demonstrate working software to the product owner at the end of every sprint.","B":"Early feedback ensures the team completes all planned user stories before the sprint review meeting.","C":"Early feedback reduces the risk of requirements misunderstanding by confirming shared understanding between the team and the business representative before development begins.","D":"Early feedback increases delivery speed by allowing the team to skip formal documentation of requirements."},"a":["C"],"e":{"A":"End-of-sprint demonstrations occur after development is complete and detect misalignment too late to avoid rework within the same sprint. This is feedback that follows rather than prevents the problem.","B":"Story completion is a delivery metric, not a mechanism for preventing requirements misunderstanding. Completing stories that have been misunderstood still results in features that fail to meet business expectations.","C":"Early feedback enables the team to validate their interpretation of requirements with stakeholders before investing development effort, as per reference section 1.1.3. This reduces the likelihood of building functionality that does not match business expectations.","D":"Eliminating documentation without establishing shared understanding increases misalignment risk. Early feedback supplements rather than replaces the need for clear requirements communication, and this option introduces additional risk rather than preventing misalignment."}},{"q":"You are a tester on an Agile team automating the deployment pipeline. The team wants to expand automation beyond test execution to include activities that support consistent and repeatable test execution across environments. Which automation tasks BEST support this goal?","o":{"A":"Automating test result analysis to classify failures as product defects or environment issues using predefined categorization rules.","B":"Automating test data generation to create consistent datasets for each test run and automating deployment of the test environment to ensure a known, reproducible state before each execution cycle.","C":"Automating test case selection to dynamically prioritize which test cases run each sprint based on recent code changes.","D":"Automating defect logging to create tickets in the defect management system whenever a test fails during pipeline execution."},"a":["B"],"e":{"A":"Result classification automation operates after test execution and does not affect the consistency of the execution environment or test data. It addresses post-execution analysis, not pre-execution setup reliability.","B":"Automating test data generation and environment deployment are essential tasks that eliminate variability in test pre-conditions, as per reference section 2.2.2. These tasks ensure each test run starts from a consistent, known state, enabling repeatable results.","C":"Dynamic test selection is a test management strategy rather than an infrastructure support task. While useful, it does not address the goal of ensuring consistent and reproducible test environments and pre-conditions before execution.","D":"Automated defect logging is an outcome-processing activity triggered after test execution. It does not contribute to the consistency and reproducibility of the test environment or test data state before execution."}},{"q":"You are a tester writing test cases from a user story for an online booking application: \"As a customer, I want to search for available rooms by date range so that I can select and book a room that fits my travel schedule.\" Which approach BEST demonstrates writing test cases that address both functional and non-functional behavior derived from this user story?","o":{"A":"Writing ABA partition tests for the date range input fields and using them as the complete test case set for both functional and non-functional coverage.","B":"Writing functional test cases that verify rooms are filtered correctly by the entered date range and non-functional test cases that verify search results return within an acceptable response time under normal load.","C":"Writing only functional test cases based on the acceptance criteria and deferring non-functional testing to a dedicated performance testing phase after the sprint.","D":"Writing test cases that verify the booking confirmation email is sent correctly after a room is selected, as this represents the critical user journey outcome."},"a":["B"],"e":{"A":"Equivalence partitioning addresses only functional input variation for the date range parameter. It does not provide non-functional coverage such as performance testing, and using it as the complete test set leaves critical quality dimensions unaddressed.","B":"Test cases derived from user stories must address both functional behavior confirming the user goal is achieved and non-functional behavior confirming quality characteristics such as performance are satisfied, as per reference section 3.3.4. Both test types are derivable from the story and together provide comprehensive coverage.","C":"Deferring non-functional testing to a separate phase contradicts the Agile principle of addressing both functional and non-functional behavior within the iteration. Test cases for both dimensions should be derived from the user story during the sprint.","D":"The booking confirmation is outside the scope of the search user story. Test cases must be derived strictly from the behavior described in the current story, which covers search functionality, not the downstream booking confirmation flow."}},{"q":"In behavior-driven development, which structural format is used to express scenarios that can be directly translated into executable test code by a BDD framework?","o":{"A":"Setup-Execute-Verify","B":"Input-Process-Output","C":"Given-When-Then","D":"Arrange-Act-Assert"},"a":["C"],"e":{"A":"Setup-Execute-Verify is an informal description of test execution phases, not a recognized BDD scenario format. BDD frameworks require the specific Given-When-Then syntax to parse and generate executable test scenarios.","B":"Input-Process-Output is a general systems thinking model, not a BDD scenario format. It does not provide the precondition-trigger-outcome structure that BDD frameworks require for test code generation.","C":"The Given-When-Then format is the standard BDD scenario structure that describes preconditions, actions, and expected outcomes in a way that BDD frameworks can parse and generate executable test code, as per reference section 3.1.1. This format bridges business-readable specifications and automated test implementation.","D":"Arrange-Act-Assert is a unit testing pattern used to structure test code within test frameworks, not a BDD scenario format. It is not used as a human-readable specification format for BDD framework code generation."}},{"q":"You are a tester on an Agile team practicing acceptance test-driven development for a user story about generating a digital invoice when a purchase is completed. The product owner, developer, and tester have collaborated to produce ATDD examples. Which outcome BEST demonstrates that the ATDD examples are serving as living documentation for the user story?","o":{"A":"The ATDD examples are expressed as executable test cases that run against the system after each code change, providing a continuously verified record of the story's current behavior.","B":"The ATDD examples are printed and distributed to stakeholders as a reference document describing expected system behavior at project completion.","C":"The ATDD examples are stored in the project wiki and reviewed by the product owner at the end of each sprint to confirm they remain accurate.","D":"The ATDD examples are used by developers as design specifications during implementation and archived after the story is accepted as done."},"a":["A"],"e":{"A":"Living documentation in ATDD refers to examples that are automated and continuously executed, so they always reflect the system's current verified behavior rather than becoming outdated reference documents, as per reference section 3.3.3. Continuous verification ensures the examples remain accurate and trustworthy as the system evolves.","B":"Printed documents become stale as the system evolves and cannot be continuously verified. Living documentation requires automated execution against the current system, not static distribution of written descriptions.","C":"Manual periodic review does not ensure continuous accuracy. Living documentation achieves accuracy through automated execution on every code change, not through scheduled human review of stored documentation.","D":"Archiving examples after acceptance removes them from active execution. Living documentation must remain active and continuously run against the system throughout the product lifecycle, not be archived after initial story acceptance."}},{"q":"You are managing quality for an Agile project where a team member argues that the whole-team approach makes independent testing redundant. Which argument BEST justifies the objective evaluation benefit of independent testing in this context?","o":{"A":"Independent testers reduce the development team's workload by taking full ownership of all test execution so developers can focus on coding.","B":"Independent testers improve test automation coverage by bringing specialized scripting skills the development team lacks.","C":"Independent testers ensure regulatory compliance by validating that all required test documentation has been produced and archived.","D":"Independent testers bring an unbiased perspective that reduces confirmation bias, enabling them to identify defects and quality risks the development team may overlook due to familiarity with the code."},"a":["D"],"e":{"A":"Independent testing does not transfer complete test ownership away from the development team. The whole-team approach retains shared quality responsibility, and independent testing supplements team testing rather than replacing it.","B":"Automation skill is not the defining benefit of independent testing. The objective evaluation benefit derives from cognitive independence, not from technical automation capability, and this argument does not address the redundancy concern.","C":"Compliance documentation is not the primary justification for independent testing in Agile. Objective evaluation of product quality through unbiased test design and execution is the core benefit, distinct from documentation and regulatory activities.","D":"The key benefit of independent testing is objective evaluation free from the familiarity effects that affect developers testing their own work, as per reference section 2.1.3. This cognitive independence increases defect detection effectiveness in complex or high-risk areas."}},{"q":"Which of the following activities does a tester perform during iteration planning? I. Reviewing user stories for testability. II. Defining the release roadmap for upcoming sprints. III. Estimating testing effort based on story complexity and team velocity. IV. Identifying functional and non-functional test conditions for each story.","o":{"A":"I, II, III, and IV","B":"I, III, and IV","C":"I, II, and III","D":"II, III, and IV"},"a":["B"],"e":{"A":"Defining the release roadmap is outside the scope of iteration planning. Iteration planning is bounded to the current sprint and does not encompass multi-sprint delivery planning activities.","B":"During iteration planning testers review stories for testability, estimate testing effort using velocity data, and identify test conditions for each story, as per reference section 1.2.5. These activities are bounded by the current sprint. Defining a release roadmap is a release planning activity outside the scope of iteration planning.","C":"Defining the release roadmap is a release planning activity, not an iteration planning task. Iteration planning focuses on selecting and preparing stories for the immediate sprint, and testers do not define cross-sprint roadmaps during this ceremony.","D":"The release roadmap is established during release planning, not iteration planning. Including roadmap definition conflates two distinct planning ceremonies and misrepresents tester responsibilities at the iteration level."}},{"q":"Which term describes a software item placed under configuration management whose version, content, and status are formally tracked throughout the development lifecycle?","o":{"A":"Configuration item","B":"Build verification test","C":"Test basis","D":"Work product"},"a":["A"],"e":{"A":"A configuration item is a software work product placed under configuration management for formal version and status tracking, as per reference section 2. Configuration management ensures that all tracked items have a known state and history, supporting traceability and build reproducibility.","B":"A build verification test is a lightweight automated test suite executed after a build to confirm the build is stable enough for further testing. It is a testing activity, not a software artifact tracked under configuration management.","C":"The test basis refers to the body of knowledge used to derive test cases, such as requirements, designs, or user stories. It is a source of test information, not a configuration-managed software item under formal version control.","D":"Work product is a broad term for any output of a software development activity, not a formal configuration management construct. Not all work products are placed under configuration control or tracked with formal version and status management."}},{"q":"You are a tester in a Scrum team preparing for sprint planning. The product owner wants to include a complex payment processing feature in the sprint. You have identified several quality risks related to transaction failures under concurrent load. How should you BEST apply your tester role to maintain quality credibility with the team during sprint planning?","o":{"A":"Requesting that the development team add unit tests for the payment feature before it is included in the sprint backlog.","B":"Presenting the identified quality risks with supporting evidence and proposing specific risk-based test coverage strategies that the team can factor into their sprint commitment decision.","C":"Recommending that the payment feature be moved to a future sprint until a dedicated performance testing phase can be scheduled outside the sprint cadence.","D":"Accepting the sprint commitment as defined by the product owner and raising quality concerns in the retrospective after the sprint is complete."},"a":["B"],"e":{"A":"Requesting pre-sprint unit tests misplaces responsibility and does not address the identified concurrent load risks. The tester's role in sprint planning is to contribute risk analysis and coverage strategies, not to direct developer pre-sprint activities.","B":"A Scrum tester builds credibility by contributing evidence-based quality risk analysis that informs the team's sprint commitment, as per reference section 3.1.4. Proposing concrete test strategies demonstrates both technical judgment and collaborative value, supporting informed sprint planning decisions.","C":"Recommending that the payment feature be moved to a future sprint until a dedicated performance testing phase can be scheduled outside the sprint cadence contradicts Agile integrated testing principles and removes the tester from the sprint planning decision. Quality risk analysis should inform the sprint commitment, not defer it to a separate phase.","D":"Raising quality risks after sprint commitment removes the tester's influence from planning decisions where risk information has the most value. Quality risk analysis must occur before commitment to enable informed sprint planning."}},{"q":"You are a tester on a team that adopted two-week sprints three sprints ago. You notice the team consistently discovers integration defects only during the final days of each sprint. Which benefit of early and frequent feedback MOST directly addresses this problem?","o":{"A":"Frequent feedback improves team morale by confirming the team is on track throughout the sprint.","B":"Frequent feedback allows the product owner to reprioritize backlog items based on team progress each day.","C":"Frequent feedback ensures that the team's velocity is accurately tracked across multiple sprints.","D":"Frequent feedback enables defects to be identified and corrected earlier in the sprint, reducing late-stage integration failures."},"a":["D"],"e":{"A":"Morale improvement is an indirect benefit of feedback, not the mechanism that prevents integration defects from appearing late in the sprint cycle. Team confidence does not replace the need for earlier detection triggers.","B":"Backlog reprioritization addresses planning adjustments, not integration quality within a sprint. Reprioritization does not resolve the root cause of defects surfacing at the end of the sprint.","C":"Velocity tracking is a planning and capacity metric, not a quality feedback mechanism. Tracking velocity does not prevent or accelerate detection of integration defects within a sprint.","D":"Early and frequent feedback shortens the time between defect introduction and detection, as per reference section 1.1.3. Increasing feedback frequency within the sprint ensures integration issues surface earlier, giving the team time to resolve them before sprint end."}},{"q":"You are a tester collaborating with developers and a business representative to write acceptance criteria for a user story: \"As a registered user, I want to reset my password so that I can regain access to my account.\" Which tester contribution BEST improves the testability of this user story?","o":{"A":"Suggesting the story be split into functional and non-functional stories before writing acceptance criteria.","B":"Recommending that automated regression tests be created immediately after the story is accepted.","C":"Proposing specific, measurable conditions such as the maximum number of reset attempts allowed and the expiry time of the reset link.","D":"Requesting that the business representative provide a detailed workflow diagram for the password reset process."},"a":["C"],"e":{"A":"Story splitting is a backlog refinement decision, not a tester contribution to acceptance criteria. Splitting does not inherently improve the testability of the current story and may not be appropriate at this stage.","B":"Recommending automation timing addresses test execution planning rather than acceptance criteria definition. Automation planning is a separate activity from writing testable acceptance criteria for the user story.","C":"Testers improve user story testability by introducing precise, verifiable acceptance criteria that define boundary conditions and observable outcomes, as per reference section 1.2.2. Specific measurable conditions enable the team to design unambiguous tests that confirm the story is complete.","D":"Requesting a diagram shifts the responsibility for acceptance clarity to the business representative rather than contributing the tester's own expertise. Testability improvement comes from translating requirements into specific, verifiable criteria, not from requesting supplementary documentation."}},{"q":"In Scrum, which term describes the ordered list of work items selected from the product backlog by the development team to complete during a single sprint?","o":{"A":"Product backlog","B":"Release plan","C":"Definition of Done","D":"Sprint backlog"},"a":["D"],"e":{"A":"The product backlog is the full ordered list of all work potentially needed in the product, owned by the product owner. It spans all future iterations and is not the subset of items committed to for a single sprint.","B":"A release plan describes the intended scope and schedule across multiple sprints toward a product release. It operates at a higher planning level and does not represent the specific work selected for one sprint.","C":"The Definition of Done is a shared checklist of quality criteria that work must satisfy to be considered complete. It is a quality standard, not a list of work items selected for a sprint iteration.","D":"The sprint backlog is the set of product backlog items the team selects for the sprint along with the plan for delivering them, as per reference section 1.2.1. It reflects the team's commitment derived through the pull principle and represents work planned for that iteration only."}},{"q":"Consider the following statements about the testing quadrants model. I. Quadrant 1 contains technology-facing tests that support the team, including unit and component tests. II. Quadrant 2 contains business-facing tests that support the team, including functional tests and examples. III. Quadrant 3 contains business-facing tests that critique the product, including exploratory and usability testing. IV. Quadrant 4 contains technology-facing tests that critique the product, including performance and security testing. Which of the following statements are CORRECT?","o":{"A":"I, II, III, and IV","B":"I and III only","C":"II and IV only","D":"I, II, and IV only"},"a":["A"],"e":{"A":"All four statements accurately describe the testing quadrants model as defined in the CTFL-AT syllabus, as per reference section 3.1.3. Each quadrant is correctly identified by its axis position and by representative test types assigned to it.","B":"This combination omits the correct descriptions for Quadrants 2 and 4. Statement II correctly places functional tests and examples in Quadrant 2, and Statement IV correctly places performance and security testing in Quadrant 4.","C":"This combination omits the correct descriptions for Quadrants 1 and 3. Statement I correctly identifies Quadrant 1 as technology-facing tests supporting the team, and Statement III correctly identifies Quadrant 3 as business-facing tests that critique the product.","D":"Statement III is also correct. Exploratory testing and usability testing are accurately described as business-facing tests that critique the product in Quadrant 3. Excluding Statement III produces an incomplete view of the quadrants model."}},{"q":"You are a tester on an Agile team that recently introduced a continuous integration pipeline. During the first two sprints, the pipeline frequently fails late in the build sequence due to integration defects not caught by unit tests. Which continuous integration practice MOST directly reduces the risk of these late-stage pipeline failures?","o":{"A":"Assigning a dedicated team member to monitor the pipeline dashboard and manually trigger re-runs when a build fails.","B":"Extending the automated test suite in the pipeline to include static analysis and integration-level checks that execute on every code commit, so defects are detected earlier in the build sequence.","C":"Scheduling the full automated test suite to run once per day during off-peak hours to reduce pipeline execution load.","D":"Requiring developers to manually verify their code compiles and passes unit tests locally before committing to the shared repository."},"a":["B"],"e":{"A":"Manual monitoring and re-triggering is a reactive response to failures rather than a practice that prevents them. Continuous integration is designed to automate detection and notification, not to require human intervention for each failure event.","B":"Continuous integration relies on automated checks triggered by every commit to detect defects at the earliest possible pipeline stage, as per reference section 1.2.4. Adding integration-level checks ensures failures surface before late-stage build steps, reducing rework and build instability.","C":"Infrequent execution delays feedback and allows integration defects to accumulate between runs. Continuous integration requires trigger-based execution on every commit, not batched daily runs, to provide timely defect detection.","D":"Relying on manual pre-commit verification introduces inconsistency and does not replace automated pipeline checks. Continuous integration automates build and test verification to ensure consistent quality gates independent of individual developer discipline."}},{"q":"You are a tester on an Agile team in sprint planning for a sprint that includes three user stories of varying complexity. The team uses planning poker to reach estimation consensus. After two rounds, two team members consistently estimate a data validation story at 5 points while the rest estimate it at 13 points. Which action BEST applies the consensus estimation process to resolve this divergence?","o":{"A":"Accepting the lower estimate from the two team members because they are most likely to perform the testing work for that story.","B":"Escalating the estimation disagreement to the product owner to determine the final story point value based on business priority.","C":"Facilitating a structured discussion where the outlier estimators explain their reasoning, enabling the team to surface hidden complexity or assumptions before re-estimating.","D":"Averaging the estimates from all team members to produce a single agreed value without further discussion."},"a":["C"],"e":{"A":"Planning poker estimates reflect whole-team effort, not only the effort of individual role members. Accepting the lower estimate without discussion ignores the higher complexity signals raised by the majority of estimators.","B":"The product owner's role in planning poker is to clarify requirements, not to assign story point values. Effort estimation is a technical team decision, and escalating to the product owner misplaces estimation authority.","C":"Consensus estimation through planning poker resolves divergence by requiring each estimator to share their reasoning, which surfaces unstated assumptions or complexity that others may not have considered, as per reference section 3.2.2. A structured discussion before re-estimating ensures the final estimate reflects shared understanding.","D":"Averaging bypasses the deliberate discussion phase of consensus estimation. Planning poker is designed to surface reasoning differences, and averaging without discussion eliminates the learning opportunity that drives more accurate shared estimates."}},{"q":"You are a tester reviewing work products at the start of a sprint. The team has decomposed a large feature into epics, user stories, and written acceptance criteria for each story. Which statement BEST describes how these work products support integrated development and testing in Agile?","o":{"A":"Epics provide the test basis for system testing, while user stories are used only for unit testing by developers.","B":"Acceptance criteria are finalized at the start of the project and remain unchanged throughout all sprints to ensure test consistency.","C":"User stories replace the need for test cases, and testers rely solely on story descriptions to execute tests during the sprint.","D":"Epics, user stories, and acceptance criteria serve as the test basis, enabling testers to derive test conditions and design tests in parallel with development."},"a":["D"],"e":{"A":"This description imposes a sequential phase-based mapping that does not reflect Agile practice. Testers derive tests from all levels of story decomposition, and the test basis is not divided by story granularity into specific test levels.","B":"Agile embraces evolving requirements, and acceptance criteria are refined through collaboration during each sprint rather than fixed at project start. Treating them as static contradicts the adaptive nature of Agile work product management.","C":"User stories are a requirement expression format, not a substitute for test cases. Testers derive test cases and conditions from user stories and acceptance criteria rather than using story descriptions as test scripts.","D":"In Agile projects, epics, user stories, and acceptance criteria are the primary work products testers use as the basis for test design throughout the iteration, as per reference section 2.1.2. This enables testing activities to proceed in parallel with development rather than after it."}},{"q":"You are a tester joining a team enhancing an existing insurance claims processing system. No formal test documentation exists, but the system has been in production for three years. Which approach BEST demonstrates using experience and existing system features as a test basis to support testing activities?","o":{"A":"Waiting for the development team to produce updated technical specifications before beginning any test design activities for the enhancement.","B":"Relying exclusively on the new acceptance criteria defined for the enhancement stories as the sole test basis for all test activities.","C":"Requesting that the product owner conduct a system walkthrough to provide a verbal description of all existing features before testing begins.","D":"Combining knowledge of the production system's existing behavior and domain expertise to design exploratory test sessions targeting areas of likely change and historical instability."},"a":["D"],"e":{"A":"Waiting for full documentation before testing contradicts the Agile principle of using available information, including system experience, as a valid test basis. Delaying test design until documentation is complete extends the defect detection window unnecessarily.","B":"Limiting the test basis to new acceptance criteria ignores the existing system behavior and domain knowledge that provide critical context for regression and integration testing. Experience and existing features are explicitly recognized as a valid test basis.","C":"A verbal walkthrough is a less reliable and less efficient test basis than direct
