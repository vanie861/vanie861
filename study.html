reasingly misaligned with actual project conditions as the release progresses.","B":"Updating the test strategy as the team learns more about product risks and quality needs across iterations is a key tester responsibility in Agile, as per reference section 2.3.2. Agile test strategies are living artifacts that evolve as the team gains knowledge. Regularly updating the strategy ensures it remains aligned with current risks and priorities.","C":"Delegating all test strategy decisions to the product owner removes the tester's professional judgment from the strategy process. The product owner defines what needs to be built and accepted; the tester determines how to test it. Test strategy decisions require testing expertise that resides with the tester, not the product owner.","D":"Implementing the test strategy by selecting appropriate test techniques and levels for each user story is a core tester responsibility in Agile teams, as per reference section 2.3.2. This activity translates the strategic testing direction into actionable techniques applied at the story level. It is a direct expression of the tester's role in executing the test strategy."}},{"q":"You are participating in a sprint retrospective after a sprint in which several defects escaped to the acceptance testing phase. The team wants to use root cause analysis to prevent recurrence. Which retrospective action BEST addresses the root cause of defects escaping the sprint?","o":{"A":"Require all defects to be fixed and retested within the same sprint they are discovered.","B":"Assign a dedicated tester to each developer to monitor code quality during implementation.","C":"Analyze the defects to identify the testing or development practice that failed to detect them earlier, and introduce a targeted process improvement.","D":"Increase the number of test cases written per user story in the next sprint to improve coverage."},"a":["C"],"e":{"A":"Requiring defects to be fixed and retested within the same sprint may be a useful practice, but it does not address the root cause of defects escaping in the first place. The retrospective question is about preventing future escapes, not about mandating timelines for current defect resolution.","B":"Assigning a dedicated tester to each developer is a resource-based response, not a root cause solution. Without understanding why defects escaped, additional monitoring alone may not prevent recurrence. Root cause analysis focuses on improving the process or practice that failed, not on increasing oversight.","C":"The purpose of using root cause analysis in a sprint retrospective is to identify the specific practice or process failure that allowed defects to escape, and to introduce a targeted improvement to prevent recurrence, as per reference section 1.2.3. This approach addresses the underlying cause rather than the symptom. A targeted process improvement is more effective than generic countermeasures.","D":"Simply increasing test case count without understanding why defects escaped does not address the root cause. More tests may improve coverage incrementally, but without root cause analysis, the same process failures can recur. This option treats a symptom rather than diagnosing and fixing the underlying problem."}},{"q":"You are a tester on a cross-functional Agile team where developers, business analysts, and testers collaborate on each sprint. During sprint planning, a developer volunteers to write automated unit tests for a complex payment module, freeing you to focus on exploratory testing of the user interface. Which advantage of the whole-team approach does this BEST illustrate?","o":{"A":"The tester is relieved of all automated testing responsibilities permanently.","B":"Developers assume full ownership of quality assurance activities in the sprint.","C":"Sprint velocity increases because fewer test cases are required per user story.","D":"Team members leverage their diverse skills collaboratively to improve overall quality."},"a":["D"],"e":{"A":"The whole-team approach does not permanently relieve testers of automated testing responsibilities. Skill sharing is situational and collaborative, not a permanent reassignment of duties. The intent is to optimize quality outcomes through flexible collaboration, not to eliminate the tester's involvement in automation.","B":"The whole-team approach distributes quality responsibility across all team members equally; it does not transfer full quality assurance ownership to developers. Developers contributing to quality activities is a shared practice, not an exclusive assumption of all QA responsibilities. Testers remain active quality contributors.","C":"Sprint velocity is not the primary benefit illustrated by this scenario, and the whole-team approach does not inherently reduce the number of test cases needed. The scenario demonstrates skill leverage and collaborative quality improvement, not velocity optimization or test case reduction.","D":"The whole-team approach encourages all team members to apply their diverse skills collaboratively to improve overall product quality, as per reference section 1.1.2. When a developer volunteers for automated unit testing to free the tester for exploratory work, the team is leveraging complementary skills to optimize quality outcomes. This reflects the core advantage of cross-functional collaboration in Agile teams."}},{"q":"Your Agile team has been using a continuous integration pipeline with automated tests for three sprints. The pipeline consistently shows that a particular developer's integrations pass all tests without failures, while another developer's integrations frequently trigger test failures. Which benefit of early and frequent feedback does this observation BEST demonstrate?","o":{"A":"Automated test results confirm that manual testing is unnecessary for stories delivered without failures.","B":"Feedback from the pipeline provides transparency into each team member's technical practices and work quality.","C":"The pipeline results can be used to formally evaluate developer performance in annual reviews.","D":"Continuous feedback enables the Scrum master to reassign stories to higher-performing developers."},"a":["B"],"e":{"A":"Passing pipeline tests for one developer's integrations does not confirm that manual testing is unnecessary. Automated tests cover predefined scenarios; manual and exploratory testing address risks not captured by automation. The absence of pipeline failures does not indicate complete test coverage.","B":"A key benefit of early and frequent feedback in Agile is that it provides transparency into team practices and work quality, as per reference section 1.1.3. When a pipeline consistently reveals that one developer's integrations fail while another's pass, the team gains objective visibility into individual technical practices. This transparency enables coaching, knowledge sharing, and continuous improvement.","C":"Using pipeline results for formal performance evaluation in annual reviews is not a benefit of early feedback in the Agile context. Agile feedback mechanisms are designed to support team improvement and learning, not to generate input for personnel management processes. Applying this data to formal reviews would be outside the Agile feedback purpose.","D":"Reassigning stories based on pipeline pass rates contradicts Agile team collaboration principles. The whole-team approach encourages coaching and skill development rather than penalizing team members through story redistribution. Agile feedback is meant to drive improvement, not to redistribute work punitively."}},{"q":"You are a tester on an Agile team midway through a release. The product owner asks for a status update on how much testing remains and whether the product is ready for release. Which tool BEST communicates test progress at both the iteration and release level in an Agile project?","o":{"A":"A defect density metric calculated from the total number of defects found per user story.","B":"A traceability matrix mapping each user story to its corresponding test cases and execution status.","C":"A burndown chart that tracks remaining test effort or open defects over time at both iteration and release levels.","D":"A test completion report generated at the end of each sprint summarizing all tests executed."},"a":["C"],"e":{"A":"Defect density is a quality metric that measures defects per story or unit of work; it does not communicate how much testing remains or whether the product is ready for release. While defect density provides quality insight, it does not track remaining test effort at iteration or release level.","B":"A traceability matrix maps requirements to test cases but does not communicate test execution progress or product readiness in an Agile-appropriate format. While useful for coverage tracking, it does not provide the time-based progress information that a burndown chart offers for iteration and release status.","C":"A burndown chart is the Agile tool specifically designed to communicate test progress and remaining work at both the iteration and release levels by tracking the reduction of remaining test effort or open defects over time, as per reference section 2.2.1. It provides a visual indication of whether testing is on track to complete within the sprint or release. This dual-level visibility directly addresses the product owner's question.","D":"A test completion report generated at the end of each sprint is a static artifact that does not provide visibility into test progress during the iteration or across the release. It is a retrospective summary rather than a real-time or multi-level tracking tool. The product owner needs progress visibility before the sprint ends."}},{"q":"Which of the following tool categories is used for software build and distribution in Agile projects?","o":{"A":"Tools that generate test data from production databases for use in functional testing.","B":"Tools that capture and replay user interface interactions for regression testing.","C":"Tools that compile source code, manage dependencies, and package the application for deployment.","D":"Tools that execute exploratory test sessions and record tester observations during testing."},"a":["C"],"e":{"A":"Tools that generate test data from production databases are test data management tools, not build and distribution tools. Test data tools support test preparation activities. Build and distribution tools address source code compilation and application packaging, not data provisioning.","B":"Tools that capture and replay user interface interactions are test execution automation tools for UI testing, not build and distribution tools. Capture-replay tools support regression testing at the UI level. Build tools operate at the compilation and packaging level of the delivery pipeline.","C":"Software build and distribution tools are the category of Agile testing tools that compile source code, manage dependencies, and package the application for deployment, as per reference section 3.4.1. These tools automate the process of transforming source code into a deployable artifact. They are a foundational component of the continuous integration and delivery pipeline.","D":"Tools that execute exploratory test sessions and record tester observations are exploratory testing tools, not build and distribution tools. Exploratory testing tools support session-based testing activities. Build tools serve a different purpose in the software delivery pipeline."}},{"q":"You are a tester on an Agile team that has just completed a deployment to the test environment. Before beginning detailed functional testing, you need to confirm that the build is stable enough to test. Which type of test is MOST appropriate to execute immediately after deployment in this scenario?","o":{"A":"Build verification tests, to confirm that core system functions are operational and the build is stable for further testing.","B":"Regression tests, to verify that all previously tested functionality remains unaffected by the new deployment.","C":"Exploratory tests, to investigate the newly deployed features without a predefined test plan.","D":"Performance tests, to measure the response time of critical user transactions under expected load."},"a":["A"],"e":{"A":"Build verification tests are the appropriate test type to execute immediately after a deployment to confirm that core system functions are operational and that the build is stable enough to proceed with further testing, as per reference section 2.2.2. They serve as a rapid stability gate before the team invests effort in more comprehensive testing. Running them first prevents wasted test effort on an unstable build.","B":"Regression tests are designed to verify that previously tested functionality is unaffected by new changes, not to confirm deployment stability. Running a full regression suite before confirming the build is testable wastes effort if the deployment is unstable. Build verification tests should be executed first to establish a stable baseline.","C":"Exploratory testing is an investigative activity most valuable for uncovering unknown defects and usability issues. Running exploratory tests on a potentially unstable build before confirming basic functionality risks wasting exploration effort and producing unreliable results. Stability confirmation should precede exploratory investigation.","D":"Performance tests measure system throughput and response time under load conditions, which is not the appropriate first action after a new deployment. Performance testing requires a confirmed stable build with functional core operations. Executing performance tests before basic functionality is verified produces misleading results."}},{"q":"Which of the following activities does a tester perform during iteration planning? I. Participating in risk analysis for user stories in the iteration. II. Estimating the effort required to test stories selected for the iteration. III. Writing final release notes for features completed in the previous iteration. IV. Identifying and clarifying testability issues in user stories.","o":{"A":"I, II, and IV.","B":"I and II only.","C":"II and III only.","D":"I, III, and IV."},"a":["A"],"e":{"A":"During iteration planning, a tester participates in risk analysis for user stories, estimates test effort for the selected stories, and identifies testability issues in user stories, as per reference section 1.2.5. Writing final release notes for features completed in a previous iteration is not an iteration planning activity; it is a release-phase activity. Statements I, II, and IV all represent tester activities in iteration planning.","B":"While risk analysis and effort estimation are correct iteration planning activities, this option omits identifying testability issues (IV), which is also a recognized tester contribution during iteration planning. Selecting only I and II misses a key activity and does not fully represent the tester's role.","C":"Writing release notes (III) is not an iteration planning activity for testers. Release notes are produced as part of release activities, not during planning of the next iteration. This option also omits risk analysis (I) and testability issue identification (IV), both of which are correct iteration planning activities.","D":"Writing final release notes (III) for features from a previous iteration is not a tester activity during iteration planning. Release note creation is a separate activity that occurs outside of iteration planning. This option includes an incorrect activity and therefore does not represent the complete and accurate set."}},{"q":"You are working on an Agile team where developers are expected to write automated unit tests as part of completing each user story. During a sprint review, the team discusses whether a story is done without unit tests. The product owner asks why unit tests are the developer's responsibility. Which explanation BEST describes how development and testing activities are integrated in Agile projects?","o":{"A":"Automated unit tests are always created by the test team and reviewed by developers before a story is accepted as complete.","B":"Automated unit tests are developer work products because they validate implementation correctness and are created alongside the code as part of completing a story.","C":"Developers write unit tests only when testers do not have sufficient time to complete manual test coverage during the sprint.","D":"Unit tests are optional in Agile projects and are included in the Definition of Done only when the team decides to prioritize test coverage."},"a":["B"],"e":{"A":"Automated unit tests are developer work products, not creations of the test team. The test team may contribute other types of automated tests, but unit tests are the developer's responsibility and are written alongside the implementation code. Reversing this responsibility misrepresents Agile integration practices.","B":"In Agile projects, development and testing activities are integrated such that developers write automated unit tests as part of completing each user story, as per reference section 2.1.2. Unit tests validate implementation correctness and are created alongside the code as a developer work product. Their inclusion in the Definition of Done reflects the integrated nature of development and quality activities in Agile.","C":"Developers in Agile write unit tests as a standard part of their work, not only when testers lack time. Unit test creation is a developer responsibility integrated into the development process, not a contingency activity based on tester availability. This option misrepresents the Agile integration of development and testing.","D":"Automated unit tests are not optional in Agile projects that follow standard practices. They are typically required as part of the Definition of Done, reflecting the expectation that developers validate their own code. Describing them as optional misrepresents their role in Agile development integration."}},{"q":"You are a tester participating in sprint planning for an upcoming iteration. The sprint backlog includes a new online payment feature that handles sensitive financial transactions. You need to assess the quality risks for this feature before estimating testing effort. Which sequence of steps BEST describes the quality risk analysis process in iteration planning?","o":{"A":"Document all known defects from previous sprints and use defect count as the sole input for risk prioritization in the current iteration.","B":"Identify potential failure modes for each story, assess the likelihood and impact of each risk, prioritize stories for testing based on risk level, and allocate testing effort proportionally.","C":"Execute a full regression suite first to establish a quality baseline, then assess remaining risk based on the number of defects found.","D":"Ask the product owner to rank stories by business value and apply testing effort in the same priority order regardless of technical risk."},"a":["B"],"e":{"A":"Using defect counts from previous sprints as the sole input for risk prioritization ignores current story characteristics and introduces bias from historical data. Risk analysis should evaluate the specific technical and functional attributes of current sprint stories. Historical defect data may inform but cannot replace current-sprint risk assessment.","B":"Quality risk analysis in Agile iteration planning involves identifying potential failure modes for each story, assessing the likelihood and impact of each risk, prioritizing stories based on risk level, and allocating testing effort proportionally, as per reference section 3.2.1. This sequence ensures that testing resources are directed toward the areas of highest risk within the iteration. It reflects the structured yet iterative approach to risk assessment in Agile.","C":"Executing a full regression suite to establish a quality baseline before risk assessment reverses the correct process sequence. Risk analysis informs test selection and effort allocation; it does not follow defect discovery. Running regression tests first and then assessing risk based on findings does not constitute a proactive risk analysis process.","D":"Applying testing effort in business value priority order regardless of technical risk conflates business prioritization with quality risk analysis. High-value stories may carry low technical risk, and low-value stories may carry high risk. Risk analysis must consider both likelihood of failure and impact, independent of business value ranking alone."}},{"q":"In Scrum, which role is responsible for maximizing the value of the product and managing the product backlog?","o":{"A":"Development team member.","B":"Business analyst.","C":"Product owner.","D":"Scrum master."},"a":["C"],"e":{"A":"Development team members are responsible for delivering potentially shippable increments during each sprint. While they may contribute to backlog refinement collaboratively, they do not hold ownership or management authority over the product backlog. That responsibility belongs to the product owner.","B":"A business analyst is not a defined Scrum role. In Scrum, the product owner is the role responsible for representing business requirements and maximizing product value. Introducing a business analyst role conflates Scrum with traditional project management structures.","C":"In Scrum, the product owner is the role responsible for maximizing the value of the product and managing the product backlog, as per reference section 1.2.1. The product owner prioritizes backlog items, defines acceptance criteria, and represents the interests of stakeholders. No other Scrum role holds formal authority over the product backlog.","D":"The Scrum master is responsible for facilitating the Scrum process, removing impediments, and coaching the team. The Scrum master does not own or manage the product backlog. Backlog management and value maximization are exclusively the product owner's responsibilities."}},{"q":"You are an independent tester reviewing the test results produced by an Agile team. You notice that the team's own testers have consistently passed stories that later fail during user acceptance testing. A team member suggests that the embedded testers should also perform independent evaluations. Which statement BEST describes the value of independent testing in Agile projects?","o":{"A":"Independent testing is only valuable when the Agile team lacks sufficient technical skills to perform adequate test coverage.","B":"Independent testers are responsible for verifying compliance with the Definition of Done on behalf of the product owner.","C":"Independent testers confirm coverage gaps that embedded testers overlook due to familiarity with the system.","D":"Independent testers provide objective evaluation because they are not subject to the same assumptions and pressures that can affect the judgment of embedded team testers."},"a":["D"],"e":{"A":"Independent testing is valuable in Agile regardless of the team's technical skill level. Its value derives from the objectivity and external perspective it provides, not from compensating for skill gaps. Framing independent testing as a remedy for inadequate technical ability misrepresents its purpose.","B":"Verifying compliance with the Definition of Done is a team and product owner responsibility, not a function of independent testers. Independent testers focus on objective quality evaluation through testing, not on approving work completion criteria. These are distinct activities with different ownership.","C":"While identifying coverage gaps is a benefit of independent testing, this option does not most precisely capture the mechanism described in the scenario, which relates to assumptions and pressures affecting embedded tester judgment rather than familiarity with coverage scope alone.","D":"Independent testers provide objective evaluation because they are free from the assumptions, social pressures, and cognitive biases that can influence embedded testers who are closely integrated with the development team, as per reference section 2.1.3. This objectivity enables independent testers to identify defects that embedded testers may overlook due to familiarity with the system or team dynamics."}},{"q":"Which of the following CORRECTLY identifies a value stated in the Agile Manifesto?","o":{"A":"Contract negotiation over customer collaboration.","B":"Comprehensive documentation over working software.","C":"Following a plan over responding to change.","D":"Working software over comprehensive documentation."},"a":["D"],"e":{"A":"The Agile Manifesto states the opposite: \"customer collaboration over contract negotiation.\" Prioritizing contract negotiation over customer collaboration represents a plan-driven, contractual approach that Agile explicitly moves away from. This option reverses the actual manifesto value.","B":"The Agile Manifesto explicitly inverts this priority, valuing working software over comprehensive documentation. Placing documentation above working software describes a traditional, document-centric development approach. The manifesto acknowledges documentation's value but subordinates it to delivering functional software.","C":"The Agile Manifesto states \"responding to change over following a plan,\" not the reverse. Preferring plans over adaptability describes waterfall or plan-driven methodologies. This option directly contradicts the manifesto's stated value regarding planning and change.","D":"The Agile Manifesto explicitly states \"working software over comprehensive documentation\" as one of its four core values, as per reference section 1.1.1. This value emphasizes that delivering functional software is more important than producing extensive written documentation, though documentation is not entirely excluded. The other options either reverse the manifesto's stated values or describe non-Agile priorities."}},{"q":"You are a tester attending a daily standup. You have been blocked for two days because a test environment required for integration testing is unavailable. You want to communicate this impediment to the team. Which CORRECT approach should you follow when raising a test impediment at the daily standup?","o":{"A":"Wait until the sprint retrospective to formally document and discuss the testing impediment with the full team.","B":"Escalate the impediment directly to the product owner and bypass the standup to avoid delaying the team.","C":"Report the impediment concisely as part of your standup update, stating what is blocked and requesting the Scrum master's assistance to resolve it.","D":"Prepare a detailed written report of the impediment and distribute it to all team members before the standup begins."},"a":["C"],"e":{"A":"Waiting until the sprint retrospective to discuss a testing impediment delays resolution by days or weeks. The standup is designed precisely for surfacing current blockers that need immediate action. Deferring an active impediment to the retrospective violates the purpose of daily status communication.","B":"Bypassing the standup to escalate directly to the product owner is not the appropriate communication channel for test impediments. The Scrum master is responsible for resolving impediments, and the standup is the correct forum for raising them. Direct product owner escalation outside the standup disrupts the established Agile communication structure.","C":"The appropriate approach for communicating a test impediment at a daily standup is to raise it concisely within your standup update by describing what is blocked and requesting the Scrum master's assistance to resolve it, as per reference section 2.2.1. The standup is the correct forum for surfacing impediments so the Scrum master can act. This maintains transparency and enables timely resolution.","D":"Preparing a detailed written report before the standup is unnecessarily formal and contrary to the Agile principle of concise, verbal communication at standups. Daily standups are designed for brief status updates and impediment surfacing, not for comprehensive written documentation. Extensive pre-meeting reports create overhead without additional benefit."}},{"q":"You are a tester on an Agile team where the automated regression suite has failed overnight. The team must decide how to respond before the daily standup. Which TWO actions are MOST appropriate for the team to take when investigating a regression test failure in an Agile project? (Select TWO)","o":{"A":"Postpone all regression testing until the end of the release to avoid disrupting sprint velocity.","B":"Immediately disable all failing regression tests to restore the green build status without investigation.","C":"Investigate the failing tests to determine whether the failure is caused by a genuine defect or by an outdated test script.","D":"Fix confirmed defects and update test scripts that have become invalid due to intentional changes in the system."},"a":["C","D"],"e":{"A":"Postponing all regression testing until the end of the release removes the continuous safety net that regression suites provide in Agile projects. Regression testing between iterations is essential for managing accumulating change risk. Deferring it entirely contradicts the Agile principle of early and frequent feedback on system quality.","B":"Disabling failing regression tests without investigation to restore a green build eliminates valuable defect detection capability. Disabling tests without understanding failure causes masks real defects and reduces regression coverage. This practice violates the purpose of maintaining a regression suite in Agile projects.","C":"When automated regression tests fail, the first action is to investigate whether the failure reflects a genuine defect or an outdated test script that no longer matches the current system behavior, as per reference section 2.2.2. This analysis distinguishes real defects from false failures caused by evolving system behavior, enabling an informed and targeted response.","D":"Once the investigation confirms the nature of each failure, the team must fix confirmed defects and update test scripts that have become invalid due to intentional system changes, as per reference section 2.2.2. This maintains both the product's functional integrity and the regression suite's accuracy and relevance across iterations."}},{"q":"You are a tester on an Agile team that has implemented a continuous integration pipeline. After each code commit, the pipeline runs automated tests and reports results within minutes. During a sprint, the pipeline detects a failing test shortly after a developer integrates new code. Which benefit of early and frequent feedback does this scenario BEST illustrate?","o":{"A":"Rapid feedback allows the team to identify and address integration defects before they propagate.","B":"Continuous integration eliminates the need for manual testing throughout the sprint.","C":"Automated pipelines replace exploratory testing as the primary defect detection method.","D":"Frequent test execution guarantees that no defects will reach the production environment."},"a":["A"],"e":{"A":"A key benefit of early and frequent feedback through continuous integration is the ability to identify and address integration defects rapidly before they accumulate or become more costly to fix, as per reference section 1.1.3. When a pipeline detects a failing test immediately after a code commit, the team receives actionable feedback that enables timely correction. This prevents defect propagation across subsequent integrations.","B":"Continuous integration does not eliminate the need for manual testing. While automated pipelines provide rapid feedback on integration health, manual testing activities such as exploratory testing and acceptance testing remain necessary in Agile projects. Continuous integration complements manual testing rather than replacing it.","C":"Automated pipelines do not replace exploratory testing. Exploratory testing provides investigative, experience-based coverage that automated regression scripts cannot replicate. The pipeline described in the scenario provides integration feedback, not the full spectrum of defect detection that exploratory testing addresses.","D":"Frequent test execution reduces defect risk but cannot guarantee a defect-free production environment. Testing can only detect defects that fall within the scope of the tests executed. New defect types, untested scenarios, and configuration issues can still reach production even when automated testing is frequent."}},{"q":"Which of the following CORRECTLY defines a build verification test in the context of Agile testing?","o":{"A":"A set of automated tests executed after a build to confirm that the basic functionality of the system is operational.","B":"A manual test performed by the product owner to verify that a user story meets its acceptance criteria.","C":"A performance test executed during continuous integration to measure application response time.","D":"A configuration management check that validates the correct version of software components are deployed."},"a":["A"],"e":{"A":"A build verification test is a set of automated tests executed immediately after a build to confirm that the basic and critical functionality of the system is operational and the build is stable for further testing, as per reference section 2. This test type provides rapid feedback on build health before the team invests further testing effort. It serves as a gate to validate that the deployment is testable.","B":"A build verification test is an automated test executed by the test team or pipeline, not a manual test performed by the product owner. The product owner validates user stories against acceptance criteria, which is a different activity. Manual product owner verification is not classified as a build verification test.","C":"A performance test measures application response time and throughput under load conditions, which is a distinct test type from a build verification test. Build verification tests confirm basic functional stability of the build, not performance characteristics. These two test types serve different purposes in the test process.","D":"A configuration management check validates software component versions and deployment configurations, which is a separate activity from build verification testing. Build verification tests execute functional test cases to confirm system stability after a build. Configuration management and build verification address different concerns."}},{"q":"In test-driven development, what does the red phase of the red-green-refactor cycle represent?","o":{"A":"Refactoring the production code to improve structure after all tests pass.","B":"Writing a failing test that defines the expected behavior before any implementation code exists.","C":"Executing the full regression suite to confirm that existing tests pass after refactoring.","D":"Reviewing code coverage metrics to identify untested paths in the implementation."},"a":["B"],"e":{"A":"Refactoring production code to improve structure after all tests pass describes the refactor phase, the third step in the TDD cycle. The red phase is the first step in which a failing test is written. Refactoring occurs after the green phase confirms that the implementation satisfies the test.","B":"In the TDD red-green-refactor cycle, the red phase represents writing a failing test that defines the expected behavior of a unit before any implementation code is written, as per reference section 3.1.1. The test fails because the functionality does not yet exist. This deliberately failing test provides a precise specification that guides subsequent implementation.","C":"Executing the full regression suite to confirm that existing tests pass after refactoring describes the verification step that may follow refactoring, not the red phase. The red phase occurs before any implementation exists. Running a regression suite is associated with broader test execution activities, not the initial TDD step.","D":"Reviewing code coverage metrics to identify untested paths is an analysis activity that may occur during or after development, not the defining characteristic of the red phase. The red phase focuses on writing a single failing test for a specific behavior before implementation, not on coverage analysis."}},{"q":"You are part of an Agile team where a critical defect is discovered by a developer during code review, before it reaches formal testing. The developer fixes the defect immediately and notifies the team. Which benefit of the whole-team approach does this scenario BEST demonstrate?","o":{"A":"Quality ownership is distributed, enabling any team member to contribute to defect prevention.","B":"Quality is a shared responsibility, and all team members contribute to defect prevention.","C":"The tester's role is replaced by developer-led quality activities in Agile teams.","D":"Defect detection is most effective when only developers review code artifacts."},"a":["B"],"e":{"A":"While quality as a shared responsibility is a correct advantage of the whole-team approach, this option does not precisely identify the benefit most clearly illustrated by the scenario. The correct answer more specifically identifies the mechanism of shared ownership demonstrated when a developer detects a defect proactively.","B":"The scenario illustrates that quality is a shared responsibility and all team members, including developers, actively contribute to defect prevention through activities like code review, as per reference section 1.1.2. When a developer detects and fixes a defect before it reaches testing, it demonstrates that quality activities are not limited to testers. This is a core advantage of the whole-team approach.","C":"The whole-team approach does not replace the tester's role with developer-led activities. Developer code review is one quality activity among many; testers continue to perform testing activities that developers cannot fully replicate. The scenario shows developers contributing to quality, not eliminating the need for testers.","D":"The whole-team approach encourages all team members to contribute to quality, not only developers. Claiming defect detection is most effective when only developers review code contradicts the whole-team principle of shared quality responsibility. This option introduces an exclusivity that the Agile whole-team approach explicitly avoids."}},{"q":"You are a tester on an Agile team that is setting up a continuous integration environment for a new project. The team is selecting tools to automate the build, test execution, and deployment pipeline. Which combination of tool types is MOST appropriate to support a continuous integration process?","o":{"A":"A requirements management tool for tracing stories to tests, a code review tool for inspecting pull requests, and a performance testing tool for load simulation.","B":"An exploratory testing tool for session management, a static analysis tool for code quality, and a release planning tool for sprint scheduling.","C":"A version control system for code management, a build tool to compile and package the application, and a test execution tool to run automated tests after each build.","D":"A manual test management tool for recording test results, a defect tracking system for logging failures, and a deployment tool for releasing to production."},"a":["C"],"e":{"A":"Requirements management, code review, and performance testing tools address specific concerns but do not form the core pipeline required for continuous integration. Continuous integration centers on automated build, test execution, and feedback, not on requirements tracing or code review workflows.","B":"Exploratory testing tools, static analysis tools, and release planning tools do not constitute a continuous integration pipeline. Continuous integration requires automation of the build and test execution cycle. These tools address related but distinct testing and planning activities that are separate from the CI pipeline itself.","C":"A continuous integration process requires a version control system to manage source code, a build tool to compile and package the application, and a test execution tool to run automated tests after each build, as per reference section 1.2.4. These three tool types form the foundational pipeline that enables continuous integration to function. Their combination automates the key steps of integrating, building, and verifying the software.","D":"A manual test management tool, defect tracking system, and deployment tool do not constitute the core of a continuous integration pipeline. Manual test management does not support automated continuous integration. While defect tracking and deployment tools are useful, they do not form the essential pipeline for continuous integration."}},{"q":"You are a tester on an Agile team where testers and developers frequently work together on the same user story. During the current sprint, you are paired with a developer to write automated acceptance tests while the developer implements the corresponding feature. Which characteristic of testing in Agile projects does this scenario BEST illustrate compared to non-Agile projects?","o":{"A":"Pairing testers with developers eliminates the need for independent testing activities.","B":"Testing and development activities occur collaboratively within the same iteration rather than in sequential phases.","C":"Testers assume full responsibility for writing all automated tests in place of developers.","D":"Test design is deferred to the end of the sprint once all development work is complete."},"a":["B"],"e":{"A":"Pairing testers with developers for collaborative work does not eliminate independent testing. Independent testing remains a valid and recommended activity in Agile projects for providing objective evaluation. The scenario demonstrates collaboration, not the elimination of independent test perspectives.","B":"A key difference between Agile and non-Agile testing is that testing and development activities occur collaboratively within the same iteration rather than in separate sequential phases, as per reference section 2.1.1. Pairing testers and developers to co-create automated acceptance tests while implementation proceeds exemplifies this integrated approach. In non-Agile projects, testing typically begins after development is complete.","C":"Testers do not assume full responsibility for all automated tests in an Agile team. The scenario describes a collaborative pairing arrangement, not a transfer of all automation responsibility to the tester. Both developers and testers contribute to automated testing in Agile projects.","D":"Deferring test design to the end of the sprint is a non-Agile practice. In Agile projects, testing activities begin during or alongside development within the same iteration. The scenario specifically illustrates concurrent test and development work, which contrasts with end-of-sprint or end-of-phase test design."}},{"q":"You are collaborating with a developer and a business representative to write a user story for a new search feature. The initial story reads: \"As a user, I want to search for products.\" You identify that this story lacks sufficient detail to determine when testing is complete. Which action BEST improves the testability of this user story?","o":{"A":"Expand the story description to include the full technical implementation details of the search algorithm.","B":"Split the story into multiple smaller stories, each describing a single search input field.","C":"Defer acceptance criteria definition until the developer completes the initial implementation.","D":"Define acceptance criteria specifying observable search behaviors and expected results collaboratively with the business representative."},"a":["D"],"e":{"A":"Expanding the story with technical implementation details does not improve testability from a testing perspective. Acceptance criteria should describe observable behaviors and outcomes, not internal implementation logic. Technical implementation details are relevant for development but do not define testable conditions for the user story.","B":"Splitting the story into multiple stories addressing individual input fields does not directly resolve the testability problem caused by absent acceptance criteria. The original issue is the lack of defined expected behaviors, not excessive story scope. Splitting without defining criteria leaves testability gaps in each sub-story.","C":"Deferring acceptance criteria until after implementation violates the principle of early collaboration in Agile. Acceptance criteria should be defined before development begins so that the developer understands the expected outcomes and the tester can prepare test cases in advance. Late definition increases rework risk.","D":"Defining observable acceptance criteria that specify expected behaviors and results in collaboration with the business representative directly improves testability, as per reference section 1.2.2. Testable acceptance criteria provide the tester with clear conditions for test completion. Collaborative definition ensures the criteria reflect actual business intent and are verifiable through testing."}},{"q":"You are a tester working within an Agile team. The team has recently adopted a new test automation framework. You are asked to evaluate whether the framework is being used consistently and effectively across the team. Which aspect of the tester's role does this activity BEST reflect?","o":{"A":"Replacing the test strategy document with the framework's built-in reporting capabilities.","B":"Ensuring the proper and consistent use of testing tools and frameworks within the team.","C":"Taking over full ownership of test automation from developers to ensure quality standards.","D":"Reporting tool usage compliance metrics to the Scrum master as part of the sprint review."},"a":["B"],"e":{"A":"Replacing the test strategy with a framework's reporting capabilities removes important strategic guidance that the test strategy provides. The test strategy defines the overall approach to testing and cannot be replaced by tool reports. Testing tools support the strategy; they do not substitute for it.","B":"Ensuring the proper and consistent use of testing tools and frameworks within the team is a recognized responsibility of the tester in an Agile team, as per reference section 2.3.2. This activity involves evaluating whether tools are applied correctly and uniformly, supporting quality and process consistency across the team. It reflects the tester's role in maintaining tooling standards.","C":"Taking over full ownership of test automation from developers contradicts the Agile whole-team approach, in which automation responsibility is shared. The tester evaluates and supports consistent tool use, not assumes exclusive control. Full ownership transfer would undermine collaborative development and testing integration.","D":"Reporting tool usage compliance metrics to the Scrum master is not a defined activity in the tester's role regarding tool management. The tester's role focuses on enabling proper use, not generating formal compliance reports for the Scrum master. Compliance reporting of this type is not described in the CTFL-AT syllabus for this LO."}}]},{"id":4,"title":"Practice Exam 5","questions":[{"q":"You are reviewing user stories with a business stakeholder to improve the testability of acceptance criteria. The stakeholder asks which characteristics must be addressed in acceptance criteria to enable both positive and negative test cases to be derived in an ATDD approach. Which TWO characteristics of acceptance criteria MOST directly enable the derivation of both positive and negative ATDD test cases? (Select TWO)","o":{"A":"Describing the internal code structure that the developer must follow to implement the feature correctly.","B":"Listing all third-party tools used to implement the feature so that testers can configure their environments correctly.","C":"Defining the expected system response when invalid or boundary inputs are provided, enabling negative test case derivation.","D":"Specifying the expected successful outcome when all required inputs are provided correctly, enabling positive test case derivation."},"a":["C","D"],"e":{"A":"Internal code structure is a development design concern, not an acceptance criterion. Acceptance criteria describe observable behaviors and outcomes, not implementation details. Code structure descriptions do not enable test case derivation because they are not observable or verifiable through black box testing.","B":"Third-party tool lists are environment configuration information, not acceptance criteria content. Acceptance criteria define the behavioral conditions for story acceptance, not the tooling required to set up a test environment. Tool lists do not directly enable the derivation of positive or negative test cases.","C":"Defining the system's expected response to invalid inputs or boundary conditions is a characteristic of testable acceptance criteria that enables negative test cases to be derived, as per reference section 3.3.2. Negative tests verify that the system handles exceptional or invalid inputs correctly. Without explicit error response conditions, ATDD practitioners cannot define what a failing input test should verify.","D":"Specifying the successful outcome for valid inputs is a foundational characteristic of testable acceptance criteria that directly enables positive test cases to be derived, as per reference section 3.3.2. Positive tests confirm that the system behaves correctly under valid conditions. Without explicit success conditions, ATDD practitioners cannot define what a passing test should verify."}},{"q":"You are a member of an independent test team supporting multiple Agile projects. The Scrum master of one team asks you to clarify what activities your independent test team performs that are not sprint-dependent. Which description BEST characterizes the iteration-independent testing activities of an independent test team in Agile projects?","o":{"A":"An independent test team exclusively executes regression tests for each sprint immediately after the embedded team completes their sprint testing.","B":"An independent test team replaces the embedded tester role when the Agile team lacks sufficient testing skills.","C":"An independent test team attends all sprint ceremonies to monitor the development team's adherence to the Definition of Done.","D":"An independent test team performs activities such as defining the overall test strategy, conducting end-of-release acceptance testing, and providing specialist skills not available within the embedded team."},"a":["D"],"e":{"A":"Executing sprint-specific regression tests immediately after embedded team testing is a sprint-dependent activity, not an iteration-independent one. Independent test teams are not solely responsible for regression execution tied to each sprint cycle. Their role spans broader activities including strategy, specialist testing, and release-level evaluation.","B":"Independent test teams supplement the embedded team's capabilities; they do not replace the embedded tester role. The embedded tester remains responsible for sprint-level testing activities. Independent testing provides objective evaluation and specialist skills that are additive, not substitutive.","C":"Independent test teams do not typically attend all sprint ceremonies or serve as monitors of the embedded team's Definition of Done compliance. Their role is to perform testing activities that provide objective evaluation, not to audit the team's ceremony participation or Definition of Done adherence. These are internal team responsibilities.","D":"Independent test teams in Agile perform activities that are not tied to individual sprint cycles, including defining the overall test strategy, performing release-level or acceptance-level testing, and providing specialized expertise such as security or performance testing, as per reference section 2.1.3. These iteration-independent activities complement the embedded team's sprint-level testing. They provide a layer of objective evaluation that the embedded team, constrained by sprint boundaries, cannot fully replicate."}},{"q":"You are a tester in sprint planning, working with the team to schedule testing tasks for the upcoming iteration. Which TWO activities are MOST aligned with the tester's role when scheduling testing tasks during iteration planning? (Select TWO)","o":{"A":"Estimating the test effort required for each user story based on its complexity and associated quality risks.","B":"Assigning all testing tasks to the most senior tester to maximize efficiency across the sprint.","C":"Identifying which user stories require acceptance tests and agreeing on the test approach for each story.","D":"Deferring all test task scheduling to the end of the sprint once the development team confirms which stories were completed."},"a":["A","C"],"e":{"A":"Estimating test effort for each user story based on complexity and risk is a core tester responsibility during iteration planning, as per reference section 2.3.2. Accurate test effort estimation enables the team to make realistic sprint commitments and allocate capacity appropriately. This activity directly reflects the tester's contribution to iteration planning.","B":"Agile teams are self-organizing and do not assign all work to the most senior individual. Test tasks may be distributed among team members based on capacity and skill, and the team collectively decides task ownership during planning. Centralizing all testing work in one person contradicts the Agile team collaboration principle.","C":"Identifying which stories need acceptance tests and defining the appropriate test approach for each is a key tester activity during iteration planning, as per reference section 2.3.2. This ensures that testing tasks are planned with sufficient detail to be executable during the sprint. Agreeing on the approach with the team supports shared ownership of quality outcomes.","D":"Deferring test task scheduling to the end of the sprint leaves testing activities unplanned and uncoordinated throughout the iteration. Iteration planning is specifically designed to schedule all sprint work, including testing tasks, at the start of the sprint. End-of-sprint scheduling prevents concurrent testing and development, reducing sprint efficiency."}},{"q":"You are explaining acceptance criteria to a business stakeholder who is responsible for a user story involving a third-party payment gateway integration. The stakeholder is unsure how to describe the external interface behavior in the acceptance criteria. Which guidance BEST helps the stakeholder define testable acceptance criteria that address the external interface?","o":{"A":"The acceptance criteria should document the full regulatory history of the payment gateway provider to establish compliance context.","B":"The acceptance criteria should describe the expected inputs and outputs at the integration boundary, including the response behavior for both successful and failed payment gateway interactions.","C":"The acceptance criteria should describe the internal architecture of the payment gateway so that developers can implement the correct integration logic.","D":"The acceptance criteria should list the names of the development team members responsible for implementing the payment gateway integration."},"a":["B"],"e":{"A":"The regulatory history of a third-party provider is background information, not a testable acceptance condition for the user story. Acceptance criteria must describe verifiable behaviors and outcomes for the specific story, not historical compliance records of external vendors. This information may be relevant to risk analysis but is not a component of testable acceptance criteria.","B":"Testable acceptance criteria for a story involving an external interface must specify the observable behavior at the integration boundary, including what inputs are sent to the external system and what outputs or responses are expected under normal and error conditions, as per reference section 3.3.2. This makes the criteria verifiable through testing without requiring knowledge of the third-party system's internals. Describing both success and failure paths ensures comprehensive testability.","C":"Acceptance criteria describe observable external behavior, not internal architecture of third-party systems. Internal architecture description is a technical design concern for developers, not a testability requirement in acceptance criteria. Acceptance criteria must remain at the observable behavior level to be testable by testers.","D":"Team member assignments are project management information, not acceptance criteria content. Acceptance criteria define the conditions under which a story is considered complete and testable, not the personnel responsible for implementation. Including names in acceptance criteria has no bearing on testability."}},{"q":"You are a tester on an Agile team preparing for the sprint retrospective. The Scrum master asks who should attend and what role each participant plays. Which statement BEST describes the facilitator and participants of a sprint retrospective?","o":{"A":"The tester facilitates the retrospective when quality issues were the primary cause of sprint failures.","B":"The Scrum master facilitates the retrospective, and the entire team including testers and developers participates.","C":"The product owner facilitates the retrospective, and only developers attend to focus on technical improvements.","D":"An external quality manager facilitates the retrospective to provide an independent perspective on team performance."},"a":["B"],"e":{"A":"Retrospective facilitation is the Scrum master's responsibility regardless of the nature of sprint issues. Assigning facilitation to the tester based on quality problems would remove the Scrum master's neutral facilitation role and create a conflict between the tester's advocacy and facilitation responsibilities.","B":"The Scrum master facilitates the sprint retrospective to ensure it runs productively, while the entire Scrum team, including testers, developers, and the product owner, participates as per reference section 1.2.3. The retrospective is a whole-team improvement ceremony, not limited to any subset of roles. The Scrum master's facilitation role is distinct from their participation as a team member.","C":"The product owner does not facilitate the retrospective; that is the Scrum master's responsibility. Additionally, retrospectives are not limited to developers; the entire Scrum team participates, including testers and the product owner. Restricting attendance to developers would prevent the team from identifying cross-functional process improvements.","D":"Sprint retrospectives are internal team ceremonies facilitated by the Scrum master, not by external managers. Introducing an external quality manager as facilitator contradicts the self-organizing nature of Agile teams and the purpose of the retrospective as a safe, team-owned improvement forum."}},{"q":"You are a tester performing quality risk analysis for a sprint backlog that includes a new prescription drug interaction checker for a healthcare application. You need to identify both functional and non-functional quality risks for this feature. Which pair of quality risks MOST accurately represents one functional and one non-functional risk for this feature?","o":{"A":"The drug interaction checker is not deployed on a cloud server (functional); the application lacks a mobile interface (non-functional).","B":"The drug interaction checker's source code is not reviewed by a security auditor (functional); the checker's user interface uses a non-standard font (non-functional).","C":"The drug interaction checker returns incorrect results for contraindicated drug combinations (functional); the system response time exceeds acceptable thresholds under peak concurrent user load (non-functional).","D":"The drug interaction checker uses an outdated database schema (functional); the checker does not include a user help section (non-functional)."},"a":["C"],"e":{"A":"Deployment environment and interface availability are infrastructure and design decisions, not functional behavioral risks or non-functional quality characteristics in the testing sense. Functional risks concern incorrect behavior against specifications; non-functional risks concern quality attributes such as performance, security, or reliability. These options do not represent quality risks.","B":"Security auditor review is a process activity, not a functional behavioral risk of the system under test. Font selection is a design preference, not a non-functional quality risk. Neither option represents a genuine quality risk category as used in Agile risk analysis during iteration planning.","C":"Returning incorrect results for contraindicated drug combinations is a functional quality risk because it concerns the correctness of the system's behavior against its specified requirements, while exceeding acceptable response time under load is a non-functional quality risk concerning performance, as per reference section 3.2.1. These two risks represent distinct risk categories and are directly relevant to the safety and usability of a healthcare application. Identifying both categories ensures comprehensive risk coverage during iteration planning.","D":"An outdated database schema is an implementation quality issue rather than a functional behavioral risk, and the absence of a help section is a usability concern rather than a non-functional quality risk in the performance or reliability sense. Neither example accurately represents the canonical functional and non-functional risk distinction used in quality risk analysis."}},{"q":"You are a tester on an Agile team entering the fourth sprint. The codebase has undergone significant change across the previous three sprints, resulting in high code churn. Your test manager asks you to justify the investment in expanding the automated regression test suite given the high rate of code change. Which argument BEST justifies automated regression test investment in a high code churn environment?","o":{"A":"High code churn reduces the value of regression testing because tests become outdated faster than they can be maintained.","B":"Automated regression tests should be deferred until code churn stabilizes at the end of the release to avoid excessive rework.","C":"Code churn makes regression testing unnecessary because changed code is already reviewed by developers before being committed.","D":"High code churn increases the probability that changes introduce regressions, making automated regression tests essential for detecting failures rapidly across a growing codebase."},"a":["D"],"e":{"A":"While high code churn does increase test maintenance effort, this increases the importance of automation, not its irrelevance. Automated tests can be updated and re-executed efficiently, whereas equivalent manual testing would grow linearly with the codebase. High maintenance effort is a reason to invest in disciplined automation, not to abandon regression testing.","B":"Deferring regression test automation until code stabilizes defeats the purpose of using automation to manage iterative change risk. By the end of the release, the accumulated regression risk would be substantially higher and more costly to address. Automation investment is most effective when introduced early and incrementally alongside feature development.","C":"Developer code review and regression testing serve different purposes; code review examines code quality and logic, while regression testing validates that existing behavior has not been inadvertently broken. Code review does not provide the same coverage or detection capability as executing a full automated regression suite. The two practices are complementary, not interchangeable.","D":"In environments with high code churn, the risk that changes break existing functionality increases with each sprint, making automated regression testing critical for managing this accumulating risk, as per reference section 2.2.2. Automated tests provide rapid feedback after each commit, enabling the team to detect regressions at the point of introduction rather than discovering them later. The investment in automation is justified by the growing regression detection burden that would otherwise require unsustainable manual effort."}},{"q":"You are a tester on an Agile team who has completed all scripted tests for a new survey analysis feature. You decide to conduct an exploratory testing session to achieve deeper coverage beyond the scripted tests. You plan to focus on areas where the feature processes large volumes of respondent data. Which approach BEST describes how to structure and execute this exploratory testing session to achieve deep coverage in this context?","o":{"A":"Execute tests without any defined charter or time limit, relying entirely on the tester's intuition to discover defects in the high-volume processing area.","B":"Repeat the scripted test cases using a larger data volume to confirm that the scripted test results remain valid under high-load conditions.","C":"Assign the exploratory session to the developer who implemented the feature to leverage their knowledge of edge cases in the data processing logic.","D":"Define a test charter targeting the high-volume data processing path, execute the session with a time limit, document findings in real time, and use interim discoveries to guide subsequent exploration within the session."},"a":["D"],"e":{"A":"Unchartered exploratory testing without a time limit reduces focus and makes it difficult to ensure that the most important risk areas receive adequate attention. Effective exploratory testing sessions use charters to direct effort and time limits to maintain discipline. Relying solely on intuition without a charter may result in superficial or unfocused exploration.","B":"Repeating scripted tests with larger data volumes is a form of data-driven regression or performance testing, not exploratory testing. Exploratory testing involves dynamic, adaptive investigation beyond scripted scenarios. Simply scaling the scripted test input does not constitute exploratory testing and would miss the investigative value of unscripted exploration.","C":"Assigning exploratory testing to the implementing developer reduces the objectivity that exploratory testing is designed to provide. Exploratory testing is most effective when conducted by someone with a testing perspective who can identify behavior that diverges from user expectations. Developer self-testing of their own implementation is less likely to surface the same defects as an independent tester's exploration.","D":"An effective exploratory testing session for achieving deep coverage is structured around a targeted test charter that focuses the tester's attention on the highest-risk area, executed within a defined time limit to maintain session quality, with real-time documentation of findings, and with the flexibility to adjust exploration based on what is discovered during the session, as per reference section 3.3.5. This approach blends structure with adaptability to maximize coverage depth in a focused area. The use of a charter and time box is the recognized session-based exploratory testing model."}},{"q":"In acceptance test-driven development, which characteristic distinguishes acceptance tests created before implementation from tests created after implementation?","o":{"A":"Pre-implementation acceptance tests serve as executable specifications that drive and constrain the implementation, and can be reused as regression tests after the feature is built.","B":"Pre-implementation acceptance tests are written by the product owner without tester involvement to maintain independence from the development team.","C":"Pre-implementation acceptance tests are executed only once to confirm implementation correctness and then discarded.","D":"Pre-implementation acceptance tests focus exclusively on non-functional characteristics such as performance and security."},"a":["A"],"e":{"A":"In ATDD, acceptance tests are written before implementation to specify the expected behavior the code must satisfy, effectively serving as executable specifications, as per reference section 3.1.1. Once the feature is implemented and the tests pass, they are retained as regression tests for subsequent iterations. This dual role as specification and regression test is a defining characteristic of ATDD acceptance tests.","B":"ATDD acceptance tests are collaboratively defined by the tester, developer, and product owner together; they are not written exclusively by the product owner. Tester involvement in pre-implementation test creation is essential to ensure the tests are technically sound and accurately represent the acceptance criteria. Excluding testers from this activity contradicts the ATDD process.","C":"A key benefit of ATDD acceptance tests is their reuse as regression tests across subsequent iterations. Discarding tests after a single execution eliminates this reuse value and contradicts the ATDD practice of building an evolving test suite. ATDD tests are designed for long-term regression coverage, not single-use validation.","D":"ATDD acceptance tests primarily address functional behavior specified in user story acceptance criteria, not exclusively non-functional characteristics. Non-functional testing is addressed separately through specialized test types. ATDD tests define the expected functional outcomes that the implementation must satisfy."}},{"q":"You are a tester using a task board to communicate testing status during a sprint. The Scrum master asks which statements about the use of story cards and test task status on a task board are correct. Consider the following statements: I. A story card moves to the \"Done\" column only when all associated test tasks have been completed and passed. II. Test tasks on the task board should be updated daily to reflect the current state of testing activities. III. The task board replaces all other test reporting tools and makes test progress reports unnecessary. IV. Test task status on the task board provides the team with real-time visibility into testing progress during the sprint. Which of the following statements are CORRECT?","o":{"A":"I, II, and IV.","B":"I and IV.","C":"I and II.","D":"II and IV."},"a":["A"],"e":{"A":"Statements I, II, and IV are all accurate descriptions of how story cards and test task status function on a task board in Agile projects, as per reference section 2.2.1. Story cards move to \"Done\" only when all test tasks pass (I), task board updates occur daily (II), and the board provides real-time testing visibility (IV). Statement III is false because the task board does not replace all other test reporting tools.","B":"While statements I and IV are individually correct, this combination omits statement II, which accurately describes the need for daily updates to maintain visibility.","C":"While statements I and II are individually correct, this combination omits statement IV, which accurately reflects that task board status provides real-time visibility into testing progress.","D":"This option omits statement I, which outlines the critical quality gate constraint required before a user story can be considered completed on the shared team board."}},{"q":"You are a tester on an Agile team developing a user authentication feature. Your team is following an ATDD approach. After the tester and developer collaboratively define the acceptance tests, the product owner is asked to review them before implementation begins. Which role does the product owner's review play in the ATDD process for this scenario?","o":{"A":"The product owner's review provides independent validation that the acceptance tests accurately reflect the business requirements before they are used to drive implementation.","B":"The product owner's review replaces the need for the tester to participate in acceptance test creation because the product owner has the most complete understanding of the requirements.","C":"The product owner's review is conducted after implementation to confirm that the delivered feature matches the original acceptance tests.","D":"The product owner's review authorizes the development team to begin implementation only if all tests can be automated immediately."},"a":["A"],"e":{"A":"In ATDD, having the business representative or product owner review acceptance tests before implementation begins provides independent validation that the tests correctly capture the intended business behavior, as per reference section 3.3.3. This review step ensures that the collaborative test definition between tester and developer has not inadvertently misinterpreted the business requirements.","B":"ATDD requires collaborative acceptance test creation involving the tester, developer, and product owner together; the product owner's review does not replace the tester's contribution. The tester brings testing expertise that is essential to making acceptance tests technically sound and comprehensive.","C":"In ATDD, the product owner's review of acceptance tests occurs before implementation, not after. Pre-implementation review is what enables acceptance tests to serve as executable specifications that drive development. Post-implementation review is a separate validation activity.","D":"The product owner's review in ATDD validates the accuracy of the acceptance tests against business requirements, not whether the tests are automatable. Automation suitability is a technical consideration separate from the business validation purpose of the product owner review."}},{"q":"You are a tester participating in a sprint retrospective focused on improving testing effectiveness. The team identifies several observations about the sprint's testing activities. Which TWO outcomes from a retrospective MOST directly improve testing effectiveness and productivity in subsequent sprints? (Select TWO)","o":{"A":"Identifying a communication gap between testers and developers during story handoff and agreeing on a new clarification step before implementation begins.","B":"Agreeing to add a specific test automation task to the next sprint backlog to address a recurring manual regression gap.","C":"Deciding to increase the team's sprint velocity target to compensate for time lost to testing activities.","D":"Documenting all defects from the sprint in a permanent defect register to be reviewed at project closure."},"a":["A","B"],"e":{"A":"Identifying a specific process gap and agreeing on a targeted corrective action directly improves the team's ability to prevent defects and reduce rework in subsequent sprints, as per reference section 1.2.3. Improving communication at story handoff addresses a root cause of defects and testing inefficiency.","B":"Identifying a concrete testing improvement and committing to implement it in the next sprint directly translates retrospective insight into improved testing effectiveness, as per reference section 1.2.3. Adding a targeted automation task addresses a specific productivity gap and produces a scalable, repeatable regression safeguard.","C":"Increasing velocity targets does not address the root causes of testing inefficiency and can lead to quality shortcuts. Velocity is an emergent measure of capacity, not an operational lever for improving test effectiveness.","D":"Creating a permanent defect register for end-of-project review is not a retrospective improvement action that enhances near-term testing effectiveness. Retrospective improvements are intended to be team-owned adjustments implemented directly in the next sprint."}},{"q":"You are a tester reviewing your team's growing manual test suite at the end of the third sprint. The test dependency list has grown. The test manager asks you to assess which manual tests are suitable for automation to manage regression risk effectively. Which criterion BEST determines whether a manual test case is suitable for inclusion in an automated regression suite?","o":{"A":"The test case was written during the current sprint and has not yet been executed manually.","B":"The test case validates stable functionality that is executed repeatedly across multiple iterations.","C":"The test case covers functionality that was reported as defect-free in the most recent sprint.","D":"The test case requires access to production data, making it too sensitive for automated execution."},"a":["B"],"e":{"A":"Newly written, unexecuted test cases are not ready for automation; they should first be validated through manual execution to confirm accuracy before being encoded into automated scripts. Automating an untested test case risks validating incorrect logic.","B":"Test automation is most valuable for tests that cover stable, frequently executed functionality where the overhead of automation script construction is offset by repeated, cost-effective reuse across iterations, as per reference section 2.2.2. Automating tests for stable features reduces manual regression effort as the codebase grows.","C":"Defect-free history in one sprint does not make a test case suitable for automation. Automation suitability depends on the test's execution repetition, stability, and predictability, not its recent pass history.","D":"Requiring production data is a test data provisioning concern, not a structural constraint on automation suitability. Many automated tests are designed with masked, sanitized data environments to enable safe, repeatable pipeline execution."}},{"q":"You are a tester contributing to release planning for a new product module. The product owner asks you to explain how your testing approach during release planning differs from testing in a traditional sequential project. Which description BEST distinguishes the Agile testing approach during release planning from a non-Agile approach?","o":{"A":"In Agile, release planning replaces all iteration-level test planning, eliminating the need for sprint-specific test activities.","B":"In Agile, testers finalize the regression test suite during release planning so that it is ready before the first iteration begins.","C":"In Agile, the test approach is defined at a high level during release planning and refined iteratively, with risk-based prioritization guiding test focus each iteration.","D":"In Agile, testers create a comprehensive master test plan during release planning that covers all testing activities for the entire release."},"a":["C"],"e":{"A":"Release planning and iteration planning are complementary levels of planning; release planning establishes the high-level roadmap and does not eliminate the need for detailed, sprint-specific test task planning or capacity allocation.","B":"Finalizing a regression test suite before the first iteration begins assumes all functionality is fixed upfront, which contradicts the iterative model. Regression tests are built incrementally as new features are verified sprint by sprint.","C":"In Agile projects, the test approach during release planning is established at a high level and evolves iteratively as more is learned about the product, with risk-based testing used to prioritize effort across iterations, as per reference section 2.1.1. This contrasts with non-Agile projects where the entire test sc
